name: Increment 133 One-Shot Payload Recovery

on:
  push:
    branches:
      - increment/133-analog-semantic-api

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Execute the staged payload and remove temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/_increment133_payload.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              index
              for index, line in enumerate(lines[start + 1 :], start + 1)
              if line.strip() == "PY"
          )
          body = [
              line[10:] if line.startswith("          ") else line
              for line in lines[start + 1 : end]
          ]
          script = "\n".join(body) + "\n"
          compile(script, "increment133_materializer.py", "exec")
          exec(script, {"__name__": "__main__"})
          Path(".github/workflows/_increment133_recover_payload.yml").unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Increment 133 — materialize API gate contracts and fixtures"
          git push origin HEAD:increment/133-analog-semantic-api
