name: Increment 30 Diagnostic Support Linkage Fix

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-diagnostic-support-fix.yml

permissions:
  contents: write

concurrency:
  group: increment-30-diagnostic-support-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Split mapped diagnostic support from the cross-layer pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          support_header = '''#ifndef NODAL_DIAGNOSTICS_DIAGNOSTICSUPPORT_H
          #define NODAL_DIAGNOSTICS_DIAGNOSTICSUPPORT_H

          #include "mlir/IR/BuiltinOps.h"
          #include "mlir/Support/LogicalResult.h"

          #include "llvm/ADT/StringRef.h"
          #include "llvm/ADT/Twine.h"

          #include <string>

          namespace nodal {

          struct DiagnosticContext {
            std::string semanticPath;
            std::string hierarchyPath;
            std::string indexPath;
            std::string sourceRange;
          };

          /// Collect deterministic source-semantic context from an operation and its
          /// ancestors. Missing context remains empty rather than being invented.
          DiagnosticContext collectDiagnosticContext(mlir::Operation *operation);

          /// Emit one stable-code error with semantic, hierarchy, index, and Scala source
          /// context appended in a deterministic order.
          mlir::LogicalResult emitMappedFailure(mlir::Operation *operation, llvm::StringRef code,
                                                const llvm::Twine &message);

          /// Emit an inventory-derived error by resolving its semantic path back to an
          /// operation or the module-level Increment 20 source-map inventory.
          mlir::LogicalResult emitMappedFailureForPath(mlir::ModuleOp module,
                                                       llvm::StringRef semanticPath,
                                                       llvm::StringRef code,
                                                       const llvm::Twine &message);

          } // namespace nodal

          #endif // NODAL_DIAGNOSTICS_DIAGNOSTICSUPPORT_H
          '''

          support_source = '''#include "nodal/Diagnostics/DiagnosticSupport.h"

          #include "mlir/IR/BuiltinAttributes.h"
          #include "mlir/IR/Diagnostics.h"
          #include "mlir/IR/Location.h"
          #include "mlir/IR/SymbolTable.h"

          #include "llvm/ADT/SmallVector.h"
          #include "llvm/Support/Casting.h"

          #include <algorithm>
          #include <cstdint>
          #include <optional>
          #include <string>

          using namespace mlir;

          namespace nodal {
          namespace {

          DictionaryAttr metadata(Operation *operation) {
            return operation ? operation->getAttrOfType<DictionaryAttr>("metadata") : DictionaryAttr();
          }

          StringAttr stringAttribute(DictionaryAttr values, llvm::StringRef name) {
            return values ? values.getAs<StringAttr>(name) : StringAttr();
          }

          std::optional<int64_t> integerAttribute(DictionaryAttr values, llvm::StringRef name) {
            if (!values)
              return std::nullopt;
            if (auto integer = values.getAs<IntegerAttr>(name))
              return integer.getInt();
            if (auto text = values.getAs<StringAttr>(name)) {
              int64_t result = 0;
              if (!text.getValue().getAsInteger(10, result))
                return result;
            }
            return std::nullopt;
          }

          llvm::StringRef semanticPath(Operation *operation) {
            for (Operation *current = operation; current; current = current->getParentOp()) {
              if (auto value = stringAttribute(metadata(current), "semantic_path"))
                return value.getValue();
            }
            return {};
          }

          llvm::StringRef explicitContext(Operation *operation, llvm::StringRef name) {
            for (Operation *current = operation; current; current = current->getParentOp()) {
              if (auto value = stringAttribute(metadata(current), name))
                return value.getValue();
            }
            return {};
          }

          FileLineColLoc findFileLocation(Location location) {
            if (auto file = llvm::dyn_cast<FileLineColLoc>(location))
              return file;
            if (auto name = llvm::dyn_cast<NameLoc>(location))
              return findFileLocation(name.getChildLoc());
            if (auto call = llvm::dyn_cast<CallSiteLoc>(location)) {
              if (FileLineColLoc caller = findFileLocation(call.getCaller()))
                return caller;
              return findFileLocation(call.getCallee());
            }
            if (auto fused = llvm::dyn_cast<FusedLoc>(location)) {
              for (Location nested : fused.getLocations()) {
                if (FileLineColLoc file = findFileLocation(nested))
                  return file;
              }
            }
            return {};
          }

          std::string hierarchyFallback(Operation *operation) {
            llvm::SmallVector<std::string, 8> symbols;
            for (Operation *current = operation; current; current = current->getParentOp()) {
              if (auto symbol = current->getAttrOfType<StringAttr>(SymbolTable::getSymbolAttrName())) {
                if (!symbol.getValue().empty())
                  symbols.push_back(symbol.getValue().str());
              }
            }
            std::reverse(symbols.begin(), symbols.end());
            std::string result;
            for (const std::string &symbol : symbols) {
              if (!result.empty())
                result.append("::");
              result.append(symbol);
            }
            return result;
          }

          std::string indexFallback(llvm::StringRef path) {
            const size_t start = path.find('[');
            if (start == llvm::StringRef::npos)
              return {};
            return path.drop_front(start).str();
          }

          std::string formatSourceRange(llvm::StringRef path, int64_t line, int64_t column,
                                        int64_t endLine, int64_t endColumn) {
            if (path.empty() || line <= 0 || column <= 0)
              return {};
            if (endLine <= 0)
              endLine = line;
            if (endColumn <= 0)
              endColumn = column;
            return (path + ":" + llvm::Twine(line) + ":" + llvm::Twine(column) + "-" +
                    llvm::Twine(endLine) + ":" + llvm::Twine(endColumn))
                .str();
          }

          void appendContext(InFlightDiagnostic &diagnostic, const DiagnosticContext &context) {
            if (!context.semanticPath.empty())
              diagnostic << " [semantic-path=" << context.semanticPath << "]";
            if (!context.hierarchyPath.empty())
              diagnostic << " [hierarchy-path=" << context.hierarchyPath << "]";
            if (!context.indexPath.empty())
              diagnostic << " [index-path=" << context.indexPath << "]";
            if (!context.sourceRange.empty())
              diagnostic << " [source-range=" << context.sourceRange << "]";
          }

          LogicalResult emitWithContext(Operation *operation, llvm::StringRef code,
                                        const llvm::Twine &message,
                                        const DiagnosticContext &context) {
            InFlightDiagnostic diagnostic = operation->emitError();
            diagnostic << code << ": " << message.str();
            appendContext(diagnostic, context);
            return failure();
          }

          Operation *findOperationByPath(mlir::ModuleOp module, llvm::StringRef path) {
            Operation *found = nullptr;
            module.walk([&](Operation *operation) {
              if (!found && semanticPath(operation) == path)
                found = operation;
            });
            return found;
          }

          DiagnosticContext sourceMapContext(mlir::ModuleOp module, llvm::StringRef path) {
            DiagnosticContext context;
            context.semanticPath = path.str();
            context.indexPath = indexFallback(path);

            ArrayAttr sourceMap = module->getAttrOfType<ArrayAttr>("nodal.bridge.source_map");
            if (!sourceMap)
              return context;
            for (Attribute attribute : sourceMap) {
              auto entry = llvm::dyn_cast<DictionaryAttr>(attribute);
              if (!entry)
                continue;
              auto semantic = entry.getAs<StringAttr>("semantic_path");
              if (!semantic || semantic.getValue() != path)
                continue;
              if (auto hierarchy = entry.getAs<StringAttr>("hierarchy_path"))
                context.hierarchyPath = hierarchy.getValue().str();
              auto source = entry.getAs<StringAttr>("source_path");
              auto line = entry.getAs<IntegerAttr>("source_line");
              auto column = entry.getAs<IntegerAttr>("source_column");
              auto endLine = entry.getAs<IntegerAttr>("source_end_line");
              auto endColumn = entry.getAs<IntegerAttr>("source_end_column");
              if (source && line && column) {
                context.sourceRange = formatSourceRange(
                    source.getValue(), line.getInt(), column.getInt(),
                    endLine ? endLine.getInt() : line.getInt(),
                    endColumn ? endColumn.getInt() : column.getInt());
              }
              break;
            }
            return context;
          }

          } // namespace

          DiagnosticContext collectDiagnosticContext(Operation *operation) {
            DiagnosticContext context;
            llvm::StringRef semantic = semanticPath(operation);
            context.semanticPath = semantic.str();
            llvm::StringRef hierarchy = explicitContext(operation, "hierarchy_path");
            context.hierarchyPath = hierarchy.empty() ? hierarchyFallback(operation) : hierarchy.str();
            llvm::StringRef index = explicitContext(operation, "index_path");
            context.indexPath = index.empty() ? indexFallback(semantic) : index.str();

            FileLineColLoc file;
            for (Operation *current = operation; current && !file; current = current->getParentOp())
              file = findFileLocation(current->getLoc());
            if (file) {
              int64_t endLine = file.getLine();
              int64_t endColumn = file.getColumn();
              for (Operation *current = operation; current; current = current->getParentOp()) {
                DictionaryAttr values = metadata(current);
                if (std::optional<int64_t> value = integerAttribute(values, "source_end_line"))
                  endLine = *value;
                if (std::optional<int64_t> value = integerAttribute(values, "source_end_column"))
                  endColumn = *value;
                if (values && (values.get("source_end_line") || values.get("source_end_column")))
                  break;
              }
              context.sourceRange = formatSourceRange(file.getFilename(), file.getLine(),
                                                      file.getColumn(), endLine, endColumn);
            }
            return context;
          }

          LogicalResult emitMappedFailure(Operation *operation, llvm::StringRef code,
                                          const llvm::Twine &message) {
            return emitWithContext(operation, code, message, collectDiagnosticContext(operation));
          }

          LogicalResult emitMappedFailureForPath(mlir::ModuleOp module,
                                                 llvm::StringRef semanticPathValue,
                                                 llvm::StringRef code,
                                                 const llvm::Twine &message) {
            if (Operation *operation = findOperationByPath(module, semanticPathValue))
              return emitMappedFailure(operation, code, message);
            return emitWithContext(module.getOperation(), code, message,
                                   sourceMapContext(module, semanticPathValue));
          }

          } // namespace nodal
          '''

          mapping_header = '''#ifndef NODAL_DIAGNOSTICS_DIAGNOSTICMAPPING_H
          #define NODAL_DIAGNOSTICS_DIAGNOSTICMAPPING_H

          #include "nodal/Diagnostics/DiagnosticSupport.h"

          #include "mlir/Pass/Pass.h"

          #include <memory>

          namespace nodal {

          /// Create/register the private Increment 22 cross-layer diagnostic verifier.
          std::unique_ptr<mlir::Pass> createCrossLayerDiagnosticPass();
          void registerNodalDiagnosticPasses();

          } // namespace nodal

          #endif // NODAL_DIAGNOSTICS_DIAGNOSTICMAPPING_H
          '''

          def dedent(text: str) -> str:
              lines = text.splitlines()
              return "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          Path("core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h").write_text(
              dedent(support_header), encoding="utf-8"
          )
          Path("core/compiler/lib/Support/DiagnosticSupport.cpp").write_text(
              dedent(support_source), encoding="utf-8"
          )
          Path("core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h").write_text(
              dedent(mapping_header), encoding="utf-8"
          )

          mapping_path = Path("core/compiler/lib/Diagnostics/DiagnosticMapping.cpp")
          mapping = mapping_path.read_text(encoding="utf-8")
          helper_start = mapping.index("llvm::StringRef semanticPath(Operation *operation) {")
          helper_end = mapping.index("llvm::StringRef inventoryPath(DictionaryAttr entry) {")
          mapping = mapping[:helper_start] + mapping[helper_end:]
          export_start = mapping.index("DiagnosticContext collectDiagnosticContext(Operation *operation) {")
          export_end = mapping.index("std::unique_ptr<Pass> createCrossLayerDiagnosticPass() {")
          mapping = mapping[:export_start] + mapping[export_end:]
          mapping_path.write_text(mapping, encoding="utf-8")

          Path("core/compiler/lib/CMakeLists.txt").write_text(
              "add_subdirectory(Support)\n"
              "add_subdirectory(Backend)\n"
              "add_subdirectory(Dialect)\n"
              "add_subdirectory(Diagnostics)\n"
              "add_subdirectory(Transforms)\n",
              encoding="utf-8",
          )

          Path("core/compiler/lib/Support/CMakeLists.txt").write_text(
              """add_library(NodalSupport STATIC
            DiagnosticSupport.cpp
            Version.cpp
          )

          add_library(Nodal::Support ALIAS NodalSupport)

          llvm_update_compile_flags(NodalSupport)

          target_include_directories(NodalSupport
            PUBLIC
              \"${NODAL_REPOSITORY_ROOT}/core/compiler/include\"
              \"${CMAKE_BINARY_DIR}/include\"
          )

          target_link_libraries(NodalSupport
            PUBLIC
              MLIRIR
              MLIRSupport
              LLVMSupport
          )
          """,
              encoding="utf-8",
          )

          dialect_cmake = Path("core/compiler/lib/Dialect/Nodal/CMakeLists.txt")
          dialect = dialect_cmake.read_text(encoding="utf-8")
          anchor = "  LINK_LIBS PUBLIC\n    MLIRBytecodeOpInterface\n"
          if dialect.count(anchor) != 1:
              raise RuntimeError("NodalDialect link anchor is not unique")
          dialect_cmake.write_text(
              dialect.replace(anchor, "  LINK_LIBS PUBLIC\n    NodalSupport\n    MLIRBytecodeOpInterface\n", 1),
              encoding="utf-8",
          )

          diagnostics_cmake = Path("core/compiler/lib/Diagnostics/CMakeLists.txt")
          diagnostics = diagnostics_cmake.read_text(encoding="utf-8")
          anchor = "  LINK_LIBS PUBLIC\n    NodalDialect\n"
          if diagnostics.count(anchor) != 1:
              raise RuntimeError("NodalDiagnostics link anchor is not unique")
          diagnostics_cmake.write_text(
              diagnostics.replace(anchor, "  LINK_LIBS PUBLIC\n    NodalDialect\n    NodalSupport\n", 1),
              encoding="utf-8",
          )

          checker_path = Path("scripts/check_increment30.py")
          checker = checker_path.read_text(encoding="utf-8")
          expected_anchor = '''    "core/compiler/include/nodal/Dialect/Nodal/AnalogNumeric.h",
              "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp",
          '''
          expected_new = '''    "core/compiler/include/nodal/Dialect/Nodal/AnalogNumeric.h",
              "core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h",
              "core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h",
              "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp",
              "core/compiler/lib/Dialect/Nodal/CMakeLists.txt",
              "core/compiler/lib/Diagnostics/DiagnosticMapping.cpp",
              "core/compiler/lib/Diagnostics/CMakeLists.txt",
              "core/compiler/lib/Support/DiagnosticSupport.cpp",
              "core/compiler/lib/Support/CMakeLists.txt",
          '''
          if checker.count(expected_anchor) != 1:
              raise RuntimeError("Increment 30 expected-file anchor is not unique")
          checker = checker.replace(expected_anchor, expected_new, 1)

          native_anchor = '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001"),
          '''
          native_new = '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001"),
                  "core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h": (
                      "DiagnosticContext", "emitMappedFailure", "emitMappedFailureForPath"),
                  "core/compiler/lib/Support/DiagnosticSupport.cpp": (
                      "collectDiagnosticContext", "emitMappedFailure", "sourceMapContext"),
                  "core/compiler/lib/Support/CMakeLists.txt": (
                      "DiagnosticSupport.cpp", "MLIRIR"),
                  "core/compiler/lib/Dialect/Nodal/CMakeLists.txt": ("NodalSupport",),
                  "core/compiler/lib/Diagnostics/CMakeLists.txt": (
                      "NodalDialect", "NodalSupport"),
          '''
          if checker.count(native_anchor) != 1:
              raise RuntimeError("Increment 30 native-contract anchor is not unique")
          checker_path.write_text(checker.replace(native_anchor, native_new, 1), encoding="utf-8")

          tests_path = Path("tests/compiler/test_increment30.py")
          tests = tests_path.read_text(encoding="utf-8")
          test_anchor = '''    def test_rejects_missing_implemented_status(self) -> None:
          '''
          test_new = '''    def test_rejects_missing_diagnostic_support_link(self) -> None:
                  temporary, root = self.temporary_repository()
                  self.addCleanup(temporary.cleanup)
                  path = root / "core/compiler/lib/Dialect/Nodal/CMakeLists.txt"
                  path.write_text(
                      path.read_text(encoding="utf-8").replace(
                          "NodalSupport", "MissingDiagnosticSupport", 1
                      ),
                      encoding="utf-8",
                  )
                  self.assertIn("NODAL-INC30-010", self.codes(root))

              def test_rejects_missing_implemented_status(self) -> None:
          '''
          if tests.count(test_anchor) != 1:
              raise RuntimeError("Increment 30 mutation-test anchor is not unique")
          tests_path.write_text(tests.replace(test_anchor, test_new, 1), encoding="utf-8")
          PY

      - name: Publish diagnostic support linkage fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h \
            core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h \
            core/compiler/lib/Support/DiagnosticSupport.cpp \
            core/compiler/lib/Support/CMakeLists.txt \
            core/compiler/lib/CMakeLists.txt \
            core/compiler/lib/Dialect/Nodal/CMakeLists.txt \
            core/compiler/lib/Diagnostics/DiagnosticMapping.cpp \
            core/compiler/lib/Diagnostics/CMakeLists.txt \
            scripts/check_increment30.py \
            tests/compiler/test_increment30.py
          git commit -m "Increment 30 — split mapped diagnostic support from cross-layer passes"
          git push origin HEAD:increment/30-analog-numeric-types
