name: Increment 34 Native Dataflow v8

on:
  push:
    branches:
      - automation/inc34-native-dataflow-v8
    paths:
      - '.github/workflows/_inc34_native_dataflow_v8.yml'
      - '.github/automation/inc34_v8_repair_controller.py'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-native-dataflow-v8
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-native-dataflow-v8
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Repair controller scripts for the live repository layout
        run: python3 controller/.github/automation/inc34_v8_repair_controller.py

      - name: Execute guarded Increment 34 continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_run_native_dataflow_v6.sh \
            "${GITHUB_WORKSPACE}/controller" \
            "${GITHUB_WORKSPACE}/work" \
            "${RUNNER_TEMP}/inc34-v8"

      # The permanent workflow update is published separately through the
      # repository connection so this token pushes only implementation files.
