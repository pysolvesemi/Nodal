name: Increment 33 final P1 repair 2026-09-02

on:
  push:
    branches:
      - automation/inc33-final-p1-repair-20260902

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Increment 33 implementation head
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Require reviewed baseline
        run: test "$(git rev-parse HEAD)" = ef5cd258ae130d4239898020590eb1fcc42fc4d9

      - name: Apply sticky-dimension and nodalc-boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          kernel_path = Path("core/scala/api/src/nodal/ElaborationConstructionKernel.scala")
          replace_once(
              kernel_path,
              textwrap.dedent(
                  '''\
                    def compatibleAdd(other: AnalogDimension): AnalogDimension =
                      if isZero && !other.isUnknown then other.copy(isZero = other.isZero || isZero)
                      else if other.isZero && !isUnknown then copy(isZero = isZero || other.isZero)
                      else if isUnknown then other
                      else if other.isUnknown then this
                      else if powers == other.powers then copy(isZero = isZero && other.isZero)
                      else AnalogDimension.Unknown
                  '''
              ),
              textwrap.dedent(
                  '''\
                    def compatibleAdd(other: AnalogDimension): AnalogDimension =
                      if isUnknown || other.isUnknown then AnalogDimension.Unknown
                      else if isZero then other.copy(isZero = other.isZero || isZero)
                      else if other.isZero then copy(isZero = isZero || other.isZero)
                      else if powers == other.powers then copy(isZero = isZero && other.isZero)
                      else AnalogDimension.Unknown
                  '''
              ),
              "sticky analog addition mismatch",
          )

          construction_tests_path = Path(
              "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala"
          )
          construction_tests = construction_tests_path.read_text(encoding="utf-8")
          class_anchor = "final class PublicAnalogCompoundVoltage extends Module:\n"
          nested_class = textwrap.dedent(
              '''\
                final class PublicAnalogNestedCompoundReadDimensionMismatch extends Module:
                  val voltage: Variable[Real] = variable(Real, 0.0.V)

                  analogProcedure:
                    voltage := (voltage + 1.0.real) + voltage

              '''
          )
          if "final class PublicAnalogNestedCompoundReadDimensionMismatch" not in construction_tests:
              if construction_tests.count(class_anchor) != 1:
                  raise SystemExit("nested compound mismatch class anchor is not unique")
              construction_tests = construction_tests.replace(
                  class_anchor,
                  nested_class + class_anchor,
                  1,
              )

          test_anchor = (
              '    test("public compound voltage assignment retains its physical dimension"):\n'
          )
          nested_test = textwrap.dedent(
              '''\
                    test("public nested incompatible compound dimensions remain unknown"):
                      val failure = scala.util
                        .Try(
                          ConstructionKernel.inspect(
                            new PublicAnalogNestedCompoundReadDimensionMismatch
                          )
                        )
                        .failed
                        .get
                        .asInstanceOf[AnalogProceduralRuntime.Failure]
                      assert(failure.diagnostic.code == "NODAL-ANALOG-033-013")

              '''
          )
          if "public nested incompatible compound dimensions remain unknown" not in construction_tests:
              if construction_tests.count(test_anchor) != 1:
                  raise SystemExit("nested compound mismatch test anchor is not unique")
              construction_tests = construction_tests.replace(
                  test_anchor,
                  nested_test + test_anchor,
                  1,
              )
          construction_tests_path.write_text(construction_tests, encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/increment-33-analog-procedural-assignment.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          witness_anchor = "      - name: Execute Scala source-semantic witness\n"
          nodalc_step = textwrap.dedent(
              '''\
                    - name: Execute Scala bridge regressions against nodalc
                      shell: bash
                      run: |
                        test -x out/native/release/bin/nodalc
                        NODAL_NODALC="$PWD/out/native/release/bin/nodalc" \\
                          ./mill -i core.scala.testkit.test.testOnly \\
                            nodal.internal.testkit.ScalaToMlirBridgeTests

              '''
          )
          if "Execute Scala bridge regressions against nodalc" not in workflow:
              if workflow.count(witness_anchor) != 1:
                  raise SystemExit("Scala witness workflow anchor is not unique")
              workflow = workflow.replace(
                  witness_anchor,
                  nodalc_step + witness_anchor,
                  1,
              )
          workflow_path.write_text(workflow, encoding="utf-8")

          checker_path = Path("scripts/check_increment33.py")
          checker = checker_path.read_text(encoding="utf-8")
          construction_anchor = textwrap.dedent(
              '''\
                    construction_tests = read_text(
                        root,
                        "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala",
                    )
              '''
          )
          kernel_read = construction_anchor + textwrap.dedent(
              '''\
                    construction_kernel = read_text(
                        root,
                        "core/scala/api/src/nodal/ElaborationConstructionKernel.scala",
                    )
                    require(
                        "if isUnknown || other.isUnknown then AnalogDimension.Unknown"
                        in construction_kernel,
                        "NODAL-INC33-067: recursive dimension mismatches are not sticky",
                    )
              '''
          )
          if "NODAL-INC33-067" not in checker:
              if checker.count(construction_anchor) != 1:
                  raise SystemExit("checker construction anchor is not unique")
              checker = checker.replace(construction_anchor, kernel_read, 1)

          test_check_anchor = textwrap.dedent(
              '''\
                    require(
                        "public incompatible compound dimensions are rejected without read fallback"
                        in construction_tests,
                        "NODAL-INC33-062: compound read-dimension regression is missing",
                    )
              '''
          )
          nested_check = test_check_anchor + textwrap.dedent(
              '''\
                    require(
                        "public nested incompatible compound dimensions remain unknown"
                        in construction_tests,
                        "NODAL-INC33-068: nested compound-dimension regression is missing",
                    )
              '''
          )
          if "NODAL-INC33-068" not in checker:
              if checker.count(test_check_anchor) != 1:
                  raise SystemExit("checker compound regression anchor is not unique")
              checker = checker.replace(test_check_anchor, nested_check, 1)

          workflow_read_anchor = (
              '        workflow = workflow_path.read_text(encoding="utf-8")\n'
          )
          workflow_check = workflow_read_anchor + textwrap.dedent(
              '''\
                        require(
                            'NODAL_NODALC="$PWD/out/native/release/bin/nodalc"' in workflow
                            and "core.scala.testkit.test.testOnly" in workflow
                            and "ScalaToMlirBridgeTests" in workflow,
                            "NODAL-INC33-069: Scala bridge regressions do not execute against nodalc",
                        )
              '''
          )
          if "NODAL-INC33-069" not in checker:
              if checker.count(workflow_read_anchor) != 1:
                  raise SystemExit("checker workflow anchor is not unique")
              checker = checker.replace(workflow_read_anchor, workflow_check, 1)
          checker_path.write_text(checker, encoding="utf-8")

          mutation_path = Path("tests/compiler/test_increment33.py")
          mutations = mutation_path.read_text(encoding="utf-8")
          required_anchor = (
              '    "core/scala/api/src/nodal/AnalogProceduralRuntime.scala",\n'
          )
          required_entry = (
              '    "core/scala/api/src/nodal/ElaborationConstructionKernel.scala",\n'
          )
          if required_entry not in mutations:
              if mutations.count(required_anchor) != 1:
                  raise SystemExit("mutation REQUIRED anchor is not unique")
              mutations = mutations.replace(
                  required_anchor,
                  required_anchor + required_entry,
                  1,
              )

          mutation_anchor = '\n\nif __name__ == "__main__":\n'
          new_mutations = textwrap.dedent(
              '''\

                  def test_recursive_dimension_mismatch_mutation_is_rejected(self) -> None:
                      temporary, root = self.fixture()
                      with temporary:
                          path = root / "core/scala/api/src/nodal/ElaborationConstructionKernel.scala"
                          path.write_text(
                              path.read_text(encoding="utf-8").replace(
                                  "if isUnknown || other.isUnknown then AnalogDimension.Unknown",
                                  "if isUnknown then other",
                                  1,
                              ),
                              encoding="utf-8",
                          )
                          self.assert_rejected(root, "recursive dimension mismatches are not sticky")

                  def test_nested_compound_dimension_regression_mutation_is_rejected(self) -> None:
                      temporary, root = self.fixture()
                      with temporary:
                          path = (
                              root
                              / "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala"
                          )
                          path.write_text(
                              path.read_text(encoding="utf-8").replace(
                                  "public nested incompatible compound dimensions remain unknown",
                                  "nested compound-dimension regression removed",
                                  1,
                              ),
                              encoding="utf-8",
                          )
                          self.assert_rejected(root, "nested compound-dimension regression is missing")

                  def test_nodalc_bridge_boundary_mutation_is_rejected(self) -> None:
                      temporary, root = self.fixture()
                      with temporary:
                          path = root / ".github/workflows/increment-33-analog-procedural-assignment.yml"
                          path.write_text(
                              path.read_text(encoding="utf-8").replace(
                                  'NODAL_NODALC="$PWD/out/native/release/bin/nodalc"',
                                  'NODAL_NODALC_DISABLED="$PWD/out/native/release/bin/nodalc"',
                                  1,
                              ),
                              encoding="utf-8",
                          )
                          self.assert_rejected(root, "Scala bridge regressions do not execute against nodalc")
              '''
          )
          if "test_recursive_dimension_mismatch_mutation_is_rejected" not in mutations:
              if mutations.count(mutation_anchor) != 1:
                  raise SystemExit("mutation insertion anchor is not unique")
              mutations = mutations.replace(
                  mutation_anchor,
                  new_mutations + mutation_anchor,
                  1,
              )
          mutation_path.write_text(mutations, encoding="utf-8")
          PY

      - name: Install pinned native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format and run focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          ./mill mill.scalalib.scalafmt/reformatAll
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          ./nodal core scala
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          test -x out/native/release/bin/nodalc
          NODAL_NODALC="$PWD/out/native/release/bin/nodalc" \
            ./mill -i core.scala.testkit.test.testOnly \
              nodal.internal.testkit.ScalaToMlirBridgeTests
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Publish validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            .github/workflows/increment-33-analog-procedural-assignment.yml \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala \
            scripts/check_increment33.py \
            tests/compiler/test_increment33.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(increment33): keep nested mismatches sticky and exercise nodalc'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
