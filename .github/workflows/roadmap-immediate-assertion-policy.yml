name: Apply immediate assertion synthesis policy

on:
  push:
    branches:
      - roadmap/immediate-assertion-synthesis-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply immediate assertion synthesis policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update assertion and property contracts
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one occurrence in {path}, found {count}: {old[:120]!r}"
                  )
              write(path, content.replace(old, new, 1))

          def insert_before(path: str, marker: str, insertion: str) -> None:
              replace_once(path, marker, insertion + marker)

          adr = "docs/architecture/0014-target-neutral-formal-verification.md"
          replace_once(
              adr,
              "- **Scope:** Future user-authored digital formal properties, formal harnesses, symbolic values, temporal semantics, proof tasks, tool adapters, evidence, and counterexample replay",
              "- **Scope:** Future user-authored digital formal properties, explicit synthesized immediate assertions, formal harnesses, symbolic values, temporal semantics, proof tasks, tool adapters, evidence, and counterexample replay",
          )
          replace_once(
              adr,
              "No user-authored formal API or proof engine is implemented by this ADR. Exact public names are frozen only by the future formal-verification design gate.\n",
              "No user-authored formal API or proof engine is implemented by this ADR. Exact public names are frozen only by the future formal-verification design gate.\n\nSynthesis eligibility is intentionally narrower than verification-property support. Only an explicitly selected immediate Boolean assertion may generate checker RTL. Concurrent or temporal properties and all formal environment constructs remain verification-only.\n",
          )
          replace_once(
              adr,
              "The formal API is separate from Scala runtime `assert` and from ordinary simulation-only reporting. A formal-only block cannot silently change synthesizable behavior.\n",
              "The formal API is separate from Scala runtime `assert` and from ordinary simulation-only reporting. A formal-only block cannot silently change synthesizable behavior. An immediate Nodal assertion may be selected explicitly for checker synthesis, but temporal or concurrent properties never acquire synthesis eligibility.\n",
          )
          replace_once(
              adr,
              "- portable immediate assertions/assumptions/covers accepted by Yosys;\n- generated monitor logic where a temporal property is not natively supported;\n",
              "- portable immediate assertions/assumptions/covers in verification artifacts accepted by Yosys;\n- generated history and monitor logic confined to formal or simulation artifacts;\n- explicit synthesizable checker logic only for an immediate Boolean assertion selected for synthesis;\n",
          )
          insert_before(
              adr,
              "## Clock and reset semantics\n",
              "## Immediate assertion synthesis boundary\n\nSynthesis eligibility is intentionally narrow:\n\n- only an immediate Boolean assertion may be selected for synthesis;\n- synthesis is opt-in and is never inferred from the use of `assert`;\n- `assume`, `cover`, sampled-history operators, temporal or sequence operators, fairness or liveness declarations, symbolic formal values, and compiler-generated temporal monitors are never synthesis-eligible;\n- generated history or monitor state for concurrent or temporal properties is confined to formal or simulation artifacts and never enters synthesizable DUT RTL;\n- a synthesized immediate assertion is observational by default and produces a deterministic checker or failure indication; it does not reset, stall, mutate, or otherwise control functional state unless ordinary design logic explicitly connects that indication.\n\nThe future design gate freezes the exact public spelling and failure-export policy. The authoritative IR records immediate-versus-temporal classification and synthesis eligibility before target lowering.\n\n",
          )
          replace_once(
              adr,
              "Nodal may reuse the same simple invariant in simulation and formal execution when semantics match. The compiler still records whether a statement is:\n\n- simulation-only;\n- formal-only;\n- shared simulation/formal;\n- synthesis-time checker generation where explicitly requested.\n\nSeverity/reporting behavior in simulation does not redefine proof semantics. Assumptions are never treated as ordinary simulation assertions without an explicit harness policy.\n",
              "Nodal may reuse the same simple immediate invariant in simulation, formal execution, and an explicitly selected synthesized checker when semantics match. The compiler still records whether a statement is:\n\n- simulation-only;\n- formal-only;\n- shared simulation/formal;\n- an explicitly synthesized immediate assertion.\n\nConcurrent or temporal properties, sampled history, assumptions, covers, symbolic formal values, and generated verification monitors remain verification-only. Severity or reporting behavior in simulation does not redefine proof semantics. Assumptions are never treated as ordinary simulation assertions without an explicit harness policy.\n",
          )
          replace_once(
              adr,
              "- Formal-only code remains isolated from synthesis and ordinary simulation artifacts.\n",
              "- Formal-only code remains isolated from synthesis and ordinary simulation artifacts.\n- Immediate assertion synthesis has a small, reviewable boundary, while temporal properties cannot add hidden monitor state to functional RTL.\n",
          )
          replace_once(
              adr,
              "- **Implement full SVA syntax first:** creates a large backend-shaped API before the useful portable subset and IR contracts are proven.\n",
              "- **Implement full SVA syntax first:** creates a large backend-shaped API before the useful portable subset and IR contracts are proven.\n- **Synthesize concurrent or temporal properties into DUT monitors:** adds hidden state and timing impact to functional RTL and confuses verification semantics with implementation.\n- **Treat assumptions, covers, or symbolic formal values as synthesizable:** gives environment and witness constructs an invalid hardware meaning.\n",
          )

          plan = "docs/roadmap/formal-verification-v0.1-plan.md"
          replace_once(
              plan,
              "This plan adds no formal API or proof implementation now. It reserves the public, IR, harness, adapter, evidence, and conformance boundaries that later increments must implement.\n",
              "This plan adds no formal API or proof implementation now. It reserves the public, IR, harness, adapter, evidence, and conformance boundaries that later increments must implement. It also fixes the synthesis boundary: only an explicitly selected immediate Boolean assertion may become checker RTL; concurrent or temporal properties remain verification-only.\n",
          )
          replace_once(
              plan,
              "```text\nformal-only\nsimulation-and-formal\nsimulation-only\nsynthesized-checker only when explicitly requested\n```\n",
              "```text\nformal-only\nsimulation-and-formal\nsimulation-only\nexplicit synthesized immediate assertion\n```\n",
          )
          insert_before(
              plan,
              "## Clock/reset contract\n",
              "## Immediate assertion synthesis boundary\n\nThe synthesis contract is deliberately smaller than the formal property contract.\n\nOnly an immediate Boolean assertion may be selected explicitly for synthesis. Such a checker observes values at its declared combinational point or owning clock domain and emits a deterministic failure indication. The default checker is observational: it cannot reset, stall, gate, mutate, or otherwise control functional state. A design may use the failure indication functionally only through an ordinary, explicit Nodal connection that is visible to normal review, timing, CDC/RDC, and synthesis checks.\n\nThe following are never synthesis-eligible:\n\n- concurrent or temporal properties and sequences;\n- `past`, `rose`, `fell`, `changed`, `stable`, or other sampled-history operators;\n- `assume`, `cover`, fairness, liveness, and environment constraints;\n- symbolic formal values or constants;\n- history registers, automata, counters, or monitors generated only to execute a verification property.\n\nThose constructs may lower to verification-only immediate checks, monitor logic, SVA, sidecar harnesses, or engine-native input. They never enter the `digital-verilog-synth` DUT artifact. A request to synthesize an ineligible property is a stable error; the compiler never approximates it as an immediate assertion.\n\n",
          )
          replace_once(
              plan,
              "A combinational assertion/assumption is explicitly declared and evaluated without sampled history. It cannot use `past`, temporal delay, or edge operators.\n",
              "A combinational assertion or assumption is explicitly declared and evaluated without sampled history. It cannot use `past`, temporal delay, or edge operators. Only an immediate Boolean assertion in this class can be synthesis-eligible; a combinational assumption remains verification-only.\n",
          )
          replace_once(
              plan,
              "- deterministic lowering to registers, CIRCT operations, SVA, or engine-native forms;\n",
              "- deterministic verification-only lowering to history registers, CIRCT operations, SVA, or engine-native forms;\n",
          )
          replace_once(
              plan,
              "- permitted simulation-monitor lowering.\n",
              "- permitted simulation-monitor lowering;\n- synthesis eligibility, which is always false for temporal or concurrent properties.\n",
          )
          replace_once(
              plan,
              "- typed sequences and temporal properties;\n- contract require/ensure;\n",
              "- typed sequences and temporal properties;\n- immediate-versus-temporal classification and explicit synthesis eligibility;\n- contract require/ensure;\n",
          )
          replace_once(
              plan,
              "- portable immediate assertions/assumptions/covers;\n- generated history/monitor logic;\n",
              "- portable immediate assertions/assumptions/covers in verification artifacts;\n- generated verification-only history and monitor logic;\n- explicit checker RTL only for synthesis-selected immediate Boolean assertions;\n",
          )
          replace_once(
              plan,
              "- formal-only value leaking into synthesis/simulation;\n",
              "- formal-only value leaking into synthesis/simulation;\n- implicit synthesis of an assertion without an explicit immediate-checker policy;\n- concurrent or temporal property requested for synthesis;\n- assumption, cover, sampled history, or symbolic formal value requested for synthesis;\n- synthesized immediate assertion attempting to alter functional behavior without an explicit design connection;\n",
          )
          replace_once(
              plan,
              "- shared simulation/formal invariant;\n- explicit formal-only block;\n",
              "- shared simulation/formal invariant;\n- explicit synthesized immediate assertion with a deterministic observational failure indication;\n- the same immediate invariant excluded from synthesis by default;\n- explicit formal-only block;\n",
          )
          replace_once(
              plan,
              "- plugin that inserts an undeclared assumption.\n",
              "- plugin that inserts an undeclared assumption;\n- implicit synthesis of an ordinary assertion;\n- temporal or concurrent property requested for synthesis;\n- assumption or cover requested for synthesis;\n- sampled-history or symbolic formal value used by a synthesized immediate assertion.\n",
          )
          replace_once(
              plan,
              "- [ ] Freeze clock/reset, combinational, cross-domain, parameter, memory, black-box, assumption-scope, vacuity, result, and source-map semantics.\n",
              "- [ ] Freeze clock/reset, combinational, cross-domain, parameter, memory, black-box, assumption-scope, vacuity, result, source-map, and immediate-assertion-only synthesis semantics.\n",
          )
          replace_once(
              plan,
              "- [ ] Add property/domain/reset/type/capability verification, deterministic parse/print, normalized reports, and portable immediate/monitor/sidecar lowering framework.\n- [ ] Prove formal-only constructs cannot affect ordinary synthesis/simulation artifacts without explicit inclusion.\n",
              "- [ ] Add property/domain/reset/type/capability verification, immediate-versus-temporal classification, deterministic parse/print, normalized reports, verification-only immediate/monitor/sidecar lowering, and explicit immediate-checker RTL lowering.\n- [ ] Prove concurrent or temporal properties, sampled history, assumptions, covers, symbolic values, and generated verification monitors cannot enter ordinary synthesis artifacts; prove immediate assertions synthesize only through explicit inclusion.\n",
          )
          replace_once(
              plan,
              "3. Scala runtime assertions and simulation/formal statements are unambiguous;\n4. cross-domain and reset behavior is explicit;\n5. assumptions and guarantees have enforceable scopes;\n6. parameter, memory, external-operation, and black-box proof policies are explicit;\n7. result states distinguish proven, failed, covered, inconclusive, unsupported, timeout, and tool errors;\n8. vacuity, over-constraint, and hidden-assumption expectations are documented;\n9. source maps, property IDs, traces, and reproducibility fields are frozen;\n10. external consumer fixtures use no compiler internals;\n11. no formal execution or hidden property inclusion occurs during the gate; and\n12. Core CI passes.\n",
              "3. Scala runtime assertions and simulation/formal statements are unambiguous;\n4. only explicitly selected immediate Boolean assertions are synthesis-eligible, and all temporal or concurrent properties remain verification-only;\n5. cross-domain and reset behavior is explicit;\n6. assumptions and guarantees have enforceable scopes;\n7. parameter, memory, external-operation, and black-box proof policies are explicit;\n8. result states distinguish proven, failed, covered, inconclusive, unsupported, timeout, and tool errors;\n9. vacuity, over-constraint, and hidden-assumption expectations are documented;\n10. source maps, property IDs, traces, and reproducibility fields are frozen;\n11. external consumer fixtures use no compiler internals;\n12. no formal execution or hidden property inclusion occurs during the gate; and\n13. Core CI passes.\n",
          )

          main = "docs/roadmap/nodal-development-todo.md"
          replace_once(main, "**Revision:** 1.12", "**Revision:** 1.13")
          replace_once(
              main,
              "- Separate formal property authoring, target lowering, harness generation, and proof-engine execution so formal-only constructs cannot silently alter synthesizable behavior or ordinary simulation.\n",
              "- Separate formal property authoring, target lowering, harness generation, and proof-engine execution so formal-only constructs cannot silently alter synthesizable behavior or ordinary simulation.\n- Permit checker RTL only for an explicitly selected immediate Boolean assertion. Concurrent or temporal properties, sampled history, assumptions, covers, symbolic formal values, and generated verification monitors remain verification-only and never enter synthesizable DUT RTL.\n",
          )
          replace_once(
              main,
              "- Keep Scala runtime assertions, simulation assertions, formal properties, and explicitly synthesized checkers distinct unless a frozen inclusion policy intentionally shares one invariant.\n",
              "- Keep Scala runtime assertions, simulation assertions, formal properties, and explicitly synthesized immediate assertions distinct unless a frozen inclusion policy intentionally shares one immediate invariant. Concurrent or temporal properties are never synthesis-eligible.\n",
          )
          replace_once(
              main,
              "black boxes, assertions/formal hooks, safe expression inlining",
              "black boxes, explicitly synthesized immediate assertions, verification-only formal hooks, safe expression inlining",
          )
          replace_once(
              main,
              "  - Keep broad SystemVerilog optional and separately gated; portable Verilog remains required for open-source interoperability.\n",
              "  - Concurrent or temporal properties and compiler-generated verification monitors are excluded from `digital-verilog-synth`; they remain formal, simulation, or sidecar artifacts.\n  - Keep broad SystemVerilog optional and separately gated; portable Verilog remains required for open-source interoperability.\n",
          )
          replace_once(
              main,
              "  - Freeze clock/reset, combinational, cross-domain, parameter, memory, black-box, assumption-scope, vacuity, result-state, source-map, and simulation/formal-inclusion semantics.\n",
              "  - Freeze clock/reset, combinational, cross-domain, parameter, memory, black-box, assumption-scope, vacuity, result-state, source-map, simulation/formal-inclusion, and immediate-assertion-only synthesis semantics.\n",
          )
          replace_once(
              main,
              "  - Add property/domain/reset/type/capability verification, deterministic parse/print, normalized reports, and portable immediate/monitor/sidecar lowering.\n  - Prove formal-only constructs cannot affect ordinary synthesis/simulation artifacts without explicit inclusion.\n",
              "  - Add property/domain/reset/type/capability verification, immediate-versus-temporal classification, deterministic parse/print, normalized reports, verification-only immediate/monitor/sidecar lowering, and explicit immediate-checker RTL lowering.\n  - Prove concurrent or temporal properties, sampled history, assumptions, covers, symbolic values, and generated verification monitors cannot enter ordinary synthesis artifacts; prove immediate assertions synthesize only through explicit inclusion.\n",
          )
          replace_once(
              main,
              "- **M6 — User-authored formal verification extension:** frozen formal property API, target-neutral property IR, compositional harness/contracts, pluggable proof engines, vacuity/coverage, typed counterexample replay, property libraries, and conformance evidence.\n",
              "- **M6 — User-authored formal verification extension:** frozen formal property API with an immediate-assertion-only synthesis boundary, target-neutral property IR, compositional harness/contracts, pluggable proof engines, vacuity/coverage, typed counterexample replay, property libraries, and conformance evidence.\n",
          )

          digital_plan = "docs/roadmap/digital-verilog-open-source-verification-plan.md"
          replace_once(
              digital_plan,
              "- registers, memories, state machines, and assertions;\n",
              "- registers, memories, state machines, and explicitly synthesized immediate assertions;\n",
          )
          replace_once(
              digital_plan,
              "- portable formal hooks or sidecar harnesses;\n",
              "- explicit synthesized immediate checker logic plus verification-only formal hooks or sidecar harnesses;\n",
          )
          insert_before(
              digital_plan,
              "## Target-HDL optimization integration\n",
              "## Assertion synthesis boundary\n\nThe `digital-verilog-synth` profile accepts checker logic only for an immediate Boolean assertion that is selected explicitly for synthesis. Merely writing an assertion does not add hardware. The synthesized checker is observational by default and produces a deterministic failure indication; functional control requires an ordinary explicit design connection.\n\nConcurrent or temporal properties, sampled-history operators, assumptions, covers, symbolic formal values, fairness or liveness declarations, and compiler-generated verification monitors are excluded from synthesizable DUT RTL. Formal and simulation profiles may create history registers or monitor automata, but those artifacts remain outside the synth profile. An unsupported synthesis request is rejected rather than approximated, bounded, or silently converted.\n\n",
          )
          replace_once(
              digital_plan,
              "Formal syntax remains within the open-source frontend capability profile. Unsupported SVA is lowered to simpler assertions or a sidecar harness, or rejected with a stable diagnostic.\n",
              "Formal syntax remains within the open-source frontend capability profile. Unsupported SVA is lowered to verification-only immediate checks, monitor logic, or a sidecar harness, or rejected with a stable diagnostic. Such monitor logic never enters `digital-verilog-synth`.\n",
          )
          replace_once(
              digital_plan,
              "- portable immediate/monitor/sidecar or future SVA lowering;\n",
              "- verification-only immediate/history/monitor/sidecar or future SVA lowering, plus a separate explicit immediate-assertion synthesis path;\n",
          )

          formal_surface_path = "docs/roadmap/formal-verification-v0.1-surface.json"
          formal_surface = json.loads(read(formal_surface_path))
          formal_surface["roadmap_revision"] = "1.13"
          formal_surface["property_inclusion"] = [
              "formal-only",
              "simulation-and-formal",
              "simulation-only",
              "explicit-synthesized-immediate-assertion",
          ]
          formal_surface["synthesis_boundary"] = {
              "eligible_kind": "explicit-immediate-boolean-assertion",
              "explicit_opt_in_required": True,
              "observational_by_default": True,
              "functional_control_requires_explicit_design_connection": True,
              "concurrent_or_temporal_property": False,
              "sampled_history": False,
              "assume": False,
              "cover": False,
              "symbolic_formal_value": False,
              "generated_verification_monitor_in_synth_rtl": False,
              "ineligible_request_policy": "stable-error",
          }
          required_semantics = formal_surface["target_neutral_ir"]["required_semantics"]
          for item in (
              "immediate versus temporal property classification",
              "explicit synthesis eligibility for immediate assertions only",
          ):
              if item not in required_semantics:
                  required_semantics.append(item)
          formal_surface["lowering_profiles"] = [
              "portable-yosys-verification-immediate-and-monitor",
              "explicit-synthesized-immediate-assertion",
              "sidecar-harness",
              "future-systemverilog-sva",
              "versioned-engine-native-adapter",
          ]
          formal_surface["soundness_rules"].update(
              {
                  "concurrent_or_temporal_property_leaks_to_synthesis": False,
                  "generated_verification_monitor_leaks_to_synthesis": False,
                  "implicit_immediate_assertion_synthesis": False,
                  "assume_or_cover_is_synthesis_eligible": False,
              }
          )
          write(formal_surface_path, json.dumps(formal_surface, indent=2) + "\n")

          backend_surface_path = "docs/roadmap/digital-backend-v0.3-surface.json"
          backend_surface = json.loads(read(backend_surface_path))
          backend_surface["roadmap_revision"] = "1.13"
          backend_surface["assertion_synthesis"] = {
              "eligible_kind": "explicit-immediate-boolean-assertion",
              "explicit_opt_in_required": True,
              "observational_by_default": True,
              "functional_control_requires_explicit_design_connection": True,
              "concurrent_or_temporal_property": False,
              "sampled_history": False,
              "assume": False,
              "cover": False,
              "symbolic_formal_value": False,
              "generated_verification_monitor_in_synth_rtl": False,
          }
          write(backend_surface_path, json.dumps(backend_surface, indent=2) + "\n")

          policy_text = "\n".join(
              read(path)
              for path in (
                  adr,
                  plan,
                  main,
                  digital_plan,
              )
          )
          required_phrases = (
              "only an immediate Boolean assertion may be selected for synthesis",
              "Concurrent or temporal properties",
              "observational by default",
              "never enters synthesizable DUT RTL",
          )
          for phrase in required_phrases:
              if phrase not in policy_text:
                  raise SystemExit(f"missing policy phrase: {phrase}")
          forbidden_phrases = (
              "synthesized-checker only when explicitly requested",
              "synthesis-time checker generation where explicitly requested",
          )
          for phrase in forbidden_phrases:
              if phrase in policy_text:
                  raise SystemExit(f"obsolete broad synthesis policy remains: {phrase}")
          if formal_surface["synthesis_boundary"]["concurrent_or_temporal_property"]:
              raise SystemExit("temporal property was incorrectly made synthesis-eligible")
          if backend_surface["assertion_synthesis"]["generated_verification_monitor_in_synth_rtl"]:
              raise SystemExit("verification monitor was incorrectly admitted to synth RTL")
          PY

      - name: Validate updated contracts
        run: |
          python3 -m json.tool docs/roadmap/formal-verification-v0.1-surface.json >/dev/null
          python3 -m json.tool docs/roadmap/digital-backend-v0.3-surface.json >/dev/null
          python3 scripts/check_markdown.py
          git diff --check

      - name: Publish roadmap policy update
        run: |
          rm .roadmap-immediate-assertion-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Roadmap — Limit synthesis to immediate assertions'
          git push origin HEAD:roadmap/immediate-assertion-synthesis-boundary
