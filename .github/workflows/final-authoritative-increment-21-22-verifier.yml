name: Final Authoritative Increment 21 and 22 Verifier

on:
  push:
    branches:
      - automation/inc21-inc22-probe-stage
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: final-authoritative-increment-21-22-verifier
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/inc21-inc22-probe-stage
          fetch-depth: 0

      - name: Inspect authoritative dev and GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          mkdir -p status
          python3 - <<'PY'
          from __future__ import annotations
          import json, re, subprocess
          from pathlib import Path

          roadmap=subprocess.check_output(['git','show','origin/dev:docs/roadmap/nodal-development-todo.md'],text=True)
          dev_sha=subprocess.check_output(['git','rev-parse','origin/dev'],text=True).strip()
          revision_match=re.search(r'^\*\*Revision:\*\* ([^\n]+)$',roadmap,re.M)
          def entry(number):
              match=re.search(rf'^- \[([ xX])\] \*\*Increment {number} — ([^*]+)\*\*',roadmap,re.M)
              return {'checked':bool(match and match.group(1).lower()=='x'),'title':match.group(2).strip() if match else None}
          def show_json(path):
              try:
                  text=subprocess.check_output(['git','show',f'origin/dev:{path}'],text=True)
                  return json.loads(text)
              except Exception:
                  return None
          def gh(args): return json.loads(subprocess.check_output(['gh',*args],text=True))
          prs=gh(['pr','list','--repo','pysolvesemi/Nodal','--state','all','--limit','100','--json','number,title,state,headRefName,mergedAt,mergeCommit,url'])
          relevant=[p for p in prs if p.get('headRefName','').startswith(('increment/21','increment/22')) or 'Increment 21' in p.get('title','') or 'Increment 22' in p.get('title','')]
          result={'dev_sha':dev_sha,'roadmap_revision':revision_match.group(1).strip() if revision_match else None,'increment20':entry(20),'increment21':entry(21),'increment22':entry(22),'manifest20':show_json('tests/compiler/fixtures/increment20/manifest.json'),'manifest21':show_json('tests/compiler/fixtures/increment21/manifest.json'),'manifest22':show_json('tests/compiler/fixtures/increment22/manifest.json'),'pull_requests':relevant}
          complete21=result['increment21']['checked'] and result['manifest21'] and result['manifest21'].get('status') in {'validated-native-verification-pipeline','validated-staged-semantic-pipeline'}
          complete22=result['increment22']['checked'] and result['manifest22'] and result['manifest22'].get('status')=='validated-circt-legalizer-skeleton'
          result['increment21_complete']=bool(complete21); result['increment22_complete']=bool(complete22)
          Path('status/final-increment21-22.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Publish final status
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/final-increment21-22.json
          git commit -m 'Automation — publish authoritative Increment 21 and 22 final status' || true
          git push origin HEAD:automation/inc21-inc22-probe-stage
