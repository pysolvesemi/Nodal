name: Increment 14 Pipeline and Interface Candidates

on:
  push:
    branches:
      - increment/14-pipeline-interface-candidates
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  candidate-contracts:
    name: increment-14/pipeline-interface-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate positive and negative compile contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment13.py --compile-negative
          python3 scripts/check_increment14.py --compile-negative
          git diff --check

      - name: Apply accepted Codex review closure
        if: github.event_name == 'push' && github.ref_name == 'increment/14-pipeline-interface-candidates'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"expected one replacement anchor in {path}"
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          api_path = Path("core/scala/api/src/nodal/PipelineInterfaceCandidateApi.scala")
          replace_once(
              api_path,
              """enum RoleAccess:
            case In(member: String)
            case Out(member: String)
            case Observe(member: String)
            case Master(member: String)
            case Slave(member: String)
            case Read(member: String)
            case Drive(member: String)
            case Connect(member: String)
            case Sense(member: String)
            case Contribute(member: String)
            case Nested(member: String, role: String)
          """,
              """enum RoleAccess:
            case In(member: String)
            case Out(member: String)
            case Observe(member: String)
            case Master(member: String)
            case Slave(member: String)
            case Read(member: String)
            case Drive(member: String)
            case Connect(member: String)
            case Sense(member: String)
            case Contribute(member: String)
            case Nested(member: String, role: String)

          object RoleAccess:
            private[nodal] def inverted(access: RoleAccess): RoleAccess = access match
              case RoleAccess.In(member)         => RoleAccess.Out(member)
              case RoleAccess.Out(member)        => RoleAccess.In(member)
              case RoleAccess.Observe(member)    => RoleAccess.Observe(member)
              case RoleAccess.Master(member)     => RoleAccess.Slave(member)
              case RoleAccess.Slave(member)      => RoleAccess.Master(member)
              case RoleAccess.Read(member)       => RoleAccess.Drive(member)
              case RoleAccess.Drive(member)      => RoleAccess.Read(member)
              case RoleAccess.Connect(member)    => RoleAccess.Connect(member)
              case RoleAccess.Sense(member)      => RoleAccess.Contribute(member)
              case RoleAccess.Contribute(member) => RoleAccess.Sense(member)
              case RoleAccess.Nested(member, role) =>
                RoleAccess.Nested(member, invertedRoleName(role))

            private def invertedRoleName(role: String): String = role match
              case "master"     => "slave"
              case "slave"      => "master"
              case "source"     => "sink"
              case "sink"       => "source"
              case "initiator"  => "target"
              case "target"     => "initiator"
              case "controller" => "peripheral"
              case "peripheral" => "controller"
              case "device"     => "environment"
              case "environment" => "device"
              case other         => s"inverse($other)"
          """,
          )
          replace_once(
              api_path,
              """trait RoleInverse[R <: RoleKind]:
            type Out <: RoleKind
            def inverse: Role[Out]

          object RoleInverse:
            given masterInverse: RoleInverse[MasterRole] with
              type Out = SlaveRole
              def inverse: Role[SlaveRole] = slave

            given slaveInverse: RoleInverse[SlaveRole] with
              type Out = MasterRole
              def inverse: Role[MasterRole] = master

            given sourceInverse: RoleInverse[SourceRole] with
              type Out = SinkRole
              def inverse: Role[SinkRole] = sink

            given sinkInverse: RoleInverse[SinkRole] with
              type Out = SourceRole
              def inverse: Role[SourceRole] = source

            given initiatorInverse: RoleInverse[InitiatorRole] with
              type Out = TargetRole
              def inverse: Role[TargetRole] = target

            given targetInverse: RoleInverse[TargetRole] with
              type Out = InitiatorRole
              def inverse: Role[InitiatorRole] = initiator

            given controllerInverse: RoleInverse[ControllerRole] with
              type Out = PeripheralRole
              def inverse: Role[PeripheralRole] = peripheral

            given peripheralInverse: RoleInverse[PeripheralRole] with
              type Out = ControllerRole
              def inverse: Role[ControllerRole] = controller

            given deviceInverse: RoleInverse[DeviceRole] with
              type Out = EnvironmentRole
              def inverse: Role[EnvironmentRole] = environment

            given environmentInverse: RoleInverse[EnvironmentRole] with
              type Out = DeviceRole
              def inverse: Role[DeviceRole] = device
          """,
              """trait RoleInverse[R <: RoleKind]:
            type Out <: RoleKind
            def inverseName: String

          object RoleInverse:
            given masterInverse: RoleInverse[MasterRole] with
              type Out = SlaveRole
              def inverseName: String = "slave"

            given slaveInverse: RoleInverse[SlaveRole] with
              type Out = MasterRole
              def inverseName: String = "master"

            given sourceInverse: RoleInverse[SourceRole] with
              type Out = SinkRole
              def inverseName: String = "sink"

            given sinkInverse: RoleInverse[SinkRole] with
              type Out = SourceRole
              def inverseName: String = "source"

            given initiatorInverse: RoleInverse[InitiatorRole] with
              type Out = TargetRole
              def inverseName: String = "target"

            given targetInverse: RoleInverse[TargetRole] with
              type Out = InitiatorRole
              def inverseName: String = "initiator"
          """,
          )
          replace_once(
              api_path,
              """  def inverted(using inverse: RoleInverse[R]): InterfacePort[I, inverse.Out] =
            new InterfacePort(
              endpoint.definition,
              inverse.inverse,
              s"${endpoint.name}.inverse",
              endpoint.domain
            )
          """,
              """  def inverted(using inverse: RoleInverse[R]): InterfacePort[I, inverse.Out] =
            val invertedRole = new Role[inverse.Out](
              inverse.inverseName,
              endpoint.role.access.map(RoleAccess.inverted)
            )
            new InterfacePort[I, inverse.Out](
              endpoint.definition,
              invertedRole,
              s"${endpoint.name}.inverse",
              endpoint.domain
            )
          """,
          )

          example_path = Path("examples/interfacePipelineApi/src/PipelineInterfaceCandidates.scala")
          replace_once(
              example_path,
              """  val invertedPixelSource = pixelSource.inverted
            val pixelMonitor = pixelSource.monitorView
          """,
              """  val invertedPixelSource = pixelSource.inverted
            val invertedPixelAccess = invertedPixelSource.role.access
            val pixelMonitor = pixelSource.monitorView
          """,
          )
          replace_once(example_path, "stage(payload + b)", "stage(payload + payload)")
          replace_once(example_path, "payload + c", "payload + payload")
          replace_once(
              example_path,
              """    invertedPixelSource,
            pixelMonitor,
          """,
              """    invertedPixelSource,
            invertedPixelAccess,
            pixelMonitor,
          """,
          )

          gate_path = Path("docs/design-gates/NodalPipelineInterfaceCandidates-DG-v0.3.md")
          replace_once(
              gate_path,
              "- legal automatic inversion exists only for fully complementary digital role pairs;",
              "- legal automatic inversion exists only for fully complementary digital role pairs and preserves the interface-specific member-access map;",
          )

          manifest_path = Path("tests/api/fixtures/increment14/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          contract = "role-inversion-preserves-interface-access"
          assert contract not in manifest["semantic_contracts"]
          manifest["semantic_contracts"].insert(1, contract)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          checker_path = Path("scripts/check_increment14.py")
          replace_once(
              checker_path,
              """            ".inverted",
                      ".monitorView",
          """,
              """            ".inverted",
                      "invertedPixelSource.role.access",
                      ".monitorView",
          """,
          )
          replace_once(
              checker_path,
              """            "Named roles, protocols, and exact connection",
          """,
              """            "Named roles, protocols, and exact connection",
                      "preserves the interface-specific member-access map",
          """,
          )
          replace_once(
              checker_path,
              """    require(
                  external,
          """,
              """    for forbidden_capture in ("stage(payload + b)", "payload + c"):
              if forbidden_capture in positive:
                  problems.append(
                      Problem(
                          "NODAL-INC14-035",
                          f"pipeline transform captures an undeclared live signal: {forbidden_capture}",
                      )
                  )

              require(
                  external,
          """,
          )
          replace_once(
              checker_path,
              """    if not isinstance(semantic_contracts, list) or len(semantic_contracts) < 20:
              problems.append(
                  Problem("NODAL-INC14-025", "semantic-negative contract inventory is incomplete")
              )
          """,
              """    if not isinstance(semantic_contracts, list) or len(semantic_contracts) < 20:
              problems.append(
                  Problem("NODAL-INC14-025", "semantic-negative contract inventory is incomplete")
              )
              elif "role-inversion-preserves-interface-access" not in semantic_contracts:
                  problems.append(
                      Problem("NODAL-INC14-036", "role inversion access-preservation contract is missing")
                  )
          """,
          )

          workflow_path = Path(".github/workflows/increment-14-pipeline-interface-candidates.yml")
          workflow_path.write_text(
              """name: Increment 14 Pipeline and Interface Candidates

          on:
            push:
              branches:
                - increment/14-pipeline-interface-candidates
            pull_request:
              branches:
                - dev

          permissions:
            contents: read

          jobs:
            candidate-contracts:
              name: increment-14/pipeline-interface-candidates
              runs-on: ubuntu-24.04
              timeout-minutes: 30

              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    fetch-depth: 0

                - name: Validate positive and negative compile contracts
                  run: |
                    ./mill mill.scalalib.scalafmt/checkFormatAll
                    ./mill scalafix.check
                    python3 scripts/check_increment13.py --compile-negative
                    python3 scripts/check_increment14.py --compile-negative
                    git diff --check
          """,
              encoding="utf-8",
          )
          PY
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment13.py --compile-negative
          python3 scripts/check_increment14.py --compile-negative
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/increment-14-pipeline-interface-candidates.yml \
            core/scala/api/src/nodal/PipelineInterfaceCandidateApi.scala \
            docs/design-gates/NodalPipelineInterfaceCandidates-DG-v0.3.md \
            examples/interfacePipelineApi/src/PipelineInterfaceCandidates.scala \
            scripts/check_increment14.py \
            tests/api/fixtures/increment14/manifest.json
          git commit -m "Increment 14 — address pipeline and role review"
          git push
