name: Increment 34 Post-Closure Evidence Label Fix

on:
  push:
    branches:
      - increment/34-postclosure-evidence-label-fix
    paths:
      - '.github/workflows/_inc34_postclosure_evidence_label_fix.yml'

permissions:
  contents: write

concurrency:
  group: increment-34-postclosure-evidence-label-fix
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v6
        with:
          ref: increment/34-postclosure-evidence-label-fix
          fetch-depth: 0

      - name: Correct the validated closure candidate label
        shell: bash
        run: |
          set -euo pipefail
          branch=increment/34-postclosure-evidence-label-fix
          initial=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          test "${initial}" = "${remote}"
          git merge-base --is-ancestor \
            605de95da0d4a9ffb65cab7cfa31bd46a7f6d556 HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")
          old = "[`da785a1f`](https://github.com/pysolvesemi/Nodal/commit/b59ed10f423d4a66e7e47d66ec764b7ff22531e7)"
          new = "[`b59ed10f`](https://github.com/pysolvesemi/Nodal/commit/b59ed10f423d4a66e7e47d66ec764b7ff22531e7)"
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale closure label, found {text.count(old)}")
          text = text.replace(old, new, 1)
          if "[`da785a1f`](https://github.com/pysolvesemi/Nodal/commit/b59ed10f" in text:
              raise SystemExit("stale visible closure label remains")
          path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/_inc34_postclosure_evidence_label_fix.yml

          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py
          python3 scripts/check_increment34.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment34.py'
          python3 scripts/check_markdown.py
          python3 scripts/check_formatting_baseline.py
          git diff --check

          current=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          test "${current}" = "${initial}"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap/nodal-development-todo.md
          git commit -m 'docs(increment34): correct closure evidence label'
          git push origin HEAD:"${branch}"
