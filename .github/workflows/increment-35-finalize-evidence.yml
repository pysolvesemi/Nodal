name: Increment 35 evidence materializer

"on":
  push:
    branches:
      - increment/35-evidence-closure-v1
    paths:
      - .github/workflows/increment-35-finalize-evidence.yml
      - scripts/_increment35_finalize_evidence.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record validated candidate evidence and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_increment35_finalize_evidence.py
          python3 - <<'PY'
          from pathlib import Path

          increment33 = Path("tests/compiler/test_increment33.py")
          lines = increment33.read_text(encoding="utf-8").splitlines(keepends=True)
          old = '                "Increment 35 closure candidate evidence is inconsistent",\n'
          matches = [index for index, line in enumerate(lines) if line == old]
          if len(matches) != 1:
              raise SystemExit(f"Increment 33 dual-state assertion matches: {len(matches)}")
          index = matches[0]
          lines[index:index + 1] = [
              "                (\n",
              '                    "Increment 35 closure candidate evidence is inconsistent"\n',
              '                    if document.get("status") == "evidence-closure-candidate"\n',
              '                    else "validated Increment 35 evidence is inconsistent"\n',
              "                ),\n",
          ]
          increment33.write_text("".join(lines), encoding="utf-8")

          increment35 = Path("tests/compiler/test_increment35.py")
          lines = increment35.read_text(encoding="utf-8").splitlines(keepends=True)

          def bounds(method: str) -> tuple[int, int]:
              marker = f"    def {method}("
              starts = [index for index, line in enumerate(lines) if line.startswith(marker)]
              if len(starts) != 1:
                  raise SystemExit(f"{method} definitions: {len(starts)}")
              start = starts[0]
              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].startswith("    def ")),
                  len(lines),
              )
              return start, end

          start, end = bounds("test_validated_state_remains_supported")
          status_line = '            document["status"] = "validated-differential-integral-operators"\n'
          matches = [index for index in range(start, end) if lines[index] == status_line]
          if len(matches) != 1:
              raise SystemExit(f"validated-state status assignments: {len(matches)}")
          index = matches[0]
          lines[index:index] = [
              '            if document["status"] == "validated-differential-integral-operators":\n',
              "                CHECKER.check_repository(root)\n",
              "                return\n",
          ]

          start, end = bounds("test_closed_roadmap_regression_is_rejected")
          old = '            self.assert_rejected(root, "closure candidate requires revision 1.46")\n'
          matches = [index for index in range(start, end) if lines[index] == old]
          if len(matches) != 1:
              raise SystemExit(f"closed-roadmap assertions: {len(matches)}")
          lines[matches[0]] = '            self.assert_rejected(root, "revision 1.46")\n'

          start, end = bounds("test_evidence_record_mutation_is_rejected")
          old = '            self.assert_rejected(root, "evidence record")\n'
          matches = [index for index in range(start, end) if lines[index] == old]
          if len(matches) != 1:
              raise SystemExit(f"evidence-record assertions: {len(matches)}")
          lines[matches[0]] = (
              '            self.assert_rejected(root, "is missing \'**Implementation PR:** #113\'")\n'
          )
          increment35.write_text("".join(lines), encoding="utf-8")
          PY
          python3 -m py_compile \
            scripts/check_increment33.py \
            scripts/check_increment34.py \
            scripts/check_increment35.py \
            tests/compiler/test_increment33.py \
            tests/compiler/test_increment34.py \
            tests/compiler/test_increment35.py
          rm scripts/_increment35_finalize_evidence.py
          rm .github/workflows/increment-35-finalize-evidence.yml
          python3 scripts/check_increment33.py
          python3 scripts/check_increment34.py
          python3 scripts/check_increment35.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment34.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment35.py'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(increment35): record validated closure candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
