name: Increment 18 Evidence Finalizer

on:
  push:
    branches:
      - increment/18-nodal-mlir-dialect-skeleton
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-18-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: increment-18/finalize-evidence
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Increment 18 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/18-nodal-mlir-dialect-skeleton

      - name: Record accepted roadmap and manifest evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()
          roadmap_path = root / "docs/roadmap/nodal-development-todo.md"
          roadmap = roadmap_path.read_text(encoding="utf-8")

          old_increment = (
              "- [ ] **Increment 18 — Nodal MLIR dialect skeleton**\n"
              "  - Register the out-of-tree dialect, TableGen organization/docs, "
              "generic parser/printer, and a verified placeholder operation.\n"
          )
          new_increment = (
              "- [x] **Increment 18 — Nodal MLIR dialect skeleton**\n"
              "  - Register the out-of-tree dialect, TableGen organization/docs, "
              "generic parser/printer, and a verified placeholder operation.\n"
              "  - Evidence: [`NodalMlirDialectSkeleton-DG-v1.0.md`]"
              "(../design-gates/NodalMlirDialectSkeleton-DG-v1.0.md), "
              "[`increment18-mlir-dialect-skeleton.md`]"
              "(../implementation/increment18-mlir-dialect-skeleton.md), "
              "PR [#45](https://github.com/pysolvesemi/Nodal/pull/45), "
              "dedicated validation run [32767361722]"
              "(https://github.com/pysolvesemi/Nodal/actions/runs/32767361722), "
              "and Core CI run [32767361651]"
              "(https://github.com/pysolvesemi/Nodal/actions/runs/32767361651).\n"
          )

          replacements = (
              ("**Revision:** 1.21", "**Revision:** 1.22"),
              ("**Updated:** 2026-08-24", "**Updated:** 2026-08-25"),
              (old_increment, new_increment),
          )
          for old, new in replacements:
              count = roadmap.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"roadmap anchor count for {old!r} is {count}"
                  )
              roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          manifest_path = root / "tests/compiler/fixtures/increment18/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["status"] = "validated-dialect-skeleton"
          manifest["evidence"] = {
              "pull_request": 45,
              "dedicated_run": 32767361722,
              "core_ci_run": 32767361651,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          checker_path = root / "scripts/check_increment18.py"
          checker = checker_path.read_text(encoding="utf-8")
          old = '            "useDefaultAttributePrinterParser = 1",\n'
          new = '            "remains deferred until a later",\n'
          if checker.count(old) != 1:
              raise RuntimeError("attribute-parser checker anchor is not unique")
          checker_path.write_text(
              checker.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

      - name: Remove finalizer and validate closed state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rm .github/workflows/increment-18-finalize.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          python3 scripts/check_increment18.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check --cached

      - name: Publish roadmap and evidence closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Increment 18 — record accepted CI evidence'
          git push origin HEAD:increment/18-nodal-mlir-dialect-skeleton
