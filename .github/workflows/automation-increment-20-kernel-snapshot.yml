name: Automation Increment 20 Package Ownership

on:
  push:
    branches:
      - automation/increment-20-complete

permissions:
  contents: write

jobs:
  patch-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODAL_WORKSPACE: ${{ github.workspace }}/source

    steps:
      - name: Check out Increment 20 branch
        uses: actions/checkout@v6
        with:
          ref: increment/20-scala-mlir-bridge
          fetch-depth: 0
          path: source

      - name: Align bridge-owned package namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              Path("source/core/scala/bridge/src/nodal/bridge/ScalaToMlirBridge.scala"): (
                  "package nodal.bridge",
                  "package nodal.internal.bridge",
              ),
              Path("source/core/scala/bridge/src/nodal/bridge/NativeCompilerClient.scala"): (
                  "package nodal.bridge",
                  "package nodal.internal.bridge",
              ),
              Path(
                  "source/core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala"
              ): (
                  "import nodal.bridge.*",
                  "import nodal.internal.bridge.*",
              ),
          }
          for path, (old, new) in edits.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate package policy and Scala core
        working-directory: source
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          python3 scripts/check_package_visibility.py
          python3 scripts/check_increment20.py
          ./nodal core scala
          git diff --check

      - name: Commit validated package ownership
        working-directory: source
        run: |
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add \
            core/scala/bridge/src/nodal/bridge/ScalaToMlirBridge.scala \
            core/scala/bridge/src/nodal/bridge/NativeCompilerClient.scala \
            core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala
          git commit -m "Increment 20 — align bridge package ownership"
          git push origin HEAD:increment/20-scala-mlir-bridge
