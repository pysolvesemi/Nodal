name: Increment 24 Current-Dev Materializer

on:
  push:
    branches:
      - increment/24-minimal-analog-expression-contribution-ir

permissions:
  contents: write

concurrency:
  group: increment-24-current-dev-materializer
  cancel-in-progress: false

jobs:
  materialize:
    name: increment-24/materialize-current-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out current Increment 24 branch
        uses: actions/checkout@v6
        with:
          ref: increment/24-minimal-analog-expression-contribution-ir
          fetch-depth: 0

      - name: Restore locked caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/nodal/downloads
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-inc24-materialize-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', 'toolchains/lock.json', 'toolchains/checksums/*.sha256', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-inc24-materialize-${{ runner.os }}-
            nodal-inc24-${{ runner.os }}-
            nodal-inc23-${{ runner.os }}-
            nodal-scala-${{ runner.os }}-

      - name: Materialize typed analog IR from the reviewed Increment 24 patch set
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            automation/increment24-materialize:refs/remotes/origin/automation/increment24-materialize
          source_ref=refs/remotes/origin/automation/increment24-materialize
          for script in \
            patch_increment24_dialect \
            patch_increment24_typed_parent_checks \
            patch_increment24_contracts \
            patch_increment24_successor_evidence \
            patch_increment24_workflow_contract; do
            git show "${source_ref}:scripts/${script}.py" > "/tmp/${script}.py"
            python3 "/tmp/${script}.py" .
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/compiler/test_increment24.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          rewritten = []
          parameter_replacements = 0
          pipeline_replacements = 0
          for line in lines:
              if "unknown parameter" in line and "unknown reference" in line:
                  rewritten.append(
                      '        path.write_text(path.read_text(encoding="utf-8").replace("LogicalResult nodal::ParameterRefOp::verify()", "LogicalResult nodal::MissingParameterRefOp::verify()", 1), encoding="utf-8")\n'
                  )
                  parameter_replacements += 1
              elif 'name == "nodal.contribute"' in line and ".replace(" in line:
                  rewritten.append(
                      "        path.write_text(path.read_text(encoding=\"utf-8\").replace('\"nodal.contribute\"', '\"nodal.missing_contribution\"'), encoding=\"utf-8\")\n"
                  )
                  pipeline_replacements += 1
              else:
                  rewritten.append(line)
          if parameter_replacements != 1:
              raise RuntimeError(
                  f"parameter mutation-test anchor count: {parameter_replacements}"
              )
          if pipeline_replacements != 1:
              raise RuntimeError(
                  f"pipeline mutation-test anchor count: {pipeline_replacements}"
              )
          path.write_text("".join(rewritten), encoding="utf-8")
          PY

      - name: Install locked toolchains and format native changes
        run: |
          set -euo pipefail
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Dialect/Nodal/NodalOps.cpp \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/test/Unit/AnalogExpressionTest.cpp
          git rm -f .github/workflows/automation-increment24-current-materializer.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate Increment 18 through Increment 24 contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/check_increment18.py
          python3 scripts/check_increment19.py
          python3 scripts/check_increment20.py
          python3 scripts/check_increment21.py
          python3 scripts/check_increment22.py
          python3 scripts/check_increment23.py
          python3 scripts/check_increment24.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Build lint and test native and Scala core
        run: |
          set -euo pipefail
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          NODAL_NODALC="${PWD}/out/native/release/bin/nodalc" \
            ./nodal core scala

      - name: Prove RC equation and stable analog rejections
        run: |
          set -euo pipefail
          compiler="${PWD}/out/native/release/bin/nodalc"
          "${compiler}" \
            --pass-pipeline='builtin.module(nodal-gate-default)' \
            core/compiler/test/IR/analog-expression-rc.mlir \
            | tee /tmp/analog-expression-rc.mlir
          grep -F 'nodal.contribute' /tmp/analog-expression-rc.mlir
          grep -F 'nodal.analog_ddt' /tmp/analog-expression-rc.mlir

          if "${compiler}" \
              core/compiler/test/IR/analog-expression-invalid-parameter.mlir \
              >/tmp/invalid-parameter.out 2>/tmp/invalid-parameter.err; then
            echo 'unknown analog parameter was accepted' >&2
            exit 1
          fi
          grep -F 'NODAL-ANALOG-PARAMETER-001' /tmp/invalid-parameter.err

          if "${compiler}" \
              core/compiler/test/IR/analog-expression-invalid-contribution.mlir \
              >/tmp/invalid-contribution.out 2>/tmp/invalid-contribution.err; then
            echo 'invalid analog contribution kind was accepted' >&2
            exit 1
          fi
          grep -F 'NODAL-ANALOG-CONTRIBUTION-001' /tmp/invalid-contribution.err

      - name: Publish Increment 24 implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 24 — implement minimal analog expression and contribution IR"
          git pull --rebase origin increment/24-minimal-analog-expression-contribution-ir
          git push origin HEAD:increment/24-minimal-analog-expression-contribution-ir
