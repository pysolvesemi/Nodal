name: Increment 28 Evidence Materialize

on:
  push:
    branches:
      - increment/28-evidence-closure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-28-evidence-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: increment-28/evidence-materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v6
        with:
          ref: increment/28-evidence-closure
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record accepted implementation evidence
        run: python3 scripts/materialize_increment28_evidence.py

      - name: Remove one-shot materialization files
        run: |
          rm -f scripts/materialize_increment28_evidence.py
          rm -f .github/workflows/increment-28-evidence-materialize.yml

      - name: Validate closed Increment 28 state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in $(seq 18 28); do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest \
            tests.compiler.test_increment27 \
            tests.compiler.test_increment28
          python3 scripts/check_markdown.py
          git diff --check

      - name: Commit final evidence closure
        run: |
          git add -A
          git commit -m "Increment 28 — record accepted evidence"
          git push origin HEAD:increment/28-evidence-closure
