name: Fix Increment 11 Scala erasure

on:
  push:
    branches:
      - increment/11-public-api-design-gate-v0.1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: increment/11-public-api-design-gate-v0.1

      - name: Add stable target names for integer operators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/scala/api/src/nodal/CandidateApi.scala")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "  def +(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n":
                  "  @targetName(\"integerExpressionAdd\")\n"
                  "  def +(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n",
              "  def -(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n":
                  "  @targetName(\"integerExpressionSubtract\")\n"
                  "  def -(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n",
              "  def *(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n":
                  "  @targetName(\"integerExpressionMultiply\")\n"
                  "  def *(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n",
              "  def /(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n":
                  "  @targetName(\"integerExpressionDivide\")\n"
                  "  def /(right: Expr[Integer]): Expr[Integer] = FrozenApiRuntime.expr(left, right)\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing operator anchor: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          ./mill mill.scalalib.scalafmt/reformatAll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/scala/api/src/nodal/CandidateApi.scala
          git commit -m 'fix(api): disambiguate frozen integer operators after erasure'
          git push origin HEAD:increment/11-public-api-design-gate-v0.1
