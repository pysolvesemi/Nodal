name: Export Increment 34 source workspace

on:
  push:
    branches:
      - automation/inc34-native-control-flow-20260902
    paths:
      - '.github/workflows/automation-export-inc34-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: 604dd738c6acff5191d6f851155d3fcad103531f
          path: source

      - name: Create immutable source archive
        run: |
          tar \
            --exclude='.git' \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf nodal-inc34-604dd738.tar.gz \
            -C source .
          sha256sum nodal-inc34-604dd738.tar.gz \
            > nodal-inc34-604dd738.tar.gz.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc34-604dd738-source
          path: |
            nodal-inc34-604dd738.tar.gz
            nodal-inc34-604dd738.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
