name: Increment 32 Live Source Bundle

on:
  push:
    branches:
      - automation/inc32-source-bundle-live

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current Increment 32 branch
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0
      - name: Restore Scala dependency cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
            ~/.cache/mill/download
          key: nodal-inc32-validation-deps-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafix.conf', '.scalafmt.conf') }}
          restore-keys: |
            nodal-inc32-scala-cache-${{ runner.os }}-
            nodal-scala-${{ runner.os }}-
      - name: Populate complete Scala validation dependencies
        run: |
          ./mill core.scala.testkit.test
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
      - name: Package complete validation dependency groups
        run: |
          cd "$HOME"
          tar -czf /tmp/nodal-inc32-validation-groups.tgz \
            .cache/coursier/v1/https/repo1.maven.org/maven2/com/lihaoyi \
            .cache/coursier/v1/https/repo1.maven.org/maven2/org/scalameta \
            .cache/coursier/v1/https/repo1.maven.org/maven2/ch/epfl/scala \
            .cache/nodal/mill \
            .cache/mill/download
      - name: Upload validation dependency groups
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc32-validation-groups
          path: /tmp/nodal-inc32-validation-groups.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
