name: Dependency report

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-report
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6

      - name: Generate update-candidate report
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .validation
          python3 scripts/dependency_report.py \
            --online \
            --markdown .validation/dependency-report.md \
            --json .validation/dependency-report.json \
            --github-output "${GITHUB_OUTPUT}"
          cat .validation/dependency-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report-${{ github.run_id }}
          path: |
            .validation/dependency-report.md
            .validation/dependency-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh update proposal
        if: steps.report.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[dependency-report] Nodal toolchain update candidates'
        run: |
          {
            echo 'This automated issue is a proposal only. It never changes the checked toolchain lock.'
            echo
            cat .validation/dependency-report.md
          } > .validation/dependency-issue.md

          issue_number="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[dependency-report] Nodal toolchain update candidates") | .number' \
              | head -n 1
          )"

          if [ -n "${issue_number}" ]; then
            gh issue edit "${issue_number}" --body-file .validation/dependency-issue.md
          else
            gh issue create --title "${TITLE}" --body-file .validation/dependency-issue.md
          fi
