name: Fix verification roadmap markdown separators

on:
  push:
    branches:
      - increment/147-verification-projection-roadmap
    paths:
      - .github/workflows/roadmap-markdown-spacing-fix.yml

permissions:
  contents: write

jobs:
  fix-separators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add required markdown separators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/nodal-development-todo.md')
          text = path.read_text()
          replacements = [
              ('  - Do not generate production UVM/UVM-MS code or vendor scripts in Foundation.\n## Foundation completion barrier', '  - Do not generate production UVM/UVM-MS code or vendor scripts in Foundation.\n\n## Foundation completion barrier'),
              ('- [ ] **Digital Verification Increment 11 — Scale, performance, compatibility, and verification release gate**\n## Analog/Mixed-Signal Verification Track', '- [ ] **Digital Verification Increment 11 — Scale, performance, compatibility, and verification release gate**\n\n## Analog/Mixed-Signal Verification Track'),
              ('- [ ] **AMS Verification Increment 12 — Scale, performance, compatibility, and AMS verification release gate**\n## Deferred reusable library roadmap', '- [ ] **AMS Verification Increment 12 — Scale, performance, compatibility, and AMS verification release gate**\n\n## Deferred reusable library roadmap'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing separator anchor: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/roadmap-markdown-spacing-fix.yml').unlink()
          PY
      - name: Validate separators
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/roadmap/nodal-development-todo.md').read_text()
          assert '\n\n## Foundation completion barrier' in text
          assert '\n\n## Analog/Mixed-Signal Verification Track' in text
          assert '\n\n## Deferred reusable library roadmap' in text
          PY
          test ! -e .github/workflows/roadmap-markdown-spacing-fix.yml
      - name: Commit separator fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/nodal-development-todo.md .github/workflows/roadmap-markdown-spacing-fix.yml
          git diff --cached --check
          git commit -m 'Increment 147 — fix roadmap markdown separators'
          git push origin HEAD
