name: Increment 35 Source Repair

"on":
  push:
    branches:
      - increment/35-differential-integral-operators-v1
    paths:
      - .github/workflows/increment-35-one-shot-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source repair and remove helper
        env:
          PATCH_SCRIPT_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64, os; exec(base64.b64decode(os.environ["PATCH_SCRIPT_B64"]))'
          rm .github/workflows/increment-35-one-shot-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/scala/api/src/nodal/ElaborationConstructionKernel.scala .github/workflows/increment-35-one-shot-repair.yml
          git commit -m "fix(increment35): separate literal payloads from expression operands"
          git push origin "HEAD:${GITHUB_REF_NAME}"
