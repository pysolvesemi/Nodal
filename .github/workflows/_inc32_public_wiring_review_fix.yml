name: Increment 32 Public Wiring Review Fix

on:
  push:
    branches:
      - automation/inc32-public-wiring-review-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Increment 32 review head
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0

      - name: Verify expected base and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          expected=52799e2e18a3b55cccb0d635d0a83c091c330ecd
          test "$(git rev-parse HEAD)" = "$expected"
          PATCH_B64=''
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/inc32-review-fix.patch
          echo '5055a6a3e91a6847c0da53b62f6dcbe65a56a116d7ce30f2d0dcfda2fa00806e  /tmp/inc32-review-fix.patch' | sha256sum --check
          git apply --check /tmp/inc32-review-fix.patch
          git apply /tmp/inc32-review-fix.patch
          git diff --check

      - name: Validate public wiring and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          ./mill core.scala.testkit.test
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          git diff --check

      - name: Commit and push exact review fix
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -path './.git' -prune -o -path './out' -prune -o -name '__pycache__' -print -quit)"
          git config user.name 'pysolvesemi'
          git config user.email 'pysolvesemi@gmail.com'
          git add -A
          git commit -m 'fix(increment32): wire public equation semantics'
          git push origin HEAD:increment/32-equation-contribution-semantics-review
