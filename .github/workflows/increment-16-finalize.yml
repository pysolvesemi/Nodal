name: Increment 16 Finalize Construction Kernel

on:
  push:
    branches:
      - increment/16-elaboration-construction-kernel
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: increment-16-finalize-construction-kernel
  cancel-in-progress: true

jobs:
  finalize:
    name: increment-16/finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out authoritative branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/16-elaboration-construction-kernel

      - name: Refresh latest remote head
        run: |
          git fetch origin increment/16-elaboration-construction-kernel dev
          git reset --hard origin/increment/16-elaboration-construction-kernel

      - name: Materialize clean construction implementation
        run: |
          python3 scripts/materialize_increment16_v10.py
          ./mill mill.scalalib.scalafmt/reformatAll

      - name: Validate materialized implementation
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment11.py
          python3 scripts/check_increment12.py --compile-negative
          python3 scripts/check_increment13.py --compile-negative
          python3 scripts/check_increment14.py --compile-negative
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py --compile
          python3 tests/api/test_increment16.py
          git add -A
          python3 scripts/check_formatting_baseline.py
          git diff --cached --check

      - name: Remove temporary construction machinery
        run: |
          rm -rf scripts/increment16_payload
          rm -f \
            scripts/apply_increment16.py \
            scripts/materialize_increment16.py \
            scripts/materialize_increment16_v2.py \
            scripts/materialize_increment16_v3.py \
            scripts/materialize_increment16_v4.py \
            scripts/materialize_increment16_v5.py \
            scripts/materialize_increment16_v6.py \
            scripts/materialize_increment16_v7.py \
            scripts/materialize_increment16_v8.py \
            scripts/materialize_increment16_v9.py \
            scripts/materialize_increment16_v10.py \
            scripts/repair_increment16_round1.py \
            scripts/repair_increment16_round2.py

          cat > .github/workflows/increment-16-construction-kernel.yml <<'YAML'
          name: Increment 16 Elaboration Construction Kernel

          on:
            push:
              branches:
                - increment/16-elaboration-construction-kernel
            pull_request:
              branches:
                - dev

          permissions:
            contents: read

          jobs:
            construction-kernel:
              name: increment-16/construction-kernel
              runs-on: ubuntu-24.04
              timeout-minutes: 75

              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    fetch-depth: 0

                - name: Bootstrap pinned contract toolchain
                  run: |
                    ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
                    echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" >> "$GITHUB_ENV"

                - name: Validate construction and predecessor contracts
                  run: |
                    ./mill mill.scalalib.scalafmt/checkFormatAll
                    ./mill scalafix.check
                    python3 scripts/check_increment11.py
                    python3 scripts/check_increment12.py --compile-negative
                    python3 scripts/check_increment13.py --compile-negative
                    python3 scripts/check_increment14.py --compile-negative
                    python3 scripts/check_increment15.py --compile-negative
                    python3 scripts/check_increment16.py --compile
                    python3 tests/api/test_increment16.py
                    python3 scripts/check_formatting_baseline.py
                    python3 scripts/check_markdown.py
                    python3 scripts/check_package_visibility.py
                    ./nodal check \
                      --contracts-only \
                      --online-toolchain \
                      --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
                      --base-ref origin/dev
                    git diff --check
          YAML

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/CODEOWNERS')
          lines = path.read_text(encoding='utf-8').splitlines()
          required = (
              '/core/scala/api/src/nodal/ElaborationConstructionKernel.scala @pysolvesemi',
              '/core/scala/testkit/test/src/nodal/ConstructionKernelTests.scala @pysolvesemi',
              '/docs/design-gates/NodalConstructionKernel-DG-v1.0.md @pysolvesemi',
              '/docs/implementation/increment16-construction-kernel.md @pysolvesemi',
              '/scripts/check_increment16.py @pysolvesemi',
              '/tests/api/fixtures/increment16/manifest.json @pysolvesemi',
              '/.github/workflows/increment-16-construction-kernel.yml @pysolvesemi',
          )
          for line in required:
              if line not in lines:
                  lines.append(line)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate final clean preflight tree
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment11.py
          python3 scripts/check_increment12.py --compile-negative
          python3 scripts/check_increment13.py --compile-negative
          python3 scripts/check_increment14.py --compile-negative
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py --compile
          python3 tests/api/test_increment16.py
          git add -A
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git diff --exit-code -- .github/workflows/increment-16-construction-kernel.yml

      - name: Commit clean implementation tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 16 — materialize clean construction kernel"
          git push origin HEAD:increment/16-elaboration-construction-kernel
