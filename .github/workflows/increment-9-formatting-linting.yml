name: Increment 9 formatting, linting, and contribution rules

on:
  push:
    branches:
      - increment/9-formatting-linting-contribution-rules
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  increment-9:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_COLOR: '0'
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' \
            -f context='increment-9/formatting-linting' \
            -f description='Increment 9 validation is running' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch integration base
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: increment-9-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lint-lock.json') }}
          restore-keys: |
            increment-9-scala-${{ runner.os }}-

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: increment-9-native-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Run complete Increment 9 gate
        run: |
          ./nodal check \
            --online-toolchain \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev

      - name: Record completed roadmap evidence
        if: success() && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "- [ ] **Increment 9 — Formatting, linting and contribution rules**"
          next_marker = "\n\n- [ ] **Increment 10 — Public API candidate prototypes**"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("unchecked Increment 9 marker not found")
          end = text.find(next_marker, start)
          if end < 0:
              raise SystemExit("Increment 10 boundary not found")
          replacement = "\n".join(
              (
                  "- [x] **Increment 9 — Formatting, linting and contribution rules**",
                  "  - Add Scalafmt/Scalafix, ClangFormat/ClangTidy where compatible with LLVM style, Markdown checks, commit/PR expectations, package-visibility checks, and rules that public API or core/library boundary changes require a design gate.",
                  "  - Evidence: [`.scalafmt.conf`](../../.scalafmt.conf), [`.scalafix.conf`](../../.scalafix.conf), [`.clang-format`](../../.clang-format), [`.clang-tidy`](../../.clang-tidy), [`CONTRIBUTING.md`](../../CONTRIBUTING.md), [`scripts/check_increment9.py`](../../scripts/check_increment9.py), [`tests/lint/`](../../tests/lint/), [`docs/development/style-and-contributions.md`](../development/style-and-contributions.md), completion commit [`80ab4e0`](https://github.com/pysolvesemi/Nodal/commit/80ab4e0764efb82cedf0adff87b1912b8ffd0f21), and successful validation run [`32444753017`](https://github.com/pysolvesemi/Nodal/actions/runs/32444753017).",
              )
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/nodal-development-todo.md
          git commit -m 'docs: complete Increment 9 roadmap evidence'
          git push origin HEAD:increment/9-formatting-linting-contribution-rules

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = success ]; then
            state=success
            description='Increment 9 validation passed'
          else
            state=failure
            description='Increment 9 validation failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='increment-9/formatting-linting' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
