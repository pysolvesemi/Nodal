name: Increment 16 Checker Repair

on:
  push:
    branches:
      - increment/16-elaboration-construction-kernel

permissions:
  contents: write

concurrency:
  group: increment-16-checker-repair
  cancel-in-progress: true

jobs:
  repair:
    name: increment-16/checker-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Wait for construction materialization and compile repair
        run: sleep 240

      - name: Check out latest branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/16-elaboration-construction-kernel

      - name: Refresh latest remote head
        run: |
          git fetch origin increment/16-elaboration-construction-kernel
          git reset --hard origin/increment/16-elaboration-construction-kernel

      - name: Apply checker repair
        run: python3 scripts/repair_increment16_round2.py

      - name: Format and validate
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment16.py --compile
          python3 tests/api/test_increment16.py
          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 16 — repair checker contracts"
          git pull --rebase origin increment/16-elaboration-construction-kernel
          git push origin HEAD:increment/16-elaboration-construction-kernel
