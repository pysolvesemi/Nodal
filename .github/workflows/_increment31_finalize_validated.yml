name: Increment 31 Validated Finalization

on:
  push:
    branches:
      - increment/31-potential-flow-access

permissions:
  contents: write

concurrency:
  group: increment-31-validated-finalization
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply repository-owned Increment 31 finalization
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ -f scripts/_increment31_finalize.py ]; then
            python3 scripts/_increment31_finalize.py
          fi
          rm -f .github/workflows/_increment31_finalize_validated.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate all Increment 31 repository contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in $(seq 18 31); do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 tests/compiler/test_increment31.py
          python3 -m unittest discover -s tests/compiler -p 'test_*.py'
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          python3 scripts/check_contribution_policy.py --base-ref origin/dev
          git diff --check

      - name: Validate native compiler and backend
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Commit validated finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(increment31): finalize validated implementation"
          git push origin HEAD:increment/31-potential-flow-access
