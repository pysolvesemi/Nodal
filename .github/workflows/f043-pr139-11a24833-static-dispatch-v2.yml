name: F043 PR139 formatted static-domain targeted dispatch
on:
  push:
    branches: ['ci-control/f043-pr139-11a24833-static-v2']
    paths: ['.github/workflows/f043-pr139-11a24833-static-dispatch-v2.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: f043-pr139-11a24833-static-dispatch-v2
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validate repaired identities and dispatch affected checks once
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path

          REPO = "pysolvesemi/Nodal"
          REPO_ID = 1340301335
          PR = 139
          TARGET = "e34d17ba2c9adb9e765ee4f0c97699128c224340"
          TARGET_TREE = "57d402aada6561e1c51ef9b60c49fff193219d8e"
          HEAD = "11a248333ccb093607b6402e0d975c615f3a893e"
          TREE = "c647d7cd06686a9ef92aae76dcf616150722ae74"
          PARENT = "76652472d6566bff82c4488022f64d3f5be9eb13"
          REF = "increment/43-analog-arrays-generation"
          CONTROL = "ci-control/f043-pr139-11a24833-static-v2"
          FILE = ".github/workflows/f043-pr139-11a24833-static-dispatch-v2.yml"
          SOURCE_FILES = [
              "core/scala/api/src/nodal/AnalogControlFlowConstruction.scala",
              "core/scala/api/src/nodal/IterationDomain.scala",
              "core/scala/testkit/test/src/nodal/IterationDomainTests.scala",
          ]
          WORKFLOWS = {
              338626156: (".github/workflows/ci.yml",
                          "906f29eff255f820b540e13111d4494e872daccf",
                          "8e60508454a7d56af871e85cf92e54c608240f6fb156967563d90ac16dc12a20"),
              350854514: (".github/workflows/increment-37-analog-events.yml",
                          "872b0778c942ac6d74b16d295f4ca45bb8a36e7b",
                          "d1688942b13fa071ff280a84dc67533942cb4b62834e9ec2c762e97903cadd8f"),
          }
          PRIOR = {
              338626156: (36900051363, {
                  110496674825: ("failure", "Validate contracts, style, and online provenance"),
                  110496674546: ("success", None),
                  110496675048: ("success", None),
                  110501392752: ("failure", "Require every Core CI job"),
              }),
              350854514: (36900082870, {
                  110496779780: ("failure", "Check style and documentation"),
              }),
          }
          PREFIX = "/repos/" + REPO
          POSTS = {PREFIX + f"/actions/workflows/{workflow}/dispatches" for workflow in WORKFLOWS}
          ACTIVE = {"queued", "in_progress", "waiting", "pending", "requested"}


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("API redirect refused")


          class Api:
              def __init__(self, token):
                  self.token = token
                  self.posts = set()
                  self.opener = urllib.request.build_opener(NoRedirect())

              def __call__(self, method, path, payload=None):
                  require(path.startswith(PREFIX + "/") and ".." not in path,
                          "unexpected API destination")
                  if method == "POST":
                      require(path in POSTS and payload == {"ref": REF} and path not in self.posts,
                              "write is not a fresh allowlisted dispatch")
                      self.posts.add(path)
                  else:
                      require(method == "GET" and payload is None, "unexpected operation")
                  request = urllib.request.Request(
                      "https://api.github.com" + path, method=method,
                      data=None if payload is None else json.dumps(payload).encode(),
                      headers={"Authorization": "Bearer " + self.token,
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28",
                               "Content-Type": "application/json"})
                  with self.opener.open(request, timeout=30) as response:
                      if method == "POST":
                          require(response.status == 204, "dispatch not acknowledged")
                          return None
                      raw = response.read(2 * 1024 * 1024 + 1)
                      require(len(raw) <= 2 * 1024 * 1024, "API response exceeds bound")
                      return json.loads(raw)


          def pages(api, path, key):
              result = []
              total = None
              separator = "&" if "?" in path else "?"
              for page in range(1, 21):
                  response = api("GET", path + separator + f"per_page=100&page={page}")
                  count = response["total_count"]
                  require(type(count) is int and 0 <= count <= 2000, "invalid inventory count")
                  require(total is None or total == count, "inventory moved during pagination")
                  total = count
                  batch = response[key]
                  require(isinstance(batch, list) and len(batch) == min(100, total - len(result)),
                          "incomplete inventory page")
                  result.extend(batch)
                  if len(result) == total:
                      require(len({entry["id"] for entry in result}) == len(result),
                              "duplicate inventory identities")
                      return result
              raise RuntimeError("inventory pagination exceeded bound")


          def prior_failure(api, workflow):
              run_id, expected_jobs = PRIOR[workflow]
              run = api("GET", PREFIX + f"/actions/runs/{run_id}")
              require(run["id"] == run_id and run["workflow_id"] == workflow and
                      run["head_sha"] == PARENT and run["head_branch"] == REF and
                      run["event"] == "workflow_dispatch" and run["run_attempt"] == 1 and
                      run["status"] == "completed" and run["conclusion"] == "failure",
                      "prior failed run identity or terminal state changed")
              jobs = pages(api, PREFIX + f"/actions/runs/{run_id}/attempts/1/jobs", "jobs")
              require({job["id"] for job in jobs} == set(expected_jobs), "prior jobs changed")
              for job in jobs:
                  conclusion, failed_step = expected_jobs[job["id"]]
                  require(job["run_id"] == run_id and job["head_sha"] == PARENT and
                          job["status"] == "completed" and job["conclusion"] == conclusion,
                          "prior job identity or outcome changed")
                  failures = [step["name"] for step in job["steps"]
                              if step["conclusion"] not in {"success", "skipped"}]
                  require(failures == ([] if failed_step is None else [failed_step]),
                          "prior failure scope changed")


          def identities(api, environment, workflow):
              require(environment["GITHUB_REPOSITORY"] == REPO and
                      environment["GITHUB_REPOSITORY_ID"] == str(REPO_ID) and
                      environment["GITHUB_REF"] == "refs/heads/" + CONTROL and
                      environment["GITHUB_EVENT_NAME"] == "push" and
                      environment["GITHUB_RUN_ATTEMPT"] == "1" and
                      re.fullmatch(r"[0-9a-f]{40}", environment["GITHUB_SHA"]),
                      "wrong controller context or repeated attempt")
              controller = api("GET", PREFIX + "/commits/" + environment["GITHUB_SHA"])
              require([p["sha"] for p in controller["parents"]] == [TARGET] and
                      [f["filename"] for f in controller["files"]] == [FILE] and
                      controller["files"][0]["status"] == "added",
                      "controller is not the scoped direct target child")
              for ref, sha in ((CONTROL, environment["GITHUB_SHA"]), ("dev", TARGET), (REF, HEAD)):
                  require(api("GET", PREFIX + "/git/ref/heads/" + ref)["object"]["sha"] == sha,
                          "live ref moved: " + ref)
              require(api("GET", PREFIX + "/git/commits/" + TARGET)["tree"]["sha"] == TARGET_TREE,
                      "integration tree changed")
              pr = api("GET", PREFIX + f"/pulls/{PR}")
              require(pr["state"] == "open" and pr["merged"] is False and pr["draft"] is True,
                      "PR state changed")
              require(pr["base"]["ref"] == "dev" and pr["base"]["sha"] == TARGET and
                      pr["head"]["ref"] == REF and pr["head"]["sha"] == HEAD and
                      pr["base"]["repo"]["id"] == REPO_ID and pr["head"]["repo"]["id"] == REPO_ID,
                      "PR identities changed")
              commit = api("GET", PREFIX + "/commits/" + HEAD)
              require(commit["commit"]["tree"]["sha"] == TREE and
                      [p["sha"] for p in commit["parents"]] == [PARENT] and
                      sorted(f["filename"] for f in commit["files"]) == SOURCE_FILES,
                      "source checkpoint or scope changed")
              path, blob, digest = WORKFLOWS[workflow]
              registered = api("GET", PREFIX + f"/actions/workflows/{workflow}")
              require(registered["id"] == workflow and registered["state"] == "active" and
                      registered["path"] == path, "wrong registered workflow")
              for revision in (HEAD, TARGET):
                  content = api("GET", PREFIX + "/contents/" + path + "?ref=" + revision)
                  require(content["encoding"] == "base64" and content["sha"] == blob,
                          "unexpected workflow blob or encoding")
                  definition = base64.b64decode(content["content"])
                  require(hashlib.sha256(definition).hexdigest() == digest and
                          b"\n  workflow_dispatch:" in definition, "workflow definition changed")
              prior_failure(api, workflow)


          def inventory(api):
              runs = pages(api, PREFIX + "/actions/runs?head_sha=" + HEAD, "workflow_runs")
              require(all(run["head_sha"] == HEAD for run in runs), "wrong-head inventory")
              return runs


          def retain_existing(runs, workflow, record):
              matching = [run for run in runs if run["workflow_id"] == workflow]
              if not matching:
                  return False
              require(all(run["head_branch"] == REF and
                          run["event"] in {"workflow_dispatch", "push", "pull_request"}
                          for run in matching), "existing run has unexpected context")
              record("retained-existing", {"workflow_id": workflow,
                                            "run_ids": [run["id"] for run in matching]})
              require(any(run["status"] in ACTIVE or
                          run["status"] == "completed" and run["conclusion"] == "success"
                          for run in matching), "existing failure requires diagnosis, not another dispatch")
              return True


          def execute(api, environment, record, sleep=time.sleep):
              for workflow in WORKFLOWS:
                  identities(api, environment, workflow)
                  if retain_existing(inventory(api), workflow, record):
                      continue
                  identities(api, environment, workflow)
                  if retain_existing(inventory(api), workflow, record):
                      continue
                  path = PREFIX + f"/actions/workflows/{workflow}/dispatches"
                  record("dispatch-intent", {"path": path, "payload": {"ref": REF}, "head": HEAD})
                  try:
                      api("POST", path, {"ref": REF})
                  except Exception:
                      record("dispatch-uncertain", {"workflow_id": workflow, "retry": False})
                      raise
                  record("dispatch-acknowledged", {"workflow_id": workflow, "http_status": 204})
                  for _ in range(12):
                      matching = [run for run in inventory(api) if run["workflow_id"] == workflow]
                      if matching:
                          require(len(matching) == 1, "ambiguous dispatch inventory")
                          run = matching[0]
                          require(run["head_branch"] == REF and run["event"] == "workflow_dispatch" and
                                  run["run_attempt"] == 1, "observed dispatch identity mismatch")
                          record("dispatch-observed", {"run_id": run["id"], "head": HEAD,
                                                       "workflow_id": workflow, "attempt": 1})
                          break
                      sleep(5)
                  else:
                      record("observation-incomplete", {"workflow_id": workflow, "retry": False})
                      raise RuntimeError("dispatch observation incomplete; reconcile without blind retry")


          if __name__ == "__main__":
              destination = Path(os.environ["RUNNER_TEMP"]) / "f043-11a24833-dispatch-v2"
              destination.mkdir(exist_ok=False)
              events = []
              previous = "0" * 64

              def record(event, data):
                  global previous
                  entry = {"sequence": len(events) + 1, "previous_sha256": previous,
                           "event": event, "data": data}
                  previous = hashlib.sha256(json.dumps(entry, sort_keys=True).encode()).hexdigest()
                  entry["sha256"] = previous
                  with (destination / "ledger.jsonl").open("a") as stream:
                      stream.write(json.dumps(entry, sort_keys=True) + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  events.append(entry)
                  print(json.dumps(entry, sort_keys=True), flush=True)

              record("controller-start", {"head": HEAD, "tree": TREE, "base": TARGET,
                                          "controller_sha": os.environ["GITHUB_SHA"]})
              execute(Api(os.environ["GITHUB_TOKEN"]), os.environ, record)
      - name: Retain dispatch ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f043-pr139-11a24833-dispatch-v2-ledger
          path: ${{ runner.temp }}/f043-11a24833-dispatch-v2/
          if-no-files-found: error
