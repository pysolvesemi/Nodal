name: Increment 148 Roadmap Overview Sync

on:
  push:
    branches:
      - increment/148-native-digital-simulator-adapter-roadmap

permissions:
  contents: write

jobs:
  sync-overview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Synchronize top-level TODO and remove staging workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence, found {count}: {old[:120]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_once("**Revision:** 1.27", "**Revision:** 1.28")

          anchor = (
              "- Verify generated pure-digital HDL through a pinned open-source matrix "
              "using Verilator, Icarus Verilog, Yosys, SBY, and optional cocotb interoperability."
          )
          replace_once(
              anchor,
              anchor
              + "\n- Keep Nodal HVL in the Nodal-owned native runtime. Use Verilator as the primary fast adapter through a cached generated C++ DUT model behind a stable C ABI and JVM native binding; use Icarus as an independent event-driven adapter through an external VVP process, VPI, and versioned shared-memory/IPC transport."
              + "\n- Keep native Icarus execution distinct from the standalone generated Verilog-testbench projection: native mode retains the live Nodal runtime, while standalone mode runs generated `tb.v` and replay collateral entirely inside the selected simulator.",
          )

          old_intro = (
              "Detailed rationale and dependent-track plans are in "
              "[`dependent-productivity-and-verification-tracks-v0.1-plan.md`](dependent-productivity-and-verification-tracks-v0.1-plan.md). "
              "Verification backend ownership is defined by "
              "[ADR 0023](../architecture/0023-unified-hvl-native-sim-uvm-uvmms-architecture.md), "
              "and direct procedural HDL testbench projections are defined by "
              "[ADR 0025](../architecture/0025-generated-procedural-hdl-testbench-projections.md). "
              "Foundation reserves only the architecture/public seams needed for future native verification, procedural Verilog/Verilog-AMS testbench, UVM, and UVM-MS work; dependent-track implementations remain outside Foundation."
          )
          new_intro = (
              "Detailed rationale and dependent-track plans are in "
              "[`dependent-productivity-and-verification-tracks-v0.1-plan.md`](dependent-productivity-and-verification-tracks-v0.1-plan.md), "
              "with native adapter staging in "
              "[`native-digital-simulator-adapters-v0.1-plan.md`](native-digital-simulator-adapters-v0.1-plan.md). "
              "Verification ownership is defined by "
              "[ADR 0023](../architecture/0023-unified-hvl-native-sim-uvm-uvmms-architecture.md), "
              "direct procedural HDL testbench projections by "
              "[ADR 0025](../architecture/0025-generated-procedural-hdl-testbench-projections.md), "
              "and native Verilator/Icarus integration by "
              "[ADR 0026](../architecture/0026-native-digital-simulator-adapter-architecture.md). "
              "Foundation reserves only the architecture/public seams; dependent-track implementations remain outside Foundation."
          )
          replace_once(old_intro, new_intro)

          old_148 = """- [ ] **Foundation Increment 148 — Native verification runtime and generated-SystemVerilog IR readiness**
  - Freeze the native Nodal verification scheduler/runtime contract independently of UVM and the simulator-adapter boundary needed for direct Verilator/Icarus and future open mixed-signal execution.
  - Define a verification-SystemVerilog IR sufficient for generated UVM/VIP classes, interfaces/virtual interfaces, clocking blocks, dynamic containers, processes/events/mailboxes/semaphores, constraints/randomization, covergroups, properties, and DPI/VPI shims.
  - Do not implement complete HVL runtime or UVM generation in Foundation."""
          new_148 = """- [ ] **Foundation Increment 148 — Native verification runtime and generated-SystemVerilog IR readiness**
  - Accept ADR 0026 and freeze native runtime ownership: Nodal owns HVL scheduling, randomization, transactions, coverage, checks, replay, logical endpoint identity, and normalized results; simulator adapters own DUT execution, signal access, callbacks, waves, diagnostics, and cleanup.
  - Freeze Verilator as generated Verilog -> C++ DUT model -> stable generated C ABI -> cached native shared library -> JVM FFI/JNI, with Nodal HVL remaining in the Nodal runtime and generated C++ classes kept private.
  - Freeze Icarus as generated Verilog -> `iverilog` -> VVP image -> external `vvp` process -> versioned VPI module -> shared-memory/IPC transport; Icarus does not require DUT-to-C++ translation.
  - Freeze batched write/evaluate/settle/event barriers, width-safe/four-state value transport, time and callback ordering, timeout/cancellation/crash handling, separate cache identities, manifests, and cross-backend parity identities.
  - Define a verification-SystemVerilog IR sufficient for generated UVM/VIP classes, interfaces/virtual interfaces, clocking blocks, dynamic containers, processes/events/mailboxes/semaphores, constraints/randomization, covergroups, properties, and DPI/VPI shims.
  - Keep Foundation architecture-only: do not implement the HVL runtime, Verilator wrapper/JVM binding, Icarus VPI/IPC adapter, standalone testbench generator, or UVM generator here."""
          replace_once(old_148, new_148)

          replace_once(
              "Nodal HVL is canonical. Native/open-source execution, generated procedural Verilog testbenches, and generated UVM are sibling projections of one Verification Semantic IR; no generated backend is the simulation foundation.",
              "Nodal HVL is canonical. Native Verilator, native Icarus, generated standalone procedural Verilog testbenches, and generated UVM are capability-checked sibling modes of one Verification Semantic IR. Verilator uses a cached compiled-model/C-ABI/JVM boundary; Icarus uses an external VVP/VPI/shared-memory-or-IPC boundary. No simulator or generated backend defines HVL semantics.",
          )

          replace_once(
              "- [ ] **Digital Verification Increment 1 — Nodal HVL native digital simulation vertical slice**",
              "- [ ] **Digital Verification Increment 1 — Nodal HVL native digital simulation vertical slice**\n  - Implement the primary cached Verilator C++-model/C-ABI/JVM adapter and the independent external-VVP/VPI/IPC Icarus adapter from one Nodal Verification runtime, including explicit synchronization barriers and differential smoke tests.",
          )
          replace_once(
              "- [ ] **Digital Verification Increment 7 — Open-source Verilog testbench execution and qualification**",
              "- [ ] **Digital Verification Increment 7 — Standalone open-source Verilog testbench execution and qualification**\n  - Run generated DUT plus generated `tb.v` without a live Nodal runtime; keep its profile, cache, manifest, and failure identity separate from native Verilator and native Icarus.",
          )
          replace_once(
              "- [ ] **Digital Verification Increment 10 — Native, Verilog-testbench, and UVM semantic parity**",
              "- [ ] **Digital Verification Increment 10 — Native Verilator, native Icarus, Verilog-testbench, and UVM semantic parity**\n  - Compare the four modes explicitly and classify scheduler, timing, random-solver, two-state/four-state, inout, timeout, termination, replay, and unsupported-capability differences.",
          )
          replace_once(
              "- [ ] **Digital Verification Increment 12 — Scale, performance, compatibility, and verification release gate**",
              "- [ ] **Digital Verification Increment 12 — Scale, performance, compatibility, and verification release gate**\n  - Benchmark Verilator cold/warm compiled-model caching and native-call throughput separately from Icarus VVP startup, VPI/IPC event throughput, four-state transport, process concurrency, and cleanup.",
          )

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/increment-148-roadmap-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/nodal-development-todo.md .github/workflows/increment-148-roadmap-sync.yml
          git commit -m "docs: synchronize native simulator roadmap overview"
          git push origin "HEAD:${GITHUB_REF_NAME}"
