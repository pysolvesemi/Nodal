name: Increment 34 Exact Post-Merge Validation

on:
  push:
    branches:
      - automation/inc34-postmerge-validation-v1
    paths:
      - '.github/workflows/_inc34_postmerge_validation_v1.yml'

permissions:
  contents: read

concurrency:
  group: increment-34-exact-postmerge-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact merged implementation
        uses: actions/checkout@v6
        with:
          ref: a9d3ec50799953c41e7b9cf1d8bd6a2c5c9afd49
          fetch-depth: 0

      - name: Verify immutable dev identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = a9d3ec50799953c41e7b9cf1d8bd6a2c5c9afd49
          remote_dev=$(git ls-remote origin refs/heads/dev | awk '{print $1}')
          test "${remote_dev}" = a9d3ec50799953c41e7b9cf1d8bd6a2c5c9afd49

      - name: Validate Increment 32, 33, and 34 contracts
        run: |
          python3 -m py_compile \
            scripts/check_increment32.py \
            scripts/check_increment33.py \
            scripts/check_increment34.py \
            tests/compiler/test_increment32.py \
            tests/compiler/test_increment33.py \
            tests/compiler/test_increment34.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py
          python3 scripts/check_increment34.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment34.py'

      - name: Compile Scala API and testkit
        run: ./nodal core scala

      - name: Execute Increment 34 semantic witnesses
        shell: bash
        run: |
          runtime_report="${RUNNER_TEMP}/increment34-runtime.txt"
          construction_report="${RUNNER_TEMP}/increment34-construction.txt"
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment34fixture.Increment34RuntimeCheck \
            "${runtime_report}"
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment34fixture.Increment34ConstructionCheck \
            "${construction_report}"
          test -s "${runtime_report}"
          test -s "${construction_report}"
          grep -F 'conditional_definite=true' "${runtime_report}"
          grep -F 'case_definite=true' "${runtime_report}"
          grep -F 'loop_definite=true' "${runtime_report}"
          grep -F 'unreachable_unknown=NODAL-ANALOG-034-014' "${runtime_report}"
          grep -F 'escaped_local=NODAL-ANALOG-034-014' "${runtime_report}"
          grep -F 'forward_reference=NODAL-ANALOG-034-014' "${runtime_report}"
          grep -F 'public_conditional_snapshots=1' "${construction_report}"
          grep -F 'public_case_snapshots=1' "${construction_report}"
          grep -F 'flat_assignments=0' "${construction_report}"
          grep -F 'precontrol_scope_aligned=true' "${construction_report}"
          grep -F 'empty_owner=NODAL-ANALOG-034-001' "${construction_report}"
          grep -F 'padded_owner=NODAL-ANALOG-034-001' "${construction_report}"

      - name: Bootstrap native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Build and validate native compiler boundary
        shell: bash
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          nodalc=$(find out -type f -name nodalc -perm -u+x | head -n 1)
          test -n "${nodalc}"
          "${nodalc}" \
            --mlir-print-op-generic \
            --mlir-print-debuginfo \
            core/compiler/test/IR/analog-control-flow.mlir \
            > "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_if"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_case"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_loop"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F 'AnalogControlFlow.scala' "${RUNNER_TEMP}/increment34-structured.mlir"

          for fixture in \
            analog-control-flow-invalid-unreachable-reference.mlir \
            analog-control-flow-invalid-forward-reference.mlir; do
            set +e
            "${nodalc}" "core/compiler/test/IR/${fixture}" \
              > "${RUNNER_TEMP}/${fixture}.out" 2>&1
            rc=$?
            set -e
            test "${rc}" -ne 0
            grep -F 'NODAL-ANALOG-034-014' "${RUNNER_TEMP}/${fixture}.out"
          done

          set +e
          "${nodalc}" core/compiler/test/IR/analog-control-flow-invalid-owner.mlir \
            > "${RUNNER_TEMP}/analog-control-flow-invalid-owner.out" 2>&1
          rc=$?
          set -e
          test "${rc}" -ne 0
          grep -F 'NODAL-ANALOG-033-009' \
            "${RUNNER_TEMP}/analog-control-flow-invalid-owner.out"

      - name: Check repository style and clean tree
        run: |
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Record exact validation identity
        run: |
          printf '%s\n' \
            'increment=34' \
            'state=pass' \
            'implementation_pr=109' \
            'implementation_head=207fd1b580e9428e9948cd4e4bd8f2060fde4b79' \
            'implementation_merge=a9d3ec50799953c41e7b9cf1d8bd6a2c5c9afd49' \
            "workflow_run=${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/increment34-postmerge-validation.txt"
          cat "${RUNNER_TEMP}/increment34-postmerge-validation.txt"
