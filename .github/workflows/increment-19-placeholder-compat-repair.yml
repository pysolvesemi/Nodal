name: Increment 19 Placeholder Compatibility Repair

on:
  push:
    branches:
      - increment/19-core-mlir-model
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-19-placeholder-compat-repair
  cancel-in-progress: false

jobs:
  repair:
    name: increment-19/placeholder-compat-repair
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Increment 19 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/19-core-mlir-model

      - name: Restore the frozen Increment 18 verifier contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/compiler/lib/Dialect/Nodal/NodalOps.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''LogicalResult nodal::PlaceholderOp::verify() {
            return requireText(getOperation(), "label", "label");
          }
          '''
          new = '''LogicalResult nodal::PlaceholderOp::verify() {
            auto label = (*this)->getAttrOfType<StringAttr>("label");
            if (!label || label.getValue().empty())
              return emitOpError("requires a non-empty 'label' attribute");
            return success();
          }
          '''
          if text.count(old) != 1:
            raise RuntimeError(f"expected one placeholder verifier anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove this one-time workflow and publish
        run: |
          rm .github/workflows/increment-19-placeholder-compat-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 19 — preserve Increment 18 placeholder contract'
          git push origin HEAD:increment/19-core-mlir-model
