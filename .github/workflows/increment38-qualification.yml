name: Increment 38 Source Qualification
on:
  push:
    branches: [automation/increment38-qualification]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct candidate with reviewed boundary fixes
        id: reconstruct
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/increment38-evidence"
          cp .automation/increment38/followup.patch "${RUNNER_TEMP}/increment38-followup.patch"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          chunks = Path('.automation/increment38')
          data = base64.b64decode(''.join((chunks / f'{i}.b64').read_text() for i in range(4)), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'ec64cd926615062e23cbca0175bb6a860445bec54daca6fc803e4257a3f13044'
          Path(os.environ['RUNNER_TEMP'], 'increment38.patch').write_bytes(lzma.decompress(data))
          PY
          git checkout -b increment/38-mathematical-simulator-functions 619cc98fa0b923e381cf13001b5b309ceab859b9
          test "$(git rev-parse HEAD:core)" = 8b371a3a98894e7b373d985dce8e9158e25729e5
          git apply --index "${RUNNER_TEMP}/increment38.patch"
          git apply --index "${RUNNER_TEMP}/increment38-followup.patch"
          git diff --cached --check
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Format candidate with pinned tools
        id: format
        shell: bash
        run: |
          set -o pipefail
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain" 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/style-bootstrap.log"
          ./nodal style fix --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/style-fix.log"
      - name: Archive and publish source candidate
        if: always() && steps.reconstruct.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'Nodal implementation'
          git config user.email 'nodal-implementation@users.noreply.github.com'
          git add core examples scripts/generate_analog_function_registry.py tests/compiler docs/design-gates/NodalAnalogFunctions-DG-v0.1.md docs/implementation/increment38-mathematical-simulator-functions.md
          git reset HEAD -- .github/workflows/increment-38-mathematical-functions.yml
          git diff --cached --check
          git commit -m 'Increment 38: implement mathematical and simulator functions'
          git rev-parse HEAD HEAD^{tree} > "${RUNNER_TEMP}/increment38-evidence/candidate-identity.txt"
          git archive HEAD | gzip > "${RUNNER_TEMP}/increment38-evidence/candidate.tar.gz"
          cp .github/workflows/increment-38-mathematical-functions.yml "${RUNNER_TEMP}/increment38-evidence/implementation-workflow.yml"
          git push origin HEAD:refs/heads/increment/38-mathematical-simulator-functions
      - name: Registry and Python tests
        if: always() && steps.reconstruct.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/generate_analog_function_registry.py --check
          python3 -m unittest discover -s tests/compiler 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/python.log"
      - name: Scala core and public witnesses
        if: always() && steps.reconstruct.outcome == 'success'
        id: scala
        shell: bash
        run: |
          set -o pipefail
          ./nodal core scala 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/scala.log"
          ./mill -i examples.continuousTimeApi.runMain nodal.increment38fixture.Increment38ConstructionCheck 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/public-scala.log"
          ./mill -i core.scala.testkit.test.runMain nodal.internal.testkit.Increment38MlirCheck "${RUNNER_TEMP}/increment38-evidence/public.mlir"
      - name: Native core qualification
        if: always() && steps.reconstruct.outcome == 'success'
        id: native
        shell: bash
        run: |
          set -o pipefail
          ./nodal bootstrap --mode prebuilt --prefix "${RUNNER_TEMP}/nodal-native-toolchain" 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/native-bootstrap.log"
          ./nodal core native --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/native.log"
      - name: Public source through native boundary
        if: steps.scala.outcome == 'success' && steps.native.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          nodalc=$(find out -type f -name nodalc -perm -u+x | head -n 1)
          translate=$(find out -type f -name nodal-translate -perm -u+x | head -n 1)
          python3 tests/compiler/fixtures/increment38/run_native_matrix.py --nodalc "$nodalc" --translate "$translate" --source "${RUNNER_TEMP}/increment38-evidence/public.mlir" 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/source-matrix.log"
          "$translate" --nodal-to-verilog-a "${RUNNER_TEMP}/increment38-evidence/public.mlir" > "${RUNNER_TEMP}/increment38-evidence/public.va"
          "$translate" --nodal-to-verilog-a "${RUNNER_TEMP}/increment38-evidence/public.mlir.events.mlir" > "${RUNNER_TEMP}/increment38-evidence/events.va"
      - name: Full contract gate
        if: always() && steps.reconstruct.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          ./nodal check --contracts-only --online-toolchain --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" --base-ref origin/dev 2>&1 | tee "${RUNNER_TEMP}/increment38-evidence/contracts.log"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment38-qualification
          path: ${{ runner.temp }}/increment38-evidence
          retention-days: 14
