name: Increment 33 stage applied compiler tree

on:
  push:
    branches:
      - automation/inc33-staging-materializer-controller-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc33-staging-materializer-controller-20260831
          fetch-depth: 0

      - name: Reassemble verified patch
        shell: bash
        run: |
          git fetch origin automation/inc33-compiler-ir-payload-20260831
          rm -f /tmp/inc33-apply.b64 /tmp/inc33-apply.gz /tmp/inc33-apply.py /tmp/inc33-repair-01.py
          for part in 00 01 02 03 04 05; do
            git show "origin/automation/inc33-compiler-ir-payload-20260831:.inc33-payload/part-${part}.b64" >> /tmp/inc33-apply.b64
          done
          test "$(wc -c < /tmp/inc33-apply.b64)" -eq 21820
          base64 --decode /tmp/inc33-apply.b64 > /tmp/inc33-apply.gz
          echo "0c0f250d75452733450dc027b414bb1aad500e28a62a1e2f4c522098eb9611fb  /tmp/inc33-apply.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/inc33-apply.gz > /tmp/inc33-apply.py
          echo "83ea42e67642dc287bc676445b0d2f9c59e48467b585baf7508eae594a0bce11  /tmp/inc33-apply.py" | sha256sum --check
          git show "origin/automation/inc33-compiler-ir-payload-20260831:.inc33-payload/repair-01.py" > /tmp/inc33-repair-01.py
          python3 /tmp/inc33-repair-01.py
          echo "7ee94fcaf4f1fc267ffa32ed8bc4a14bae41569e30d63ddba75ad1b160680a68  /tmp/inc33-apply.py" | sha256sum --check
          python3 -m py_compile /tmp/inc33-apply.py

      - name: Apply to staging branch
        shell: bash
        run: |
          git checkout -B automation/inc33-compiler-ir-staging-20260831 origin/increment/33-analog-variables-procedural-assignment-v5
          python3 /tmp/inc33-apply.py
          rm -f /tmp/inc33-apply.b64 /tmp/inc33-apply.gz /tmp/inc33-apply.py /tmp/inc33-repair-01.py

      - name: Format staged sources
        shell: bash
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Dialect/Nodal/NodalOps.cpp \
            core/compiler/lib/Dialect/Nodal/NodalTypes.cpp
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/implementation/increment33-analog-variables-procedural-assignment.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Publish staging tree
        shell: bash
        run: |
          git config user.name "nodal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "stage: apply Increment 33 compiler IR tranche"
          git push --force origin HEAD:automation/inc33-compiler-ir-staging-20260831

      - name: Check structural contract
        run: python3 scripts/check_increment33.py
