name: Activate Increment 21 V5 Materializer

on:
  push:
    branches:
      - automation/inc21-inc22-probe-stage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/inc21-inc22-probe-stage
          fetch-depth: 0
      - name: Select structural v5 materializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for relative in (
              '.github/workflows/chain-and-close-increment-21.yml',
              '.github/workflows/recover-increment-21-if-needed.yml',
          ):
              path=Path(relative)
              if not path.is_file(): continue
              text=path.read_text(encoding='utf-8')
              for previous in (
                  'materialize_increment21.py',
                  'materialize_increment21_v2.py',
                  'materialize_increment21_v3.py',
                  'materialize_increment21_v4.py',
              ):
                  text=text.replace(previous,'materialize_increment21_v5.py')
              path.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Publish v5 activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/chain-and-close-increment-21.yml \
            .github/workflows/recover-increment-21-if-needed.yml
          git commit -m 'Automation — select structural Increment 21 v5 materializer'
          git push origin HEAD:automation/inc21-inc22-probe-stage
