name: Increment 35 Audited Repair

on:
  push:
    branches:
      - increment/35-differential-integral-operators-v1

permissions:
  contents: write

jobs:
  repair-and-retire-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited semantic and validation repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()

          def read(relative: str) -> str:
              path = root / relative
              if not path.is_file():
                  raise RuntimeError(f"missing required file: {relative}")
              return path.read_text(encoding="utf-8")

          def write(relative: str, content: str) -> None:
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          def replace_once(relative: str, old: str, new: str) -> None:
              text = read(relative)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{relative}: expected one replacement anchor, found {count}\n--- anchor ---\n{old}"
                  )
              write(relative, text.replace(old, new))

          analog_numeric = "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp"
          replace_once(
              analog_numeric,
              '''  if (!operatorId || operatorId.getValue().trim().empty() || !owner ||
              owner.getValue().trim().empty())
            return emitMappedFailure(operation, "NODAL-ANALOG-035-002",
                                     "continuous-time operator identity and owner must be non-empty");
          if (!context ||
          ''',
              '''  if (!operatorId || operatorId.getValue().trim().empty() || !owner ||
              owner.getValue().trim().empty())
            return emitMappedFailure(operation, "NODAL-ANALOG-035-002",
                                     "continuous-time operator identity and owner must be non-empty");
          const llvm::StringRef operatorIdentity = operatorId.getValue();
          const llvm::StringRef ownerIdentity = owner.getValue();
          if (!operatorIdentity.starts_with(ownerIdentity) ||
              !operatorIdentity.drop_front(ownerIdentity.size()).starts_with("."))
            return emitMappedFailure(operation, "NODAL-ANALOG-035-002",
                                     "continuous-time operator identity must be owned by its declared owner");
          if (!context ||
          ''',
          )

          replace_once(
              analog_numeric,
              '''LogicalResult verifyDdt(Operation *operation) {
            if (operation->getNumOperands() != 1 || operation->getNumResults() != 1)
              return emitMappedFailure(operation, "NODAL-ANALOG-035-002",
                                       "ddt requires one input and one result");
            auto input = getAnalogNumericTypeInfo(operation->getOperand(0).getType());
            auto result = getAnalogNumericTypeInfo(operation->getResult(0).getType());
            if (failed(input) || failed(result) ||
                input->kind != AnalogNumericKind::Real ||
                result->kind != AnalogNumericKind::Real)
              return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                       "ddt requires real quantity input and result");

            std::string inputDimension = input->dimension;
            std::string resultDimension;
            if (input->legacyF64 && result->legacyF64) {
              if (!operation->getAttr("operator_contract"))
                return success();
              inputDimension = textAttr(operation, "input_dimension").str();
              resultDimension = textAttr(operation, "result_dimension").str();
              auto dimension =
                  combineAnalogDimensions(inputDimension, "time", true);
              if (failed(dimension) || resultDimension != *dimension)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "ddt result must subtract one time exponent");
            } else {
              if (input->legacyF64 || result->legacyF64)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "ddt cannot mix legacy f64 and typed quantity values");
              auto dimension = combineAnalogDimensions(input->dimension, "time", true);
              if (failed(dimension) || result->dimension != *dimension)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "ddt result must subtract one time exponent");
              resultDimension = *dimension;
            }
            if (failed(verifyContinuousContract(operation, false, inputDimension,
                                                resultDimension)))
              return failure();
            return verifyDdtSimplification(operation, resultDimension);
          }
          ''',
              '''LogicalResult verifyDdt(Operation *operation) {
            const bool contracted =
                static_cast<bool>(operation->getAttrOfType<StringAttr>("operator_contract"));
            if (operation->getNumOperands() != 1 || operation->getNumResults() != 1)
              return emitMappedFailure(
                  operation,
                  contracted ? llvm::StringRef("NODAL-ANALOG-035-002")
                             : llvm::StringRef("NODAL-ANALOG-DDT-001"),
                  "ddt requires one input and one result");

            if (!contracted) {
              if (operation->getOperand(0).getType().isF64() &&
                  operation->getResult(0).getType().isF64())
                return success();
              auto input = getAnalogNumericTypeInfo(operation->getOperand(0).getType());
              if (failed(input) || input->kind != AnalogNumericKind::Real)
                return emitMappedFailure(operation, "NODAL-ANALOG-DDT-001",
                                         "typed ddt requires a real quantity input");
              auto dimension = combineAnalogDimensions(input->dimension, "time", true);
              if (failed(dimension) ||
                  !semanticTypeMatches(operation->getResult(0).getType(),
                                       AnalogNumericKind::Real, *dimension))
                return emitMappedFailure(operation, "NODAL-ANALOG-DDT-001",
                                         "ddt result must subtract one time exponent");
              return success();
            }

            auto input = getAnalogNumericTypeInfo(operation->getOperand(0).getType());
            auto result = getAnalogNumericTypeInfo(operation->getResult(0).getType());
            if (failed(input) || failed(result) ||
                input->kind != AnalogNumericKind::Real ||
                result->kind != AnalogNumericKind::Real)
              return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                       "ddt requires real quantity input and result");

            std::string inputDimension = input->dimension;
            std::string resultDimension;
            if (input->legacyF64 && result->legacyF64) {
              inputDimension = textAttr(operation, "input_dimension").str();
              resultDimension = textAttr(operation, "result_dimension").str();
              auto dimension =
                  combineAnalogDimensions(inputDimension, "time", true);
              if (failed(dimension) || resultDimension != *dimension)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "ddt result must subtract one time exponent");
            } else {
              if (input->legacyF64 || result->legacyF64)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "contracted ddt cannot mix legacy f64 and typed quantities");
              auto dimension = combineAnalogDimensions(input->dimension, "time", true);
              if (failed(dimension) || result->dimension != *dimension)
                return emitMappedFailure(operation, "NODAL-ANALOG-035-003",
                                         "ddt result must subtract one time exponent");
              resultDimension = *dimension;
            }
            if (failed(verifyContinuousContract(operation, false, inputDimension,
                                                resultDimension)))
              return failure();
            return verifyDdtSimplification(operation, resultDimension);
          }
          ''',
          )

          replace_once(
              analog_numeric,
              '''LogicalResult verifyAnalogNumericModel(mlir::ModuleOp module) {
            LogicalResult result = success();
            module.walk([&](Operation *operation) {
              if (failed(result))
                return;
              for (Type type : operation->getOperandTypes()) {
          ''',
              '''LogicalResult verifyAnalogNumericModel(mlir::ModuleOp module) {
            LogicalResult result = success();
            llvm::StringSet<> continuousOperatorIds;
            llvm::StringSet<> continuousStateIds;
            module.walk([&](Operation *operation) {
              if (failed(result))
                return;
              const llvm::StringRef operationName = operation->getName().getStringRef();
              if ((operationName == "nodal.analog_ddt" ||
                   operationName == "nodal.analog_idt") &&
                  operation->getAttr("operator_contract")) {
                if (auto operatorId = operation->getAttrOfType<StringAttr>("operator_id")) {
                  if (!operatorId.getValue().trim().empty() &&
                      !continuousOperatorIds.insert(operatorId.getValue()).second) {
                    result = emitMappedFailure(
                        operation, "NODAL-ANALOG-035-002",
                        "continuous-time operator identity must be unique");
                    return;
                  }
                }
                if (auto stateId = operation->getAttrOfType<StringAttr>("state_id")) {
                  if (!stateId.getValue().trim().empty() &&
                      !continuousStateIds.insert(stateId.getValue()).second) {
                    result = emitMappedFailure(
                        operation, "NODAL-ANALOG-035-005",
                        "integral state identity must be unique");
                    return;
                  }
                }
              }
              for (Type type : operation->getOperandTypes()) {
          ''',
          )

          replace_once(
              "core/compiler/lib/Backend/AnalogVerticalSlice.cpp",
              '''    "nodal.analog_ddt",
              "nodal.contribute",
          ''',
              '''    "nodal.analog_ddt",
              "nodal.analog_idt",
              "nodal.contribute",
          ''',
          )

          checker = "scripts/check_increment35.py"
          replace_once(
              checker,
              '''    manifest = load_json(root, "tests/compiler/fixtures/increment35/manifest.json")

              require(
          ''',
              '''    manifest = load_json(root, "tests/compiler/fixtures/increment35/manifest.json")
              catalog = load_json(root, "core/compiler/diagnostics-v0.1.json")

              temporary_files = (
                  ".github/workflows/increment-35-bootstrap.yml",
                  "scripts/bootstrap_increment35.part00",
                  "scripts/bootstrap_increment35.part01",
                  "scripts/bootstrap_increment35.part02",
                  "scripts/bootstrap_increment35.part03",
                  "scripts/bootstrap_increment35.part04",
                  "scripts/bootstrap_increment35.part05",
                  "scripts/bootstrap_increment35.part06",
                  "tests/compiler/fixtures/increment35/bootstrap-revision.txt",
              )
              for relative in temporary_files:
                  require(
                      not (root / relative).exists(),
                      f"NODAL-INC35-005: temporary bootstrap artifact remains: {relative}",
                  )

              require(
          ''',
          )
          replace_once(
              checker,
              '''        "idt_folding_prohibited",
              ):
          ''',
              '''        "idt_folding_prohibited",
                  "legacy_ddt_diagnostic_compatibility",
                  "native_operator_identity_uniqueness",
              ):
          ''',
          )
          replace_once(
              checker,
              '''        "verilog_a_vertical_slice",
              ):
          ''',
              '''        "verilog_a_vertical_slice",
                  "bootstrap_scaffolding_removed",
              ):
          ''',
          )
          replace_once(
              checker,
              '''            "NODAL-ANALOG-035-008",
                  ),
          ''',
              '''            "NODAL-ANALOG-035-008",
                      "NODAL-ANALOG-DDT-001",
                      "continuousOperatorIds",
                      "continuousStateIds",
                  ),
          ''',
          )
          replace_once(
              checker,
              '''            "current*time",
          ''',
              '''            "inputDimension.multiply(AnalogDimension.Time)",
          ''',
          )
          replace_once(
              checker,
              '''        ('name == "nodal.analog_idt"', 'llvm::Twine("idt(")', "nodal.simplified"),
          ''',
              '''        ('name == "nodal.analog_idt"', '"nodal.analog_idt",', 'llvm::Twine("idt(")', "nodal.simplified"),
          ''',
          )
          replace_once(
              checker,
              '''        "core/compiler/test/IR/analog-differential-integral-invalid-context.mlir",
          ''',
              '''        "core/compiler/test/IR/analog-differential-integral-invalid-context.mlir",
                  "core/compiler/test/IR/analog-differential-integral-invalid-contract.mlir",
                  "core/compiler/test/IR/analog-differential-integral-invalid-dimension.mlir",
                  "core/compiler/test/IR/analog-differential-integral-invalid-analysis.mlir",
                  "core/compiler/test/IR/analog-differential-integral-invalid-duplicate-identity.mlir",
          ''',
          )
          replace_once(
              checker,
              '''            "NODAL-ANALOG-035-008",
                  ),
                  "dedicated Increment 35 workflow",
          ''',
              '''            "NODAL-ANALOG-035-008",
                      "check_invalid contract NODAL-ANALOG-035-002",
                      "check_invalid dimension NODAL-ANALOG-035-003",
                      "check_invalid analysis NODAL-ANALOG-035-006",
                      "check_invalid_with_pipeline duplicate-identity NODAL-ANALOG-035-002",
                  ),
                  "dedicated Increment 35 workflow",
          ''',
          )
          replace_once(
              checker,
              '''    require(
                  manifest.get("schema") == 1
          ''',
              '''    expected_diagnostics = [f"NODAL-ANALOG-035-{index:03d}" for index in range(1, 9)]
              require(
                  manifest.get("diagnostics") == expected_diagnostics,
                  "NODAL-INC35-007: Increment 35 diagnostic inventory is incomplete",
              )
              families = catalog.get("families")
              require(
                  isinstance(families, dict)
                  and families.get("analog-differential-integral") == expected_diagnostics
                  and "NODAL-ANALOG-035-" in catalog.get("preserved_prefixes", []),
                  "NODAL-INC35-007: native diagnostic catalog lacks Increment 35",
              )

              require(
                  manifest.get("schema") == 1
          ''',
          )

          manifest_path = root / "tests/compiler/fixtures/increment35/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["semantics"]["legacy_ddt_diagnostic_compatibility"] = True
          manifest["semantics"]["native_operator_identity_uniqueness"] = True
          manifest["integration"]["bootstrap_scaffolding_removed"] = True
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          catalog_path = root / "core/compiler/diagnostics-v0.1.json"
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          diagnostics = [f"NODAL-ANALOG-035-{index:03d}" for index in range(1, 9)]
          catalog["families"]["analog-differential-integral"] = diagnostics
          if "NODAL-ANALOG-035-" not in catalog["preserved_prefixes"]:
              catalog["preserved_prefixes"].append("NODAL-ANALOG-035-")
          catalog_path.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")

          write(
              "core/scala/testkit/test/src/nodal/DifferentialIntegralConstructionTests.scala",
              '''package nodal.internal.testkit

          import nodal.*

          import utest.*

          final class DifferentialIntegralLegacyTop extends Module:
            analog:
              val derivative = ddt(2.0.V)
              val fixedIntegral = idt(1.0.A, 0.0.real)
              val solverIntegral = idt(2.0.A)

          final class DifferentialIntegralEquationTop extends Module:
            equations:
              val derivative = ddt(1.0.V)
              val integral = idt(1.0.A)

          final class DifferentialIntegralContributionTop extends Module:
            contributions:
              val derivative = ddt(1.0.V)
              val integral = idt(1.0.A)

          final class DifferentialIntegralTypedInitialTop extends Module:
            analog:
              val initialCharge = 2.0.A * 3.0.s
              val integral = idt(1.0.A, initialCharge)

          final class DifferentialIntegralMultipleStateTop extends Module:
            analog:
              val first = idt(1.0.A)
              val second = idt(2.0.A, 0.0.real)

          final class DifferentialOutsideRegion extends Module:
            val invalid = ddt(1.0.V)

          final class IntegralInitialEquationRegion extends Module:
            initialEquations:
              val invalid = idt(1.0.A)

          final class DifferentialProceduralRegion extends Module:
            analogProcedure:
              val invalid = ddt(1.0.V)

          final class IntegralInitialConditionMismatch extends Module:
            analog:
              val invalid = idt(1.0.A, 1.0.V)

          object DifferentialIntegralConstructionTests extends TestSuite:
            private val expectedAnalyses = Vector(
              "ac",
              "dc",
              "initialization",
              "noise",
              "operating-point",
              "transient"
            )

            private def failureCode(top: => Module): String =
              scala.util
                .Try(ConstructionKernel.inspect(top))
                .failed
                .get
                .asInstanceOf[ConstructionException]
                .diagnostic
                .code

            val tests: Tests = Tests:
              test("ddt and idt record dimensions, state, initialization, analyses, ownership, and source"):
                val snapshot = ConstructionKernel.inspect(new DifferentialIntegralLegacyTop)
                val operators = snapshot.continuousOperators

                assert(operators.size == 3)
                val derivative = operators.find(_.operation == "analog_ddt").get
                val integrals = operators.filter(_.operation == "analog_idt")
                val fixed = integrals.find(_.initialization == "fixed").get
                val solver = integrals.find(_.initialization == "solver-selected").get

                assert(derivative.context == "legacy-analog")
                assert(derivative.inputDimension == "voltage")
                assert(derivative.resultDimension == "time^-1*voltage")
                assert(derivative.stateId.isEmpty)
                assert(derivative.initialization == "none")
                assert(fixed.inputDimension == "current")
                assert(fixed.resultDimension == "current*time")
                assert(fixed.initialCondition.nonEmpty)
                assert(fixed.stateId.contains(s"${fixed.path}.state"))
                assert(solver.stateId.contains(s"${solver.path}.state"))
                assert(solver.initialCondition.isEmpty)
                assert(operators.forall(_.analyses == expectedAnalyses))
                assert(operators.forall(operator => operator.path.startsWith(s"${operator.owner}.")))
                assert(operators.forall(_.source.nonEmpty))

              test("equation and contribution regions retain distinct declarative contexts"):
                val equations =
                  ConstructionKernel.inspect(new DifferentialIntegralEquationTop).continuousOperators
                val contributions =
                  ConstructionKernel.inspect(new DifferentialIntegralContributionTop).continuousOperators

                assert(equations.size == 2)
                assert(equations.forall(_.context == "equation"))
                assert(contributions.size == 2)
                assert(contributions.forall(_.context == "contribution"))
                assert(equations.map(_.operation).toSet == Set("analog_ddt", "analog_idt"))
                assert(contributions.map(_.operation).toSet == Set("analog_ddt", "analog_idt"))

              test("typed non-zero integral initial condition matches the integrated dimension"):
                val operator = ConstructionKernel
                  .inspect(new DifferentialIntegralTypedInitialTop)
                  .continuousOperators
                  .find(_.operation == "analog_idt")
                  .get
                assert(operator.initialization == "fixed")
                assert(operator.inputDimension == "current")
                assert(operator.resultDimension == "current*time")
                assert(operator.initialCondition.nonEmpty)

              test("integral state identities are unique and deterministic"):
                val first = ConstructionKernel
                  .inspect(new DifferentialIntegralMultipleStateTop)
                  .continuousOperators
                  .filter(_.operation == "analog_idt")
                val second = ConstructionKernel
                  .inspect(new DifferentialIntegralMultipleStateTop)
                  .continuousOperators
                  .filter(_.operation == "analog_idt")
                val firstStates = first.flatMap(_.stateId)
                val secondStates = second.flatMap(_.stateId)
                assert(firstStates.size == 2)
                assert(firstStates.distinct.size == firstStates.size)
                assert(firstStates == secondStates)

              test("continuous operators outside declarative analog regions are rejected"):
                assert(failureCode(new DifferentialOutsideRegion) == "NODAL-ANALOG-035-001")

              test("continuous operators are rejected in initial-equation regions"):
                assert(failureCode(new IntegralInitialEquationRegion) == "NODAL-ANALOG-035-001")

              test("continuous operators are rejected in procedural regions"):
                assert(failureCode(new DifferentialProceduralRegion) == "NODAL-ANALOG-035-001")

              test("idt initial condition dimension must match its integral result"):
                assert(failureCode(new IntegralInitialConditionMismatch) == "NODAL-ANALOG-035-004")
          ''',
          )

          write(
              "examples/continuousTimeApi/src/nodal/increment35fixture/Increment35ConstructionCheck.scala",
              '''package nodal.increment35fixture

          import java.nio.file.{Files, Path}

          import nodal.*
          import nodal.internal.bridge.ScalaToMlirBridge

          final class Increment35LegacyFixture extends Module:
            analog:
              val derivative = ddt(2.0.V)
              val fixedIntegral = idt(1.0.A, 0.0.real)
              val solverIntegral = idt(2.0.A)

          final class Increment35EquationFixture extends Module:
