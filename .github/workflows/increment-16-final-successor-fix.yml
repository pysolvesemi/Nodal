# Trigger after workflow registration; removed by the repair job.
name: Increment 16 Final Successor Fix

on:
  push:
    branches:
      - increment/16-elaboration-construction-kernel

permissions:
  contents: write

concurrency:
  group: increment-16-final-successor-fix
  cancel-in-progress: false

jobs:
  patch:
    name: increment-16/final-successor-fix
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out authoritative branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/16-elaboration-construction-kernel

      - name: Make Increment 15 roadmap validation successor-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_increment15.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if "**Revision:** 1.19" not in roadmap:
            problems.append(Problem("NODAL-INC15-059", "roadmap revision is not 1.19"))
'''
          new = '''        revision_lines = [
            line.removeprefix("**Revision:** ")
            for line in roadmap.splitlines()
            if line.startswith("**Revision:** ")
        ]
        revision = ()
        if len(revision_lines) == 1:
            try:
                revision = tuple(int(part) for part in revision_lines[0].split("."))
            except ValueError:
                revision = ()
        if not revision or revision < (1, 19):
            problems.append(Problem("NODAL-INC15-059", "roadmap revision predates 1.19"))
'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError("Increment 15 revision anchor is not unique")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/increment-16-final-successor-fix.yml

      - name: Validate predecessor and current contracts
        run: |
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py --compile
          python3 tests/api/test_increment15.py
          python3 tests/api/test_increment16.py
          git diff --check

      - name: Commit permanent fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_increment15.py .github/workflows/increment-16-final-successor-fix.yml
          git commit -m "Increment 16 — make Increment 15 revision check successor-safe"
          git pull --rebase origin increment/16-elaboration-construction-kernel
          git push origin HEAD:increment/16-elaboration-construction-kernel
