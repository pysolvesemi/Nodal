name: Apply generated verification projection roadmap update

on:
  push:
    branches:
      - increment/147-verification-projection-roadmap
    paths:
      - .github/workflows/roadmap-generated-verification-projections.yml

permissions:
  contents: write

jobs:
  apply-roadmap-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply architecture and roadmap changes
        env:
          ROADMAP_UPDATE_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          exec(compile(gzip.decompress(base64.b64decode(os.environ['ROADMAP_UPDATE_GZ_B64'])), 'roadmap_update.py', 'exec'))
          PY
      - name: Validate roadmap consistency
        run: |
          set -euo pipefail
          test -f docs/architecture/0025-generated-procedural-testbench-projections.md
          grep -q '^\*\*Revision:\*\* 1.27$' docs/roadmap/nodal-development-todo.md
          grep -q 'Digital Verification Increment 11' docs/roadmap/dependent-productivity-and-verification-tracks-v0.1-plan.md
          grep -q 'AMS Verification Increment 12' docs/roadmap/dependent-productivity-and-verification-tracks-v0.1-plan.md
          grep -q 'verilog-ams-testbench' docs/roadmap/dependent-track-gate-v0.1.json
          test ! -e .github/workflows/roadmap-generated-verification-projections.yml
      - name: Commit generated roadmap update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture docs/roadmap .github/workflows/roadmap-generated-verification-projections.yml
          git diff --cached --check
          git commit -m 'Increment 147 — reserve generated verification projections'
          git push origin HEAD
