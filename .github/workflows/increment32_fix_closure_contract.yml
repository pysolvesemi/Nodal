name: Increment 32 Fix Closure Contract

on:
  push:
    branches:
      - automation/increment32-fix-closure-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: increment/32-equation-contribution-semantics-review
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Remove circular post-closure evidence requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_increment32.py')
          text = path.read_text(encoding='utf-8')
          for line in (
              '            "closure_merge",\n',
              '            "final_post_merge_core_ci_run",\n',
          ):
              if line not in text:
                  raise SystemExit(f'missing expected checker line: {line!r}')
              text = text.replace(line, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/check_increment32.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check_increment32.py
          git commit -m "fix(increment32): remove circular closure evidence requirement"
          git push origin "HEAD:${TARGET_BRANCH}"
