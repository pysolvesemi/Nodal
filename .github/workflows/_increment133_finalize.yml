name: Increment 133 One-Shot Finalizer

on:
  push:
    branches:
      - increment/133-analog-semantic-api

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Finalize permanent Increment 133 payload
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          api_path = root / "core/scala/api/src/nodal/ContinuousTimeCandidateApi.scala"
          api = api_path.read_text(encoding="utf-8")

          equation_options = '''final case class EquationOptions(
              id: Option[EquationId] = None,
              guard: Option[Expr[Bool]] = None,
              analyses: AnalysisApplicability = AnalysisApplicability.All,
              continuity: ContinuityClass = ContinuityClass.Unspecified
          )
          '''
          initial_options = '''final case class InitialEquationOptions(
              id: Option[EquationId] = None,
              guard: Option[Expr[Bool]] = None,
              continuity: ContinuityClass = ContinuityClass.Unspecified
          )
          '''
          if "final case class InitialEquationOptions(" not in api:
              if equation_options not in api:
                  raise RuntimeError("EquationOptions insertion anchor mismatch")
              api = api.replace(equation_options, equation_options + "\n" + initial_options, 1)

          equation_definition = '''def equation(
              left: Expr[Real],
              right: Expr[Real],
              options: EquationOptions = EquationOptions()
          ): Unit = CandidateRuntime.statement("candidate-equation", left, right, options)
          '''
          equation_operator = '''extension (left: Expr[Real])
            infix def ===(right: Expr[Real]): Unit = equation(left, right)
          '''
          if "infix def ===(right: Expr[Real])" not in api:
              if equation_definition not in api:
                  raise RuntimeError("equation operator insertion anchor mismatch")
              api = api.replace(
                  equation_definition,
                  equation_definition + "\n" + equation_operator,
                  1,
              )

          old_initial_pattern = re.compile(
              r'''def initialEquation\(\n'''
              r'''    left: Expr\[Real\],\n'''
              r'''    right: Expr\[Real\],\n'''
              r'''    options: EquationOptions = EquationOptions\(\n'''
              r'''      analyses = AnalysisApplicability\.only\(AnalysisKind\.Initialization\)\n'''
              r'''    \)\n'''
              r'''\): Unit = CandidateRuntime\.statement\("candidate-initial-equation", left, right, options\)\n'''
          )
          new_initial = '''def initialEquation(
              left: Expr[Real],
              right: Expr[Real],
              options: InitialEquationOptions = InitialEquationOptions()
          ): Unit = CandidateRuntime.statement("candidate-initial-equation", left, right, options)
          '''
          if old_initial_pattern.search(api):
              api = old_initial_pattern.sub(new_initial, api, count=1)
          elif new_initial not in api:
              raise RuntimeError("initialEquation replacement anchor mismatch")
          api_path.write_text(api, encoding="utf-8")

          internal_path = root / "examples/continuousTimeApi/src/ContinuousTimeCandidates.scala"
          internal = internal_path.read_text(encoding="utf-8")
          old_internal = 'EquationOptions(id = Some(EquationId("initial-charge")))'
          new_internal = 'InitialEquationOptions(id = Some(EquationId("initial-charge")))'
          if old_internal in internal:
              internal = internal.replace(old_internal, new_internal, 1)
          elif new_internal not in internal:
              raise RuntimeError("internal initial-equation options anchor mismatch")
          internal_path.write_text(internal, encoding="utf-8")

          external_path = root / "examples/continuousTimeExternal/src/ReusablePhysicalComponents.scala"
          external = external_path.read_text(encoding="utf-8")
          resistor_pattern = re.compile(
              r'''    equations:\n'''
              r'''      equation\(\n'''
              r'''        path\.potential,\n'''
              r'''        resistance \* path\.flow,\n'''
              r'''        EquationOptions\(id = Some\(EquationId\("resistor-ohm-law"\)\)\)\n'''
              r'''      \)\n'''
          )
          if resistor_pattern.search(external):
              external = resistor_pattern.sub(
                  "    equations:\n      path.potential === resistance * path.flow\n",
                  external,
                  count=1,
              )
          elif "path.potential === resistance * path.flow" not in external:
              raise RuntimeError("external resistor equation anchor mismatch")
          external_path.write_text(external, encoding="utf-8")

          plan_path = root / "docs/roadmap/continuous-time-ams-v0.1-plan.md"
          plan = plan_path.read_text(encoding="utf-8")
          start_marker = "- [ ] **Increment 133 — Analog semantic API and analysis contract design gate**"
          next_marker = "- [ ] **Increment 134 — Source-semantic analog IR, `AnalogIsland`, and stable identities**"
          start = plan.find(start_marker)
          end = plan.find(next_marker)
          if start < 0 or end < 0 or end <= start:
              raise RuntimeError("Increment 133 detailed-plan range mismatch")
          replacement = '''- [ ] **Increment 133 — Analog semantic API and analysis contract design gate**
            - Freeze the equation/component checkpoint first: unordered equations, additive contributions, procedural-assignment separation, conservative connections, partial/concrete components, local balance, structural parameters, and initial equations.
            - Publish `NodalEquationComponentApi-DG-v0.1.md` and its machine-readable checkpoint surface; Increment 32 may begin after this checkpoint is accepted even while the remaining full gate is still being validated.
            - Freeze the complete continuous-time public surface covering analog state and reinitialization, event tolerances and discontinuities, analysis context, environment/PVT, noise identity/correlation, validity envelopes, and solver hints.
            - Publish `NodalContinuousTimeApi-DG-v0.1.md`, a machine-readable public surface, migration notes, stable diagnostics, positive/negative fixtures, and an external reusable physical-component fixture.
            - Keep frontend, equation normalization, residual formation, solver, and backend behavior inert.

          '''
          plan = plan[:start] + replacement + plan[end:]
          plan_path.write_text(plan, encoding="utf-8")

          architecture_path = root / "docs/roadmap/continuous-time-ams-v0.1-surface.json"
          architecture = json.loads(architecture_path.read_text(encoding="utf-8"))
          architecture["status"] = "public-api-frozen-awaiting-evidence"
          architecture["implementation_status"]["public_api_frozen"] = True
          matches = 0
          for item in architecture["roadmap"]:
              if item.get("increment") == 133:
                  item["status"] = "approved-awaiting-evidence"
                  matches += 1
          if matches != 1:
              raise RuntimeError("Increment 133 architecture entry mismatch")
          architecture_path.write_text(
              json.dumps(architecture, indent=2) + "\n",
              encoding="utf-8",
          )

          permanent_workflow = root / ".github/workflows/increment-133-analog-semantic-api.yml"
          workflow_text = permanent_workflow.read_text(encoding="utf-8")
          workflow_text = workflow_text.replace(
              "python3 -m unittest tests.api.test_increment133",
              "python3 -m unittest discover -s tests/api -p 'test_increment133.py'",
          )
          permanent_workflow.write_text(workflow_text, encoding="utf-8")

          for temporary in (
              ".github/workflows/_increment133_payload.yml",
              ".github/workflows/_increment133_recover_payload.yml",
              ".github/workflows/_increment133_finalize.yml",
          ):
              (root / temporary).unlink(missing_ok=True)
          PY

          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill scalafix.fix
          python3 scripts/check_increment133.py --compile-negative
          python3 -m unittest discover -s tests/api -p 'test_increment133.py'
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Increment 133 — finalize analog semantic API gate"
          git push origin HEAD:increment/133-analog-semantic-api
