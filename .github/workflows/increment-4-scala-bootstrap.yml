name: Increment 4 Scala bootstrap validation

on:
  push:
    branches:
      - increment/4-modern-scala3-build
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  scala-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_COLOR: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run validation suite
        shell: bash
        run: |
          set +e
          mkdir -p .validation
          : > .validation/results

          run_check() {
            local slug="$1"
            local label="$2"
            shift 2
            "$@" > ".validation/${slug}.log" 2>&1
            local status=$?
            printf '%s|%s|%s\n' "$slug" "$label" "$status" >> .validation/results
          }

          run_check architecture "Architecture checker" \
            python3 scripts/check_architecture.py
          run_check bootstrap-pins "Scala bootstrap pin checker" \
            python3 scripts/check_scala_bootstrap.py
          run_check architecture-tests "Architecture unit tests" \
            python3 -m unittest discover -s tests/architecture -p 'test_*.py'
          run_check bootstrap-tests "Bootstrap unit tests" \
            python3 -m unittest discover -s tests/build -p 'test_*.py'
          run_check java-version "Managed Java version" \
            ./mill java -version
          run_check scala-compile "Compile every Scala module" \
            ./mill __.compile
          run_check scala-smoke "Scala bootstrap smoke tests" \
            ./mill core.scala.testkit.test

          overall=0
          while IFS='|' read -r slug label status; do
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          done < .validation/results
          printf '%s\n' "$overall" > .validation/exit-code

          echo 'Validation summary:'
          while IFS='|' read -r slug label status; do
            if [ "$status" -eq 0 ]; then result='PASS'; else result="FAIL (${status})"; fi
            printf '  %-34s %s\n' "$label" "$result"
          done < .validation/results

          while IFS='|' read -r slug label status; do
            echo
            echo "===== ${label} ====="
            cat ".validation/${slug}.log"
          done < .validation/results

      - name: Publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .validation/exit-code ] && [ "$(cat .validation/exit-code)" -eq 0 ]; then
            state=success
            description='Scala 3 bootstrap validation passed'
          else
            state=failure
            description='Scala 3 bootstrap validation failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='increment-4/scala-bootstrap' \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Propagate validation result
        if: always()
        shell: bash
        run: |
          test -f .validation/exit-code
          exit "$(cat .validation/exit-code)"
