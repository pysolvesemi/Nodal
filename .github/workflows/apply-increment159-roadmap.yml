name: Apply Increment 159 roadmap update

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-staged-for-range-roadmap-v3
          fetch-depth: 0
      - run: python3 scripts/apply_increment159_roadmap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m "docs: add typed staged for-range increment"
          git push origin HEAD:agent/typed-staged-for-range-roadmap-v3
