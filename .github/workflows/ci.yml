name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_increment12_roadmap_check:
    name: update Increment 12 roadmap check
    if: github.event_name == 'pull_request' && github.head_ref == 'increment/124-interface-role-inout-ams-roadmap'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select the writable feature head
        run: |
          git fetch --no-tags origin \
            increment/124-interface-role-inout-ams-roadmap:refs/remotes/origin/increment/124-interface-role-inout-ams-roadmap
          git checkout -B increment/124-interface-role-inout-ams-roadmap \
            origin/increment/124-interface-role-inout-ams-roadmap

      - name: Validate a forward-moving roadmap date
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_increment12.py')
          content = path.read_text(encoding='utf-8')
          old = '''            "**Revision:** 1.12",\n            "**Updated:** 2026-08-22",\n            "- [x] **Increment 12 — Clock/reset public API v0.2 freeze and contract fixtures**",\n'''
          new = '''            "**Revision:** 1.12",\n            "- [x] **Increment 12 — Clock/reset public API v0.2 freeze and contract fixtures**",\n'''
          if content.count(old) != 1:
              raise SystemExit('Increment 12 roadmap fragment was not found exactly once')
          content = content.replace(old, new, 1)
          anchor = '''        "main roadmap",\n    )\n\n    _require(\n        build,\n'''
          replacement = '''        "main roadmap",\n    )\n    updated_lines = [\n        line.removeprefix("**Updated:** ")\n        for line in roadmap.splitlines()\n        if line.startswith("**Updated:** ")\n    ]\n    if len(updated_lines) != 1 or updated_lines[0] < "2026-08-22":\n        problems.append(\n            Problem(\n                "NODAL-INC12-054",\n                "main roadmap Updated date must be present and no earlier than 2026-08-22",\n            )\n        )\n\n    _require(\n        build,\n'''
          if content.count(anchor) != 1:
              raise SystemExit('Increment 12 roadmap validation insertion point was not found exactly once')
          content = content.replace(anchor, replacement, 1)
          path.write_text(content, encoding='utf-8')
          PY
          python3 scripts/check_increment12.py
          git diff --check

      - name: Publish updated checker
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git checkout origin/dev -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Increment 12 roadmap date check forward-compatible'
          git push origin HEAD:increment/124-interface-role-inout-ams-roadmap

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
