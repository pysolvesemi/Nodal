name: Increment 34 Native Dataflow v4

on:
  push:
    branches:
      - automation/inc34-native-dataflow-v4
    paths:
      - '.github/workflows/_inc34_native_dataflow_v4.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-native-dataflow-v4
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-native-dataflow-v4
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Materialize complete Increment 34 compiler tranche
        run: |
          python3 -m py_compile \
            controller/.github/automation/inc34_patch_scala.py \
            controller/.github/automation/inc34_patch_native.py \
            controller/.github/automation/inc34_patch_contracts.py \
            controller/.github/automation/inc34_post_repair.py \
            controller/.github/automation/inc34_patch_native_dataflow.py \
            controller/.github/automation/inc34_patch_native_dataflow_repair.py
          python3 controller/.github/automation/inc34_patch_scala.py --root work
          python3 controller/.github/automation/inc34_patch_native.py --root work
          python3 controller/.github/automation/inc34_patch_contracts.py --root work
          python3 controller/.github/automation/inc34_post_repair.py --root work
          python3 controller/.github/automation/inc34_patch_native_dataflow.py --root work
          python3 controller/.github/automation/inc34_patch_native_dataflow_repair.py --root work

      - name: Install locked toolchains
        working-directory: work
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_NATIVE_TOOLCHAIN=${RUNNER_TEMP}/nodal-native-toolchain" >> "${GITHUB_ENV}"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" >> "${GITHUB_ENV}"

      - name: Format staged implementation
        working-directory: work
        run: |
          ./mill mill.scalalib.scalafmt.ScalafmtModule/reformatAll __.sources
          clang_format=$(find "${NODAL_LINT_TOOLCHAIN}" -type f -name clang-format -perm -u+x | head -n 1)
          test -n "${clang_format}"
          "${clang_format}" -i core/compiler/lib/Dialect/Nodal/NodalOps.cpp

      - name: Validate repository and mutation contracts
        working-directory: work
        run: |
          python3 scripts/check_increment33.py
          python3 scripts/check_increment34.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment34.py'
          git diff --check

      - name: Compile and test Scala core
        working-directory: work
        run: ./nodal core scala

      - name: Build, lint, and test native core
        working-directory: work
        run: |
          ./nodal core native \
            --toolchain "${NODAL_NATIVE_TOOLCHAIN}" \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}"

      - name: Execute Increment 34 source and construction witnesses
        working-directory: work
        run: |
          runtime_report="${RUNNER_TEMP}/increment34-runtime.txt"
          construction_report="${RUNNER_TEMP}/increment34-construction.txt"
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment34fixture.Increment34RuntimeCheck \
            "${runtime_report}"
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment34fixture.Increment34ConstructionCheck \
            "${construction_report}"
          grep -F 'conditional_definite=true' "${runtime_report}"
          grep -F 'case_definite=true' "${runtime_report}"
          grep -F 'loop_definite=true' "${runtime_report}"
          grep -F 'static_definite=true' "${runtime_report}"
          grep -F 'public_conditional_snapshots=1' "${construction_report}"
          grep -F 'public_case_snapshots=1' "${construction_report}"
          grep -F 'flat_assignments=0' "${construction_report}"

      - name: Prove direct native structured dataflow diagnostics
        working-directory: work
        shell: bash
        run: |
          nodalc=$(find out -type f -name nodalc -perm -u+x | head -n 1)
          test -n "${nodalc}"
          "${nodalc}" --mlir-print-op-generic --mlir-print-debuginfo \
            core/compiler/test/IR/analog-control-flow.mlir \
            > "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_if"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_case"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F '"nodal.analog_loop"' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F 'ControlTop.final_read' "${RUNNER_TEMP}/increment34-structured.mlir"
          grep -F 'AnalogControlFlow.scala' "${RUNNER_TEMP}/increment34-structured.mlir"
          for fixture in missing-else missing-default zero-trip continue-path; do
            set +e
            "${nodalc}" \
              "core/compiler/test/IR/analog-control-flow-invalid-${fixture}.mlir" \
              >"${RUNNER_TEMP}/${fixture}.out" \
              2>"${RUNNER_TEMP}/${fixture}.err"
            rc=$?
            set -e
            test "${rc}" -ne 0
            grep -F 'NODAL-ANALOG-034-004' "${RUNNER_TEMP}/${fixture}.err"
          done

      - name: Require repository style and clean patch
        working-directory: work
        run: |
          ./nodal style check --lint-toolchain "${NODAL_LINT_TOOLCHAIN}"
          git diff --check

      - name: Commit and publish exact validated checkpoint
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin \
            increment/34-analog-control-flow-v1:refs/remotes/origin/increment/34-analog-control-flow-v1
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse origin/increment/34-analog-control-flow-v1)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            published=$(git rev-parse HEAD)
          else
            git commit -m \
              'feat(increment34): complete structured compiler dataflow'
            published=$(git rev-parse HEAD)
            git push origin HEAD:increment/34-analog-control-flow-v1
          fi
          gh pr comment 109 --repo "${GITHUB_REPOSITORY}" \
            --body "Increment 34 native branch-sensitive dataflow checkpoint passed the Scala, native, mutation, direct-MLIR, source-map, and style gates. Published exact head: \`${published}\`. Increment 34 remains open for exact-head matrix, fresh review, merge, and separate evidence closure."

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment34-native-dataflow-v4
          path: |
            ${{ runner.temp }}/increment34-runtime.txt
            ${{ runner.temp }}/increment34-construction.txt
            ${{ runner.temp }}/increment34-structured.mlir
            ${{ runner.temp }}/*.err
          if-no-files-found: warn
          retention-days: 3
