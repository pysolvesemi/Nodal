name: Increment 13 Core Semantic Candidates

on:
  push:
    branches:
      - increment/13-core-semantic-candidates
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  candidate-contracts:
    name: increment-13/core-semantic-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate positive and negative compile contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment13.py --compile-negative
          git diff --check
