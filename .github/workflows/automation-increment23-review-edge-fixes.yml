name: Automation Increment 23 Review Edge Fixes

on:
  push:
    branches:
      - automation/increment23-materialize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-increment23-review-edge-fixes
  cancel-in-progress: true

jobs:
  patch:
    name: increment-23/review-edge-fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out automation source
        uses: actions/checkout@v6
        with:
          ref: automation/increment23-materialize
          path: automation

      - name: Check out Increment 23 branch
        uses: actions/checkout@v6
        with:
          ref: increment/23-backend-framework-capability-profiles
          fetch-depth: 0
          path: worktree

      - name: Apply review edge-case fixes
        run: python3 automation/scripts/patch_increment23_review_edge_cases.py worktree

      - name: Restore locked caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/nodal/downloads
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-inc23-review-${{ runner.os }}-${{ hashFiles('worktree/build.mill', 'worktree/.mill-version', 'worktree/mill', 'worktree/toolchains/lock.json', 'worktree/toolchains/checksums/*.sha256', 'worktree/toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-inc23-review-${{ runner.os }}-
            nodal-inc23-${{ runner.os }}-

      - name: Install locked toolchains and format fixes
        working-directory: worktree
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Backend/Backend.cpp \
            core/compiler/test/Unit/BackendTest.cpp

      - name: Validate review fixes and repository contracts
        working-directory: worktree
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in 18 19 20 21 22 23; do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Build lint and test complete native and Scala core
        working-directory: worktree
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          NODAL_NODALC="${PWD}/out/native/release/bin/nodalc" \
            ./nodal core scala
          git diff --check

      - name: Publish review fixes
        working-directory: worktree
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/compiler/lib/Backend/Backend.cpp \
            core/compiler/test/Unit/BackendTest.cpp \
            scripts/check_increment23.py \
            tests/compiler/test_increment23.py \
            docs/implementation/increment23-backend-framework.md
          git commit -m 'Increment 23 — fix target parser edge cases'
          git push origin HEAD:increment/23-backend-framework-capability-profiles
