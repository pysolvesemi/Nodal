name: Increment 133 Temporary Format Diff

on:
  push:
    branches:
      - increment/133-analog-semantic-api

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Print exact Scalafmt correction
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          git --no-pager diff --no-color -- core/scala/api/src/nodal/ContinuousTimeCandidateApi.scala
          test -z "$(git status --short -- core/scala/api/src/nodal/ContinuousTimeCandidateApi.scala)"
