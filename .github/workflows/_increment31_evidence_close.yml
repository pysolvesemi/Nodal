name: Increment 31 Evidence Closure Materialization

on:
  push:
    branches:
      - increment/31-evidence-closure

permissions:
  contents: write

concurrency:
  group: increment-31-evidence-closure
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  close-evidence:
    name: increment-31/evidence-closure-materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v6
        with:
          ref: increment/31-evidence-closure
          fetch-depth: 0

      - name: Record evidence, validate closure, and remove updater
        run: python3 scripts/_increment31_evidence_close.py
