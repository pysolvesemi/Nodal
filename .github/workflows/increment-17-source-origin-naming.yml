name: Increment 17 Source Origin Naming

on:
  push:
    branches:
      - increment/17-source-origin-naming
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  finalize-roadmap:
    name: increment-17/finalize-roadmap
    if: github.event_name == 'pull_request' && github.head_ref == 'increment/17-source-origin-naming' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out authoritative Increment 17 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/17-source-origin-naming

      - name: Close roadmap and validate final contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path("docs/roadmap/nodal-development-todo.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          revision_old = "**Revision:** 1.20"
          revision_new = "**Revision:** 1.21"
          if revision_new not in roadmap:
              if roadmap.count(revision_old) != 1:
                  raise RuntimeError("roadmap revision anchor is not unique")
              roadmap = roadmap.replace(revision_old, revision_new, 1)

          unchecked = "- [ ] **Increment 17 — Source spans, semantic naming, and origin graph**"
          checked = "- [x] **Increment 17 — Source spans, semantic naming, and origin graph**"
          if checked not in roadmap:
              if roadmap.count(unchecked) != 1:
                  raise RuntimeError("Increment 17 roadmap anchor is not unique")
              roadmap = roadmap.replace(unchecked, checked, 1)

          scope = (
              "  - Capture Scala declaration/member names and expression spans; build stable "
              "origin/sink-affinity metadata; define deterministic names for modules, declarations, "
              "shaped elements/views, domains, generated clock/reset ports, synchronizers, FIFOs, "
              "reset controllers, crossings, pipeline/FSM state, anonymous registers, and required "
              "temporaries. Prohibit traversal-counter-only normal names and retain expression-level "
              "source maps when nodes are inlined."
          )
          evidence = (
              "  - Evidence: [`SemanticOriginKernel.scala`](../../core/scala/api/src/nodal/"
              "SemanticOriginKernel.scala), [`SemanticOriginTests.scala`](../../core/scala/testkit/"
              "test/src/nodal/SemanticOriginTests.scala), [`NodalSemanticOriginNaming-DG-v1.0.md`]"
              "(../design-gates/NodalSemanticOriginNaming-DG-v1.0.md), PR [#42]"
              "(https://github.com/pysolvesemi/Nodal/pull/42), dedicated validation run "
              "[32722646172](https://github.com/pysolvesemi/Nodal/actions/runs/32722646172), "
              "and Core CI run [32722646224](https://github.com/pysolvesemi/Nodal/actions/runs/"
              "32722646224)."
          )
          if evidence not in roadmap:
              if roadmap.count(scope) != 1:
                  raise RuntimeError("Increment 17 evidence anchor is not unique")
              roadmap = roadmap.replace(scope, scope + "\n" + evidence, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")
          PY

          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py
          git diff --check

      - name: Commit finalized roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m "Increment 17 — close roadmap and validation evidence"
          git pull --rebase origin increment/17-source-origin-naming
          git push origin HEAD:increment/17-source-origin-naming

  source-origin:
    name: increment-17/source-origin
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bootstrap pinned contract toolchain
        run: |
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" >> "$GITHUB_ENV"

      - name: Validate semantic source identity and predecessor contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py --compile
          python3 tests/api/test_increment16.py
          python3 tests/api/test_increment17.py
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref origin/dev
          git diff --check
