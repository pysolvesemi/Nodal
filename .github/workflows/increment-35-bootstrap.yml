                .flatMap(_.stateId)
              val fixed = legacy.continuousOperators
                .find(operator =>
                  operator.operation == "analog_idt" && operator.initialization == "fixed"
                )
                .get
              val solver = legacy.continuousOperators
                .find(operator =>
