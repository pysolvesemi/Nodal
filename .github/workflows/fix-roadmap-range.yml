name: Fix roadmap terminal range

on:
  push:
    branches:
      - increment/13-core-semantics-digital-verilog-roadmap

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: increment/13-core-semantics-digital-verilog-roadmap
          fetch-depth: 0

      - name: Correct terminal roadmap range
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")
          old = "No official reusable model/component library is implemented by Increments 0-86."
          new = "No official reusable model/component library is implemented by Increments 0-90."
          if text.count(old) != 1:
              raise SystemExit("expected one deferred-roadmap range anchor")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-roadmap-range.yml
          git add -- docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: correct deferred roadmap range'
          git push origin HEAD:increment/13-core-semantics-digital-verilog-roadmap
