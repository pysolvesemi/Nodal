name: Increment 29 Review Repair

on:
  push:
    branches:
      - increment/29-parameters-units
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-29-review-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: increment-29/review-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/29-parameters-units
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install locked toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Apply review repairs
        run: python3 scripts/repair_increment29_review.py

      - name: Remove one-shot repair automation
        run: |
          rm -f scripts/repair_increment29_review.py
          rm -f .github/workflows/increment-29-review-repair.yml

      - name: Apply deterministic formatting
        run: |
          ./nodal style fix \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate contracts and mutation coverage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in $(seq 18 29); do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_markdown.py
          git diff --check

      - name: Build lint and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Commit repaired Increment 29
        run: |
          git add -A
          git commit -m "Increment 29 — resolve parameter unit and width review findings"
          git push origin HEAD:increment/29-parameters-units
