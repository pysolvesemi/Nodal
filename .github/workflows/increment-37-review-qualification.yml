name: Increment 37 Review Qualification
on:
  push:
    branches: [increment/37-review-qualification]
    paths: ['.github/workflows/increment-37-review-qualification.yml']
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Integrate exact dev and apply reviewed patch
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == '4e8472a3247b4309eca5e2104bd2b06e28e42d08'
          subprocess.run(['git', '-c', 'user.name=Nodal qualification', '-c', 'user.email=qualification@localhost', 'merge', '--no-commit', '--no-ff', '8d4dcb3b0a04314f2ec33ccd2006c71ed20c5d61'], check=True)
          blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/pysolvesemi/Nodal/git/blobs/5a8b86d63cc28eb058a282e6ec2bc6d3aa53122b']))
          patch = lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch) == 20993 and hashlib.sha256(patch).hexdigest() == '830dc4aad3d790645f79aa4532f4f08dada0a586b16985e56e3b4155113eac9d'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          pathlib.Path('.github/workflows/increment-37-review-qualification.yml').unlink()
          PY
      - name: Format and execute repository gates
        if: steps.apply.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-review'
          out.mkdir()
          native = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native'
          lint = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lint'
          results = {}
          def run(label, args):
              print('::group::' + label, flush=True)
              with (out / (label + '.log')).open('w') as log:
                  proc = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in proc.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  results[label] = proc.wait()
              (out / 'results.json').write_text(json.dumps(results, indent=2))
              print('::endgroup::', flush=True)
          run('lint-bootstrap', ['./nodal', 'style', 'bootstrap', '--prefix', str(lint)])
          run('scalafmt', ['./mill', '-i', 'mill.scalalib.scalafmt/reformatAll'])
          run('scalafix', ['./mill', '-i', 'scalafix.fix'])
          run('clang-format', ['python3', 'scripts/run_clang_tools.py', 'format', '--fix', '--toolchain', str(lint)])
          run('scala', ['./nodal', 'core', 'scala'])
          run('python', ['python3', '-m', 'unittest', 'discover', '-s', 'tests/compiler', '-p', 'test_*.py'])
          run('native-bootstrap', ['./nodal', 'bootstrap', '--mode', 'prebuilt', '--prefix', str(native)])
          run('native', ['./nodal', 'core', 'native', '--toolchain', str(native), '--lint-toolchain', str(lint)])
          source = out / 'increment37-source.mlir'
          run('source', ['./mill', '-i', 'core.scala.testkit.test.runMain', 'nodal.internal.testkit.Increment37MlirCheck', str(source)])
          compilers = [p for p in pathlib.Path('out').rglob('nodalc') if p.is_file() and os.access(p, os.X_OK)]
          translators = [p for p in pathlib.Path('out').rglob('nodal-translate') if p.is_file() and os.access(p, os.X_OK)]
          if compilers and translators:
              tools = ['--nodalc', str(compilers[0].resolve()), '--translate', str(translators[0].resolve())]
              run('matrix', ['python3', 'tests/compiler/fixtures/increment37/run_native_matrix.py', *tools, '--source', str(source)])
              run('directions', ['python3', 'tests/compiler/fixtures/increment37/run_direction_matrix.py', *tools])
          else:
              results['missing-native-tools'] = 1
              (out / 'results.json').write_text(json.dumps(results, indent=2))
          run('style', ['./nodal', 'style', 'check', '--lint-toolchain', str(lint), '--base-ref', 'origin/dev'])
          run('contracts', ['./nodal', 'check', '--contracts-only', '--online-toolchain', '--lint-toolchain', str(lint), '--base-ref', 'origin/dev'])
          run('markdown', ['python3', 'scripts/check_markdown.py'])
          run('whitespace', ['git', 'diff', '--check'])
          PY
      - name: Retain exact source objects and evidence without changing refs
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-review'
          out.mkdir(exist_ok=True)
          def git(*args): return subprocess.check_output(['git', *args])
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = git('write-tree').decode().strip()
          (out / 'candidate.tar.gz').write_bytes(git('archive', '--format=tar.gz', tree))
          (out / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary'))
          entries, workflows = [], []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw: continue
              name = raw.decode()
              path = pathlib.Path(name)
              item = {'path': name, 'type': 'blob', 'mode': '100755' if path.exists() and os.access(path, os.X_OK) else '100644'}
              if path.exists(): item['content'] = path.read_text()
              else: item['sha'] = None
              (workflows if name.startswith('.github/workflows/') else entries).append(item)
          (out / 'workflow-entries.json').write_text(json.dumps(workflows, indent=2))
          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}).encode()
          req = urllib.request.Request('https://api.github.com/repos/pysolvesemi/Nodal/git/trees', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response: result = json.load(response)
          (out / 'candidate.json').write_text(json.dumps({'source_tree_sha': result['sha'], 'validated_tree_sha': tree, 'implementation_parent': '4e8472a3247b4309eca5e2104bd2b06e28e42d08', 'integration_parent': '8d4dcb3b0a04314f2ec33ccd2006c71ed20c5d61', 'run_id': os.environ['GITHUB_RUN_ID']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment37-review-qualification
          path: ${{ runner.temp }}/increment37-review
          retention-days: 14
      - name: Enforce every required gate
        if: always() && steps.apply.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-review/results.json').read_text())
          print(json.dumps(result, indent=2))
          required = ['scala', 'python', 'native', 'source', 'matrix', 'directions', 'style', 'contracts', 'markdown', 'whitespace']
          assert all(key in result for key in required) and all(value == 0 for value in result.values()), 'Review fixes are not qualified'
          PY
