name: Increment 30 Review Fixes

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    name: apply-reviewed-semantic-fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Apply semantic and regression fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement site, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp",
              '''struct EvaluationResult {
            EvaluationStatus status = EvaluationStatus::Dynamic;
            ConstantValue value;
          };

          bool isNamed(Operation *operation, llvm::StringRef name) {''',
              '''struct EvaluationResult {
            EvaluationStatus status = EvaluationStatus::Dynamic;
            ConstantValue value;
          };

          constexpr llvm::StringLiteral kFoldAttributes[] = {
              "nodal.folded",           "nodal.folded_kind",      "nodal.folded_dimension",
              "nodal.folded_value",     "nodal.folded_provenance",
          };

          void clearFoldAnnotations(Operation *operation) {
            for (llvm::StringRef attribute : kFoldAttributes)
              operation->removeAttr(attribute);
          }

          bool isNamed(Operation *operation, llvm::StringRef name) {''',
          )

          replace_once(
              "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp",
              '''EvaluationResult evaluateSelect(Operation *operation, bool reportErrors) {
            EvaluationResult condition = evaluateValue(operation->getOperand(0), reportErrors);
            EvaluationResult trueValue = evaluateValue(operation->getOperand(1), reportErrors);
            EvaluationResult falseValue = evaluateValue(operation->getOperand(2), reportErrors);
            if (condition.status == EvaluationStatus::Error || trueValue.status == EvaluationStatus::Error ||
                falseValue.status == EvaluationStatus::Error)
              return errorResult(operation, "NODAL-ANALOG-FOLD-001", "conditional operand evaluation failed",
                                 reportErrors);
            if (condition.status != EvaluationStatus::Constant ||
                trueValue.status != EvaluationStatus::Constant ||
                falseValue.status != EvaluationStatus::Constant)
              return dynamicResult();
            return condition.value.boolean ? trueValue : falseValue;
          }
''',
              '''EvaluationResult promoteSelectedConstant(Operation *operation, EvaluationResult selected,
                                                           bool reportErrors) {
            auto resultInformation = getAnalogNumericTypeInfo(operation->getResult(0).getType());
            if (failed(resultInformation))
              return errorResult(operation, "NODAL-ANALOG-FOLD-001",
                                 "conditional result has no semantic type", reportErrors);
            if (selected.value.dimension != resultInformation->dimension)
              return errorResult(operation, "NODAL-ANALOG-FOLD-001",
                                 "selected constant dimension does not match conditional result",
                                 reportErrors);
            if (selected.value.kind == resultInformation->kind) {
              selected.value.dimension = resultInformation->dimension;
              return selected;
            }
            if (selected.value.kind == AnalogNumericKind::Integer &&
                resultInformation->kind == AnalogNumericKind::Real && selected.value.integer) {
              std::optional<double> promoted = integerAsDouble(*selected.value.integer);
              if (!promoted)
                return errorResult(operation, "NODAL-ANALOG-FOLD-001",
                                   "selected integer cannot be promoted to a finite real", reportErrors);
              ConstantValue result;
              result.kind = AnalogNumericKind::Real;
              result.dimension = resultInformation->dimension;
              result.real = *promoted;
              return constantResult(std::move(result));
            }
            return errorResult(operation, "NODAL-ANALOG-FOLD-001",
                               "selected constant kind does not match conditional result", reportErrors);
          }

          EvaluationResult evaluateSelect(Operation *operation, bool reportErrors) {
            EvaluationResult condition = evaluateValue(operation->getOperand(0), reportErrors);
            EvaluationResult trueValue = evaluateValue(operation->getOperand(1), reportErrors);
            EvaluationResult falseValue = evaluateValue(operation->getOperand(2), reportErrors);
            if (condition.status == EvaluationStatus::Error || trueValue.status == EvaluationStatus::Error ||
                falseValue.status == EvaluationStatus::Error)
              return errorResult(operation, "NODAL-ANALOG-FOLD-001", "conditional operand evaluation failed",
                                 reportErrors);
            if (condition.status != EvaluationStatus::Constant ||
                trueValue.status != EvaluationStatus::Constant ||
                falseValue.status != EvaluationStatus::Constant)
              return dynamicResult();
            EvaluationResult selected = condition.value.boolean ? trueValue : falseValue;
            return promoteSelectedConstant(operation, std::move(selected), reportErrors);
          }
''',
          )

          replace_once(
              "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp",
              '''LogicalResult foldAnalogNumericConstants(mlir::ModuleOp module) {
            if (failed(verifyAnalogNumericModel(module)))
              return failure();
            LogicalResult result = success();
            module.walk([&](Operation *operation) {
              if (failed(result) || !isFoldCandidate(operation) || operation->getNumResults() != 1)
                return;
              EvaluationResult evaluated = evaluateValue(operation->getResult(0), true);
              if (evaluated.status == EvaluationStatus::Error) {
                result = failure();
                return;
              }
              constexpr llvm::StringLiteral attributes[] = {"nodal.folded", "nodal.folded_kind",
                                                            "nodal.folded_dimension", "nodal.folded_value",
                                                            "nodal.folded_provenance"};
              if (evaluated.status != EvaluationStatus::Constant) {
                for (llvm::StringRef attribute : attributes)
                  operation->removeAttr(attribute);
                return;
              }

              MLIRContext *context = operation->getContext();
              operation->setAttr("nodal.folded", BoolAttr::get(context, true));
              llvm::StringRef kind =
                  evaluated.value.kind == AnalogNumericKind::Integer ? llvm::StringRef("integer")
                  : evaluated.value.kind == AnalogNumericKind::Real  ? llvm::StringRef("real")
                                                                     : llvm::StringRef("boolean");
              operation->setAttr("nodal.folded_kind", StringAttr::get(context, kind));
              operation->setAttr("nodal.folded_dimension",
                                 StringAttr::get(context, evaluated.value.dimension));
              operation->setAttr("nodal.folded_provenance", StringAttr::get(context, "increment30"));
              if (evaluated.value.kind == AnalogNumericKind::Boolean) {
                operation->setAttr("nodal.folded_value", BoolAttr::get(context, evaluated.value.boolean));
              } else if (evaluated.value.kind == AnalogNumericKind::Real) {
                operation->setAttr("nodal.folded_value",
                                   FloatAttr::get(Float64Type::get(context), evaluated.value.real));
              } else if (evaluated.value.integer) {
                llvm::APInt integer = *evaluated.value.integer;
                if (integer.getBitWidth() == 0)
                  integer = llvm::APInt(1, 0);
                operation->setAttr(
                    "nodal.folded_value",
                    IntegerAttr::get(IntegerType::get(context, integer.getBitWidth()), integer));
              } else {
                result = emitMappedFailure(operation, "NODAL-ANALOG-FOLD-001",
                                           "constant integer fold lost its exact value");
              }
            });
            return result;
          }
''',
              '''LogicalResult foldAnalogNumericConstants(mlir::ModuleOp module) {
            if (failed(verifyAnalogNumericModel(module)))
              return failure();

            module.walk([](Operation *operation) { clearFoldAnnotations(operation); });

            LogicalResult result = success();
            module.walk([&](Operation *operation) {
              if (failed(result) || !isFoldCandidate(operation) || operation->getNumResults() != 1)
                return;
              EvaluationResult evaluated = evaluateValue(operation->getResult(0), true);
              if (evaluated.status == EvaluationStatus::Error) {
                result = failure();
                return;
              }
              if (evaluated.status != EvaluationStatus::Constant)
                return;

              MLIRContext *context = operation->getContext();
              operation->setAttr("nodal.folded", BoolAttr::get(context, true));
              llvm::StringRef kind =
                  evaluated.value.kind == AnalogNumericKind::Integer ? llvm::StringRef("integer")
                  : evaluated.value.kind == AnalogNumericKind::Real  ? llvm::StringRef("real")
                                                                     : llvm::StringRef("boolean");
              operation->setAttr("nodal.folded_kind", StringAttr::get(context, kind));
              operation->setAttr("nodal.folded_dimension",
                                 StringAttr::get(context, evaluated.value.dimension));
              operation->setAttr("nodal.folded_provenance", StringAttr::get(context, "increment30"));
              if (evaluated.value.kind == AnalogNumericKind::Boolean) {
                operation->setAttr("nodal.folded_value", BoolAttr::get(context, evaluated.value.boolean));
              } else if (evaluated.value.kind == AnalogNumericKind::Real) {
                operation->setAttr("nodal.folded_value",
                                   FloatAttr::get(Float64Type::get(context), evaluated.value.real));
              } else if (evaluated.value.integer) {
                llvm::APInt integer = *evaluated.value.integer;
                if (integer.getBitWidth() == 0)
                  integer = llvm::APInt(1, 0);
                operation->setAttr(
                    "nodal.folded_value",
                    IntegerAttr::get(IntegerType::get(context, integer.getBitWidth()), integer));
              } else {
                result = emitMappedFailure(operation, "NODAL-ANALOG-FOLD-001",
                                           "constant integer fold lost its exact value");
              }
            });
            return result;
          }
''',
          )

          replace_once(
              "core/compiler/lib/Backend/AnalogVerticalSlice.cpp",
              '''std::optional<std::string> renderFoldedExpression(Operation *operation) {
            auto folded = operation->getAttrOfType<BoolAttr>("nodal.folded");
            if (!folded || !folded.getValue())
              return std::nullopt;
            Attribute value = operation->getAttr("nodal.folded_value");
            if (auto boolean = llvm::dyn_cast_or_null<BoolAttr>(value))
              return boolean.getValue() ? std::string("1") : std::string("0");
            if (auto real = llvm::dyn_cast_or_null<FloatAttr>(value)) {
              if (!std::isfinite(real.getValueAsDouble()))
                return std::nullopt;
              return formatReal(real.getValueAsDouble());
            }
            if (auto integer = llvm::dyn_cast_or_null<IntegerAttr>(value)) {
              llvm::SmallString<64> rendered;
              integer.getValue().toString(rendered, 10, true);
              return rendered.str().str();
            }
            return std::nullopt;
          }
''',
              '''bool isFoldedExpressionCandidate(Operation *operation) {
            if (!operation || operation->getNumResults() != 1)
              return false;
            llvm::StringRef name = operation->getName().getStringRef();
            return name == "nodal.analog_add" || name == "nodal.analog_sub" ||
                   name == "nodal.analog_mul" || name == "nodal.analog_div" ||
                   name == "nodal.analog_neg" || name == "nodal.analog_compare" ||
                   name == "nodal.analog_logic" || name == "nodal.analog_select";
          }

          llvm::StringRef foldedKindName(AnalogNumericKind kind) {
            switch (kind) {
            case AnalogNumericKind::Integer:
              return "integer";
            case AnalogNumericKind::Real:
              return "real";
            case AnalogNumericKind::Boolean:
              return "boolean";
            case AnalogNumericKind::Invalid:
              return {};
            }
            return {};
          }

          std::optional<std::string> renderFoldedExpression(Operation *operation) {
            if (!isFoldedExpressionCandidate(operation))
              return std::nullopt;
            auto folded = operation->getAttrOfType<BoolAttr>("nodal.folded");
            auto provenance = operation->getAttrOfType<StringAttr>("nodal.folded_provenance");
            auto kind = operation->getAttrOfType<StringAttr>("nodal.folded_kind");
            auto dimension = operation->getAttrOfType<StringAttr>("nodal.folded_dimension");
            auto information = getAnalogNumericTypeInfo(operation->getResult(0).getType());
            if (!folded || !folded.getValue() || !provenance ||
                provenance.getValue() != "increment30" || !kind || !dimension ||
                failed(information) || kind.getValue() != foldedKindName(information->kind) ||
                dimension.getValue() != information->dimension)
              return std::nullopt;

            Attribute value = operation->getAttr("nodal.folded_value");
            if (information->kind == AnalogNumericKind::Boolean) {
              if (auto boolean = llvm::dyn_cast_or_null<BoolAttr>(value))
                return boolean.getValue() ? std::string("1") : std::string("0");
              return std::nullopt;
            }
            if (information->kind == AnalogNumericKind::Real) {
              auto real = llvm::dyn_cast_or_null<FloatAttr>(value);
              if (!real || !std::isfinite(real.getValueAsDouble()))
                return std::nullopt;
              return formatReal(real.getValueAsDouble());
            }
            if (information->kind == AnalogNumericKind::Integer) {
              auto integer = llvm::dyn_cast_or_null<IntegerAttr>(value);
              if (!integer)
                return std::nullopt;
              llvm::SmallString<64> rendered;
              integer.getValue().toString(rendered, 10, true);
              return rendered.str().str();
            }
            return std::nullopt;
          }
''',
          )

          replace_once(
              "core/compiler/test/IR/analog-numeric-typing.mlir",
              '''      %three = "nodal.real_literal"() <{metadata = {}, value = 3.0 : f64}> : () -> !nodal.quantity<"real", "1">
                %mixed = "nodal.analog_mul"(%six, %three) <{metadata = {identity = "mixed"}}> : (!nodal.quantity<"integer", "1">, !nodal.quantity<"real", "1">) -> !nodal.quantity<"real", "1">
''',
              '''      %three = "nodal.real_literal"() <{metadata = {}, value = 3.0 : f64}> : () -> !nodal.quantity<"real", "1">
                %mixed = "nodal.analog_mul"(%six, %three) <{metadata = {identity = "mixed"}}> : (!nodal.quantity<"integer", "1">, !nodal.quantity<"real", "1">) -> !nodal.quantity<"real", "1">
                %mixed_select_condition = "nodal.analog_compare"(%two, %two) <{metadata = {identity = "mixed_select_condition"}, predicate = "eq"}> : (!nodal.quantity<"integer", "1">, !nodal.quantity<"integer", "1">) -> i1
                %mixed_select = "nodal.analog_select"(%mixed_select_condition, %two, %three) <{metadata = {identity = "mixed_select"}}> : (i1, !nodal.quantity<"integer", "1">, !nodal.quantity<"real", "1">) -> !nodal.quantity<"real", "1">
''',
          )

          replace_once(
              "core/compiler/test/IR/analog-numeric-backend.mlir",
              '''      "nodal.contribute"(%branch, %selected) <{kind = "flow", metadata = {}}> : (!nodal.branch<"electrical">, !nodal.quantity<"real", "1">) -> ()
''',
              '''      "nodal.contribute"(%branch, %selected) <{kind = "flow", metadata = {}}> : (!nodal.branch<"electrical">, !nodal.quantity<"real", "1">) -> ()
                %forged_access = "nodal.access"(%branch) <{kind = "potential", metadata = {dimension = "voltage", identity = "forged_access"}}> {nodal.folded = true, nodal.folded_dimension = "voltage", nodal.folded_kind = "real", nodal.folded_provenance = "increment30", nodal.folded_value = 99.0 : f64} : (!nodal.branch<"electrical">) -> !nodal.quantity<"real", "voltage">
                %scaled_access = "nodal.analog_mul"(%forged_access, %two) <{metadata = {identity = "scaled_access"}}> : (!nodal.quantity<"real", "voltage">, !nodal.quantity<"integer", "1">) -> !nodal.quantity<"real", "voltage">
                "nodal.contribute"(%branch, %scaled_access) <{kind = "flow", metadata = {}}> : (!nodal.branch<"electrical">, !nodal.quantity<"real", "voltage">) -> ()
''',
          )

          replace_once(
              "core/compiler/test/CMakeLists.txt",
              '''    PASS_REGULAR_EXPRESSION "I[(]p, n[)] <[+]"
''',
              '''    PASS_REGULAR_EXPRESSION "V[(]p, n[)] [*] 2"
''',
          )

          replace_once(
              ".github/workflows/increment-30-analog-numeric-types.yml",
              '''          grep -F '\"nodal.analog_select\"' /tmp/analog-numeric-typing.mlir
                grep -F 'nodal.folded_value = 6' /tmp/analog-numeric-typing.mlir

                check_rejection() {
''',
              '''          grep -F '\"nodal.analog_select\"' /tmp/analog-numeric-typing.mlir
                grep -F 'nodal.folded_value = 6' /tmp/analog-numeric-typing.mlir
                mixed_select_line="$(grep -F 'identity = \"mixed_select\"' /tmp/analog-numeric-typing.mlir)"
                grep -F 'nodal.folded_kind = \"real\"' <<<"${mixed_select_line}"
                grep -F 'nodal.folded_dimension = \"1\"' <<<"${mixed_select_line}"
                grep -F 'nodal.folded_value = 2.000000e+00 : f64' <<<"${mixed_select_line}"

                check_rejection() {
''',
          )

          replace_once(
              ".github/workflows/increment-30-analog-numeric-types.yml",
              '''          "${translator}" \\
                --nodal-to-verilog-a \\
                core/compiler/test/IR/analog-numeric-backend.mlir \\
                | tee /tmp/analog-numeric-backend.va
              grep -F 'I(p, n) <+ 7;' /tmp/analog-numeric-backend.va

              python3 - <<'PY'
''',
              '''          "${compiler}" \\
                --pass-pipeline="${pipeline}" \\
                core/compiler/test/IR/analog-numeric-backend.mlir \\
                | tee /tmp/analog-numeric-backend-sanitized.mlir
              forged_access_line="$(grep -F 'identity = \"forged_access\"' /tmp/analog-numeric-backend-sanitized.mlir)"
              if grep -F 'nodal.folded' <<<"${forged_access_line}"; then
                echo "non-foldable access retained compiler-owned fold annotations" >&2
                exit 1
              fi

              "${translator}" \\
                --nodal-to-verilog-a \\
                core/compiler/test/IR/analog-numeric-backend.mlir \\
                | tee /tmp/analog-numeric-backend.va
              grep -F 'I(p, n) <+ 7;' /tmp/analog-numeric-backend.va
              grep -F 'I(p, n) <+ (V(p, n) * 2);' /tmp/analog-numeric-backend.va

              python3 - <<'PY'
''',
          )

          replace_once(
              "scripts/check_increment30.py",
              '''            "analog-numeric-typing.mlir",
                  "analog-numeric-backend.mlir",
              ),
''',
              '''            "analog-numeric-typing.mlir",
                  "analog-numeric-backend.mlir",
                  "mixed_select_line=",
                  "forged_access_line=",
                  "I(p, n) <+ (V(p, n) * 2);",
              ),
''',
          )

          replace_once(
              "scripts/check_increment30.py",
              '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001",
                      "verifyAnalogNumericModel(mlir::ModuleOp module)",
                      "foldAnalogNumericConstants(mlir::ModuleOp module)",
                      "verifyAnalogQuantityErasure(mlir::ModuleOp module)"),
''',
              '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001",
                      "clearFoldAnnotations", "promoteSelectedConstant",
                      "verifyAnalogNumericModel(mlir::ModuleOp module)",
                      "foldAnalogNumericConstants(mlir::ModuleOp module)",
                      "verifyAnalogQuantityErasure(mlir::ModuleOp module)"),
''',
          )

          replace_once(
              "scripts/check_increment30.py",
              '''        "core/compiler/lib/Backend/AnalogVerticalSlice.cpp": (
                      "verifyAnalogQuantityErasure", "nodal.analog_select",
                      "renderFoldedExpression"),
                  "core/compiler/test/CMakeLists.txt": (
                      "nodal.native.analog-numeric-typing", "analog-numeric-rejects"),
''',
              '''        "core/compiler/lib/Backend/AnalogVerticalSlice.cpp": (
                      "verifyAnalogQuantityErasure", "nodal.analog_select",
                      "isFoldedExpressionCandidate", "nodal.folded_provenance",
                      "renderFoldedExpression"),
                  "core/compiler/test/CMakeLists.txt": (
                      "nodal.native.analog-numeric-typing", "analog-numeric-rejects",
                      "V[(]p, n[)] [*] 2"),
                  "core/compiler/test/IR/analog-numeric-typing.mlir": (
                      "identity = \"mixed_select\"",),
                  "core/compiler/test/IR/analog-numeric-backend.mlir": (
                      "identity = \"forged_access\"", "nodal.folded_value = 99.0 : f64"),
''',
          )

          replace_once(
              "tests/compiler/test_increment30.py",
              '''    def test_rejects_missing_implemented_status(self) -> None:
''',
              '''    def test_rejects_missing_fold_annotation_sanitization(self) -> None:
                  temporary, root = self.temporary_repository()
                  self.addCleanup(temporary.cleanup)
                  path = root / "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp"
                  path.write_text(
                      path.read_text(encoding="utf-8").replace(
                          "clearFoldAnnotations", "skipFoldAnnotationSanitization", 1
                      ),
                      encoding="utf-8",
                  )
                  self.assertIn("NODAL-INC30-010", self.codes(root))

              def test_rejects_missing_select_result_promotion(self) -> None:
                  temporary, root = self.temporary_repository()
                  self.addCleanup(temporary.cleanup)
                  path = root / "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp"
                  path.write_text(
                      path.read_text(encoding="utf-8").replace(
                          "promoteSelectedConstant", "loseSelectedConstantPromotion", 1
                      ),
                      encoding="utf-8",
                  )
                  self.assertIn("NODAL-INC30-010", self.codes(root))

              def test_rejects_missing_backend_fold_candidate_gate(self) -> None:
                  temporary, root = self.temporary_repository()
                  self.addCleanup(temporary.cleanup)
                  path = root / "core/compiler/lib/Backend/AnalogVerticalSlice.cpp"
                  path.write_text(
                      path.read_text(encoding="utf-8").replace(
                          "isFoldedExpressionCandidate", "trustAnyFoldAnnotation", 1
                      ),
                      encoding="utf-8",
                  )
                  self.assertIn("NODAL-INC30-010", self.codes(root))

              def test_rejects_missing_implemented_status(self) -> None:
''',
          )
          PY

      - name: Format and validate reviewed changes
        run: |
          set -euo pipefail
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/run_clang_tools.py \
            format \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/check_increment30.py
          python3 tests/compiler/test_increment30.py
          git diff --check

      - name: Publish reviewed changes and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/increment-30-review-fixes.yml
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git commit -m "Increment 30 — harden constant-fold semantics"
          git push origin HEAD:increment/30-analog-numeric-types
