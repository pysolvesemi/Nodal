name: Increment 37 Lowering Candidate
on:
  push:
    branches: [increment/37-lowering-validation]
    paths: ['.github/workflows/increment-37-lowering-workspace.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Apply exact hash-checked candidate
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          chunks = ['bcc9728521ed831cc462020323f45e81187e94fd', '2077ad4461ed7f12bc93d4f728b8355041fe1665', 'f559fed1f8ebdba179d0f08990f5a593ec96f4be']
          data = b''.join(base64.b64decode(json.loads(subprocess.check_output(['gh', 'api', f'repos/pysolvesemi/Nodal/git/blobs/{sha}']))['content']) for sha in chunks)
          patch = lzma.decompress(data)
          assert len(patch) == 79642 and hashlib.sha256(patch).hexdigest() == '91ef9cc7e45f1d99515aee699b6116e19237856943e80dacb3b8644e3ec25913'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          pathlib.Path('.github/workflows/increment-37-lowering-workspace.yml').unlink()
          PY
      - name: Format and validate candidate
        if: steps.apply.outcome == 'success'
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lowering-candidate'
          out.mkdir()
          native = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native'
          lint = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lint'
          results = {}
          def run(label, args):
              print('::group::' + label, flush=True)
              with (out / (label + '.log')).open('w') as log:
                  proc = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in proc.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  results[label] = proc.wait()
              (out / 'results.json').write_text(json.dumps(results, indent=2))
              print('::endgroup::', flush=True)
          run('lint-bootstrap', ['./nodal', 'style', 'bootstrap', '--prefix', str(lint)])
          run('scalafmt', ['./mill', '-i', 'mill.scalalib.scalafmt/reformatAll'])
          run('scalafix', ['./mill', '-i', 'scalafix.fix'])
          run('clang-format', ['python3', 'scripts/run_clang_tools.py', 'format', '--fix', '--toolchain', str(lint)])
          run('scala', ['./nodal', 'core', 'scala'])
          run('python', ['python3', '-m', 'unittest', 'discover', '-s', 'tests/compiler', '-p', 'test_*.py'])
          run('native-bootstrap', ['./nodal', 'bootstrap', '--mode', 'prebuilt', '--prefix', str(native)])
          run('native', ['./nodal', 'core', 'native', '--toolchain', str(native), '--lint-toolchain', str(lint)])
          source = out / 'increment37-source.mlir'
          run('source', ['./mill', '-i', 'core.scala.testkit.test.runMain', 'nodal.internal.testkit.Increment37MlirCheck', str(source)])
          compilers = [p for p in pathlib.Path('out').rglob('nodalc') if p.is_file() and os.access(p, os.X_OK)]
          translators = [p for p in pathlib.Path('out').rglob('nodal-translate') if p.is_file() and os.access(p, os.X_OK)]
          if compilers and translators:
              args = ['python3', 'tests/compiler/fixtures/increment37/run_native_matrix.py', '--nodalc', str(compilers[0].resolve()), '--translate', str(translators[0].resolve())]
              if source.exists(): args += ['--source', str(source)]
              run('matrix', args)
              for item in out.glob('*.mlir'):
                  proc = subprocess.run([str(translators[0].resolve()), '--nodal-to-verilog-a', str(item)], text=True, capture_output=True)
                  (out / (item.name + '.va')).write_text(proc.stdout)
                  (out / (item.name + '.stderr')).write_text(proc.stderr)
                  results[item.name] = proc.returncode
              (out / 'results.json').write_text(json.dumps(results, indent=2))
          run('style', ['./nodal', 'style', 'check', '--lint-toolchain', str(lint)])
          run('markdown', ['python3', 'scripts/check_markdown.py'])
          run('whitespace', ['git', 'diff', '--check'])
          PY
      - name: Retain exact source and native tool artifacts
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess, tarfile, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lowering-candidate'
          out.mkdir(exist_ok=True)
          def git(*args): return subprocess.check_output(['git', *args])
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = git('write-tree').decode().strip()
          (out / 'candidate.tar.gz').write_bytes(git('archive', '--format=tar.gz', tree))
          (out / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary'))
          entries, workflows = [], []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw: continue
              name = raw.decode()
              path = pathlib.Path(name)
              item = {'path': name, 'type': 'blob', 'mode': '100755' if path.exists() and os.access(path, os.X_OK) else '100644'}
              if path.exists(): item['content'] = path.read_text()
              else: item['sha'] = None
              (workflows if name.startswith('.github/workflows/') else entries).append(item)
          (out / 'workflow-entries.json').write_text(json.dumps(workflows, indent=2))
          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}).encode()
          req = urllib.request.Request('https://api.github.com/repos/pysolvesemi/Nodal/git/trees', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response: result = json.load(response)
          (out / 'candidate.json').write_text(json.dumps({'source_tree_sha': result['sha'], 'validated_tree_sha': tree, 'parent': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID']}, indent=2))
          kit = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-kit'
          kit.mkdir(exist_ok=True)
          for binary in pathlib.Path('out').rglob('*'):
              if binary.name not in ['nodalc', 'nodal-translate'] or not binary.is_file() or not os.access(binary, os.X_OK): continue
              shutil.copy2(binary, kit / binary.name)
              for name in re.findall(r'(/[^\s()]+)', subprocess.check_output(['ldd', str(binary)], text=True)):
                  dep = pathlib.Path(name)
                  if dep.is_file(): shutil.copy2(dep, kit / dep.name)
          if list(kit.iterdir()):
              with tarfile.open(out / 'native-kit.tar.gz', 'w:gz') as archive: archive.add(kit, arcname='native-kit')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment37-lowering-candidate
          path: ${{ runner.temp }}/lowering-candidate
          retention-days: 3
      - name: Enforce all executed gates
        if: always() && steps.apply.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'lowering-candidate/results.json').read_text())
          print(json.dumps(result, indent=2))
          assert result and all(value == 0 for value in result.values()), 'Candidate is not accepted'
          PY
