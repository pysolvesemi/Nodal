name: Increment 31 Native Implementation Agent

on:
  push:
    branches:
      - increment/31-potential-flow-access

permissions:
  contents: write

concurrency:
  group: increment-31-native-agent
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Increment 31 native implementation
        run: |
          python3 scripts/_increment31_native_agent.py
          rm -f scripts/_increment31_payload_*.txt

      - name: Bootstrap locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format Increment 31 C++ sources
        run: |
          format="$(find "${RUNNER_TEMP}/nodal-lint-toolchain" -type f -name clang-format | head -1)"
          test -n "${format}"
          "${format}" -i \
            core/compiler/include/nodal/Dialect/Nodal/PotentialFlowAccess.h \
            core/compiler/lib/Dialect/Nodal/PotentialFlowAccess.cpp \
            core/compiler/lib/Dialect/Nodal/NatureDiscipline.cpp \
            core/compiler/lib/Dialect/Nodal/NodalOps.cpp \
            core/compiler/lib/Backend/AnalogVerticalSlice.cpp

      - name: Validate native compiler implementation
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 31 — implement potential and flow access"
          git push origin HEAD:increment/31-potential-flow-access
