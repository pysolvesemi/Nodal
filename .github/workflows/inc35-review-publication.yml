name: Increment 35 review integration qualification
on:
  push:
    branches: [automation/inc35-review-publication-20260905]
    paths: ['_inc35_review_integrate.py', '.github/workflows/inc35-review-publication.yml']
permissions:
  contents: write
concurrency:
  group: inc35-review-publication
  cancel-in-progress: false
jobs:
  qualify-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge accepted dev without losing the reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          cp _inc35_review_integrate.py "${RUNNER_TEMP}/inc35-review-integrate.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c increment/35-review-hardening 8c7aeb524fb3e427f43148e0acb8a00e2d0eac27
          python3 "${RUNNER_TEMP}/inc35-review-integrate.py"
          git commit -m 'merge(dev): retain Increment 36 closure with Increment 35 review fixes'
          git push origin HEAD:refs/heads/increment/35-review-hardening
          printf 'qualified_integration_head=%s\nqualified_integration_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
