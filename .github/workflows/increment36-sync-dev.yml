name: Increment 36 Integrate Current Dev
on:
  push:
    branches: [automation/increment36-sync-dev-20260905]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: f4eb8593aad5af4ce4898649106344755c0eaed6
      - name: Merge only the inspected histories
        shell: bash
        run: |
          set -euo pipefail
          branch=increment/36-time-waveform-operators-v1
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = f4eb8593aad5af4ce4898649106344755c0eaed6
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = 4d7783e9505d1263e7ff236e07e6ea1392ffceba
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 4d7783e9505d1263e7ff236e07e6ea1392ffceba
          test "$(git write-tree)" = 9930a1ce13983097d9273f427d2f848dd0e7d74f
          python3 scripts/check_increment35.py
          python3 scripts/check_increment36.py
          python3 scripts/check_hvl_roadmap.py
          python3 scripts/test_hvl_roadmap.py
          python3 -m unittest discover -s tests/compiler
          git diff --cached --check
          git commit -m 'Increment 36 — Integrate current dev without changing accepted waveform semantics'
          git push origin HEAD:refs/heads/$branch
          git rev-parse HEAD > /tmp/increment36-integration-head.txt
          git rev-parse HEAD^{tree} >> /tmp/increment36-integration-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: increment36-integration-identity
          path: /tmp/increment36-integration-head.txt
          retention-days: 3
