name: Increment 30 Native Pass Order Fix

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-native-pass-order-fix.yml

permissions:
  contents: write

concurrency:
  group: increment-30-native-pass-order-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Repair pass construction order and remove dead helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          passes_path = Path("core/compiler/lib/Transforms/Passes.cpp")
          passes = passes_path.read_text(encoding="utf-8")

          declaration_anchor = "void addVerifierPasses(OpPassManager &manager, GateProfile profile) {"
          declarations = """std::unique_ptr<Pass> createFoldAnalogConstantsPass();
          std::unique_ptr<Pass> createVerifyAnalogNumericPass();

          """
          if passes.count(declaration_anchor) != 1:
              raise RuntimeError("pass builder anchor is not unique")
          if "createFoldAnalogConstantsPass();" not in passes:
              passes = passes.replace(declaration_anchor, declarations + declaration_anchor, 1)

          replacements = {
              "manager.addPass(std::make_unique<FoldAnalogConstantsPass>());":
                  "manager.addPass(createFoldAnalogConstantsPass());",
              "manager.addPass(std::make_unique<VerifyAnalogNumericPass>());":
                  "manager.addPass(createVerifyAnalogNumericPass());",
          }
          for old, new in replacements.items():
              if passes.count(old) != 1:
                  raise RuntimeError(f"pass construction anchor count is {passes.count(old)} for {old}")
              passes = passes.replace(old, new, 1)

          definition_anchor = "class NormalizePipelinePass final\n"
          definitions = """std::unique_ptr<Pass> createFoldAnalogConstantsPass() {
            return std::make_unique<FoldAnalogConstantsPass>();
          }

          std::unique_ptr<Pass> createVerifyAnalogNumericPass() {
            return std::make_unique<VerifyAnalogNumericPass>();
          }

          """
          if passes.count(definition_anchor) != 1:
              raise RuntimeError("pass factory definition anchor is not unique")
          if "std::unique_ptr<Pass> createFoldAnalogConstantsPass() {" not in passes:
              passes = passes.replace(definition_anchor, definitions + definition_anchor, 1)
          passes_path.write_text(passes, encoding="utf-8")

          numeric_path = Path("core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp")
          numeric = numeric_path.read_text(encoding="utf-8")
          dead_numeric = """llvm::APInt signedExtend(const llvm::APInt &value, unsigned width) {
            return value.sextOrTrunc(std::max(width, value.getBitWidth()));
          }

          """
          if numeric.count(dead_numeric) != 1:
              raise RuntimeError("dead signedExtend helper anchor is not unique")
          numeric_path.write_text(numeric.replace(dead_numeric, "", 1), encoding="utf-8")

          ops_cpp_path = Path("core/compiler/lib/Dialect/Nodal/NodalOps.cpp")
          ops_cpp = ops_cpp_path.read_text(encoding="utf-8")
          dead_ops = """Operation *enclosingSemanticModule(Operation *operation) {
            for (Operation *current = operation; current; current = current->getParentOp()) {
              if (llvm::isa<nodal::ModuleOp>(current))
                return current;
            }
            return nullptr;
          }


          """
          if ops_cpp.count(dead_ops) != 1:
              raise RuntimeError("dead enclosingSemanticModule helper anchor is not unique")
          ops_cpp_path.write_text(ops_cpp.replace(dead_ops, "", 1), encoding="utf-8")

          ops_td_path = Path("core/compiler/include/nodal/Dialect/Nodal/NodalOps.td")
          ops_td = ops_td_path.read_text(encoding="utf-8")
          if ops_td.count("class Nodal_AnalogBinaryOp<string mnemonic, string description>") != 1:
              raise RuntimeError("analog binary class anchor is not unique")
          ops_td = ops_td.replace(
              "class Nodal_AnalogBinaryOp<string mnemonic, string description>",
              "class Nodal_AnalogBinaryOp<string mnemonic, string summaryText>",
              1,
          )
          if ops_td.count("  let summary = description;") != 1:
              raise RuntimeError("analog binary summary anchor is not unique")
          ops_td_path.write_text(
              ops_td.replace("  let summary = description;", "  let summary = summaryText;", 1),
              encoding="utf-8",
          )

          checker_path = Path("scripts/check_increment30.py")
          checker = checker_path.read_text(encoding="utf-8")
          old = """        \"core/compiler/lib/Transforms/Passes.cpp\": (
                      \"nodal-fold-analog-constants\", \"nodal-verify-analog-numeric\"),
          """
          new = """        \"core/compiler/lib/Transforms/Passes.cpp\": (
                      \"nodal-fold-analog-constants\", \"nodal-verify-analog-numeric\",
                      \"createFoldAnalogConstantsPass\", \"createVerifyAnalogNumericPass\"),
          """
          if checker.count(old) != 1:
              raise RuntimeError("Increment 30 pass contract anchor is not unique")
          checker_path.write_text(checker.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Publish native pass-order repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp \
            core/compiler/lib/Dialect/Nodal/NodalOps.cpp \
            core/compiler/include/nodal/Dialect/Nodal/NodalOps.td \
            scripts/check_increment30.py
          git commit -m "Increment 30 — repair native pass construction order"
          git push origin HEAD:increment/30-analog-numeric-types

# Removed through the GitHub connector after publishing the source-only fix.
