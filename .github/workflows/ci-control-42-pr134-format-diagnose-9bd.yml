name: Nodal 42 pinned format diagnosis

on:
  push:
    branches:
      - ci-control/nodal-42-pr134-format-diagnose-9bd-v1
    paths:
      - .github/workflows/ci-control-42-pr134-format-diagnose-9bd.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact source and style
        shell: bash
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/pysolvesemi/Nodal/9bd5db950c7e103bf86807276f7dc0814b1a735b'
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${root}/.clang-format" -o .clang-format
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${root}/core/compiler/lib/Transforms/Passes.cpp" -o Passes.cpp
          printf '%s  %s\n' \
            '561f61439c969d9b5007aa4f1bdc7f30b7f8b431c24841cd22d6cc0eb1c4bb8b' \
            '.clang-format' | sha256sum --check --strict
          printf '%s  %s\n' \
            'fc32a7b70a91dfea76fa3e1a62ab625de3201bcc93140b4dee78db90123a05b2' \
            'Passes.cpp' | sha256sum --check --strict

      - name: Install exact pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps \
            'clang-format==22.1.8'
          clang-format --version

      - name: Materialize exact formatted blob only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          clang-format --style=file Passes.cpp > formatted.cpp
          printf '%s  %s\n' \
            'c5a4e54be5ac8c517fe230d6c98f68cc2e19f4c66759a2d7c7246b51b5933a51' \
            'formatted.cpp' | sha256sum --check --strict
          echo '--- hierarchy region after pinned formatter ---'
          sed -n '375,410p' formatted.cpp
          echo '--- exact diff ---'
          diff -u Passes.cpp formatted.cpp || true
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          payload = json.dumps({
              'content': base64.b64encode(Path('formatted.cpp').read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://api.github.com/repos/pysolvesemi/Nodal/git/blobs',
              data=payload,
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Nodal-42-format-materializer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          expected = '0a5a96eb320e32548a83bccace1d555595f66b11'
          assert result.get('sha') == expected, result
          print('formatted_blob_sha=' + result['sha'])
          PY
