name: Increment 34 Quiesce Obsolete Closure Controllers v2

on:
  push:
    branches:
      - automation/inc34-evidence-closure-controller-v1
    paths:
      - '.github/workflows/_inc34_quiesce_obsolete_closure_v2.yml'

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  quiesce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closure controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-evidence-closure-controller-v1
          path: controller
          fetch-depth: 1

      - name: Cancel all superseded closure controllers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_quiesce_obsolete_closure_v2.sh
