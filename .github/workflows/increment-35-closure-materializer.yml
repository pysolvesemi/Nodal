name: Increment 35 closure materializer

"on":
  push:
    branches:
      - increment/35-evidence-closure-v1
    paths:
      - .github/workflows/increment-35-closure-materializer.yml

permissions:
  contents: write

concurrency:
  group: increment-35-closure-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize closure candidate and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_inc35_closure_materializer.py
          rm scripts/_inc35_closure_materializer.py
          rm .github/workflows/increment-35-closure-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(increment35): materialize evidence-closure candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
