name: Increment 28 P1 Review Fix

on:
  push:
    branches:
      - increment/28-electrical-connectivity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-28-review-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: increment-28/p1-compatible-discipline-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/28-electrical-connectivity
          fetch-depth: 0

      - name: Verify exact repair staging state
        shell: bash
        run: |
          set -euo pipefail
          base=bd41fe1dd87a34211944fb9796fbdfc91027c0bd
          git merge-base --is-ancestor "${base}" HEAD
          unexpected="$({ git diff --name-only "${base}"..HEAD || true; } | grep -Ev '^(scripts/[.]increment28_review_fix[.]py|[.]github/workflows/increment-28-review-fix[.]yml)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "unexpected pre-repair changes:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          count="$(git diff --name-only "${base}"..HEAD | wc -l | tr -d ' ')"
          test "${count}" = "2"
          test -z "$(git status --short)"

      - name: Install locked native and lint toolchains
        shell: bash
        run: |
          set -euo pipefail
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Apply exact P1 semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.increment28_review_fix.py
          python3 scripts/run_clang_tools.py format \
            --fix \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git rm scripts/.increment28_review_fix.py
          git rm .github/workflows/increment-28-review-fix.yml

      - name: Verify final repair scope and formatting
        shell: bash
        run: |
          set -euo pipefail
          base=bd41fe1dd87a34211944fb9796fbdfc91027c0bd
          mapfile -t changed < <(git diff --name-only "${base}")
          test "${#changed[@]}" = "8"
          for path in "${changed[@]}"; do
            case "${path}" in
              core/compiler/lib/Dialect/Nodal/ConservativeConnectivity.cpp|\
              core/compiler/test/IR/electrical-connectivity.mlir|\
              core/compiler/test/Unit/ConservativeConnectivityTest.cpp|\
              docs/design-gates/NodalElectricalConnectivity-DG-v1.0.md|\
              docs/implementation/increment28-electrical-connectivity.md|\
              scripts/check_increment28.py|\
              tests/compiler/fixtures/increment28/manifest.json|\
              tests/compiler/test_increment28.py)
                ;;
              *)
                echo "unexpected review-fix path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          python3 scripts/run_clang_tools.py format \
            --check \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 -m py_compile scripts/check_increment28.py tests/compiler/test_increment28.py
          python3 -m json.tool tests/compiler/fixtures/increment28/manifest.json >/dev/null
          git diff --check

      - name: Validate contracts and mutation tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          for increment in $(seq 18 28); do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover -s tests/compiler -p 'test_*.py'
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev

      - name: Build lint and test native core
        shell: bash
        run: |
          set -euo pipefail
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Prove compatible-discipline normalization and idempotence
        shell: bash
        run: |
          set -euo pipefail
          compiler="${PWD}/out/native/release/bin/nodalc"
          pipeline='builtin.module(nodal-materialize-conservative-connectivity)'
          "${compiler}" \
            --pass-pipeline="${pipeline}" \
            core/compiler/test/IR/electrical-connectivity.mlir \
            | tee /tmp/electrical-connectivity.once.mlir
          "${compiler}" \
            --pass-pipeline="${pipeline}" \
            /tmp/electrical-connectivity.once.mlir \
            > /tmp/electrical-connectivity.twice.mlir
          cmp /tmp/electrical-connectivity.once.mlir /tmp/electrical-connectivity.twice.mlir
          grep -F 'sym_name = "electrical_equivalent"' /tmp/electrical-connectivity.once.mlir
          grep -F 'discipline = @electrical' /tmp/electrical-connectivity.once.mlir
          grep -F 'global::electrical' /tmp/electrical-connectivity.once.mlir

      - name: Commit and publish P1 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 28 — preserve compatible discipline sets'
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:increment/28-electrical-connectivity
