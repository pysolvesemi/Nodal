name: Nodal 42 PR134 Increment 37 transient retry 7ab7ec0

on:
  push:
    branches:
      - 'ci-control/nodal-42-pr134-7ab7ec0-inc37-429-retry-v1'
    paths:
      - '.github/workflows/ci-control-42-pr134-7ab7ec0-inc37-retry-v1.yml'
      - 'scripts/ci_control/increment42_pr134_7ab7ec0_inc37_retry_v1.py'
      - 'scripts/ci_control/increment42_pr134_7ab7ec0_inc37_retry_v1_inventory.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: nodal-42-pr134-7ab7ec0-inc37-429-retry-v1
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out only the pinned controller commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact source and retry only transient Increment 37
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_control/increment42_pr134_7ab7ec0_inc37_retry_v1.py
      - name: Preserve dispatch intent and observed run ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodal-42-pr134-7ab7ec0-inc37-retry-v1-dispatch-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-evidence/
          if-no-files-found: error
          retention-days: 30
