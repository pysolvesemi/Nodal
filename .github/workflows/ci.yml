name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize_increment114:
    name: materialize Increment 114
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run Increment 114 roadmap materializer'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add completed Increment 114 policy correction
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          roadmap = Path("docs/roadmap/nodal-development-todo.md")
          content = roadmap.read_text(encoding="utf-8")
          marker = "\n\n## Deferred reusable library roadmap\n"
          entry = "\n".join(
              (
                  "- [x] **Increment 114 — Immediate assertion synthesis boundary correction**",
                  "  - Restrict synthesizable assertion logic to an explicitly selected immediate Boolean assertion evaluated combinationally or in one owning clock domain.",
                  "  - Keep concurrent or temporal properties, sampled history, assumptions, covers, symbolic formal values, fairness/liveness declarations, and compiler-generated verification monitors outside synthesizable DUT RTL.",
                  "  - Require synthesized immediate assertions to be observational by default; functional control requires an ordinary explicit design connection.",
                  "  - Synchronize ADR 0014, the formal-verification plan/surface, the digital Verilog verification plan, the digital-backend surface, and roadmap revision 1.13. Keep exact public spelling and implementation deferred to Increments 109-110.",
                  "  - Evidence: [`0014-target-neutral-formal-verification.md`](../architecture/0014-target-neutral-formal-verification.md), [`formal-verification-v0.1-plan.md`](formal-verification-v0.1-plan.md), [`formal-verification-v0.1-surface.json`](formal-verification-v0.1-surface.json), [`digital-verilog-open-source-verification-plan.md`](digital-verilog-open-source-verification-plan.md), and [`digital-backend-v0.3-surface.json`](digital-backend-v0.3-surface.json).",
                  "",
              )
          )
          if entry.strip() not in content:
              if content.count(marker) != 1:
                  raise SystemExit("deferred library roadmap marker is ambiguous")
              content = content.replace(marker, "\n" + entry + marker, 1)
          old_library_scope = (
              "No official reusable model/component library or production plugin "
              "is implemented by Increments 0-113."
          )
          new_library_scope = (
              "No official reusable model/component library or production plugin "
              "is implemented by Increments 0-114."
          )
          if old_library_scope in content:
              content = content.replace(old_library_scope, new_library_scope, 1)
          roadmap.write_text(content, encoding="utf-8")

          plan = Path("docs/roadmap/formal-verification-v0.1-plan.md")
          plan_content = plan.read_text(encoding="utf-8")
          plan_marker = "\n## Gate exit criteria\n"
          plan_entry = "\n".join(
              (
                  "### Increment 114 — Immediate assertion synthesis boundary correction",
                  "",
                  "- [x] Narrow synthesis eligibility to explicitly selected immediate Boolean assertions.",
                  "- [x] Make concurrent/temporal properties and all formal environment constructs verification-only.",
                  "- [x] Require observational checker behavior by default and explicit functional connections.",
                  "- [x] Update architecture, roadmap, backend, and machine-readable policy surfaces without implementing the deferred API or lowering.",
                  "",
              )
          )
          if plan_entry.strip() not in plan_content:
              if plan_content.count(plan_marker) != 1:
                  raise SystemExit("formal gate-exit marker is ambiguous")
              plan_content = plan_content.replace(plan_marker, "\n" + plan_entry + plan_marker, 1)
          plan.write_text(plan_content, encoding="utf-8")

          formal_surface_path = Path("docs/roadmap/formal-verification-v0.1-surface.json")
          formal_surface = json.loads(formal_surface_path.read_text(encoding="utf-8"))
          formal_surface["policy_correction_increment"] = 114
          formal_surface_path.write_text(
              json.dumps(formal_surface, indent=2) + "\n",
              encoding="utf-8",
          )

          backend_surface_path = Path("docs/roadmap/digital-backend-v0.3-surface.json")
          backend_surface = json.loads(backend_surface_path.read_text(encoding="utf-8"))
          backend_surface["roadmap_last_increment"] = 114
          backend_surface_path.write_text(
              json.dumps(backend_surface, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool docs/roadmap/formal-verification-v0.1-surface.json >/dev/null
          python3 -m json.tool docs/roadmap/digital-backend-v0.3-surface.json >/dev/null
          python3 scripts/check_increment12.py
          python3 scripts/check_markdown.py
          git diff --check

      - name: Publish Increment 114 source changes
        run: |
          rm .increment114-roadmap-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap .increment114-roadmap-trigger
          git commit -m 'Increment 114 — Record immediate assertion synthesis boundary'
          git push origin HEAD:increment/114-immediate-assertion-synthesis-boundary

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
