name: Automation Increment 20 Repair v2

on:
  push:
    branches:
      - automation/increment-20-complete

permissions:
  contents: write

concurrency:
  group: automation-increment-20-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out automation source
        uses: actions/checkout@v6
        with:
          ref: automation/increment-20-complete
          path: automation

      - name: Check out Increment 20 branch
        uses: actions/checkout@v6
        with:
          ref: increment/20-scala-mlir-bridge
          fetch-depth: 0
          path: target

      - name: Install simplified bridge and snapshot patch
        run: |
          cp automation/automation/increment20-repair/ScalaToMlirBridge.scala \
            target/core/scala/bridge/src/nodal/bridge/ScalaToMlirBridge.scala
          cp automation/automation/increment20-repair/NativeCompilerClientFixed.scala \
            target/core/scala/bridge/src/nodal/bridge/NativeCompilerClient.scala
          cp automation/automation/increment20-repair/ScalaToMlirBridgeTests.scala \
            target/core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala
          python3 automation/automation/increment20-repair/patch_kernel.py target

      - name: Format and validate Scala bridge
        working-directory: target
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          python3 scripts/check_increment20.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          ./nodal core scala
          git diff --check

      - name: Commit validated repair
        working-directory: target
        run: |
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            core/scala/bridge/src/nodal/bridge/ScalaToMlirBridge.scala \
            core/scala/bridge/src/nodal/bridge/NativeCompilerClient.scala \
            core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala
          if git diff --cached --quiet; then
            echo 'Increment 20 repair already present'
          else
            git commit -m 'Increment 20 — complete deterministic Scala-to-MLIR bridge'
            git push origin HEAD:increment/20-scala-mlir-bridge
          fi
