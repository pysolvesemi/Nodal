name: Modelica-Inspired Equation Roadmap Update

on:
  push:
    branches:
      - agent/modelica-equation-roadmap-update

permissions:
  contents: write

concurrency:
  group: modelica-equation-roadmap-update
  cancel-in-progress: false

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/modelica-equation-roadmap-update

      - name: Apply equation-oriented roadmap recommendations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "**Revision:** 1.33",
              "**Revision:** 1.34",
              "roadmap revision",
          )

          replace_once(
              "- Preserve source-semantic analog constructs separately from normalized topology, hybrid equation systems, analysis projections, target AMS IR, and solver-facing representations; no simulator callback ABI or emitted HDL text defines Nodal semantics.\n- Partition continuous behavior into explicit `AnalogIsland`s with stable topology, unknown, equation, contribution, state, event, noise, analysis, capability, and source identities.",
              "- Preserve source-semantic analog constructs separately from normalized topology, hybrid equation systems, analysis projections, target AMS IR, and solver-facing representations; no simulator callback ABI or emitted HDL text defines Nodal semantics.\n- Treat source-level continuous equations as unordered simultaneous constraints. Preserve authored left/right expressions and a canonical solver-neutral residual; do not infer execution order, causal direction, or division-based rearrangement in the frontend.\n- Keep first-class equations, additive potential/flow contributions, procedural analog assignments, and conservative connections as distinct semantic operations with separate ordering, accumulation, ownership, and legality rules.\n- Generate conservative connection equations from terminal connection sets: compatible potentials are equal and signed flows sum to zero, with branch orientation and provenance retained.\n- Support partial and concrete physical-component contracts with local equation/unknown balance checks before whole-design island and DAE verification.\n- Analyze a logically flattened topology/equation view while retaining source hierarchy and emitting hierarchical Verilog-A/Verilog-AMS wherever the selected target permits.\n- Distinguish ordinary parameters, structural parameters, and dynamic values. Topology, component count, equation count, shape, or structural rank may change only through elaboration/static generation or an explicitly capability-gated variable-topology contract.\n- Lower general equations through a capability-checked equation-to-target legalizer that may select a safe potential/flow form, introduce an explicit auxiliary unknown or branch, preserve a target-supported form, or reject the target; never silently approximate or orient an equation merely to emit HDL.\n- Partition continuous behavior into explicit `AnalogIsland`s with stable topology, unknown, equation, contribution, state, event, noise, analysis, capability, and source identities.",
              "fixed equation architecture",
          )

          replace_once(
              "- Preserve analog and mixed-signal terms such as `analog`, `initial`, `on`, `discipline`, `nature`, `V`, `I`, `ddt`, `idt`, `cross`, `timer`, `transition`, and `<+`.\n- Do not copy backend event-process syntax into ordinary synchronous source.",
              "- Preserve analog and mixed-signal terms such as `analog`, `initial`, `on`, `discipline`, `nature`, `V`, `I`, `ddt`, `idt`, `cross`, `timer`, `transition`, and `<+`.\n- Freeze a first-class unordered equation block and explicit equation-construction form while keeping `<+` contribution and procedural assignment visibly distinct.\n- Evaluate `equation(lhs, rhs)` and concise operator candidates through compile prototypes; do not overload `===` unless Boolean equality, type resolution, and diagnostics remain unambiguous.\n- Provide acausal conservative terminal/branch, reusable one-port/two-port, partial/concrete component, initial-equation, state-initialization, and reinitialization candidates in the continuous-time gate.\n- Use Scala traits, abstract classes, factories, and typed interfaces for replaceable model implementations rather than copying Modelica redeclaration syntax.\n- Do not copy backend event-process syntax into ordinary synchronous source.",
              "public equation API direction",
          )

          replace_once(
              "## Phase 2 — Analog language and Verilog-A profile\n\n- [x] **Increment 27 — Natures and disciplines**",
              "## Phase 2 — Analog language and Verilog-A profile\n\n**Phase 2 dependency gate:** Increment 32 must not begin until the equation/component checkpoint of Increment 133 is approved. That checkpoint freezes unordered equation semantics; equation, contribution, and procedural-assignment separation; conservative connection equations; terminal/branch and partial/concrete component contracts; local balance; structural parameters; initialization equations; and unsupported-target behavior. The remaining analysis, PVT, noise, validity, and solver-hint portions of Increment 133 may complete later without weakening this prerequisite.\n\n- [x] **Increment 27 — Natures and disciplines**",
              "phase 2 dependency gate",
          )

          replace_once(
              "- [ ] **Increment 28 — Electrical nodes, nets, and branches**\n  - Implement scalar nodes, ground/reference behavior, implicit/named branches, directions, connectivity, aliases, and ownership.",
              "- [ ] **Increment 28 — Electrical nodes, nets, and branches**\n  - Implement scalar conservative terminals/nodes, ground/reference behavior, implicit/named branches, port directions, aliases, connection-set identity, branch orientation, ownership, and source hierarchy.\n  - Generate compatible-potential equality and signed zero-sum flow-conservation equations from connection sets, retaining provenance for later residual construction and target lowering.\n  - Define partial versus concrete physical-component connectivity ownership without treating conservative terminals as directional signal flow.",
              "increment 28",
          )

          replace_once(
              "- [ ] **Increment 29 — Parameters, constants, ranges, and units**\n  - Implement supported parameter kinds, constraints, constant expressions, overrides, unit-aware literals, and lossless native HDL rendering.",
              "- [ ] **Increment 29 — Parameters, constants, ranges, and units**\n  - Implement supported parameter kinds, constraints, constant expressions, overrides, unit-aware literals, and lossless native HDL rendering.\n  - Classify ordinary parameters, structural parameters, and dynamic values; require topology, component count, equation count, shape, or rank changes to be elaboration-time or static target generation, and diagnose unsupported parameter-envelope structural changes.",
              "increment 29",
          )

          replace_once(
              "- [ ] **Increment 32 — Analog blocks and contribution semantics**\n  - Implement analog regions, `<+`, potential/flow contributions, equation participation, ordering, and illegal procedural use.",
              "- [ ] **Increment 32 — First-class analog equations, blocks, and contribution semantics**\n  - Implement analog regions, unordered first-class equations, and `<+` potential/flow contributions as distinct source-semantic operations; keep both distinct from Increment 33 procedural assignment.\n  - Preserve authored equation sides, stable equation identity, physical dimensions, guards, analysis applicability, and canonical residual intent without premature causal orientation or unsafe algebraic division.\n  - Define additive contribution accumulation, source-order independence, equation/contribution interaction, illegal procedural use, and stable diagnostics.\n  - Require the approved equation/component checkpoint from Increment 133 before implementation begins.",
              "increment 32",
          )

          replace_once(
              "- [ ] **Increment 45 — Analog canonicalization passes**\n  - Implement safe folding, algebraic normalization, dead declaration removal, branch/access normalization, and no contribution reordering.",
              "- [ ] **Increment 45 — Analog canonicalization passes**\n  - Implement safe folding, residual-preserving algebraic normalization, dead declaration removal, branch/access normalization, and deterministic common-expression handling.\n  - Prohibit unproved equation orientation, division by possibly zero expressions, contribution reordering, state movement, topology change, or residual elimination; retain before/after equation provenance.",
              "increment 45",
          )

          replace_once(
              "- [ ] **Increment 46 — Analog semantic lint suite**\n  - Detect floating nodes, discipline conflicts, branch misuse, unit errors, unreachable events, discontinuities, parameter risks, and portability hazards.",
              "- [ ] **Increment 46 — Analog semantic lint suite**\n  - Detect floating nodes, discipline conflicts, branch misuse, unit errors, local/global equation imbalance, structural singularity, unsafe equation orientation or division, invalid structural-parameter envelopes, unreachable events, discontinuities, parameter risks, and portability hazards.",
              "increment 46",
          )

          replace_once(
              "- [ ] **Increment 133 — Analog semantic API and analysis contract design gate**\n  - Compile and compare public candidates for equations/contributions, explicit analog state and initialization, event tolerance and discontinuity declarations, analysis context, environment/PVT access, noise identity/correlation, validity envelopes, and solver-hint metadata.\n  - Publish `NodalContinuousTimeApi-DG-v0.1.md`, a machine-readable public surface, migration notes, stable diagnostics, positive/negative fixtures, and an external reusable-model fixture.\n  - Keep frontend, equation normalization, solver, and backend behavior inert.",
              "- [ ] **Increment 133 — Analog semantic API and analysis contract design gate**\n  - Schedule an equation/component API checkpoint ahead of Increment 32 while retaining the complete continuous-time API gate in this increment.\n  - Compile and compare public candidates for unordered equations, contributions, procedural-assignment distinction, conservative terminals/branches/connections, partial/concrete component balance, structural parameters, initial equations, explicit analog state and reinitialization, event tolerance and discontinuity declarations, analysis context, environment/PVT access, noise identity/correlation, validity envelopes, and solver-hint metadata.\n  - Publish `NodalEquationComponentApi-DG-v0.1.md`, a machine-readable checkpoint surface, migration notes, stable diagnostics, compile-positive/negative fixtures, and one external reusable physical-component fixture. Increment 32 may start only after this checkpoint is accepted.\n  - Publish the complete `NodalContinuousTimeApi-DG-v0.1.md` and machine-readable public surface before closing Increment 133.\n  - Keep frontend, equation normalization, solver, and backend behavior inert throughout the design gate.",
              "increment 133",
          )

          replace_once(
              "- [ ] **Increment 134 — Source-semantic analog IR, `AnalogIsland`, and stable identities**\n  - Implement source-semantic operations for contributions, equations, operators, events, analyses, noise, environment, connect constructs, and solver hints.\n  - Build deterministic islands and stable IDs for topology objects, unknowns, equations, state, events, noise, bridges, and analyses.\n  - Add normalized parse/print, source maps, parameter formulas/envelopes, mutation tests, and semantic manifests.",
              "- [ ] **Increment 134 — Source-semantic analog IR, `AnalogIsland`, and stable identities**\n  - Implement distinct source-semantic operations for equations, contributions, procedural assignments, connections, operators, events, analyses, noise, environment, and solver hints.\n  - Preserve authored equation left/right expressions separately from later residual form and retain terminal, branch, connection-set, component, partial/concrete, local-balance, structural-parameter, hierarchy, dimension, guard, analysis, and source-span metadata.\n  - Build deterministic islands and stable IDs for topology objects, components, unknowns, equations, contributions, state, events, noise, bridges, and analyses.\n  - Add normalized parse/print, source maps, parameter formulas/envelopes, mutation tests, local semantic inventories, and semantic manifests.",
              "increment 134",
          )

          replace_once(
              "- [ ] **Increment 135 — Topology expansion, residual DAE construction, and structural verification**\n  - Expand conservative connections and contribution sets into solver-neutral residual systems while preserving provenance.\n  - Classify continuous, derivative, algebraic, discrete, parameter, environment, and independent variables.\n  - Implement incidence/dependency graphs, structural matching, block decomposition, equation/unknown balance, references, conservation, singularity, algebraic loops, initialization structure, variable-topology classification, and parameter-envelope checks.\n  - Reject unsupported higher-index or variable-structure systems explicitly; do not perform unapproved index reduction.",
              "- [ ] **Increment 135 — Topology expansion, residual DAE construction, and structural verification**\n  - Build a logically flattened hierarchy/topology/equation view for analysis without requiring flattened target emission.\n  - Expand conservative connection sets, first-class equations, and contribution sets into solver-neutral residual systems while preserving authored equation, component, branch, orientation, and hierarchy provenance.\n  - Classify continuous, derivative, algebraic, discrete, parameter, structural-parameter, environment, independent, and input variables.\n  - Implement local component balance plus whole-island incidence/dependency graphs, structural matching, block decomposition, equation/unknown balance, references, conservation, singularity, algebraic loops, initialization structure, variable-topology classification, and parameter-envelope checks.\n  - Keep residual construction independent of target causal orientation; reject unsupported higher-index or variable-structure systems explicitly and do not perform unapproved index reduction.",
              "increment 135",
          )

          replace_once(
              "- [ ] **Increment 141 — Verilog-A/Verilog-AMS and solver-facing lowering parity**\n  - Prove source-semantic, residual/analysis, and target-lowering correspondence for supported constructs.\n  - Emit deterministic state, event, noise, analysis, environment, contribution, and source-map metadata alongside Verilog-A/Verilog-AMS.\n  - Add target reparse, OpenVAF/OSDI where supported, ngspice and mixed-signal adapter differential fixtures, and explicit capability rejection.\n  - Do not claim waveform equivalence as proof for unsupported structural transformations.",
              "- [ ] **Increment 141 — Verilog-A/Verilog-AMS and solver-facing lowering parity**\n  - Prove source-semantic, residual/analysis, and target-lowering correspondence for supported constructs.\n  - Implement a capability-checked equation-to-target legalizer that selects direct potential/flow contributions only after dimension, singularity, parameter-envelope, state/event, analysis, numerical-conditioning, and target-capability checks; otherwise introduce explicit auxiliary branches/unknowns where legal or reject the target.\n  - Preserve source module hierarchy where legal while using the logically flattened view only for analysis and proof.\n  - Emit deterministic state, event, noise, analysis, environment, contribution, source-map, and per-equation legalization metadata, including source equation, residual, selected target form, reason, introduced objects, and target location.\n  - Add target reparse, OpenVAF/OSDI where supported, ngspice and mixed-signal adapter differential fixtures, and explicit capability rejection.\n  - Do not claim waveform equivalence as proof for unsupported structural transformations.",
              "increment 141",
          )

          replace_once(
              "\n## Phase 10 — Foundation comments, FPGA-readiness, and HVL verification-readiness",
              "\n### Optional analog component-library track\n\nThis dependent track begins only after the Increment 133 equation/component checkpoint and the relevant Increments 134-142 contracts. It lives under `libraries/`, uses only public Nodal contracts, and never becomes a dependency of `core/`.\n\n- [ ] **Library Increment AL-01 — Physical-component interfaces and analog-basic pilot**\n  - Define public one-port/two-port, source/load, ground/reference, partial/concrete balance, factory/replacement, parameter-validity, and model-validity conventions.\n  - Implement and qualify resistor, capacitor, inductor, ideal sources, controlled sources, and switch components with units, legal parameter ranges, local balance, generated-HDL goldens, and applicable DC/transient/AC evidence.\n\n- [ ] **Library Increment AL-02 — Electrothermal composition pilot**\n  - Add thermal terminal/nature/discipline use, thermal capacitance and conductance, power-to-heat coupling, a temperature-dependent resistor, and electrothermal RC examples.\n  - Prove electrical-only and coupled models reuse the same conservative connector/equation architecture and reject dimension, balance, PVT, and validity-envelope failures.\n\n- [ ] **Library Increment AL-03 — Library portability, reuse, and release qualification**\n  - Add parameter matrices, hierarchy and repeated-instance tests, source-to-HDL traceability, cross-simulator capability reports, semantic versioning, compatibility metadata, and package/release evidence.\n  - Keep Modelica-style stream connectors, fluid mixing, full redeclaration semantics, automatic high-index DAE reduction, and production compact-model coverage deferred.\n\n## Phase 10 — Foundation comments, FPGA-readiness, and HVL verification-readiness",
              "optional analog library track",
          )

          required = [
              "**Revision:** 1.34",
              "Phase 2 dependency gate",
              "First-class analog equations, blocks, and contribution semantics",
              "NodalEquationComponentApi-DG-v0.1.md",
              "equation-to-target legalizer",
              "Library Increment AL-01",
              "Library Increment AL-03",
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError(f"required marker missing: {marker}")

          path.write_text(text, encoding="utf-8")
          PY

          python3 scripts/check_markdown.py
          git diff --check

      - name: Commit roadmap update and remove temporary workflow
        run: |
          rm -f .github/workflows/modelica-equation-roadmap-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: strengthen equation-oriented AMS roadmap"
          git pull --rebase origin agent/modelica-equation-roadmap-update
          git push origin HEAD:agent/modelica-equation-roadmap-update
