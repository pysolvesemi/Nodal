name: Debug Scalafmt

on:
  push:
    branches:
      - increment/9-formatting-linting-contribution-rules

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Print canonical Scalafmt diff
        shell: bash
        run: |
          ./mill mill.scalalib.scalafmt/formatAll
          git diff -- core/scala/sim/src/nodal/bootstrap/sim/SimulationPlan.scala
