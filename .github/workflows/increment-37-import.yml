name: Increment 37 Candidate Validation

on:
  push:
    branches: [increment/37-analog-events]
    paths:
      - '.github/workflows/increment-37-import.yml'
      - '.github/increment37-workspace/**'

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/increment/37-analog-events'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Import hash-checked source patch and remove transport helpers
        id: import
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          root = pathlib.Path('.github/increment37-workspace')
          encoded = ''.join((root / f'patch.{i}').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 105341
          assert hashlib.sha256(patch).hexdigest() == 'cd428cca3cd81fa09b87e23055e1c39141edbc743113cf4ef7101bc88ca15728'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'implementation.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          shutil.rmtree(root)
          for name in ['increment-37-workspace.yml', 'increment-37-import.yml']:
              pathlib.Path('.github/workflows', name).unlink()
          PY
      - name: Format, build, and execute candidate contracts
        id: validate
        if: steps.import.outcome == 'success'
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate'
          output.mkdir()
          lint = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nodal-lint-toolchain'
          native = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nodal-native-toolchain'
          results = {}
          def run(label, args):
              print(f'::group::{label}', flush=True)
              with (output / f'{label}.log').open('w') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  code = process.wait()
              results[label] = code
              (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              print(f'::endgroup::\n{label}: exit {code}', flush=True)
              return code
          run('lint-bootstrap', ['./nodal', 'style', 'bootstrap', '--prefix', str(lint)])
          run('scalafmt', ['./mill', '-i', 'mill.scalalib.scalafmt/reformatAll'])
          run('scalafix', ['./mill', '-i', 'scalafix.fix'])
          run('clang-format', ['python3', 'scripts/run_clang_tools.py', 'format', '--fix', '--toolchain', str(lint)])
          run('scala', ['./nodal', 'core', 'scala'])
          run('python', ['python3', '-m', 'unittest', 'discover', '-s', 'tests/compiler', '-p', 'test_*.py'])
          run('native-bootstrap', ['./nodal', 'bootstrap', '--mode', 'prebuilt', '--prefix', str(native)])
          run('native', ['./nodal', 'core', 'native', '--toolchain', str(native), '--lint-toolchain', str(lint)])
          source = output / 'increment37-source.mlir'
          run('source', ['./mill', '-i', 'core.scala.testkit.test.runMain', 'nodal.internal.testkit.Increment37MlirCheck', str(source)])
          compilers = [p for p in pathlib.Path('out').rglob('nodalc') if p.is_file() and os.access(p, os.X_OK)]
          translators = [p for p in pathlib.Path('out').rglob('nodal-translate') if p.is_file() and os.access(p, os.X_OK)]
          if compilers and translators:
              args = ['python3', 'tests/compiler/fixtures/increment37/run_native_matrix.py', '--nodalc', str(compilers[0].resolve()), '--translate', str(translators[0].resolve())]
              if source.exists():
                  args += ['--source', str(source)]
              run('event-matrix', args)
          run('markdown', ['python3', 'scripts/check_markdown.py'])
          run('whitespace', ['git', 'diff', '--check'])
          PY
      - name: Retain formatted source tree without changing any branch
        if: always() && steps.import.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate'
          output.mkdir(exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args])
          subprocess.run(['git', 'add', '-A'], check=True)
          head = git('rev-parse', 'HEAD').decode().strip()
          tree = git('write-tree').decode().strip()
          (output / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary'))
          (output / 'candidate.tar.gz').write_bytes(git('archive', '--format=tar.gz', tree))
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              path = pathlib.Path(name)
              entry = {'path': name, 'mode': '100755' if path.exists() and os.access(path, os.X_OK) else '100644', 'type': 'blob'}
              if path.exists():
                  entry['content'] = path.read_text()
              else:
                  entry['sha'] = None
              entries.append(entry)
          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}).encode()
          request = urllib.request.Request('https://api.github.com/repos/pysolvesemi/Nodal/git/trees', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          record = {'parent_sha': head, 'tree_sha': result['sha'], 'local_tree_sha': tree, 'run_id': os.environ['GITHUB_RUN_ID']}
          (output / 'candidate.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          assert result['sha'] == tree, 'Published tree must exactly match validated candidate'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment37-candidate
          path: ${{ runner.temp }}/increment37-candidate
          retention-days: 3
      - name: Report candidate validation result
        if: always() && steps.import.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          results = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate/results.json').read_text())
          print(json.dumps(results, indent=2))
          assert results and all(value == 0 for value in results.values()), 'Candidate has outstanding failures; do not merge'
          PY
