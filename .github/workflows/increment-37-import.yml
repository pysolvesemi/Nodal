name: Increment 37 Candidate Validation

on:
  push:
    branches: [increment/37-analog-events]
    paths:
      - '.github/workflows/increment-37-import.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/increment/37-analog-events'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Import hash-checked source and review patches
        id: import
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          root = pathlib.Path('.github/increment37-workspace')
          patches = [
              (''.join((root / f'patch.{i}').read_text().strip() for i in range(1, 5)), 105341, 'cd428cca3cd81fa09b87e23055e1c39141edbc743113cf4ef7101bc88ca15728'),
              ((root / 'review.xz.b64').read_text().strip(), 14136, '908324b447e09bc4ee3b3a784183929daa3e8d4e28719a969d89423c8839e273'),
          ]
          for index, (encoded, size, digest) in enumerate(patches):
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              assert len(patch) == size and hashlib.sha256(patch).hexdigest() == digest
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / f'implementation-{index}.patch'
              target.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', str(target)], check=True)
              subprocess.run(['git', 'apply', str(target)], check=True)
          correction = lzma.decompress(base64.b64decode((root / 'review2.xz.b64').read_text().strip(), validate=True))
          assert len(correction) == 3548 and hashlib.sha256(correction).hexdigest() == 'faa8b30c3d35e609d0ba23f4d0f0699c1a6c15b90aac7397c93dfa1e2b9663be'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'review2.patch').write_bytes(correction)
          shutil.rmtree(root)
          for name in ['increment-37-workspace.yml', 'increment-37-import.yml']:
              pathlib.Path('.github/workflows', name).unlink()
          PY
      - name: Format, build, and execute candidate contracts
        id: validate
        if: steps.import.outcome == 'success'
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate'
          output.mkdir()
          lint = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nodal-lint-toolchain'
          native = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nodal-native-toolchain'
          results = {}
          def run(label, args):
              print(f'::group::{label}', flush=True)
              with (output / f'{label}.log').open('w') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  code = process.wait()
              results[label] = code
              (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              print(f'::endgroup::\n{label}: exit {code}', flush=True)
              return code
          run('lint-bootstrap', ['./nodal', 'style', 'bootstrap', '--prefix', str(lint)])
          run('scalafmt', ['./mill', '-i', 'mill.scalalib.scalafmt/reformatAll'])
          run('scalafix', ['./mill', '-i', 'scalafix.fix'])
          run('clang-format', ['python3', 'scripts/run_clang_tools.py', 'format', '--fix', '--toolchain', str(lint)])
          correction = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'review2.patch')
          subprocess.run(['git', 'apply', '--check', correction], check=True)
          subprocess.run(['git', 'apply', correction], check=True)
          run('corrected-scalafmt', ['./mill', '-i', 'mill.scalalib.scalafmt/reformatAll'])
          run('corrected-scalafix', ['./mill', '-i', 'scalafix.fix'])
          run('policy', ['python3', 'scripts/check_increment37.py'])
          run('scala', ['./nodal', 'core', 'scala'])
          run('python', ['python3', '-m', 'unittest', 'discover', '-s', 'tests/compiler', '-p', 'test_*.py'])
          run('native-bootstrap', ['./nodal', 'bootstrap', '--mode', 'prebuilt', '--prefix', str(native)])
          run('native', ['./nodal', 'core', 'native', '--toolchain', str(native), '--lint-toolchain', str(lint)])
          source = output / 'increment37-source.mlir'
          run('source', ['./mill', '-i', 'core.scala.testkit.test.runMain', 'nodal.internal.testkit.Increment37MlirCheck', str(source)])
          compilers = [p for p in pathlib.Path('out').rglob('nodalc') if p.is_file() and os.access(p, os.X_OK)]
          translators = [p for p in pathlib.Path('out').rglob('nodal-translate') if p.is_file() and os.access(p, os.X_OK)]
          if compilers and translators and source.exists():
              run('event-matrix', ['python3', 'tests/compiler/fixtures/increment37/run_native_matrix.py', '--nodalc', str(compilers[0].resolve()), '--translate', str(translators[0].resolve()), '--source', str(source)])
          else:
              results['event-matrix'] = 99
              (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          run('style', ['./nodal', 'style', 'check', '--lint-toolchain', str(lint)])
          run('markdown', ['python3', 'scripts/check_markdown.py'])
          run('whitespace', ['git', 'diff', '--check'])
          PY
      - name: Retain source tree without changing branches
        if: always() && steps.import.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request, urllib.error
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate'
          output.mkdir(exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args])
          subprocess.run(['git', 'add', '-A'], check=True)
          head = git('rev-parse', 'HEAD').decode().strip()
          tree = git('write-tree').decode().strip()
          (output / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary'))
          (output / 'candidate.tar.gz').write_bytes(git('archive', '--format=tar.gz', tree))
          entries, workflows = [], []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              path = pathlib.Path(name)
              entry = {'path': name, 'mode': '100755' if path.exists() and os.access(path, os.X_OK) else '100644', 'type': 'blob'}
              if path.exists():
                  entry['content'] = path.read_text()
              else:
                  entry['sha'] = None
              if name.startswith('.github/workflows/'):
                  workflows.append(entry)
              else:
                  entries.append(entry)
          (output / 'workflow-entries.json').write_text(json.dumps(workflows, indent=2) + '\n')
          record = {'parent_sha': head, 'validated_tree_sha': tree, 'run_id': os.environ['GITHUB_RUN_ID']}
          (output / 'candidate.json').write_text(json.dumps(record, indent=2) + '\n')
          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}).encode()
          request = urllib.request.Request('https://api.github.com/repos/pysolvesemi/Nodal/git/trees', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print(error.read().decode())
              raise
          record['source_tree_sha'] = result['sha']
          (output / 'candidate.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          PY
      - name: Retain exact compiler and shared libraries for offline diagnosis
        if: always() && steps.import.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate'
          kit = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-native-kit'
          kit.mkdir(exist_ok=True)
          binaries = [p for p in pathlib.Path('out').rglob('*') if p.name in ['nodalc', 'nodal-translate'] and p.is_file() and os.access(p, os.X_OK)]
          for binary in binaries:
              shutil.copy2(binary, kit / binary.name)
              deps = subprocess.check_output(['ldd', str(binary)], text=True)
              for path in re.findall(r'(/[^\s()]+)', deps):
                  source = pathlib.Path(path)
                  if source.is_file():
                      shutil.copy2(source, kit / source.name)
          if binaries:
              with tarfile.open(out / 'native-kit.tar.gz', 'w:gz') as archive:
                  archive.add(kit, arcname='native-kit')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment37-candidate
          path: ${{ runner.temp }}/increment37-candidate
          retention-days: 3
      - name: Report candidate validation result
        if: always() && steps.import.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          results = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-candidate/results.json').read_text())
          print(json.dumps(results, indent=2))
          required = {'policy', 'scala', 'python', 'native', 'source', 'event-matrix', 'style', 'markdown', 'whitespace', 'corrected-scalafmt', 'corrected-scalafix'}
          assert required <= results.keys() and all(value == 0 for value in results.values()), 'Candidate has outstanding failures; do not merge'
          PY
