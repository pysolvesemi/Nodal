name: Increment 33 compiler IR materializer v3

on:
  push:
    branches:
      - automation/inc33-compiler-ir-materializer-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out materializer branch
        uses: actions/checkout@v6
        with:
          ref: automation/inc33-compiler-ir-materializer-20260831
          fetch-depth: 0

      - name: Reassemble and verify compiler-boundary tranche
        shell: bash
        run: |
          git fetch origin automation/inc33-compiler-ir-payload-20260831
          rm -f /tmp/inc33-apply.b64 /tmp/inc33-apply.gz /tmp/inc33-apply.py /tmp/inc33-repair-01.py
          for part in 00 01 02 03 04 05; do
            git show "origin/automation/inc33-compiler-ir-payload-20260831:.inc33-payload/part-${part}.b64" >> /tmp/inc33-apply.b64
          done
          test "$(wc -c < /tmp/inc33-apply.b64)" -eq 21820
          base64 --decode /tmp/inc33-apply.b64 > /tmp/inc33-apply.gz
          echo "0c0f250d75452733450dc027b414bb1aad500e28a62a1e2f4c522098eb9611fb  /tmp/inc33-apply.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/inc33-apply.gz > /tmp/inc33-apply.py
          echo "83ea42e67642dc287bc676445b0d2f9c59e48467b585baf7508eae594a0bce11  /tmp/inc33-apply.py" | sha256sum --check
          git show "origin/automation/inc33-compiler-ir-payload-20260831:.inc33-payload/repair-01.py" > /tmp/inc33-repair-01.py
          python3 /tmp/inc33-repair-01.py
          echo "7ee94fcaf4f1fc267ffa32ed8bc4a14bae41569e30d63ddba75ad1b160680a68  /tmp/inc33-apply.py" | sha256sum --check
          python3 -m py_compile /tmp/inc33-apply.py

      - name: Apply tranche to active Increment 33 branch
        shell: bash
        run: |
          git checkout -B increment/33-analog-variables-procedural-assignment-v5 origin/increment/33-analog-variables-procedural-assignment-v5
          python3 /tmp/inc33-apply.py
          rm -f /tmp/inc33-apply.b64 /tmp/inc33-apply.gz /tmp/inc33-apply.py /tmp/inc33-repair-01.py
          git fetch --no-tags origin dev:refs/remotes/origin/dev

      - name: Install pinned toolchains
        shell: bash
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Apply repository formatting
        shell: bash
        run: |
          ./nodal style fix \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Validate Increment 33 checkpoint contract
        run: python3 scripts/check_increment33.py --compile

      - name: Validate Scala core
        run: ./nodal core scala

      - name: Validate native compiler
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate repository contracts
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev

      - name: Commit validated feature changes
        shell: bash
        run: |
          git config user.name "nodal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/compiler core/scala docs/design-gates/NodalAnalogProceduralAssignment-DG-v0.1.md docs/implementation/increment33-analog-variables-procedural-assignment.md scripts/check_increment33.py tests/compiler/fixtures/increment33
          git commit -m "feat(compiler): add first-class analog procedural IR"
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
