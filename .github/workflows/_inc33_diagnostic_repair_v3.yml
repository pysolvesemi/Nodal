name: Increment 33 Diagnostic Repair V3

on:
  push:
    branches:
      - automation/inc33-diagnostic-repair-v3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out active Increment 33 branch
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Repair declaration-region diagnostic parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scala_path = Path("core/scala/api/src/nodal/AnalogProceduralRuntime.scala")
          scala = scala_path.read_text(encoding="utf-8")
          old = """    ): Variable =
                requireProcedure(Option(identity).filter(_.nonEmpty))
                if identity.trim.isEmpty then
          """
          new = """    ): Variable =
                if !procedureActive then
                  fail(
                    "NODAL-ANALOG-033-003",
                    "procedural variable declaration requires an active procedural region",
                    Option(identity).filter(_.nonEmpty)
                  )
                if identity.trim.isEmpty then
          """
          # YAML block indentation contributes ten leading spaces to every embedded line.
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if old not in scala:
              raise SystemExit("Scala declaration guard pattern was not found")
          scala_path.write_text(scala.replace(old, new, 1), encoding="utf-8")

          native_path = Path("core/native/include/nodal/AnalogProceduralRuntime.h")
          native = native_path.read_text(encoding="utf-8")
          if "#include <type_traits>\n" not in native:
              native = native.replace(
                  "#include <string>\n",
                  "#include <string>\n#include <type_traits>\n",
                  1,
              )
          old_native = (
              "    requireProcedure(identity.empty() ? std::nullopt : "
              "std::optional<std::string>(identity));\n"
              "    identity = trim(identity);\n"
          )
          new_native = (
              "    if (!procedureActive_)\n"
              "      fail(\"NODAL-ANALOG-033-003\",\n"
              "           \"procedural variable declaration requires an active procedural region\",\n"
              "           identity.empty() ? std::nullopt : "
              "std::optional<std::string>(identity));\n"
              "    identity = trim(identity);\n"
          )
          if old_native not in native:
              raise SystemExit("native declaration guard pattern was not found")
          native_path.write_text(native.replace(old_native, new_native, 1), encoding="utf-8")

          replacements = {
              Path("examples/continuousTimeApi/src/nodal/increment33fixture/Increment33RuntimeCheck.scala"): (
                  'expect("NODAL-ANALOG-033-008"):\n      outside.declare("illegal", RealVoltage)',
                  'expect("NODAL-ANALOG-033-003"):\n      outside.declare("illegal", RealVoltage)',
              ),
              Path("tests/compiler/fixtures/increment33/analog_procedural_runtime_test.cpp"): (
                  'expect("NODAL-ANALOG-033-008", [&] {\n    (void)outside.declareVariable("illegal", RealVoltage);',
                  'expect("NODAL-ANALOG-033-003", [&] {\n    (void)outside.declareVariable("illegal", RealVoltage);',
              ),
              Path("scripts/check_increment33.py"): (
                  '        "NODAL-ANALOG-033-008",\n        "NODAL-ANALOG-033-009",',
                  '        "NODAL-ANALOG-033-003",\n        "NODAL-ANALOG-033-009",',
              ),
          }
          for path, (old_text, new_text) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old_text not in text:
                  raise SystemExit(f"repair pattern was not found in {path}")
              path.write_text(text.replace(old_text, new_text, 1), encoding="utf-8")
          PY

      - name: Validate repaired checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          ./mill examples.continuousTimeApi.runMain \
            nodal.increment33fixture.Increment33RuntimeCheck \
            /tmp/increment33-scala-witness.txt
          grep -F 'variables=4' /tmp/increment33-scala-witness.txt
          grep -F 'assignments=5' /tmp/increment33-scala-witness.txt
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_markdown.py
          git diff --check

      - name: Publish repaired checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            core/native/include/nodal/AnalogProceduralRuntime.h \
            core/scala/api/src/nodal/AnalogProceduralRuntime.scala \
            examples/continuousTimeApi/src/nodal/increment33fixture/Increment33RuntimeCheck.scala \
            scripts/check_increment33.py \
            tests/compiler/fixtures/increment33/analog_procedural_runtime_test.cpp
          git commit -m 'fix(increment33): distinguish declaration region diagnostics'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
