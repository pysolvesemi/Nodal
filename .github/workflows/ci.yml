name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix_increment124_newlines:
    name: fix Increment 124 file endings
    if: github.event_name == 'pull_request' && github.head_ref == 'increment/124-interface-role-inout-ams-roadmap'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select the writable feature head
        run: |
          git fetch --no-tags origin \
            increment/124-interface-role-inout-ams-roadmap:refs/remotes/origin/increment/124-interface-role-inout-ams-roadmap
          git checkout -B increment/124-interface-role-inout-ams-roadmap \
            origin/increment/124-interface-role-inout-ams-roadmap

      - name: Add required final newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              'docs/architecture/0021-unified-struct-interface-role-and-inout-architecture.md',
              'docs/roadmap/interface-role-inout-ams-v0.1-plan.md',
              'docs/roadmap/interface-role-inout-ams-v0.1-surface.json',
          ):
              path = Path(name)
              content = path.read_bytes()
              if not content.endswith(b'\n'):
                  path.write_bytes(content + b'\n')
          PY
          python3 -m json.tool docs/roadmap/interface-role-inout-ams-v0.1-surface.json >/dev/null
          python3 scripts/check_markdown.py
          git diff --check

      - name: Publish corrected source tree
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git checkout origin/dev -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Increment 124 file endings'
          git push origin HEAD:increment/124-interface-role-inout-ams-roadmap

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
