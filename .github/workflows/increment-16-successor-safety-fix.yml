name: Increment 16 Successor-Safety Fix

on:
  push:
    branches:
      - increment/16-elaboration-construction-kernel

permissions:
  contents: write

concurrency:
  group: increment-16-successor-safety-fix
  cancel-in-progress: false

jobs:
  patch:
    name: increment-16/successor-safety-fix
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out authoritative branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/16-elaboration-construction-kernel

      - name: Refresh latest remote head
        run: |
          git fetch origin increment/16-elaboration-construction-kernel
          git reset --hard origin/increment/16-elaboration-construction-kernel

      - name: Make Increment 15 roadmap validation successor-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_increment15.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import os\nimport subprocess\n"
          import_replacement = "import os\nimport re\nimport subprocess\n"
          if import_replacement not in text:
              assert text.count(import_anchor) == 1
              text = text.replace(import_anchor, import_replacement, 1)

          old = '''        if "**Revision:** 1.19" not in roadmap:
            problems.append(Problem("NODAL-INC15-059", "roadmap revision is not 1.19"))
'''
          new = '''        revision_match = re.search(
            r"(?m)^\\*\\*Revision:\\*\\* 1\\.(\\d+)$",
            roadmap,
          )
          if revision_match is None or int(revision_match.group(1)) < 19:
              problems.append(
                  Problem("NODAL-INC15-059", "roadmap revision predates 1.19")
              )
'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/increment-16-successor-safety-fix.yml

      - name: Validate patched predecessor checker
        run: |
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py --compile
          python3 tests/api/test_increment15.py
          python3 tests/api/test_increment16.py
          git diff --check

      - name: Commit permanent fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_increment15.py .github/workflows/increment-16-successor-safety-fix.yml
          git commit -m "Increment 16 — make predecessor roadmap check successor-safe"
          git pull --rebase origin increment/16-elaboration-construction-kernel
          git push origin HEAD:increment/16-elaboration-construction-kernel
