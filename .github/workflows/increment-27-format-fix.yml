name: Increment 27 Format Fix

on:
  push:
    branches:
      - increment/27-natures-disciplines
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-27-format-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    name: increment-27/format-fix
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/27-natures-disciplines
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install pinned lint toolchain
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Apply repository formatting
        run: |
          python3 scripts/run_clang_tools.py format \
            --fix \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Commit formatting repair
        run: |
          git add \
            core/compiler/include/nodal/Dialect/Nodal/NatureDiscipline.h \
            core/compiler/lib/Dialect/Nodal/NatureDiscipline.cpp \
            core/compiler/test/Unit/NatureDisciplineTest.cpp
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "Increment 27 — apply pinned clang-format"
          git push origin HEAD:increment/27-natures-disciplines
