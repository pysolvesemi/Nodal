name: Increment 30 Increment 22 Checker Split Fix

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-increment22-checker-fix.yml

permissions:
  contents: write

concurrency:
  group: increment-30-increment22-checker-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Align Increment 22 checker with diagnostic support split
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checker_path = Path("scripts/check_increment22.py")
          checker = checker_path.read_text(encoding="utf-8")

          expected_anchor = '''    "core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h",
              "core/compiler/lib/Diagnostics/CMakeLists.txt",
          '''
          expected_replacement = '''    "core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h",
              "core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h",
              "core/compiler/lib/Diagnostics/CMakeLists.txt",
              "core/compiler/lib/Support/DiagnosticSupport.cpp",
          '''
          if checker.count(expected_anchor) != 1:
              raise RuntimeError("Increment 22 expected-file anchor is not unique")
          checker = checker.replace(expected_anchor, expected_replacement, 1)

          header_anchor = '''    header = read(
                  root / "core/compiler/include/nodal/Diagnostics/DiagnosticMapping.h",
                  problems,
                  "NODAL-INC22-003",
              )
          '''
          header_replacement = header_anchor + '''    support_header = read(
                  root / "core/compiler/include/nodal/Diagnostics/DiagnosticSupport.h",
                  problems,
                  "NODAL-INC22-003",
              )
          '''
          if checker.count(header_anchor) != 1:
              raise RuntimeError("Increment 22 header-read anchor is not unique")
          checker = checker.replace(header_anchor, header_replacement, 1)

          native_anchor = '''    native = read(
                  root / "core/compiler/lib/Diagnostics/DiagnosticMapping.cpp",
                  problems,
                  "NODAL-INC22-004",
              )
          '''
          native_replacement = native_anchor + '''    support_native = read(
                  root / "core/compiler/lib/Support/DiagnosticSupport.cpp",
                  problems,
                  "NODAL-INC22-004",
              )
          '''
          if checker.count(native_anchor) != 1:
              raise RuntimeError("Increment 22 native-read anchor is not unique")
          checker = checker.replace(native_anchor, native_replacement, 1)

          header_require = '''    require(
                  header,
          '''
          if checker.count(header_require) != 1:
              raise RuntimeError("Increment 22 header-contract anchor is not unique")
          checker = checker.replace(
              header_require,
              '''    require(
                  header + "\\n" + support_header,
          ''',
              1,
          )

          native_require = '''    require(
                  native,
          '''
          if checker.count(native_require) != 1:
              raise RuntimeError("Increment 22 native-contract anchor is not unique")
          checker = checker.replace(
              native_require,
              '''    require(
                  native + "\\n" + support_native,
          ''',
              1,
          )

          hierarchy_guard = '''    if "context.hierarchyPath = path.str();" in native:
          '''
          if checker.count(hierarchy_guard) != 1:
              raise RuntimeError("Increment 22 hierarchy guard anchor is not unique")
          checker = checker.replace(
              hierarchy_guard,
              '''    if "context.hierarchyPath = path.str();" in native + "\\n" + support_native:
          ''',
              1,
          )
          checker_path.write_text(checker, encoding="utf-8")

          tests_path = Path("tests/compiler/test_increment22.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_path = 'root / "core/compiler/lib/Diagnostics/DiagnosticMapping.cpp"'
          if tests.count(old_path) != 2:
              raise RuntimeError("Increment 22 support mutation paths are not exactly two")
          tests_path.write_text(
              tests.replace(
                  old_path,
                  'root / "core/compiler/lib/Support/DiagnosticSupport.cpp"',
              ),
              encoding="utf-8",
          )
          PY

      - name: Publish inherited checker alignment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_increment22.py tests/compiler/test_increment22.py
          git commit -m "Increment 30 — align Increment 22 checker with diagnostic support split"
          git push origin HEAD:increment/30-analog-numeric-types
