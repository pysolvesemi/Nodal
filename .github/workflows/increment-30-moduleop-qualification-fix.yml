name: Increment 30 ModuleOp Qualification Fix

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-moduleop-qualification-fix.yml

permissions:
  contents: write

concurrency:
  group: increment-30-moduleop-qualification-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Repair builtin ModuleOp ABI and stale diagnostic helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          analog_path = Path("core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp")
          analog = analog_path.read_text(encoding="utf-8")
          replacements = {
              "LogicalResult verifyAnalogNumericModel(ModuleOp module) {":
                  "LogicalResult verifyAnalogNumericModel(mlir::ModuleOp module) {",
              "LogicalResult foldAnalogNumericConstants(ModuleOp module) {":
                  "LogicalResult foldAnalogNumericConstants(mlir::ModuleOp module) {",
              "LogicalResult verifyAnalogQuantityErasure(ModuleOp module) {":
                  "LogicalResult verifyAnalogQuantityErasure(mlir::ModuleOp module) {",
          }
          for old, new in replacements.items():
              if analog.count(old) != 1:
                  raise RuntimeError(f"Analog ModuleOp definition anchor is not unique: {old}")
              analog = analog.replace(old, new, 1)
          analog_path.write_text(analog, encoding="utf-8")

          mapping_path = Path("core/compiler/lib/Diagnostics/DiagnosticMapping.cpp")
          mapping = mapping_path.read_text(encoding="utf-8")
          helper = '''std::optional<int64_t> integerAttribute(DictionaryAttr values, llvm::StringRef name) {
            if (!values)
              return std::nullopt;
            if (auto integer = values.getAs<IntegerAttr>(name))
              return integer.getInt();
            if (auto text = values.getAs<StringAttr>(name)) {
              int64_t result = 0;
              if (!text.getValue().getAsInteger(10, result))
                return result;
            }
            return std::nullopt;
          }

          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          ) + "\n"
          if mapping.count(helper) != 1:
              raise RuntimeError("Unused integerAttribute helper anchor is not unique")
          mapping = mapping.replace(helper, "", 1)
          if mapping.count("#include <cstdint>\n") != 1:
              raise RuntimeError("cstdint include anchor is not unique")
          mapping = mapping.replace("#include <cstdint>\n", "", 1)
          mapping_path.write_text(mapping, encoding="utf-8")

          checker_path = Path("scripts/check_increment30.py")
          checker = checker_path.read_text(encoding="utf-8")
          anchor = '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001"),
          '''
          replacement = '''        "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp": (
                      "combineAnalogDimensions", "NODAL-ANALOG-PROMOTION-001",
                      "nodal.folded_provenance", "NODAL-ANALOG-DIVIDE-001",
                      "verifyAnalogNumericModel(mlir::ModuleOp module)",
                      "foldAnalogNumericConstants(mlir::ModuleOp module)",
                      "verifyAnalogQuantityErasure(mlir::ModuleOp module)"),
          '''
          anchor = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in anchor.splitlines()
          ) + "\n"
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          if checker.count(anchor) != 1:
              raise RuntimeError("Increment 30 native ABI contract anchor is not unique")
          checker_path.write_text(checker.replace(anchor, replacement, 1), encoding="utf-8")

          tests_path = Path("tests/compiler/test_increment30.py")
          tests = tests_path.read_text(encoding="utf-8")
          anchor = '''    def test_rejects_missing_implemented_status(self) -> None:
          '''
          replacement = '''    def test_rejects_unqualified_builtin_module_definition(self) -> None:
                  temporary, root = self.temporary_repository()
                  self.addCleanup(temporary.cleanup)
                  path = root / "core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp"
                  path.write_text(
                      path.read_text(encoding="utf-8").replace(
                          "verifyAnalogNumericModel(mlir::ModuleOp module)",
                          "verifyAnalogNumericModel(ModuleOp module)",
                          1,
                      ),
                      encoding="utf-8",
                  )
                  self.assertIn("NODAL-INC30-010", self.codes(root))

              def test_rejects_missing_implemented_status(self) -> None:
          '''
          anchor = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in anchor.splitlines()
          ) + "\n"
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          if tests.count(anchor) != 1:
              raise RuntimeError("Increment 30 ABI mutation-test anchor is not unique")
          tests_path.write_text(tests.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Validate repository contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check_increment22.py
          python3 scripts/check_increment24.py
          python3 scripts/check_increment30.py
          python3 tests/compiler/test_increment22.py
          python3 tests/compiler/test_increment24.py
          python3 tests/compiler/test_increment30.py
          git diff --check

      - name: Publish ModuleOp ABI fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/compiler/lib/Dialect/Nodal/AnalogNumeric.cpp \
            core/compiler/lib/Diagnostics/DiagnosticMapping.cpp \
            scripts/check_increment30.py \
            tests/compiler/test_increment30.py
          git commit -m "Increment 30 — qualify builtin ModuleOp semantic entry points"
          git push origin HEAD:increment/30-analog-numeric-types
