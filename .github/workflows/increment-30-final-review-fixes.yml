name: Increment 30 Final Semantic Review Fixes

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-final-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: increment-30-final-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Apply semantic fixes and regression coverage
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_increment30_final_review_fixes.py
          python3 scripts/apply_increment30_final_review_fixes.py
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/run_clang_tools.py format \
            --fix \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/check_increment30.py
          python3 tests/compiler/test_increment30.py
          git diff --check

      - name: Publish final semantic fixes
        run: |
          set -euo pipefail
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          git commit -m "Increment 30 — close final semantic review gaps"
          git push origin HEAD:increment/30-analog-numeric-types
