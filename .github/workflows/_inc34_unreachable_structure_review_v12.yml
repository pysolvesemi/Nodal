name: Increment 34 Fresh Review Structural Hardening v12

on:
  push:
    branches:
      - automation/inc34-unreachable-structure-review-v12
    paths:
      - '.github/workflows/_inc34_unreachable_structure_review_v12.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-unreachable-structure-review-v12
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out fresh-review controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-unreachable-structure-review-v12
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Execute corrected guarded fresh-review structural hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_run_unreachable_structure_review_v12b.sh \
            "${GITHUB_WORKSPACE}/controller" \
            "${GITHUB_WORKSPACE}/work" \
            "${RUNNER_TEMP}/inc34-unreachable-structure-v12"
