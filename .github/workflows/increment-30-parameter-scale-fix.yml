name: Increment 30 Parameter Unit Scale Fix

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-parameter-scale-fix.yml

permissions:
  contents: write

concurrency:
  group: increment-30-parameter-scale-fix
  cancel-in-progress: false

jobs:
  apply:
    name: apply-and-clean
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Apply reviewed fixed-parameter unit-scale correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_increment30_parameter_scale_fix.py")
          text = path.read_text(encoding="utf-8")

          old_anchor = (
              "    '''    \".github/workflows/increment-30-final-review-fixes.yml\",\n"
              "    \"scripts/apply_increment30_final_review_fixes.py\",\n"
              ")\n"
              "''',\n"
          )
          current_anchor = (
              "    '''    \".github/workflows/increment-30-final-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-temporary-artifact-guard.yml\",\n"
              "    \"scripts/apply_increment30_final_review_fixes.py\",\n"
              ")\n"
              "''',\n"
          )
          if text.count(old_anchor) != 1:
              raise SystemExit("parameter-scale script old temporary-file anchor is not unique")
          text = text.replace(old_anchor, current_anchor, 1)

          output_anchor = (
              "    '''    \".github/workflows/increment-30-final-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-parameter-scale-fix.yml\",\n"
          )
          preserved_output = (
              "    '''    \".github/workflows/increment-30-final-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-review-fixes.yml\",\n"
              "    \".github/workflows/increment-30-temporary-artifact-guard.yml\",\n"
              "    \".github/workflows/increment-30-parameter-scale-fix.yml\",\n"
          )
          if text.count(output_anchor) != 1:
              raise SystemExit("parameter-scale script replacement temporary-file anchor is not unique")
          text = text.replace(output_anchor, preserved_output, 1)

          replacements = {
              r'            "identity = \"parameter_scale\"",':
                  r'            "identity = \\\"parameter_scale\\\"",',
              r'        path.write_text("temporary\n", encoding="utf-8")':
                  r'        path.write_text("temporary\\n", encoding="utf-8")',
          }
          for needle, replacement in replacements.items():
              if text.count(needle) != 1:
                  raise SystemExit(f"parameter-scale escape anchor is not unique: {needle}")
              text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 scripts/apply_increment30_parameter_scale_fix.py
          rm -f \
            scripts/apply_increment30_parameter_scale_fix.py \
            .github/workflows/increment-30-parameter-scale-fix.yml

      - name: Format and validate the cleaned implementation
        run: |
          set -euo pipefail
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/run_clang_tools.py format \
            --fix \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/check_increment30.py
          python3 tests/compiler/test_increment30.py
          git diff --check

      - name: Publish the semantic correction and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 30 — canonicalize parameter unit scale before folding"
          git push origin HEAD:increment/30-analog-numeric-types
