name: Increment 33 Diagnostic Repair V3

on:
  push:
    branches:
      - automation/inc33-diagnostic-repair-v3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repair controls
        uses: actions/checkout@v6
        with:
          ref: automation/inc33-diagnostic-repair-v3
          path: controls
          fetch-depth: 1

      - name: Check out active Increment 33 branch
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          path: target
          fetch-depth: 0

      - name: Apply exact reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git apply --check ../controls/.automation/inc33-diagnostic-repair.patch
          git apply ../controls/.automation/inc33-diagnostic-repair.patch
          ./mill mill.scalalib.scalafmt/reformatAll
          git diff --check

      - name: Validate repaired checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          report=/tmp/increment33-scala-witness.txt
          ./mill examples.continuousTimeApi.runMain \
            nodal.increment33fixture.Increment33RuntimeCheck \
            "$report"
          grep -F 'variables=4' "$report"
          grep -F 'assignments=5' "$report"
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_markdown.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              "core/native/include/nodal/AnalogProceduralRuntime.h",
              "core/scala/api/src/nodal/AnalogProceduralConstruction.scala",
              "core/scala/api/src/nodal/AnalogProceduralRuntime.scala",
              "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala",
              "examples/continuousTimeApi/src/nodal/increment33fixture/Increment33RuntimeCheck.scala",
              "scripts/check_increment33.py",
              "tests/compiler/fixtures/increment33/analog_procedural_runtime_test.cpp",
          }
          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--short"], text=True
              ).splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  "unexpected repaired file set:\n"
                  + "\n".join(sorted(actual))
                  + "\nexpected:\n"
                  + "\n".join(sorted(expected))
              )
          PY

      - name: Publish repaired checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            core/native/include/nodal/AnalogProceduralRuntime.h \
            core/scala/api/src/nodal/AnalogProceduralConstruction.scala \
            core/scala/api/src/nodal/AnalogProceduralRuntime.scala \
            core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala \
            examples/continuousTimeApi/src/nodal/increment33fixture/Increment33RuntimeCheck.scala \
            scripts/check_increment33.py \
            tests/compiler/fixtures/increment33/analog_procedural_runtime_test.cpp
          git commit -m 'fix(increment33): distinguish declaration region diagnostics'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
