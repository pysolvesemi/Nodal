name: Increment 32 Test Selector Fix

on:
  push:
    branches:
      - automation/inc32-review-fix-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Increment 32 head
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0
      - name: Correct policy-compliant test selector
        env:
          EXPECTED_HEAD: f6d30abdb2d2b779a4e434b46ec564ec1a6f5aaa
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_increment32.py")
          text = path.read_text(encoding="utf-8")
          old_selector = '            "nodal.AnalogEquationConstructionTests",'
          new_selector = '            "nodal.internal.testkit.AnalogEquationConstructionTests",'
          if text.count(old_selector) != 1:
              raise SystemExit("unexpected Increment 32 test selector state")
          text = text.replace(old_selector, new_selector, 1)

          old_token = '            "PublicAnalogEquationTop",'
          new_token = (
              '            "package nodal.internal.testkit",\n'
              '            "PublicAnalogEquationTop",'
          )
          if text.count(old_token) != 1:
              raise SystemExit("unexpected public integration token state")
          text = text.replace(old_token, new_token, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 scripts/check_increment32.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          git diff --check
      - name: Publish selector correction
        run: |
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add scripts/check_increment32.py
          git commit -m "test(increment32): select policy-compliant integration suite"
          git push origin HEAD:increment/32-equation-contribution-semantics-review
