name: F160 PR138 reviewed-repair Core dispatch
on:
  push:
    branches: ['ci-control/f160-pr138-09e7c0dd-review']
    paths: ['.github/workflows/f160-pr138-09e7-review-dispatch.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: f160-pr138-09e7-review-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact identities and dispatch affected Core once
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          REPO = "pysolvesemi/Nodal"
          REPO_ID = 1340301335
          PR = 138
          TARGET = "ee6e919510e95a8e267c676a9724ec1bae86f348"
          HEAD = "09e7c0dd370f4fac5b381e96036df53d942c2010"
          TREE = "1efa8f2184169f69ae6408d79c8ed597ac460a25"
          PARENT = "4ce431418434685e0d74f3af3ab2f8a2c4cd740f"
          REF = "increment/160-evidence-closure"
          CONTROL = "ci-control/f160-pr138-09e7c0dd-review"
          FILE = ".github/workflows/f160-pr138-09e7-review-dispatch.yml"
          WORKFLOW = 338626156
          DEFINITION = "8e60508454a7d56af871e85cf92e54c608240f6fb156967563d90ac16dc12a20"
          PRIOR_RUN = 36672907964
          PREFIX = "/repos/" + REPO
          POST = PREFIX + "/actions/workflows/338626156/dispatches"


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("API redirect refused")


          class Api:
              def __init__(self, token):
                  self.token = token
                  self.posts = 0
                  self.opener = urllib.request.build_opener(NoRedirect())

              def __call__(self, method, path, payload=None):
                  require(path.startswith(PREFIX + "/") and ".." not in path,
                          "unexpected API destination")
                  if method == "POST":
                      require(path == POST and payload == {"ref": REF} and self.posts == 0,
                              "write is not the single allowlisted dispatch")
                      self.posts += 1
                  else:
                      require(method == "GET" and payload is None, "unexpected operation")
                  request = urllib.request.Request(
                      "https://api.github.com" + path, method=method,
                      data=None if payload is None else json.dumps(payload).encode(),
                      headers={"Authorization": "Bearer " + self.token,
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28",
                               "Content-Type": "application/json"})
                  with self.opener.open(request, timeout=30) as response:
                      if method == "POST":
                          require(response.status == 204, "dispatch not acknowledged")
                          return None
                      raw = response.read(2 * 1024 * 1024 + 1)
                      require(len(raw) <= 2 * 1024 * 1024, "API response exceeds bound")
                      return json.loads(raw)


          def pages(api, path, key):
              result = []
              total = None
              separator = "&" if "?" in path else "?"
              for page in range(1, 21):
                  response = api("GET", path + separator + f"per_page=100&page={page}")
                  count = response["total_count"]
                  require(type(count) is int and 0 <= count <= 2000, "invalid inventory count")
                  require(total is None or total == count, "inventory moved during pagination")
                  total = count
                  batch = response[key]
                  require(isinstance(batch, list) and len(batch) <= 100, "invalid inventory page")
                  result.extend(batch)
                  if len(batch) < 100:
                      require(len(result) == total, "incomplete inventory")
                      require(len({entry["id"] for entry in result}) == len(result),
                              "duplicate inventory identities")
                      return result
              raise RuntimeError("inventory pagination exceeded bound")


          def identities(api, environment):
              require(environment["GITHUB_REPOSITORY"] == REPO and
                      environment["GITHUB_REF"] == "refs/heads/" + CONTROL and
                      environment["GITHUB_EVENT_NAME"] == "push", "wrong controller context")
              controller = api("GET", PREFIX + "/commits/" + environment["GITHUB_SHA"])
              require([p["sha"] for p in controller["parents"]] == [TARGET] and
                      [f["filename"] for f in controller["files"]] == [FILE],
                      "controller is not the scoped direct target child")
              for ref, sha in ((CONTROL, environment["GITHUB_SHA"]), ("dev", TARGET), (REF, HEAD)):
                  require(api("GET", PREFIX + "/git/ref/heads/" + ref)["object"]["sha"] == sha,
                          "live ref moved: " + ref)
              pr = api("GET", PREFIX + "/pulls/138")
              require(pr["state"] == "open" and pr["merged"] is False and pr["draft"] is True,
                      "PR state changed")
              require(pr["base"]["ref"] == "dev" and pr["base"]["sha"] == TARGET and
                      pr["head"]["ref"] == REF and pr["head"]["sha"] == HEAD and
                      pr["base"]["repo"]["id"] == REPO_ID and pr["head"]["repo"]["id"] == REPO_ID,
                      "PR identities changed")
              commit = api("GET", PREFIX + "/commits/" + HEAD)
              require(commit["commit"]["tree"]["sha"] == TREE and
                      [p["sha"] for p in commit["parents"]] == [PARENT] and
                      sorted(f["filename"] for f in commit["files"]) ==
                      ["scripts/check_increment160.py", "tests/compiler/test_increment160_closure.py"],
                      "repair source/scope changed")
              workflow = api("GET", PREFIX + "/actions/workflows/338626156")
              require(workflow["id"] == WORKFLOW and workflow["state"] == "active" and
                      workflow["path"] == ".github/workflows/ci.yml", "wrong Core workflow")
              content = api("GET", PREFIX + "/contents/.github/workflows/ci.yml?ref=" + HEAD)
              require(content["encoding"] == "base64", "unexpected workflow encoding")
              definition = base64.b64decode(content["content"])
              require(hashlib.sha256(definition).hexdigest() == DEFINITION and
                      b"\n  workflow_dispatch:" in definition, "workflow definition changed")
              prior = api("GET", PREFIX + "/actions/runs/" + str(PRIOR_RUN))
              require(prior["workflow_id"] == WORKFLOW and prior["head_sha"] == PARENT and
                      prior["head_branch"] == REF and prior["event"] == "workflow_dispatch" and
                      prior["run_attempt"] == 1 and prior["status"] == "completed" and
                      prior["conclusion"] == "success", "prior qualification changed")
              jobs = pages(api, PREFIX + f"/actions/runs/{PRIOR_RUN}/attempts/1/jobs", "jobs")
              require({job["name"] for job in jobs} == {"contracts", "scala", "native", "required"}
                      and len(jobs) == 4 and all(job["head_sha"] == PARENT and
                      job["status"] == "completed" and job["conclusion"] == "success" for job in jobs),
                      "prior jobs incomplete")


          def inventory(api):
              runs = pages(api, PREFIX + "/actions/runs?head_sha=" + HEAD, "workflow_runs")
              require(all(run["head_sha"] == HEAD for run in runs), "wrong-head inventory")
              return runs


          def execute(api, environment, record, sleep=time.sleep):
              identities(api, environment)
              existing = inventory(api)
              if existing:
                  record("retained-existing", {"run_ids": [run["id"] for run in existing]})
                  return
              # Revalidate immediately before the only possible write.
              identities(api, environment)
              existing = inventory(api)
              if existing:
                  record("retained-existing", {"run_ids": [run["id"] for run in existing]})
                  return
              record("dispatch-intent", {"path": POST, "payload": {"ref": REF}, "head": HEAD})
              try:
                  api("POST", POST, {"ref": REF})
              except Exception:
                  record("dispatch-uncertain", {"retry": False})
                  raise
              record("dispatch-acknowledged", {"http_status": 204})
              for _ in range(12):
                  runs = inventory(api)
                  matching = [run for run in runs if run["workflow_id"] == WORKFLOW]
                  if matching:
                      require(len(matching) == 1, "ambiguous dispatch inventory")
                      run = matching[0]
                      require(run["head_branch"] == REF and run["event"] == "workflow_dispatch" and
                              run["run_attempt"] == 1, "observed dispatch identity mismatch")
                      record("dispatch-observed", {"run_id": run["id"], "head": HEAD,
                                                   "workflow_id": WORKFLOW, "attempt": 1})
                      return
                  sleep(5)
              record("observation-incomplete", {"retry": False})
              raise RuntimeError("dispatch acknowledged but observation incomplete; do not retry")


          if __name__ == "__main__":
              destination = Path(os.environ["RUNNER_TEMP"]) / "f160-09e7-dispatch"
              destination.mkdir(exist_ok=False)
              events = []
              previous = "0" * 64

              def record(event, data):
                  global previous
                  entry = {"sequence": len(events) + 1, "previous_sha256": previous,
                           "event": event, "data": data}
                  previous = hashlib.sha256(json.dumps(entry, sort_keys=True).encode()).hexdigest()
                  entry["sha256"] = previous
                  with (destination / "ledger.jsonl").open("a") as stream:
                      stream.write(json.dumps(entry, sort_keys=True) + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  events.append(entry)
                  print(json.dumps(entry, sort_keys=True), flush=True)

              record("controller-start", {"head": HEAD, "tree": TREE, "base": TARGET,
                                          "controller_sha": os.environ["GITHUB_SHA"]})
              execute(Api(os.environ["GITHUB_TOKEN"]), os.environ, record)
      - name: Retain dispatch ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f160-pr138-09e7-dispatch-ledger
          path: ${{ runner.temp }}/f160-09e7-dispatch/
          if-no-files-found: error
