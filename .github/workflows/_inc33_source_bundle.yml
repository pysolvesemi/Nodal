name: Increment 33 Source Bundle

on:
  push:
    branches:
      - automation/inc33-source-bundle-20260831

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current Increment 33 branch
        uses: actions/checkout@v6
        with:
          ref: d45f64cf3c820f03ead32281befed4524fbab282
          fetch-depth: 0
      - name: Package source snapshot
        run: |
          git rev-parse HEAD > /tmp/nodal-inc33-head.txt
          tar --exclude=.git --exclude=out --exclude=build -czf /tmp/nodal-inc33-current.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc33-current-source
          path: |
            /tmp/nodal-inc33-current.tgz
            /tmp/nodal-inc33-head.txt
          if-no-files-found: error
          retention-days: 1
