name: Apply generated testbench roadmap update

on:
  push:
    branches:
      - agent/generated-verilog-family-testbench-roadmap
    paths:
      - .github/workflows/generated-testbench-roadmap-edit.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: agent/generated-verilog-family-testbench-roadmap
          fetch-depth: 2

      - name: Recover and run the staged editor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/generated-testbench-roadmap-edit.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{workflow}"], text=True
          )
          marker = "          python3 - <<'PY'\n"
          start = previous.index(marker) + len(marker)
          end = previous.index("\n          PY\n", start)
          lines = previous[start:end].splitlines()
          code = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          ) + "\n"
          Path("/tmp/apply_generated_testbench_roadmap.py").write_text(code)
          PY
          python3 /tmp/apply_generated_testbench_roadmap.py

          if [[ -f scripts/check_architecture.py ]]; then
            python3 scripts/check_architecture.py
          fi

          git rm .github/workflows/generated-testbench-roadmap-edit.yml
          git diff --check
          git status --short

      - name: Commit roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: reserve generated Verilog-family testbench projections"
          git push origin HEAD:agent/generated-verilog-family-testbench-roadmap
