name: Increment 12 source fix

on:
  push:
    branches:
      - increment/12-clock-reset-api-v0-2-freeze

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Increment 12 source fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply and compile the source fix
        run: |
          python3 .increment12-fix.py
          ./mill \
            examples.externalLibrary.compile \
            examples.publicApiCandidates.compile \
            examples.clockResetApi.compile

      - name: Publish the source fix
        run: |
          rm .increment12-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Scala erasure in clock/reset API fixtures'
          git push origin HEAD:increment/12-clock-reset-api-v0-2-freeze
