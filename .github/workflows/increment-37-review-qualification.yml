name: Increment 37 Review Qualification
on:
  push:
    branches: [increment/37-review-qualification]
    paths: ['.github/workflows/increment-37-review-qualification.yml']
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: afb746e2bb39fd5f04bef6011112686307ce8fce
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Apply exact generated-state review fix
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == 'afb746e2bb39fd5f04bef6011112686307ce8fce'
          blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/pysolvesemi/Nodal/git/blobs/7c5c119b27f8f791dda6098634ce318f983c2ef1']))
          patch = lzma.decompress(base64.b64decode(blob['content']))
          assert len(patch) == 12570 and hashlib.sha256(patch).hexdigest() == '3b5ba7751693811a74e92760d000e6b673a0959f06675de1322753ee1271160f'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          PY
      - name: Execute full locked-toolchain qualification
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/increment37-review"
          mkdir -p "$evidence"
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/lint" 2>&1 | tee "$evidence/lint-bootstrap.log"
          ./nodal bootstrap --mode prebuilt --prefix "${RUNNER_TEMP}/native" 2>&1 | tee "$evidence/native-bootstrap.log"
          ./nodal style fix --lint-toolchain "${RUNNER_TEMP}/lint" 2>&1 | tee "$evidence/format.log"
          ./nodal check --toolchain "${RUNNER_TEMP}/native" --lint-toolchain "${RUNNER_TEMP}/lint" --online-toolchain --base-ref origin/dev 2>&1 | tee "$evidence/full-check.log"
          ./mill -i core.scala.testkit.test.runMain nodal.internal.testkit.Increment37MlirCheck "$evidence/increment37-source.mlir" 2>&1 | tee "$evidence/source.log"
          nodalc=$(find out -type f -name nodalc -perm -u+x | head -n 1)
          translate=$(find out -type f -name nodal-translate -perm -u+x | head -n 1)
          test -n "$nodalc" && test -n "$translate"
          python3 tests/compiler/fixtures/increment37/run_native_matrix.py --nodalc "$nodalc" --translate "$translate" --source "$evidence/increment37-source.mlir" 2>&1 | tee "$evidence/event-matrix.log"
          python3 tests/compiler/fixtures/increment37/run_direction_matrix.py --nodalc "$nodalc" --translate "$translate" 2>&1 | tee "$evidence/direction-matrix.log"
          git diff --check
      - name: Retain qualified source objects without changing refs
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'increment37-review'
          def git(*args): return subprocess.check_output(['git', *args])
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = git('write-tree').decode().strip()
          (out / 'candidate.tar.gz').write_bytes(git('archive', '--format=tar.gz', tree))
          (out / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary'))
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw: continue
              name = raw.decode()
              assert not name.startswith('.github/workflows/'), 'Source qualification may not change workflows'
              path = pathlib.Path(name)
              item = {'path': name, 'type': 'blob', 'mode': '100755' if path.exists() and os.access(path, os.X_OK) else '100644'}
              if path.exists(): item['content'] = path.read_text()
              else: item['sha'] = None
              entries.append(item)
          payload = json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries}).encode()
          request = urllib.request.Request('https://api.github.com/repos/pysolvesemi/Nodal/git/trees', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=60) as response: result = json.load(response)
          assert result['sha'] == tree, 'Published source objects differ from validated tree'
          (out / 'candidate.json').write_text(json.dumps({'source_tree_sha': tree, 'validated_tree_sha': tree, 'implementation_parent': git('rev-parse', 'HEAD').decode().strip(), 'run_id': os.environ['GITHUB_RUN_ID'], 'full_qualification': 'success'}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment37-review-qualification
          path: ${{ runner.temp }}/increment37-review
          retention-days: 14
