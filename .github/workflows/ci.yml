name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  prepare-target-hdl-pass-roadmap:
    name: prepare target-HDL pass roadmap
    if: >-
      ((github.event_name == 'push' &&
        github.ref_name == 'increment/13-verilog-optimization-pass-roadmap') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'increment/13-verilog-optimization-pass-roadmap')) &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          ref: increment/13-verilog-optimization-pass-roadmap
          fetch-depth: 0

      - name: Normalize transformer anchors and number preservation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("docs/architecture/README.md")
          index_text = index_path.read_text(encoding="utf-8")
          old_index = "| [0012](0012-versioned-capability-plugin-architecture.md) | Use manifest-first, versioned capability graphs with local design hosts, deterministic phases, isolated compiler/backend/tool boundaries, lockfiles, and retained plugin provenance. |"
          new_index = "| [0012](0012-versioned-capability-plugin-architecture.md) | Use explicit manifests, a typed capability graph, deterministic phases, local design hosts, separate Scala/native/process boundaries, lockfiles, trust policy, and retained plugin provenance. |"
          if old_index not in index_text:
              raise SystemExit("ADR 0012 index anchor did not match")
          index_path.write_text(index_text.replace(old_index, new_index, 1), encoding="utf-8")

          script_path = Path("scripts/update_target_hdl_optimization_roadmap.py")
          script_text = script_path.read_text(encoding="utf-8")

          old_anchor = '"Passing FPGA hardware does not erase a discretization or quantization mismatch."'
          new_anchor = '"Passing a later level does not erase an earlier approximation error. Reports must preserve the full ladder."'
          if old_anchor not in script_text:
              raise SystemExit("AMS ADR transformer anchor did not match")
          script_text = script_text.replace(old_anchor, new_anchor, 1)

          old_logic = "            return str(map_increment(int(match.group(0))))"
          new_logic = "\n".join(
              (
                  "            original = match.group(0)",
                  "            original_number = int(original)",
                  "            mapped = map_increment(original_number)",
                  "            return original if mapped == original_number else str(mapped)",
              )
          )
          if old_logic not in script_text:
              raise SystemExit("increment renumber transformer logic did not match")
          script_text = script_text.replace(old_logic, new_logic, 1)
          script_path.write_text(script_text, encoding="utf-8")
          PY

      - name: Apply target-HDL pass roadmap transformation
        run: python3 scripts/update_target_hdl_optimization_roadmap.py

      - name: Validate durable documentation and JSON
        shell: bash
        run: |
          python3 scripts/check_markdown.py
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_architecture.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("docs/roadmap").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          print("roadmap JSON validation passed")
          PY

      - name: Commit durable roadmap and restore permanent CI
        shell: bash
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git checkout origin/dev -- .github/workflows/ci.yml
          git rm -f \
            .github/workflows/apply-target-hdl-optimization-roadmap.yml \
            scripts/update_target_hdl_optimization_roadmap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/branch-policy.json \
            .github/workflows/ci.yml \
            docs/architecture \
            docs/roadmap
          git diff --cached --check
          git commit -m 'docs: plan plug-and-play target-HDL optimization passes'
          git push origin HEAD:increment/13-verilog-optimization-pass-roadmap

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
