name: Increment 32 Closure Source V2

on:
  push:
    branches:
      - automation/inc32-closure-source-v2

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/32-evidence-closure
          fetch-depth: 0
      - name: Record source identity
        run: git rev-parse HEAD > /tmp/nodal-inc32-closure-head.txt
      - name: Package source
        run: tar --exclude=.git --exclude=out --exclude=build -czf /tmp/nodal-inc32-closure-source.tgz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc32-closure-source-v2
          path: |
            /tmp/nodal-inc32-closure-source.tgz
            /tmp/nodal-inc32-closure-head.txt
          if-no-files-found: error
          retention-days: 1
