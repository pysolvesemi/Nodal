name: Increment 33 Final Closure Matrix Guard

on:
  push:
    branches:
      - automation/inc33-final-closure-matrix-guard-20260831

permissions:
  actions: read
  contents: write
  pull-requests: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out final closure head
        uses: actions/checkout@v6
        with:
          ref: increment/33-evidence-closure
          fetch-depth: 0

      - name: Wait for complete final closure matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          cat > /tmp/required.txt <<'EOF'
          Core CI
          Increment 13 Core Semantic Candidates
          Increment 14 Pipeline and Interface Candidates
          Increment 15 Unified Public API Freeze
          Increment 16 Elaboration Construction Kernel
          Increment 17 Source Origin Naming
          Increment 18 MLIR Dialect Skeleton
          Increment 19 Core MLIR Model
          Increment 20 Scala-to-MLIR Bridge
          Increment 21 Native Semantic Pipeline
          Increment 22 Cross-Layer Diagnostics
          Increment 23 Backend Framework
          Increment 24 Minimal Analog IR
          Increment 25 RC Filter Vertical Slice
          Increment 26 Reproducibility Contract
          Increment 27 Natures and Disciplines
          Increment 28 Electrical Conservative Connectivity
          Increment 29 Parameters Constants Ranges and Units
          Increment 30 Analog Numeric Types and Expression Typing
          Increment 31 Potential and Flow Access
          Increment 32 Equation and Contribution Semantics
          Increment 133 Analog Semantic API
          Increment 33 Analog Procedural Assignment
          EOF
          sed -i 's/^          //' /tmp/required.txt

          for attempt in $(seq 1 165); do
            gh api "/repos/pysolvesemi/Nodal/actions/runs?head_sha=$head&event=pull_request&per_page=100" > /tmp/runs.json
            set +e
            python3 - "$head" <<'PY'
          import json
          import sys
          from pathlib import Path
          head = sys.argv[1]
          required = [line for line in Path('/tmp/required.txt').read_text().splitlines() if line]
          runs = json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs', [])
          latest = {}
          for run in sorted(runs, key=lambda item: (item.get('run_number', 0), item.get('id', 0))):
              if run.get('head_sha') == head:
                  latest[run.get('name')] = run
          missing = [name for name in required if name not in latest]
          pending = [name for name in required if name in latest and latest[name].get('status') != 'completed']
          failed = [
              {'name': name, 'id': latest[name].get('id'), 'conclusion': latest[name].get('conclusion')}
              for name in required if name in latest and latest[name].get('status') == 'completed'
              and latest[name].get('conclusion') != 'success'
          ]
          report = {
              'head': head,
              'missing': missing,
              'pending': pending,
              'failed': failed,
              'runs': {
                  name: {'id': latest[name].get('id'), 'status': latest[name].get('status'),
                         'conclusion': latest[name].get('conclusion')}
                  for name in required if name in latest
              },
          }
          Path('/tmp/inc33-final-matrix.json').write_text(json.dumps(report, indent=2) + '\n')
          if failed:
              print(json.dumps(report, indent=2))
              raise SystemExit(2)
          if missing or pending:
              raise SystemExit(1)
          print(json.dumps(report, indent=2))
          PY
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -eq 2 ]; then exit 1; fi
            if [ "$attempt" -eq 165 ]; then cat /tmp/inc33-final-matrix.json; exit 1; fi
            sleep 20
          done

      - name: Publish final closure matrix checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          pr=$(gh api '/repos/pysolvesemi/Nodal/pulls/101')
          test "$(printf '%s' "$pr" | jq -r '.state')" = 'open'
          test "$(printf '%s' "$pr" | jq -r '.head.sha')" = "$head"
          test "$(printf '%s' "$pr" | jq -r '.base.ref')" = 'dev'
          git push --force origin "$head":refs/heads/checkpoint/increment-33-final-closure-matrix-green
          run_ids=$(jq -r '.runs | to_entries | map("\(.key)=\(.value.id)") | join(", ")' /tmp/inc33-final-matrix.json)
          gh api --method POST \
            -f body="Final Increment 33 evidence-stamped head \`$head\` passed all 23 required workflows. Run evidence: $run_ids" \
            '/repos/pysolvesemi/Nodal/issues/101/comments'
