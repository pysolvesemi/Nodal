name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        id: contract_validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_hvl_roadmap.py
          python3 scripts/test_hvl_roadmap.py
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

      - name: Capture failed style repair for review
        if: ${{ failure() && steps.contract_validation.outcome == 'failure' }}
        shell: bash
        run: |
          evidence="${RUNNER_TEMP}/nodal-style-evidence"
          mkdir -p "${evidence}"
          git rev-parse HEAD > "${evidence}/source.commit"
          git rev-parse 'HEAD^{tree}' > "${evidence}/source.tree"
          printf 'run_id=%s\nrun_attempt=%s\nevent=%s\nref=%s\nsha=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_EVENT_NAME}" \
            "${GITHUB_REF}" "${GITHUB_SHA}" > "${evidence}/run.txt"
          git status --porcelain=v1 > "${evidence}/before.status"
          git diff --binary --full-index --no-ext-diff --no-textconv HEAD \
            > "${evidence}/before.patch"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet HEAD
          set +e
          ./nodal style fix --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            > "${evidence}/style-fix.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "${result}" > "${evidence}/style-fix.exit-code"
          git diff --binary --full-index --no-ext-diff --no-textconv HEAD \
            > "${evidence}/style-fix.patch"
          git status --porcelain=v1 > "${evidence}/after.status"
          git diff --name-status --no-renames HEAD > "${evidence}/changed-paths.txt"
          (cd "${evidence}" && sha256sum source.commit source.tree run.txt \
            before.status before.patch style-fix.log style-fix.exit-code \
            style-fix.patch after.status changed-paths.txt > SHA256SUMS)
          cat "${evidence}/style-fix.log"
          exit "${result}"

      - name: Preserve failed style repair evidence
        if: ${{ always() && steps.contract_validation.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: style-repair-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nodal-style-evidence/
          if-no-files-found: error

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

      - name: Preserve constructor prototype evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constructor-prototype-${{ github.sha }}-${{ github.run_attempt }}
          path: .validation/constructor-capture/**
          include-hidden-files: true
          if-no-files-found: error

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
