name: Increment 29 Target Reparse Repair

on:
  push:
    branches:
      - increment/29-parameters-units
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-29-reparse-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: increment-29/reparse-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/29-parameters-units
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair target reparse validation
        run: python3 scripts/repair_increment29_reparse.py

      - name: Install locked lint toolchain
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format and check repaired sources
        run: |
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Backend/AnalogVerticalSlice.cpp \
            core/compiler/lib/Dialect/Nodal/ParameterModel.cpp
          git diff --check

      - name: Commit source-only repair
        run: |
          git add \
            core/compiler/lib/Backend/AnalogVerticalSlice.cpp \
            core/compiler/lib/Dialect/Nodal/ParameterModel.cpp
          git commit -m "Increment 29 — extend native parameter reparse validation"
          git push origin HEAD:increment/29-parameters-units
