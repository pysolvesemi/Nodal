name: Increment 32 Public Wiring Review Fix

on:
  push:
    branches:
      - automation/inc32-public-wiring-review-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Increment 32 review head
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0

      - name: Move integration test into the owned package
        shell: bash
        run: |
          set -euo pipefail
          expected=156a8e3188c9926ab45098d4881db3cdf9f897ca
          test "$(git rev-parse HEAD)" = "$expected"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/scala/testkit/test/src/nodal/AnalogEquationConstructionTests.scala')
          text = path.read_text(encoding='utf-8')
          if not text.startswith('package nodal\n'):
              raise SystemExit('unexpected Increment 32 integration-test package')
          text = text.replace('package nodal\n', 'package nodal.internal.testkit\n\nimport nodal.*\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Validate ownership and public construction semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_package_visibility.py
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          ./mill core.scala.testkit.test
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          git diff --check

      - name: Commit and push the ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pysolvesemi'
          git config user.email 'pysolvesemi@gmail.com'
          git add core/scala/testkit/test/src/nodal/AnalogEquationConstructionTests.scala
          git commit -m 'fix(increment32): use owned test package'
          git push origin HEAD:increment/32-equation-contribution-semantics-review
