name: Automation Increment 21 Closure

on:
  push:
    branches:
      - automation/increment-21-bootstrap
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: automation-increment-21-closure
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out automation source
        uses: actions/checkout@v6
        with:
          ref: automation/increment-21-bootstrap
          path: automation

      - name: Check out Increment 21 feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/21-native-verifier-pipeline
          fetch-depth: 0
          path: target

      - name: Wait for fully materialized Increment 21 branch
        working-directory: target
        run: |
          ready=0
          for attempt in $(seq 1 240); do
            git fetch --no-tags origin \
              increment/21-native-verifier-pipeline:refs/remotes/origin/increment/21-native-verifier-pipeline
            git reset --hard origin/increment/21-native-verifier-pipeline
            if test -f scripts/check_increment21.py && \
               test -f core/compiler/lib/Transforms/Verification.cpp && \
               test -f .github/workflows/increment-21-native-verification-pipeline.yml; then
              ready=1
              break
            fi
            sleep 30
          done
          test "${ready}" = 1

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('target/toolchains/lock.json', 'target/toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        working-directory: target
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate complete Increment 21 implementation
        working-directory: target
        run: |
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/include/nodal/Transforms/Verification.h \
            core/compiler/lib/Transforms/Verification.cpp \
            core/compiler/test/Unit/VerificationSessionTest.cpp
          if ! git diff --quiet; then
            git config user.name "pysolvesemi"
            git config user.email "pysolvesemi@gmail.com"
            git add \
              core/compiler/include/nodal/Transforms/Verification.h \
              core/compiler/lib/Transforms/Verification.cpp \
              core/compiler/test/Unit/VerificationSessionTest.cpp
            git commit -m "Increment 21 — normalize native verifier formatting"
            git push origin HEAD:increment/21-native-verifier-pipeline
          fi
          python3 scripts/check_increment18.py
          python3 scripts/check_increment19.py
          python3 scripts/check_increment20.py
          python3 scripts/check_increment21.py
          python3 -m unittest discover -s tests/compiler -p 'test_*.py'
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 core/compiler/test/run_increment21_tests.py \
            out/native/release/bin/nodalc \
            core/compiler/test/IR
          git diff --check

      - name: Record accepted evidence and merge Increment 21
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../automation/scripts/close_increment21.py
