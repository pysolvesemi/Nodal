name: Increment 32 Live Source Bundle

on:
  push:
    branches:
      - automation/inc32-source-bundle-live

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current Increment 32 branch
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0
      - name: Populate Mill launcher executable
        run: ./mill --version
      - name: Package Mill executable cache
        run: |
          tar -C "$HOME" -czf /tmp/nodal-inc32-mill-cache.tgz .cache/mill/download
      - name: Upload Mill executable cache
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc32-mill-cache
          path: /tmp/nodal-inc32-mill-cache.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
