name: Increment 33 final P1 repair v3 2026-09-02

on:
  push:
    branches:
      - automation/inc33-final-p1-repair-v3-20260902

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Increment 33 implementation head
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Require reviewed baseline
        run: test "$(git rev-parse HEAD)" = ef5cd258ae130d4239898020590eb1fcc42fc4d9

      - name: Apply final P1 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path: Path, marker: str, payload: str, guard: str) -> None:
              text = path.read_text(encoding="utf-8")
              if guard in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: expected one marker {marker!r}, found {text.count(marker)}")
              path.write_text(text.replace(marker, payload + marker, 1), encoding="utf-8")

          kernel_path = Path("core/scala/api/src/nodal/ElaborationConstructionKernel.scala")
          kernel = kernel_path.read_text(encoding="utf-8")
          start_marker = "  def compatibleAdd(other: AnalogDimension): AnalogDimension =\n"
          end_marker = "\n  def canonical: String ="
          if kernel.count(start_marker) != 1:
              raise SystemExit("compatibleAdd start marker is not unique")
          start = kernel.index(start_marker)
          end = kernel.index(end_marker, start)
          original = kernel[start:end]
          if "else if isUnknown then other" not in original or "else if other.isUnknown then this" not in original:
              raise SystemExit("compatibleAdd no longer matches the reviewed defect")
          replacement = (
              "  def compatibleAdd(other: AnalogDimension): AnalogDimension =\n"
              "    if isUnknown || other.isUnknown then AnalogDimension.Unknown\n"
              "    else if isZero then other.copy(isZero = other.isZero || isZero)\n"
              "    else if other.isZero then copy(isZero = isZero || other.isZero)\n"
              "    else if powers == other.powers then copy(isZero = isZero && other.isZero)\n"
              "    else AnalogDimension.Unknown\n"
          )
          kernel = kernel[:start] + replacement + kernel[end:]
          rewritten = kernel[start:start + len(replacement)]
          if rewritten != replacement:
              raise SystemExit("compatibleAdd replacement did not remain byte-exact")
          kernel_path.write_text(kernel, encoding="utf-8")

          construction_tests_path = Path(
              "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala"
          )
          insert_once(
              construction_tests_path,
              "final class PublicAnalogCompoundVoltage extends Module:\n",
              "final class PublicAnalogNestedCompoundReadDimensionMismatch extends Module:\n"
              "  val voltage: Variable[Real] = variable(Real, 0.0.V)\n"
              "\n"
              "  analogProcedure:\n"
              "    voltage := (voltage + 1.0.real) + voltage\n"
              "\n",
              "final class PublicAnalogNestedCompoundReadDimensionMismatch",
          )
          insert_once(
              construction_tests_path,
              '    test("public compound voltage assignment retains its physical dimension"):\n',
              '    test("public nested incompatible compound dimensions remain unknown"):\n'
              "      val failure = scala.util\n"
              "        .Try(\n"
              "          ConstructionKernel.inspect(\n"
              "            new PublicAnalogNestedCompoundReadDimensionMismatch\n"
              "          )\n"
              "        )\n"
              "        .failed\n"
              "        .get\n"
              "        .asInstanceOf[AnalogProceduralRuntime.Failure]\n"
              '      assert(failure.diagnostic.code == "NODAL-ANALOG-033-013")\n'
              "\n",
              "public nested incompatible compound dimensions remain unknown",
          )

          workflow_path = Path(
              ".github/workflows/increment-33-analog-procedural-assignment.yml"
          )
          insert_once(
              workflow_path,
              "      - name: Execute Scala source-semantic witness\n",
              "      - name: Execute Scala bridge regressions against nodalc\n"
              "        shell: bash\n"
              "        run: |\n"
              "          test -x out/native/release/bin/nodalc\n"
              '          NODAL_NODALC="$PWD/out/native/release/bin/nodalc" \\\n'
              "            ./mill -i core.scala.testkit.test.testOnly \\\n"
              "              nodal.internal.testkit.ScalaToMlirBridgeTests\n"
              "\n",
              "Execute Scala bridge regressions against nodalc",
          )

          checker_path = Path("scripts/check_increment33.py")
          checker = checker_path.read_text(encoding="utf-8")
          if "NODAL-INC33-067" not in checker:
              marker = '    roadmap = read_text(root, "docs/roadmap/nodal-development-todo.md")\n'
              if checker.count(marker) != 1:
                  raise SystemExit("checker roadmap marker is not unique")
              payload = (
                  "    construction_kernel = read_text(\n"
                  "        root,\n"
                  '        "core/scala/api/src/nodal/ElaborationConstructionKernel.scala",\n'
                  "    )\n"
                  "    require(\n"
                  '        "if isUnknown || other.isUnknown then AnalogDimension.Unknown"\n'
                  "        in construction_kernel,\n"
                  '        "NODAL-INC33-067: recursive dimension mismatches are not sticky",\n'
                  "    )\n"
                  "    require(\n"
                  '        "public nested incompatible compound dimensions remain unknown"\n'
                  "        in construction_tests,\n"
                  '        "NODAL-INC33-068: nested compound-dimension regression is missing",\n'
                  "    )\n"
                  "\n"
              )
              checker = checker.replace(marker, payload + marker, 1)

          if "NODAL-INC33-069" not in checker:
              marker = '        workflow = workflow_path.read_text(encoding="utf-8")\n'
              if checker.count(marker) != 1:
                  raise SystemExit("checker workflow marker is not unique")
              payload = (
                  "        require(\n"
                  '            \'NODAL_NODALC="$PWD/out/native/release/bin/nodalc"\' in workflow\n'
                  '            and "core.scala.testkit.test.testOnly" in workflow\n'
                  '            and "ScalaToMlirBridgeTests" in workflow,\n'
                  '            "NODAL-INC33-069: Scala bridge regressions do not execute against nodalc",\n'
                  "        )\n"
              )
              checker = checker.replace(marker, marker + payload, 1)
          checker_path.write_text(checker, encoding="utf-8")

          mutation_path = Path("tests/compiler/test_increment33.py")
          mutations = mutation_path.read_text(encoding="utf-8")
          required = '    "core/scala/api/src/nodal/ElaborationConstructionKernel.scala",\n'
          if required not in mutations:
              marker = '    "core/scala/api/src/nodal/AnalogProceduralRuntime.scala",\n'
              if mutations.count(marker) != 1:
                  raise SystemExit("mutation REQUIRED marker is not unique")
              mutations = mutations.replace(marker, marker + required, 1)

          if "test_recursive_dimension_mismatch_mutation_is_rejected" not in mutations:
              marker = '\n\nif __name__ == "__main__":\n'
              if mutations.count(marker) != 1:
                  raise SystemExit("mutation insertion marker is not unique")
              methods = (
                  "\n"
                  "    def test_recursive_dimension_mismatch_mutation_is_rejected(self) -> None:\n"
                  "        temporary, root = self.fixture()\n"
                  "        with temporary:\n"
                  '            path = root / "core/scala/api/src/nodal/ElaborationConstructionKernel.scala"\n'
                  "            path.write_text(\n"
                  "                path.read_text(encoding=\"utf-8\").replace(\n"
                  '                    "if isUnknown || other.isUnknown then AnalogDimension.Unknown",\n'
                  '                    "if isUnknown then other",\n'
                  "                    1,\n"
                  "                ),\n"
                  '                encoding="utf-8",\n'
                  "            )\n"
                  '            self.assert_rejected(root, "recursive dimension mismatches are not sticky")\n'
                  "\n"
                  "    def test_nested_compound_dimension_regression_mutation_is_rejected(self) -> None:\n"
                  "        temporary, root = self.fixture()\n"
                  "        with temporary:\n"
                  "            path = (\n"
                  "                root\n"
                  '                / "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala"\n'
                  "            )\n"
                  "            path.write_text(\n"
                  "                path.read_text(encoding=\"utf-8\").replace(\n"
                  '                    "public nested incompatible compound dimensions remain unknown",\n'
                  '                    "nested compound-dimension regression removed",\n'
                  "                    1,\n"
                  "                ),\n"
                  '                encoding="utf-8",\n'
                  "            )\n"
                  '            self.assert_rejected(root, "nested compound-dimension regression is missing")\n'
                  "\n"
                  "    def test_nodalc_bridge_boundary_mutation_is_rejected(self) -> None:\n"
                  "        temporary, root = self.fixture()\n"
                  "        with temporary:\n"
                  '            path = root / ".github/workflows/increment-33-analog-procedural-assignment.yml"\n'
                  "            path.write_text(\n"
                  "                path.read_text(encoding=\"utf-8\").replace(\n"
                  '                    \'NODAL_NODALC="$PWD/out/native/release/bin/nodalc"\',\n'
                  '                    \'NODAL_NODALC_DISABLED="$PWD/out/native/release/bin/nodalc"\',\n'
                  "                    1,\n"
                  "                ),\n"
                  '                encoding="utf-8",\n'
                  "            )\n"
                  "            self.assert_rejected(\n"
                  "                root,\n"
                  '                "Scala bridge regressions do not execute against nodalc",\n'
                  "            )\n"
              )
              mutations = mutations.replace(marker, methods + marker, 1)
          mutation_path.write_text(mutations, encoding="utf-8")
          PY

      - name: Install pinned native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format and run focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          ./mill mill.scalalib.scalafmt/reformatAll
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          ./nodal core scala
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          test -x out/native/release/bin/nodalc
          NODAL_NODALC="$PWD/out/native/release/bin/nodalc" \
            ./mill -i core.scala.testkit.test.testOnly \
              nodal.internal.testkit.ScalaToMlirBridgeTests
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Publish validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            .github/workflows/increment-33-analog-procedural-assignment.yml \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala \
            scripts/check_increment33.py \
            tests/compiler/test_increment33.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(increment33): keep nested mismatches sticky and exercise nodalc'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
