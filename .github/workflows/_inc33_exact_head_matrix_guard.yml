name: Increment 33 Exact-Head Matrix Guard

on:
  push:
    branches:
      - automation/inc33-exact-head-matrix-guard-20260831

permissions:
  actions: read
  contents: write
  pull-requests: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact Increment 33 branch
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Wait for complete exact-head workflow matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          required=$(cat <<'EOF'
          Core CI
          Increment 13 Core Semantic Candidates
          Increment 14 Pipeline and Interface Candidates
          Increment 15 Unified Public API Freeze
          Increment 16 Elaboration Construction Kernel
          Increment 17 Source Origin Naming
          Increment 18 MLIR Dialect Skeleton
          Increment 19 Core MLIR Model
          Increment 20 Scala-to-MLIR Bridge
          Increment 21 Native Semantic Pipeline
          Increment 22 Cross-Layer Diagnostics
          Increment 23 Backend Framework
          Increment 24 Minimal Analog IR
          Increment 25 RC Filter Vertical Slice
          Increment 26 Reproducibility Contract
          Increment 27 Natures and Disciplines
          Increment 28 Electrical Conservative Connectivity
          Increment 29 Parameters Constants Ranges and Units
          Increment 30 Analog Numeric Types and Expression Typing
          Increment 31 Potential and Flow Access
          Increment 32 Equation and Contribution Semantics
          Increment 133 Analog Semantic API
          Increment 33 Analog Procedural Assignment
          EOF
          )
          printf '%s\n' "$required" | sed 's/^          //' > /tmp/required-workflows.txt

          for attempt in $(seq 1 150); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/pysolvesemi/Nodal/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
              > /tmp/runs.json
            python3 - "$head" <<'PY'
          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          required = [
              line.strip()
              for line in Path('/tmp/required-workflows.txt').read_text().splitlines()
              if line.strip()
          ]
          runs = json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs', [])
          latest = {}
          for run in sorted(runs, key=lambda item: (item.get('run_number', 0), item.get('id', 0))):
              if run.get('head_sha') == head:
                  latest[run.get('name')] = run
          missing = [name for name in required if name not in latest]
          pending = [
              name for name in required
              if name in latest and latest[name].get('status') != 'completed'
          ]
          failed = [
              (name, latest[name].get('id'), latest[name].get('conclusion'))
              for name in required
              if name in latest
              and latest[name].get('status') == 'completed'
              and latest[name].get('conclusion') != 'success'
          ]
          report = {
              'head': head,
              'required_count': len(required),
              'observed_count': len(latest),
              'missing': missing,
              'pending': pending,
              'failed': failed,
              'runs': {
                  name: {
                      'id': latest[name].get('id'),
                      'status': latest[name].get('status'),
                      'conclusion': latest[name].get('conclusion'),
                  }
                  for name in required if name in latest
              },
          }
          Path('/tmp/inc33-matrix-status.json').write_text(json.dumps(report, indent=2) + '\n')
          if failed:
              print(json.dumps(report, indent=2))
              raise SystemExit(2)
          if missing or pending:
              raise SystemExit(1)
          print(json.dumps(report, indent=2))
          PY
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$rc" -eq 2 ]; then
              exit 1
            fi
            if [ "$attempt" -eq 150 ]; then
              cat /tmp/inc33-matrix-status.json
              echo 'Timed out waiting for exact-head workflow matrix.' >&2
              exit 1
            fi
            sleep 20
          done

      - name: Verify pull request identity and publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          pr=$(gh api "/repos/pysolvesemi/Nodal/pulls?state=open&head=pysolvesemi:increment/33-analog-variables-procedural-assignment-v5" --jq '.[0]')
          test "$(printf '%s' "$pr" | jq -r '.number')" = '100'
          test "$(printf '%s' "$pr" | jq -r '.draft')" = 'false'
          test "$(printf '%s' "$pr" | jq -r '.head.sha')" = "$head"
          test "$(printf '%s' "$pr" | jq -r '.base.ref')" = 'dev'

          git push --force origin "$head":refs/heads/checkpoint/increment-33-exact-head-matrix-green
          runs=$(jq -r '.runs | to_entries | map("\(.key)=\(.value.id)") | join(", ")' /tmp/inc33-matrix-status.json)
          gh api --method POST \
            -f body="Complete Increment 33 exact-head matrix passed on \`$head\` (23/23 workflows). Run evidence: $runs" \
            "/repos/pysolvesemi/Nodal/issues/100/comments"
