name: Increment 29 Completion Repair

on:
  push:
    branches:
      - increment/29-parameters-units
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-29-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    name: increment-29/complete-review-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/29-parameters-units
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install locked toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Make completion replacements deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/repair_increment29_complete.py")
          text = path.read_text(encoding="utf-8")
          old = """replace_once(
              \"core/compiler/lib/Backend/AnalogVerticalSlice.cpp\",
              '''  llvm::sort(parameters,
                       [](Operation *lhs, Operation *rhs) { return symbolName(lhs) < symbolName(rhs); });
          ''',
              '''  if (failed(orderParametersByDependency(definition, parameters)))
              return failure();
          ''',
          )
          """
          new = """replace_once(
              \"core/compiler/lib/Backend/AnalogVerticalSlice.cpp\",
              '''  llvm::sort(parameters,
                       [](Operation *lhs, Operation *rhs) { return symbolName(lhs) < symbolName(rhs); });
            llvm::sort(ports, [](Operation *lhs, Operation *rhs) {
              return lhs->getAttrOfType<StringAttr>(\"name\").getValue() <
                     rhs->getAttrOfType<StringAttr>(\"name\").getValue();
            });
          ''',
              '''  if (failed(orderParametersByDependency(definition, parameters)))
              return failure();
            llvm::sort(ports, [](Operation *lhs, Operation *rhs) {
              return lhs->getAttrOfType<StringAttr>(\"name\").getValue() <
                     rhs->getAttrOfType<StringAttr>(\"name\").getValue();
            });
          ''',
          )
          """
          if text.count(old) != 1:
              raise SystemExit(f"completion ordering anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          escaped_old = r'"permissions:\n  contents: read"'
          escaped_new = r'"permissions:\\n  contents: read"'
          if text.count(escaped_old) != 1:
              raise SystemExit(
                  f"completion workflow-token anchor count: {text.count(escaped_old)}"
              )
          text = text.replace(escaped_old, escaped_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply all review repairs
        run: python3 scripts/repair_increment29_complete.py

      - name: Remove one-shot repair automation
        run: |
          rm -f scripts/repair_increment29_complete.py
          rm -f .github/workflows/increment-29-complete.yml
          rm -f scripts/repair_increment29_review.py
          rm -f .github/workflows/increment-29-review-repair.yml
          rm -f scripts/repair_increment29.py
          rm -f .github/workflows/increment-29-repair.yml

      - name: Apply deterministic formatting
        run: |
          ./nodal style fix \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate contracts and mutation coverage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in $(seq 18 29); do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_markdown.py
          git diff --check

      - name: Build lint and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Prove repaired parameter semantics and rendering
        run: |
          set -euo pipefail
          compiler="${PWD}/out/native/release/bin/nodalc"
          translator="${PWD}/out/native/release/bin/nodal-translate"
          pipeline='builtin.module(nodal-verify-parameters)'

          "${compiler}" \
            --pass-pipeline="${pipeline}" \
            core/compiler/test/IR/parameters-units.mlir \
            >/tmp/parameters-units.mlir

          "${translator}" \
            --nodal-to-verilog-a \
            core/compiler/test/IR/parameter-rendering.mlir \
            | tee /tmp/parameter-rendering.va

          grep -F 'parameter real R_BARE = 1k from [1k:2k]; // unit: kΩ/V' /tmp/parameter-rendering.va
          grep -F 'localparam integer WIDE = 340282366920938463463374607431768211455;' /tmp/parameter-rendering.va
          grep -F 'parameter integer Z_BASE = 2;' /tmp/parameter-rendering.va
          grep -F 'parameter integer A_DEP = Z_BASE;' /tmp/parameter-rendering.va
          z_base_line=$(grep -nF 'parameter integer Z_BASE = 2;' /tmp/parameter-rendering.va | cut -d: -f1)
          a_dep_line=$(grep -nF 'parameter integer A_DEP = Z_BASE;' /tmp/parameter-rendering.va | cut -d: -f1)
          test "${z_base_line}" -lt "${a_dep_line}"

          check_rejection() {
            fixture="$1"
            code="$2"
            if "${compiler}" --pass-pipeline="${pipeline}" \
                "core/compiler/test/IR/parameters-units-invalid-${fixture}.mlir" \
                >"/tmp/${fixture}.out" 2>"/tmp/${fixture}.err"; then
              echo "invalid ${fixture} parameter model was accepted" >&2
              exit 1
            fi
            grep -F "${code}" "/tmp/${fixture}.err"
          }

          check_rejection unit NODAL-UNIT-SCALE-001
          check_rejection constraint NODAL-PARAMETER-CONSTRAINT-001
          check_rejection envelope NODAL-PARAMETER-ENVELOPE-001
          check_rejection dynamic NODAL-DYNAMIC-VALUE-001
          check_rejection override NODAL-PARAMETER-OVERRIDE-001
          check_rejection cycle NODAL-CONSTANT-CYCLE-001

      - name: Commit completed Increment 29 repairs
        run: |
          git add -A
          git commit -m "Increment 29 — resolve all parameter review findings"
          git push origin HEAD:increment/29-parameters-units
