          write(
              "core/compiler/test/IR/analog-differential-integral-invalid-dimension.mlir",
              '''module attributes { nodal.target.profile = "analog" } {
            "nodal.module"() <{metadata = {}, sym_name = "InvalidDimension"}> ({
            ^bb0:
