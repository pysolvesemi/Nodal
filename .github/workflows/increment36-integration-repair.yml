name: Increment 36 Integration Repair
on:
  push:
    branches: [automation/increment36-integration-repair]
permissions:
  contents: read
  actions: write
jobs:
  cleanup-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f4eb8593aad5af4ce4898649106344755c0eaed6
      - name: Cancel only obsolete Increment 36 PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in 9cd163d13ecaa616a2086e2d2844e3e19a5c2529 de82c2ecf507ab1084fabfdcfd92c4e109fa5361 50015ebb68f3899e2dfba8c7a935ad8a0c0cee63 f0fc87b0bb64f39ca3a86cf172fb96fbf3646f3c 1cc97f9fef2692129b148c65db6f46a385cfc650 ec2fdd93afdc242087cffda71436508ee200ce93; do
            for id in $(gh api "repos/pysolvesemi/Nodal/actions/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[] | select(.event == "pull_request" and .status != "completed") | .id'); do
              gh api --method POST "repos/pysolvesemi/Nodal/actions/runs/$id/cancel" || true
            done
          done
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - run: ./nodal bootstrap --mode prebuilt --prefix "$RUNNER_TEMP/native"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33946712248
          name: increment36-native-tools
          path: /tmp/previous-native
      - name: Package exact previous native tools and their locked shared libraries
        shell: bash
        run: |
          mkdir -p /tmp/runtime/bin /tmp/runtime/lib
          find /tmp/previous-native -type f -name 'nodal*' -exec cp '{}' /tmp/runtime/bin/ ';'
          chmod +x /tmp/runtime/bin/*
          for file in /tmp/runtime/bin/*; do
            LD_LIBRARY_PATH="$RUNNER_TEMP/native/lib" ldd "$file" | awk -v root="$RUNNER_TEMP/native/lib/" '$3 ~ root {print $3}'
          done | sort -u > /tmp/libraries.txt
          while IFS= read -r file; do cp -L "$file" /tmp/runtime/lib/; done < /tmp/libraries.txt
          printf '%s\n' f0fc87b0bb64f39ca3a86cf172fb96fbf3646f3c > /tmp/runtime/source-commit.txt
          LD_LIBRARY_PATH=/tmp/runtime/lib /tmp/runtime/bin/nodalc --version
          tar -C /tmp -czf /tmp/increment36-debug-runtime.tar.gz runtime
      - uses: actions/upload-artifact@v4
        with:
          name: increment36-debug-runtime
          path: /tmp/increment36-debug-runtime.tar.gz
          retention-days: 1
