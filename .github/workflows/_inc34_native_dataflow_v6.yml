name: Increment 34 Native Dataflow v6

on:
  push:
    branches:
      - automation/inc34-native-dataflow-v6
    paths:
      - '.github/automation/inc34_run_native_dataflow_v6.sh'
      - '.github/workflows/_inc34_native_dataflow_v6.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-native-dataflow-v6
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-native-dataflow-v6
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Execute guarded Increment 34 continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_run_native_dataflow_v6.sh \
            "${GITHUB_WORKSPACE}/controller" \
            "${GITHUB_WORKSPACE}/work" \
            "${RUNNER_TEMP}/inc34-v6"
