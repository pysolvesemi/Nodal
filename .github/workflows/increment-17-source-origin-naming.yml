name: Increment 17 Source Origin Naming

on:
  push:
    branches:
      - increment/17-source-origin-naming
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  repair-source-origin:
    name: increment-17/repair-source-origin
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out authoritative Increment 17 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/17-source-origin-naming

      - name: Repair source-frame and binding resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/scala/api/src/nodal/SemanticOriginKernel.scala")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''  private val declarationPattern =
            raw"\\b(?:lazy\\s+val|val|var)\\s+([A-Za-z_][A-Za-z0-9_]*)".r
''',
                  '''  private val declarationPattern =
            """^\\s*(?:(?:private(?:\\[[^\\]]+\\])?|protected(?:\\[[^\\]]+\\])?|final|lazy|override|inline|transparent)\\s+)*(?:val|var)\\s+([A-Za-z_][A-Za-z0-9_]*)\\b""".r
''',
                  "declaration pattern",
              ),
              (
                  '''    val userIndex = frames.indexWhere(isUserFrame)
            val user = if userIndex >= 0 then Some(frames(userIndex)) else None
''',
                  '''    val userFrames = frames.zipWithIndex.filter: (frame, _) =>
              isUserFrame(frame)
            val userCandidate = userFrames
              .find: (frame, _) =>
                frame.getMethodName == "<init>" &&
                  Option(frame.getFileName)
                    .flatMap(fileName => locateSource(fileName, frame.getClassName))
                    .nonEmpty
              .orElse(userFrames.headOption)
            val userIndex = userCandidate.map(_._2).getOrElse(-1)
            val user = userCandidate.map(_._1)
''',
                  "user-frame selection",
              ),
              (
                  '''  private def bindingNear(
            lines: Vector[String],
            currentIndex: Int
          ): Option[(Int, String)] =
            val lower = math.max(0, currentIndex - 5)
            val candidates = (currentIndex to lower by -1).iterator.flatMap: index =>
              declarationPattern.findFirstMatchIn(lines(index)).map: matched =>
                index -> matched.group(1)
            candidates.nextOption().filter(_._2 != "_")
''',
                  '''  private def bindingNear(
            lines: Vector[String],
            currentIndex: Int
          ): Option[(Int, String)] =
            val lower = math.max(0, currentIndex - 8)
            val upper = math.min(lines.size - 1, currentIndex + 8)
            val indexes = (lower to upper).sortBy: index =>
              (math.abs(index - currentIndex), if index <= currentIndex then 0 else 1)
            indexes.iterator
              .flatMap: index =>
                declarationPattern.findFirstMatchIn(lines(index)).map: matched =>
                  index -> matched.group(1)
              .nextOption()
              .filter(_._2 != "_")
''',
                  "nearby binding lookup",
              ),
              (
                  '''  private def ownerTypeName(ownerClass: String): Option[String] =
            ownerClass
              .split("\\\\.")
              .lastOption
              .toVector
              .flatMap(_.split("\\\\$").toVector)
              .find(segment => segment.nonEmpty && segment != "package")
              .map(cleanIdentifier(_, "source"))
''',
                  '''  private def ownerTypeName(ownerClass: String): Option[String] =
            ownerClass
              .split("\\\\.")
              .lastOption
              .flatMap(
                _.split("\\\\$").find(segment => segment.nonEmpty && segment != "package")
              )
              .map(_.takeWhile(character => Character.isJavaIdentifierPart(character)))
              .filter(_.nonEmpty)
''',
                  "owner type extraction",
              ),
          ]

          for old, new, label in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise RuntimeError(f"{label} anchor is not unique")
              text = text.replace(old, new, 1)

          old = '''  private def sourceIdentityScore(path: Path, ownerClass: String): Int =
            try
              val source = Files.readString(path)
              val packages = sourcePackagePattern
                .findAllMatchIn(source)
                .map(_.group(1))
                .toSet
              val packageScore = ownerPackage(ownerClass)
                .filter(packages.contains)
                .map(_ => 100)
                .getOrElse(0)
              val typeScore = ownerTypeName(ownerClass)
                .map: typeName =>
                  val declaration =
                    (
                      "(?m)^\\\\s*(?:(?:final|sealed|abstract|case)\\\\s+)*" +
                        "(?:class|object|trait|enum)\\\\s+" +
                        java.util.regex.Pattern.quote(typeName) +
                        "\\\\b"
                    ).r
                  if declaration.findFirstIn(source).nonEmpty then 50 else 0
                .getOrElse(0)
              val pathScore = ownerPackage(ownerClass)
                .map(_.replace('.', '/'))
                .filter(packagePath => repositoryPath(path).contains(packagePath))
                .map(_ => 10)
                .getOrElse(0)
              packageScore + typeScore + pathScore
            catch case _: Exception => 0
'''
          new = '''  private def sourceIdentityScore(path: Path, ownerClass: String): Int =
            try
              val source = Files.readString(path)
              val ownerPackageValue = ownerPackage(ownerClass)
              val ownerTypeValue = ownerTypeName(ownerClass)
              val packages = sourcePackagePattern
                .findAllMatchIn(source)
                .map(_.group(1))
                .toSet
              val packageScore = ownerPackageValue
                .filter(packages.contains)
                .map(_ => 500)
                .getOrElse(0)
              val typeScore = ownerTypeValue
                .map: typeName =>
                  val declaration =
                    (
                      "(?m)^\\\\s*(?:(?:final|sealed|abstract|case)\\\\s+)*" +
                        "(?:class|object|trait|enum)\\\\s+" +
                        java.util.regex.Pattern.quote(typeName) +
                        "\\\\b"
                    ).r
                  if declaration.findFirstIn(source).nonEmpty then 1000 else 0
                .getOrElse(0)
              val pathScore = ownerPackageValue
                .map(_.replace('.', '/'))
                .filter: packagePath =>
                  val candidate = repositoryPath(path)
                  candidate.contains(s"/$packagePath/") ||
                  candidate.startsWith(s"$packagePath/")
                .map(_ => 250)
                .getOrElse(0)
              packageScore + typeScore + pathScore
            catch case _: Exception => 0
'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError("source identity scoring anchor is not unique")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill scalafix.fix

      - name: Validate repaired semantic origin behavior
        run: |
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py --compile
          python3 tests/api/test_increment16.py
          python3 tests/api/test_increment17.py
          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/scala/api/src/nodal/SemanticOriginKernel.scala
          git commit -m "Increment 17 — fix semantic binding and source identity"
          git pull --rebase origin increment/17-source-origin-naming
          git push origin HEAD:increment/17-source-origin-naming

  source-origin:
    name: increment-17/source-origin
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bootstrap pinned contract toolchain
        run: |
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" >> "$GITHUB_ENV"

      - name: Validate semantic source identity and predecessor contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py --compile
          python3 tests/api/test_increment16.py
          python3 tests/api/test_increment17.py
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref origin/dev
          git diff --check
