name: Increment 30 Final Semantic Review Fixes

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-final-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: increment-30-final-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Apply semantic fixes and regression coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_increment30_final_review_fixes.py")
          text = path.read_text(encoding="utf-8")

          start_marker = 'WORKFLOW = ".github/workflows/increment-30-analog-numeric-types.yml"'
          end_marker = '''insert_after_line(
              "docs/implementation/increment30-analog-numeric-types.md",'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]

          cleanup_start = text.index("for temporary in (")
          cleanup_end = text.index('print("Increment 30 final semantic review fixes applied")')
          text = (
              text[:cleanup_start]
              + '(ROOT / "scripts/apply_increment30_final_review_fixes.py").unlink()\n\n'
              + text[cleanup_end:]
          )
          path.write_text(text, encoding="utf-8")
          PY

          python3 scripts/apply_increment30_final_review_fixes.py
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/run_clang_tools.py format \
            --fix \
            --toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Publish semantic fixes
        run: |
          set -euo pipefail
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "semantic patch unexpectedly modifies a workflow" >&2
            git diff --cached --name-status >&2
            exit 1
          fi
          git commit -m "Increment 30 — close final semantic review gaps"
          git push origin HEAD:increment/30-analog-numeric-types
