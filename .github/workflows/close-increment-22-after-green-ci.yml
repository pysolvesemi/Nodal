name: Close Increment 22 After Green CI

on:
  push:
    branches:
      - automation/inc21-inc22-probe-stage
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: close-increment-22-after-green-ci
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out automation branch
        uses: actions/checkout@v6
        with:
          ref: automation/inc21-inc22-probe-stage
          fetch-depth: 0

      - name: Wait for Increment 22 PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=''
          for attempt in $(seq 1 90); do
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head increment/22-circt-conversion-legalizer --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then break; fi
            sleep 20
          done
          if [ -z "$pr" ]; then
            echo 'Increment 22 PR did not appear before timeout' >&2
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for implementation-head checks
        id: implementation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --required --watch --interval 20
          head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          dedicated=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --commit "$head" --workflow increment-22-circt-conversion-legalizer.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          core=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --commit "$head" --workflow ci.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$dedicated"
          test -n "$core"
          echo "dedicated=$dedicated" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"

      - name: Record accepted implementation evidence
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DEDICATED_RUN: ${{ steps.implementation.outputs.dedicated }}
          CORE_RUN: ${{ steps.implementation.outputs.core }}
        run: |
          git fetch --no-tags origin \
            increment/22-circt-conversion-legalizer:refs/remotes/origin/increment/22-circt-conversion-legalizer \
            dev:refs/remotes/origin/dev
          git checkout -B increment/22-circt-conversion-legalizer \
            origin/increment/22-circt-conversion-legalizer
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          pr = int(os.environ['PR_NUMBER'])
          dedicated = int(os.environ['DEDICATED_RUN'])
          core = int(os.environ['CORE_RUN'])

          roadmap_path = Path('docs/roadmap/nodal-development-todo.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          replacements = (
              ('**Revision:** 1.25', '**Revision:** 1.26'),
              (
                  '- [ ] **Increment 22 — CIRCT conversion strategy and legalizer skeleton**\n'
                  '  - Add the first registered Nodal-to-CIRCT conversion strategy, exact legalizer subset, and transactional pass skeleton.\n',
                  '- [x] **Increment 22 — CIRCT conversion strategy and legalizer skeleton**\n'
                  '  - Add the first registered Nodal-to-CIRCT conversion strategy, exact legalizer subset, and transactional pass skeleton.\n'
                  f'  - Evidence: [`NodalCirctConversionStrategy-DG-v1.0.md`](../design-gates/NodalCirctConversionStrategy-DG-v1.0.md), '
                  f'[`increment22-circt-conversion-legalizer.md`](../implementation/increment22-circt-conversion-legalizer.md), '
                  f'PR [#{pr}](https://github.com/pysolvesemi/Nodal/pull/{pr}), '
                  f'dedicated validation run [{dedicated}](https://github.com/pysolvesemi/Nodal/actions/runs/{dedicated}), '
                  f'and Core CI run [{core}](https://github.com/pysolvesemi/Nodal/actions/runs/{core}).\n'
              ),
          )
          for old, new in replacements:
              if roadmap.count(old) != 1:
                  raise RuntimeError(f'roadmap anchor count for {old!r}: {roadmap.count(old)}')
              roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap, encoding='utf-8')

          manifest_path = Path('tests/compiler/fixtures/increment22/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['status'] = 'validated-circt-legalizer-skeleton'
          manifest['evidence'] = {
              'pull_request': pr,
              'dedicated_run': dedicated,
              'core_ci_run': core,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/check_increment22.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/nodal-development-todo.md \
            tests/compiler/fixtures/increment22/manifest.json
          git commit -m 'Increment 22 — record accepted CI evidence'
          git push origin HEAD:increment/22-circt-conversion-legalizer

      - name: Wait for evidence-head checks and merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --required --watch --interval 20
          final_head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch \
            --subject 'Increment 22 — CIRCT conversion strategy and legalizer skeleton'
          merge_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json mergeCommit --jq '.mergeCommit.oid')
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for post-merge Core CI
        id: postmerge
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          run=''
          for attempt in $(seq 1 90); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --branch dev \
              --commit "$MERGE_SHA" --workflow ci.yml --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0].databaseId // empty')
            if [ -n "$run" ]; then break; fi
            sleep 20
          done
          test -n "$run"
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Publish closure status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          IMPLEMENTATION_HEAD: ${{ steps.implementation.outputs.head }}
          DEDICATED_RUN: ${{ steps.implementation.outputs.dedicated }}
          CORE_RUN: ${{ steps.implementation.outputs.core }}
          FINAL_HEAD: ${{ steps.merge.outputs.final_head }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          POSTMERGE_RUN: ${{ steps.postmerge.outputs.run }}
        run: |
          git checkout automation/inc21-inc22-probe-stage
          mkdir -p status
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {key.lower(): (value or None) for key, value in os.environ.items()
                     if key in {'JOB_STATUS','PR_NUMBER','IMPLEMENTATION_HEAD','DEDICATED_RUN','CORE_RUN','FINAL_HEAD','MERGE_SHA','POSTMERGE_RUN'}}
          Path('status/increment22-closure.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/increment22-closure.json
          git commit -m 'Automation — publish Increment 22 closure status' || true
          git push origin HEAD:automation/inc21-inc22-probe-stage
