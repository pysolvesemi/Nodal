name: F043 PR139 formatted ownership targeted qualification
on:
  push:
    branches: ['ci-control/f043-pr139-3f7abea7-ownership-v1']
    paths: ['.github/workflows/f043-pr139-3f7abea7-ownership-dispatch.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: f043-pr139-3f7abea7-ownership-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Validate repaired identities and dispatch four affected checks once
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path

          REPO = "pysolvesemi/Nodal"
          REPO_ID = 1340301335
          PR = 139
          TARGET = "3d5a6f259505ea5084cf7606c0cfeb92e5843e41"
          TARGET_TREE = "ac138f1d24e30671937a7e1b973618d5d10d8ec4"
          HEAD = '3f7abea70797576866bb5af645685ec2aca34572'
          TREE = 'fd6b72dcf084ee36232651dd920b5df7ae0eb048'
          PARENT = '0af7a0942888aaa06f3c0437140bdfb160539204'
          PARENT_TREE = '838a820f9578735230dbe01fe7b0bdd0f8c99c05'
          GITHUB_TREE = "61e6829f2a84dbc35aff1091ffcaed027449314c"
          REF = "increment/43-analog-arrays-generation"
          CONTROL = 'ci-control/f043-pr139-3f7abea7-ownership-v1'
          FILE = '.github/workflows/f043-pr139-3f7abea7-ownership-dispatch.yml'
          SOURCE_FILES = {'core/scala/testkit/test/src/nodal/internal/testkit/Increment43RangeConstructionTests.scala': '3b27e5104b6330d682882c6f4f81f9223705dddb'}
          WORKFLOWS = {
              338626156: (".github/workflows/ci.yml", "906f29eff255f820b540e13111d4494e872daccf",
                          "8e60508454a7d56af871e85cf92e54c608240f6fb156967563d90ac16dc12a20"),
              342056804: (".github/workflows/increment-20-scala-mlir-bridge.yml", "6408a35a0353adaefc3d85a08246d5238e302a0e",
                          "72589312a568704f6a68a008cd5ea67af1b6ff4c1ff1817aa3c6180d8099fc4e"),
              344284403: (".github/workflows/increment-28-electrical-connectivity.yml", "0cfddfcf3c753b4bd1f915ac361b840ec3fc4ae4",
                          "a70851c22b0f8c2d104a3a5500998e08f20f48bd3560794a2ae831516f513c8e"),
              344342524: (".github/workflows/increment-29-parameters-units.yml", "b05c9bac999a55b824584287502bd24b5395f026",
                          "f69d4c5e57791839e3654292d90c6cbea92760797914d93c564abe04b75f16b4"),
          }
          PRIOR_RUNS = {
              36982974526: (338626156, {110761496769, 110761496891, 110761497091, 110764888283}),
              36983004643: (342056804, {110761596423}),
              36983033183: (344284403, {110761680300}),
              36983059838: (344342524, {110761773680}),
          }
          PREFIX = "/repos/" + REPO
          POSTS = {PREFIX + f"/actions/workflows/{workflow}/dispatches" for workflow in WORKFLOWS}
          ACTIVE = {"queued", "in_progress", "waiting", "pending", "requested"}


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("API redirect refused")


          class Api:
              def __init__(self, token):
                  self.token = token
                  self.posts = set()
                  self.opener = urllib.request.build_opener(NoRedirect())

              def __call__(self, method, path, payload=None):
                  require(path.startswith(PREFIX + "/") and ".." not in path, "unexpected API destination")
                  if method == "POST":
                      require(path in POSTS and payload == {"ref": REF} and path not in self.posts,
                              "write is not a fresh allowlisted dispatch")
                      self.posts.add(path)
                  else:
                      require(method == "GET" and payload is None, "unexpected operation")
                  request = urllib.request.Request(
                      "https://api.github.com" + path, method=method,
                      data=None if payload is None else json.dumps(payload).encode(),
                      headers={"Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
                  with self.opener.open(request, timeout=30) as response:
                      if method == "POST":
                          require(response.status == 204, "dispatch not acknowledged")
                          return None
                      raw = response.read(2 * 1024 * 1024 + 1)
                      require(len(raw) <= 2 * 1024 * 1024, "API response exceeds bound")
                      return json.loads(raw)


          def pages(api, path, key):
              result = []
              total = None
              separator = "&" if "?" in path else "?"
              for page in range(1, 21):
                  response = api("GET", path + separator + f"per_page=100&page={page}")
                  count = response["total_count"]
                  require(type(count) is int and 0 <= count <= 2000, "invalid inventory count")
                  require(total is None or total == count, "inventory moved during pagination")
                  total = count
                  batch = response[key]
                  require(isinstance(batch, list) and len(batch) == min(100, total - len(result)),
                          "incomplete inventory page")
                  result.extend(batch)
                  if len(result) == total:
                      require(len({entry["id"] for entry in result}) == len(result), "duplicate inventory identities")
                      return result
              raise RuntimeError("inventory pagination exceeded bound")


          def identities(api, environment, workflow):
              require(environment["GITHUB_REPOSITORY"] == REPO and
                      environment["GITHUB_REPOSITORY_ID"] == str(REPO_ID) and
                      environment["GITHUB_REF"] == "refs/heads/" + CONTROL and
                      environment["GITHUB_EVENT_NAME"] == "push" and
                      environment["GITHUB_RUN_ATTEMPT"] == "1" and
                      re.fullmatch(r"[0-9a-f]{40}", environment["GITHUB_SHA"]), "wrong controller context or repeat")
              controller = api("GET", PREFIX + "/commits/" + environment["GITHUB_SHA"])
              require([p["sha"] for p in controller["parents"]] == [TARGET] and
                      [f["filename"] for f in controller["files"]] == [FILE] and
                      controller["files"][0]["status"] == "added", "controller is not the scoped direct target child")
              for ref, sha in ((CONTROL, environment["GITHUB_SHA"]), ("dev", TARGET), (REF, HEAD)):
                  require(api("GET", PREFIX + "/git/ref/heads/" + ref)["object"]["sha"] == sha, "live ref moved: " + ref)
              require(api("GET", PREFIX + "/git/commits/" + TARGET)["tree"]["sha"] == TARGET_TREE,
                      "integration tree changed")
              require(api("GET", PREFIX + "/git/commits/" + PARENT)["tree"]["sha"] == PARENT_TREE,
                      "prerequisite tree changed")
              pr = api("GET", PREFIX + f"/pulls/{PR}")
              require(pr["state"] == "open" and pr["merged"] is False and pr["draft"] is True, "PR state changed")
              require(pr["base"]["ref"] == "dev" and pr["base"]["sha"] == TARGET and
                      pr["head"]["ref"] == REF and pr["head"]["sha"] == HEAD and
                      pr["base"]["repo"]["id"] == REPO_ID and pr["head"]["repo"]["id"] == REPO_ID,
                      "PR identities changed")
              commit = api("GET", PREFIX + "/commits/" + HEAD)
              require(commit["commit"]["tree"]["sha"] == TREE and
                      [p["sha"] for p in commit["parents"]] == [PARENT] and
                      {f["filename"]: f["sha"] for f in commit["files"]} == SOURCE_FILES and
                      len(commit["files"]) == len(SOURCE_FILES) and
                      all(f["status"] == "modified" for f in commit["files"]) and
                      "[skip ci]" in commit["commit"]["message"], "candidate identity or one-file format-repair scope changed")
              path, blob, digest = WORKFLOWS[workflow]
              registered = api("GET", PREFIX + f"/actions/workflows/{workflow}")
              require(registered["id"] == workflow and registered["state"] == "active" and registered["path"] == path,
                      "wrong registered workflow")
              for revision in (HEAD, TARGET):
                  top = api("GET", PREFIX + "/git/trees/" + revision)
                  require(top.get("truncated") is False and
                          [entry["sha"] for entry in top["tree"] if entry["path"] == ".github" and
                           entry["type"] == "tree"] == [GITHUB_TREE], "audited inherited workflow tree changed")
                  content = api("GET", PREFIX + "/contents/" + path + "?ref=" + revision)
                  require(content["encoding"] == "base64" and content["sha"] == blob, "workflow blob or encoding changed")
                  definition = base64.b64decode(content["content"], validate=False)
                  require(hashlib.sha256(definition).hexdigest() == digest and b"\n  workflow_dispatch:" in definition,
                          "workflow definition changed")


          QUALIFIED = "b686a14933137a6f372e23d94e9ff5c4803d720d"


          def qualified_predecessor(api):
              for run_id, (workflow, expected_jobs) in PRIOR_RUNS.items():
                  run = api("GET", PREFIX + f"/actions/runs/{run_id}")
                  require(run["id"] == run_id and run["workflow_id"] == workflow and
                          run["head_sha"] == QUALIFIED and run["head_branch"] == REF and
                          run["event"] == "workflow_dispatch" and run["run_attempt"] == 1 and
                          run["status"] == "completed" and run["conclusion"] == "success",
                          "prerequisite run changed or is not successful and terminal")
                  jobs = pages(api, PREFIX + f"/actions/runs/{run_id}/jobs?filter=latest", "jobs")
                  require({job["id"] for job in jobs} == expected_jobs and all(
                      job["run_id"] == run_id and job["head_sha"] == QUALIFIED and
                      job["run_attempt"] == 1 and job["status"] == "completed" and
                      job["conclusion"] == "success" for job in jobs), "prerequisite job changed")
                  if workflow == 342056804:
                      require(any(step["name"] == "Compile Scala bridge and prove native round-trip" and
                                  step["status"] == "completed" and step["conclusion"] == "success"
                                  for job in jobs for step in job["steps"]), "configured prerequisite bridge did not pass")



          FAILED_RUNS = {
              36999113023: (338626156, 110812477567, "Validate contracts, style, and online provenance"),
              36999141635: (342056804, 110812567777, "Validate bridge and predecessor contracts"),
              36999169103: (344284403, 110812653943, "Validate contracts and mutation tests"),
              36999197972: (344342524, 110812747964, "Validate contracts and mutation tests"),
          }


          def diagnosed_failures(api):
              for run_id, (workflow, failed_job, failed_step) in FAILED_RUNS.items():
                  run = api("GET", PREFIX + f"/actions/runs/{run_id}")
                  require(run["id"] == run_id and run["workflow_id"] == workflow and
                          run["head_sha"] == PARENT and run["head_branch"] == REF and
                          run["event"] == "workflow_dispatch" and run["run_attempt"] == 1 and
                          run["status"] == "completed" and run["conclusion"] == "failure",
                          "diagnosed predecessor is not the terminal failed original attempt")
                  jobs = pages(api, PREFIX + f"/actions/runs/{run_id}/jobs?filter=latest", "jobs")
                  require(all(job["run_id"] == run_id and job["head_sha"] == PARENT and
                              job["run_attempt"] == 1 and job["status"] == "completed" for job in jobs),
                          "predecessor job identities changed or work remains active")
                  if workflow == 338626156:
                      known = {110812477354: ("native", "success"),
                               110812477639: ("scala", "success"),
                               failed_job: ("contracts", "failure")}
                      require(len(jobs) == 4 and all(
                          any(job["id"] == job_id and (job["name"], job["conclusion"]) == expectation for job in jobs)
                          for job_id, expectation in known.items()), "Core has an additional or changed failure")
                      aggregate = [job for job in jobs if job["id"] not in known]
                      require(len(aggregate) == 1 and aggregate[0]["id"] == 110815981386 and
                              aggregate[0]["name"] == "required" and
                              aggregate[0]["conclusion"] == "failure" and
                              [step["name"] for step in aggregate[0]["steps"] if step["conclusion"] == "failure"] ==
                              ["Require every Core CI job"], "unexpected Core aggregate failure")
                  else:
                      require(len(jobs) == 1 and jobs[0]["id"] == failed_job and
                              jobs[0]["conclusion"] == "failure", "unexpected predecessor job set")
                  job = next(job for job in jobs if job["id"] == failed_job)
                  require([step["name"] for step in job["steps"] if step["conclusion"] == "failure"] == [failed_step],
                          "original diagnosed failure step changed")


          def inventory(api):
              runs = pages(api, PREFIX + "/actions/runs?head_sha=" + HEAD, "workflow_runs")
              require(all(run["head_sha"] == HEAD for run in runs), "wrong-head inventory")
              return runs


          def retain_existing(runs, workflow, record):
              matching = [run for run in runs if run["workflow_id"] == workflow]
              if not matching:
                  return False
              require(all(run["head_branch"] == REF and run["event"] in {"workflow_dispatch", "push", "pull_request"}
                          for run in matching), "existing run has unexpected context")
              record("retained-existing", {"workflow_id": workflow, "run_ids": [run["id"] for run in matching]})
              require(any(run["status"] in ACTIVE or run["status"] == "completed" and run["conclusion"] == "success"
                          for run in matching), "existing failure requires diagnosis, not another dispatch")
              return True


          def no_active_predecessor(api, workflow):
              runs = pages(api, PREFIX + "/actions/runs?branch=" + REF, "workflow_runs")
              require(not any(run["workflow_id"] == workflow and run["head_sha"] != HEAD and
                              run["status"] in ACTIVE for run in runs),
                      "an active predecessor could be cancelled by branch concurrency")


          def execute(api, environment, record, sleep=time.sleep):
              qualified_predecessor(api)
              diagnosed_failures(api)
              for workflow in WORKFLOWS:
                  identities(api, environment, workflow)
                  if retain_existing(inventory(api), workflow, record):
                      continue
                  no_active_predecessor(api, workflow)
                  identities(api, environment, workflow)
                  if retain_existing(inventory(api), workflow, record):
                      continue
                  path = PREFIX + f"/actions/workflows/{workflow}/dispatches"
                  record("dispatch-intent", {"path": path, "payload": {"ref": REF}, "head": HEAD})
                  try:
                      api("POST", path, {"ref": REF})
                  except Exception:
                      record("dispatch-uncertain", {"workflow_id": workflow, "retry": False})
                      raise
                  record("dispatch-acknowledged", {"workflow_id": workflow, "http_status": 204})
                  for _ in range(12):
                      matching = [run for run in inventory(api) if run["workflow_id"] == workflow]
                      if matching:
                          require(len(matching) == 1, "ambiguous dispatch inventory")
                          run = matching[0]
                          require(run["head_branch"] == REF and run["event"] == "workflow_dispatch" and
                                  run["run_attempt"] == 1, "observed dispatch identity mismatch")
                          record("dispatch-observed", {"run_id": run["id"], "head": HEAD, "workflow_id": workflow, "attempt": 1})
                          break
                      sleep(5)
                  else:
                      record("observation-incomplete", {"workflow_id": workflow, "retry": False})
                      raise RuntimeError("dispatch observation incomplete; do not retry")


          if __name__ == "__main__":
              destination = Path(os.environ["RUNNER_TEMP"]) / "f043-3f7abea7-dispatch"
              destination.mkdir(parents=True, exist_ok=True)
              events = []
              previous = "0" * 64

              def record(event, data):
                  global previous
                  entry = {"sequence": len(events) + 1, "previous_sha256": previous, "event": event, "data": data}
                  previous = hashlib.sha256(json.dumps(entry, sort_keys=True).encode()).hexdigest()
                  entry["sha256"] = previous
                  with (destination / "ledger.jsonl").open("a") as stream:
                      stream.write(json.dumps(entry, sort_keys=True) + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  events.append(entry)
                  print(json.dumps(entry, sort_keys=True), flush=True)

              record("controller-start", {"head": HEAD, "tree": TREE, "base": TARGET, "controller_sha": os.environ["GITHUB_SHA"]})
              execute(Api(os.environ["GITHUB_TOKEN"]), os.environ, record)
      - name: Retain dispatch ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f043-pr139-3f7abea7-dispatch-ledger
          path: ${{ runner.temp }}/f043-3f7abea7-dispatch/
          if-no-files-found: error
