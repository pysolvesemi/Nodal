name: Apply clock/reset API freeze plan

on:
  push:
    branches:
      - increment/12-clock-reset-api-freeze-plan

permissions:
  contents: write

jobs:
  apply-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          ref: increment/12-clock-reset-api-freeze-plan
          fetch-depth: 0

      - name: Update roadmap and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one roadmap anchor, found {count}: {old[:160]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_once("**Revision:** 1.1", "**Revision:** 1.2")

          replace_once(
              "Nodal adopts **implicit local domains, explicit crossings, and explicit emitted HDL**. Ordinary source creates state with high-level constructors; generated Verilog-AMS remains explicit about clock/reset ports and event processes.\n\n### Ordinary synchronous source",
              "Nodal adopts **implicit local domains, explicit crossings, and explicit emitted HDL**. Ordinary source creates state with high-level constructors; generated Verilog-AMS remains explicit about clock/reset ports and event processes.\n\nThe binding architecture is [ADR 0007](../architecture/0007-implicit-clock-reset-domains.md). The exact public API candidate, staged implementation plan, and freeze exit criteria are recorded in [`clock-reset-api-v0.2-plan.md`](clock-reset-api-v0.2-plan.md). Increment 12 may change a candidate spelling only when compile prototypes demonstrate a Scala ambiguity or semantic hole, and the v0.2 gate must record the reason.\n\n### Ordinary synchronous source",
          )

          replace_once(
              '''val pixel = ClockDomain.external(
  "pixel",
  reset = Reset.asyncAssertSyncRelease(activeLow = true),
  frequency = 148.5.MHz,
)''',
              '''val pixel = ClockDomain.external(
  name = "pixel",
  edge = ClockEdge.Rising,
  reset = ResetPolicy.AsyncAssertSyncRelease(stages = 2),
  resetPolarity = ResetPolarity.ActiveLow,
  frequency = 148.5.MHz
)''',
          )

          replace_once(
              "The example is directional rather than an already frozen API. The design gate may refine names while preserving the architecture below.",
              "This is the mandatory Increment 12 freeze candidate. Compile prototypes may refine a spelling, but not the implicit-domain, explicit-crossing, or explicit-reset-policy architecture.",
          )

          replace_once(
              "- The public architecture provides distinct crossing categories for a level bit or Gray value, pulse/event transfer, coherent request/acknowledge bundle, ready/valid stream through an asynchronous FIFO, reset synchronization, and an explicitly waived unsafe crossing. Candidate concise forms include `syncTo`, `pulseTo`, `handshakeTo`, `streamTo`, `resetTo`, and `unsafeCrossTo`.",
              "- The public architecture provides distinct crossing categories for a level bit, Gray value, pulse/event, coherent request/acknowledge payload, ready/valid stream through an asynchronous FIFO, reset synchronization, and an explicitly reported waiver. The freeze candidate uses `Cdc.sync`, `Cdc.gray`, `Cdc.pulse`, `Cdc.handshake`, `Cdc.fifo`, `Rdc.sync`, and `Cdc.waive` rather than a generic crossing tag.",
          )

          replace_once(
              "- `unsafeCrossTo` requires a source-located waiver, rationale, and report entry. It never removes provenance or makes downstream reconvergence checks disappear.",
              "- `Cdc.waive` requires a stable waiver ID, source-located rationale, declared relationship, and report entry. It never removes provenance or makes downstream reconvergence checks disappear.",
          )

          replace_once(
              "- Reusable modules are reset-policy agnostic where target semantics permit. Domain binding selects synchronous reset, asynchronous reset, asynchronous assertion with synchronized release, power-on initialization, or no reset.",
              "- Reusable modules are reset-policy agnostic where target semantics permit. The initial freeze candidate is `ResetPolicy.None`, `ResetPolicy.Sync`, `ResetPolicy.Async`, or `ResetPolicy.AsyncAssertSyncRelease(stages = n)`. Power-on initialization remains a distinct state/backend capability rather than an implicit reset policy.",
          )

          old_increment = '''- [ ] **Increment 12 — Clock/reset architecture gate, public API v0.2 revision, and contract fixtures**
  - Publish `docs/design-gates/NodalClockResetApi-DG-v0.2.md` and a migration note that supersede only the v0.1 ordinary synchronous/event subset. Freeze the implicit-local-domain and explicit-crossing architecture, exact `ClockDomain`/reset binding, `Reg`/`RegNext`/`when` syntax, child-domain inheritance, root-domain binding, CDC/RDC primitive categories, clock-gate/mux escape policy, analog-event separation, and diagnostics before frontend implementation.
  - Turn the approved v0.2 examples into compile-positive and compile-negative tests, including default-domain reuse, multiple domains, derived clocks, reset-policy variants, legal single-bit/Gray/pulse/handshake/stream crossings, illegal direct or multi-bit crossings, reset-release failures, an external-library consumer with no internal-package access, and stable diagnostic codes for prohibited or ambiguous usage.'''
          new_increment = '''- [ ] **Increment 12 — Clock/reset public API v0.2 freeze and contract fixtures**
  - Use [ADR 0007](../architecture/0007-implicit-clock-reset-domains.md) and [`clock-reset-api-v0.2-plan.md`](clock-reset-api-v0.2-plan.md) as the mandatory architecture and API candidate. Compile prototypes must cover `Clock`, `Reset`, `ClockDomain.external/from/required/generated`, lexical `domain: ...`, `Reg`, `Reg.uninitialized`, `RegNext`, `when`/`elsewhen`/`otherwise`, typed `.domain(...)` instance binding, `ResetPolicy`, `ClockRelation`, semantic `Cdc`/`Rdc` operations, explicit `ClockGate`/`ClockMux`, and the quarantined `nodal.lowlevel.process(event)` escape.
  - Publish `docs/design-gates/NodalClockResetApi-DG-v0.2.md`, a v0.1-to-v0.2 migration note, and an updated machine-readable API manifest. Supersede `always(clock.rising)` only for ordinary synchronous state; retain `analog` and `on(cross/timer)` for genuine analog/event semantics.
  - Add compile-positive fixtures for implicit single-domain state, root and existing-signal domain binding, generated/related clocks, named multi-domain requirements, every reset policy, legal level/Gray/pulse/handshake/FIFO/reset crossings, gates/muxes, analog-event separation, and an external-library consumer using only public APIs.
  - Add compile-negative fixtures for missing domains, direct asynchronous sampling, multi-bit `Cdc.sync`, unsafe pulses, unreported relationship assumptions, reset-release and reconvergence hazards, Boolean clock creation, ordinary use of `always`, low-level-process misuse, and ambiguous/multiple state drivers. Freeze stable diagnostic codes and source locations.
  - Keep frontend and backend semantics inert in this increment. Check Increment 12 only when the exact API, migration, manifest, positive/negative contracts, external-library boundary, and CI satisfy the plan's freeze exit criteria.'''
          replace_once(old_increment, new_increment)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-clock-reset-api-freeze-plan.yml
          git add -- docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: freeze clock/reset API candidate in roadmap'
          git push origin HEAD:increment/12-clock-reset-api-freeze-plan
