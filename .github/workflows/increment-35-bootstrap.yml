name: Increment 35 Source Repair

on:
  push:
    branches:
      - increment/35-differential-integral-operators-v1
    paths:
      - 'scripts/apply_increment35_repair.py'

permissions:
  contents: write

jobs:
  apply-source-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply, validate, and commit source-only repair
        shell: bash
        run: |
          if [ ! -f scripts/apply_increment35_repair.py ]; then
            echo 'Increment 35 source repair already consumed.'
            exit 0
          fi
          python3 scripts/apply_increment35_repair.py
          python3 scripts/check_increment24.py
          python3 scripts/check_increment34.py
          python3 scripts/check_increment35.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment35.py'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Increment 35 contracts and remove bootstrap fragments'
          git push origin HEAD:increment/35-differential-integral-operators-v1
