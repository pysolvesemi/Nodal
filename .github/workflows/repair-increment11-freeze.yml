name: Repair Increment 11 design-gate lifecycle policy

on:
  push:
    branches:
      - increment/11-public-api-v0.1-freeze

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: increment/11-public-api-v0.1-freeze

      - name: Add explicit superseded-gate lifecycle support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          policy_path = Path('.github/change-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          gate = policy['design_gate']
          gate['superseded_marker'] = '**Status:** Superseded'
          gate['superseded_by_prefix'] = '**Superseded by:**'
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')

          checker_path = Path('scripts/check_contribution_policy.py')
          checker = checker_path.read_text(encoding='utf-8')
          old_fields = '''    approved_marker = gate.get("approved_marker")
    scope_prefix = gate.get("scope_marker_prefix")
    if not all(isinstance(value, str) and value for value in (directory, filename_pattern, approved_marker, scope_prefix)):
        problems.append(Problem("NODAL-POLICY-002", "change-policy design-gate fields are invalid"))
        return
'''
          new_fields = '''    approved_marker = gate.get("approved_marker")
    superseded_marker = gate.get("superseded_marker")
    superseded_by_prefix = gate.get("superseded_by_prefix")
    scope_prefix = gate.get("scope_marker_prefix")
    if not all(
        isinstance(value, str) and value
        for value in (
            directory,
            filename_pattern,
            approved_marker,
            superseded_marker,
            superseded_by_prefix,
            scope_prefix,
        )
    ):
        problems.append(Problem("NODAL-POLICY-002", "change-policy design-gate fields are invalid"))
        return
'''
          if old_fields not in checker:
              raise SystemExit('design-gate field anchor not found')
          checker = checker.replace(old_fields, new_fields, 1)

          old_status = '''        if approved_marker not in content:
            problems.append(Problem("NODAL-POLICY-004", f"design gate is not approved: {relative}"))
            continue
        for line in content.splitlines():
            if line.startswith(scope_prefix):
                approved_scopes.add(line.removeprefix(scope_prefix).strip())
'''
          new_status = '''        if superseded_marker in content:
            if superseded_by_prefix not in content:
                problems.append(
                    Problem(
                        "NODAL-POLICY-016",
                        f"superseded design gate lacks replacement reference: {relative}",
                    )
                )
            continue
        if approved_marker not in content:
            problems.append(Problem("NODAL-POLICY-004", f"design gate is not approved: {relative}"))
            continue
        for line in content.splitlines():
            if line.startswith(scope_prefix):
                approved_scopes.add(line.removeprefix(scope_prefix).strip())
'''
          if old_status not in checker:
              raise SystemExit('design-gate status anchor not found')
          checker_path.write_text(checker.replace(old_status, new_status, 1), encoding='utf-8')

          tests_path = Path('tests/lint/test_increment9.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '''        self.assertEqual(problems, [])

    def test_pull_request_metadata_is_checked(self) -> None:
'''
          addition = '''        self.assertEqual(problems, [])

    def test_superseded_gate_is_accepted_with_approved_replacement(self) -> None:
        temporary, root = self.policy_fixture()
        self.addCleanup(temporary.cleanup)
        gate_dir = root / "docs/design-gates"
        gate_dir.mkdir(parents=True)
        old_gate = gate_dir / "NodalPublicApiCandidates-DG-v0.1.md"
        old_gate.write_text(
            "# Old gate\\n\\n**Status:** Superseded\\n**Scope:** public-api\\n"
            "**Superseded by:** NodalPublicApi-DG-v0.1.md\\n",
            encoding="utf-8",
        )
        replacement = gate_dir / "NodalPublicApi-DG-v0.1.md"
        replacement.write_text(
            "# Replacement\\n\\n**Status:** Approved\\n**Scope:** public-api\\n",
            encoding="utf-8",
        )
        problems = POLICY.check_repository(
            root,
            changed_files=[
                "core/scala/api/src/nodal/Module.scala",
                "docs/design-gates/NodalPublicApiCandidates-DG-v0.1.md",
                "docs/design-gates/NodalPublicApi-DG-v0.1.md",
            ],
        )
        self.assertEqual(problems, [])

    def test_superseded_gate_requires_replacement_reference(self) -> None:
        temporary, root = self.policy_fixture()
        self.addCleanup(temporary.cleanup)
        gate_dir = root / "docs/design-gates"
        gate_dir.mkdir(parents=True)
        old_gate = gate_dir / "NodalPublicApiCandidates-DG-v0.1.md"
        old_gate.write_text(
            "# Old gate\\n\\n**Status:** Superseded\\n**Scope:** public-api\\n",
            encoding="utf-8",
        )
        replacement = gate_dir / "NodalPublicApi-DG-v0.1.md"
        replacement.write_text(
            "# Replacement\\n\\n**Status:** Approved\\n**Scope:** public-api\\n",
            encoding="utf-8",
        )
        problems = POLICY.check_repository(
            root,
            changed_files=[
                "core/scala/api/src/nodal/Module.scala",
                "docs/design-gates/NodalPublicApiCandidates-DG-v0.1.md",
                "docs/design-gates/NodalPublicApi-DG-v0.1.md",
            ],
        )
        self.assertIn("NODAL-POLICY-016", {problem.code for problem in problems})

    def test_pull_request_metadata_is_checked(self) -> None:
'''
          if anchor not in tests:
              raise SystemExit('lint test insertion anchor not found')
          tests_path.write_text(tests.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Validate lifecycle policy repair
        run: |
          python3 -m unittest discover -s tests/lint -p 'test_*.py'
          python3 scripts/check_contribution_policy.py --base-ref origin/dev
          python3 scripts/check_increment10.py
          python3 scripts/check_increment11.py

      - name: Commit lifecycle policy repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/change-policy.json \
            scripts/check_contribution_policy.py \
            tests/lint/test_increment9.py
          git commit -m 'policy: support superseded design gates'
          git push origin HEAD:increment/11-public-api-v0.1-freeze
