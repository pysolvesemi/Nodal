name: Refine Increment 159 structural scope

on:
  push:
    branches:
      - increment/159-static-symbolic-range-clarification

permissions:
  contents: write

jobs:
  refine-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: increment/159-static-symbolic-range-clarification
          fetch-depth: 0
      - run: python3 scripts/refine_increment159_structural_scope.py
      - run: |
          rm scripts/refine_increment159_structural_scope.py
          rm .github/workflows/refine-increment159-structural-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/nodal-development-todo.md scripts/refine_increment159_structural_scope.py .github/workflows/refine-increment159-structural-scope.yml
          git diff --cached --check
          git commit -m "docs: refine staged generate structural scope"
          git push origin HEAD:increment/159-static-symbolic-range-clarification
