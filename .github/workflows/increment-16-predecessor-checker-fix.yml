name: Increment 16 Predecessor Checker Fix

on:
  push:
    branches:
      - increment/16-elaboration-construction-kernel

permissions:
  contents: write

concurrency:
  group: increment-16-predecessor-checker-fix
  cancel-in-progress: true

jobs:
  patch:
    name: increment-16/predecessor-checker-fix
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make Increment 15 roadmap validation successor-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_increment15.py')
          source = path.read_text(encoding='utf-8')
          old = '''        if "**Revision:** 1.19" not in roadmap:
            problems.append(Problem("NODAL-INC15-059", "roadmap revision is not 1.19"))
'''
          new = '''        revision_lines = [
            line.removeprefix("**Revision:** ")
            for line in roadmap.splitlines()
            if line.startswith("**Revision:** ")
        ]
        revision: tuple[int, ...] | None = None
        if len(revision_lines) == 1:
            try:
                revision = tuple(int(part) for part in revision_lines[0].split("."))
            except ValueError:
                revision = None
        if revision is None or revision < (1, 19):
            problems.append(Problem("NODAL-INC15-059", "roadmap revision predates 1.19"))
'''
          if new in source:
              print('Increment 15 checker is already successor-safe')
          else:
              if source.count(old) != 1:
                  raise RuntimeError('Increment 15 revision anchor is not unique')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate predecessor and current increment contracts
        run: |
          python3 scripts/check_increment15.py
          python3 tests/api/test_increment15.py
          python3 scripts/check_increment16.py
          python3 tests/api/test_increment16.py
          git diff --check

      - name: Commit checker compatibility fix
        run: |
          if git diff --quiet; then
            echo "No checker change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_increment15.py
          git commit -m "Increment 16 — make Increment 15 roadmap checks successor-safe"
          git push origin HEAD:increment/16-elaboration-construction-kernel
