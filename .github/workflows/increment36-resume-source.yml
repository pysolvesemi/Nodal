name: Increment 36 Resume Source
on:
  push:
    branches: [automation/increment36-resume-source-20260905]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: b11dd8c285dd7ffed2ad75b6439771367aa2470e
      - name: Bundle exact published closure and merged implementation
        run: |
          test "$(git rev-parse HEAD^{tree})" = db0076513dd1cc1e157b4ba41c9131e8da97adb4
          git update-ref refs/heads/recovery-closure b11dd8c285dd7ffed2ad75b6439771367aa2470e
          git update-ref refs/heads/recovery-dev aa93bc7e9eb6df51162a486452b185025b77207a
          git bundle create /tmp/nodal36-closure.bundle refs/heads/recovery-closure refs/heads/recovery-dev
          git bundle verify /tmp/nodal36-closure.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nodal36-closure-history
          path: /tmp/nodal36-closure.bundle
          retention-days: 3
