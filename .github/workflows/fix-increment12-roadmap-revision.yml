name: Record Increment 12 roadmap freeze baseline

on:
  push:
    branches:
      - roadmap/immediate-assertion-synthesis-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Record Increment 12 roadmap freeze baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record the Increment 12 baseline explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/nodal-development-todo.md")
          content = path.read_text(encoding="utf-8")
          evidence = "  - Evidence: [`NodalClockResetApi-DG-v0.2.md`](../design-gates/NodalClockResetApi-DG-v0.2.md), [`public-api-v0.2.json`](../../core/scala/api/public-api-v0.2.json), [`clock-reset-diagnostics-v0.2.json`](../../core/scala/api/clock-reset-diagnostics-v0.2.json), [`tests/api/fixtures/increment12/manifest.json`](../../tests/api/fixtures/increment12/manifest.json), [`scripts/check_increment12.py`](../../scripts/check_increment12.py), and status `increment-12/clock-reset-api-v0-2`.\n"
          baseline = "  - Freeze baseline: roadmap **Revision:** 1.12; later roadmap revisions must preserve this completed increment and its evidence.\n"
          if baseline not in content:
              if content.count(evidence) != 1:
                  raise SystemExit("Increment 12 evidence line was not found exactly once")
              content = content.replace(evidence, evidence + baseline, 1)
              path.write_text(content, encoding="utf-8")
          PY
          python3 scripts/check_increment12.py
          python3 scripts/check_markdown.py
          git diff --check

      - name: Publish baseline record
        run: |
          rm .record-increment12-baseline-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/nodal-development-todo.md .record-increment12-baseline-trigger
          git commit -m 'Record Increment 12 roadmap freeze baseline'
          git push origin HEAD:roadmap/immediate-assertion-synthesis-boundary
