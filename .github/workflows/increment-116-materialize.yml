name: Increment 116 materializer

on:
  push:
    branches:
      - increment/116-register-factory-api-gate

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Materialize Increment 116'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize API, fixtures, contracts, and roadmap
        run: python3 .increment116_apply.py

      - name: Format and validate the frozen surface
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill scalafix.check
          python3 scripts/check_increment116.py --compile-negative
          python3 -m unittest tests/api/test_increment116.py
          git diff --check

      - name: Publish final Increment 116 source tree
        run: |
          rm -f .increment116_apply.py
          rm -f .increment116-trigger
          rm -f .github/workflows/increment-116-materialize.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 116 — Freeze register factory public API v0.1'
          git push origin HEAD:increment/116-register-factory-api-gate
