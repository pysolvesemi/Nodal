name: Increment 33 repair compiler IR tranche

on:
  push:
    branches:
      - automation/inc33-staging-materializer-controller-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc33-staging-materializer-controller-20260831
          fetch-depth: 0

      - name: Check out repair branch
        shell: bash
        run: |
          cp .inc33-controller/repair_compiler_ir.py /tmp/inc33-repair.py
          git checkout -B automation/inc33-compiler-ir-repair-20260831 origin/automation/inc33-compiler-ir-repair-20260831
          git fetch --no-tags origin dev:refs/remotes/origin/dev

      - name: Apply lint-safe semantic repair
        run: python3 /tmp/inc33-repair.py

      - name: Install pinned toolchains
        shell: bash
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format repair candidate
        shell: bash
        run: |
          ./mill mill.scalalib.scalafmt/reformatAll
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Dialect/Nodal/NodalOps.cpp \
            core/compiler/lib/Dialect/Nodal/NodalTypes.cpp
          git diff --check

      - name: Publish repair candidate
        shell: bash
        run: |
          git config user.name "nodal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/scala/api/src/nodal/AnalogProceduralConstruction.scala \
            core/scala/api/src/nodal/AnalogProceduralRuntime.scala \
            core/scala/api/src/nodal/CandidateApi.scala \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            docs/design-gates/NodalAnalogProceduralAssignment-DG-v0.1.md
          git commit -m "fix(core): make analog procedural failures lint-safe"
          git push origin HEAD:automation/inc33-compiler-ir-repair-20260831

      - name: Validate repository style
        run: |
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate Increment 33 checkpoint
        run: python3 scripts/check_increment33.py --compile

      - name: Validate Scala core
        run: ./nodal core scala

      - name: Validate native compiler
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Validate repository contracts
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain" \
            --base-ref origin/dev
