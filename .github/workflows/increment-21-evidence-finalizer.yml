name: Increment 23 Evidence Finalizer

on:
  push:
    branches:
      - increment/23-roadmap-evidence-closure
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: increment-23-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: increment-23/finalize-evidence
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/23-roadmap-evidence-closure
          fetch-depth: 0

      - name: Record accepted evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/automation_close_increment23.py

      - name: Remove one-shot files and restore trusted finalizer
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          git checkout origin/dev -- \
            .github/workflows/increment-21-evidence-finalizer.yml
          rm scripts/automation_close_increment23.py
          rm .github/workflows/automation-increment23-evidence-closure.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate closed state and exact final diff
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          for increment in 18 19 20 21 22 23; do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

          mapfile -t changed < <(git diff --name-only origin/dev)
          printf 'Final closure diff:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" \
            | grep -Fx 'docs/roadmap/nodal-development-todo.md'
          printf '%s\n' "${changed[@]}" \
            | grep -Fx 'tests/compiler/fixtures/increment23/manifest.json'
          grep -F '**Revision:** 1.29' \
            docs/roadmap/nodal-development-todo.md
          grep -F -- '- [x] **Increment 23 — Backend framework and capability profiles**' \
            docs/roadmap/nodal-development-todo.md
          grep -F -- '- [ ] **Increment 24 — Minimal analog expression and contribution IR**' \
            docs/roadmap/nodal-development-todo.md
          grep -F -- '- [ ] **Foundation Increment 153 — Function-local lexical naming and alias contract**' \
            docs/roadmap/nodal-development-todo.md

      - name: Publish roadmap and manifest closure
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 23 — record accepted CI evidence'
          git push origin HEAD:increment/23-roadmap-evidence-closure
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Dispatch permanent final-head validation
        env:
          BRANCH: increment/23-roadmap-evidence-closure
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"%s\"}' "${BRANCH}")"
          for workflow in increment-23-backend-framework.yml ci.yml; do
            curl --fail-with-body --retry 3 \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d "${payload}"
          done

      - name: Record final closure head
        run: echo "Final closure head is ${{ steps.publish.outputs.sha }}"
