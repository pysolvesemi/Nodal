name: Increment 32 Review Fix Materializer V2

on:
  push:
    branches:
      - automation/inc32-review-fix-v2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Increment 32 review head
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0
      - name: Apply reviewed production-path fixes
        env:
          EXPECTED_HEAD: 52799e2e18a3b55cccb0d635d0a83c091c330ecd
          PATCH_B64: >-
            
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/inc32-review-fixes.patch
          git apply --check /tmp/inc32-review-fixes.patch
          git apply /tmp/inc32-review-fixes.patch
          python3 scripts/check_increment32.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment32.py'
          git diff --check
      - name: Publish exact repaired implementation head
        run: |
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add \
            core/native/include/nodal/AnalogEquationRuntime.h \
            core/scala/api/src/nodal/AnalogEquationRuntime.scala \
            core/scala/api/src/nodal/CandidateApi.scala \
            core/scala/api/src/nodal/ContinuousTimeCandidateApi.scala \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            core/scala/api/src/nodal/SemanticOriginKernel.scala \
            docs/design-gates/NodalAnalogEquationContribution-DG-v1.0.md \
            docs/implementation/increment32-equation-contribution-semantics.md \
            examples/continuousTimeApi/src/nodal/increment32fixture/Increment32RuntimeCheck.scala \
            scripts/check_increment32.py \
            tests/compiler/fixtures/increment32/analog_equation_runtime_test.cpp \
            tests/compiler/fixtures/increment32/manifest.json \
            tests/compiler/test_increment32.py
          git commit -m "fix(increment32): wire public analog semantics and close review gaps"
          git push origin HEAD:increment/32-equation-contribution-semantics-review
