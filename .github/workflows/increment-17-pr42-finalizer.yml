name: Increment 17 PR42 Finalizer

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: increment-17-pr42-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: increment-17/pr42-finalize
    if: github.event.pull_request.number == 42 && github.head_ref == 'increment/17-source-origin-naming' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out authoritative increment branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/17-source-origin-naming

      - name: Materialize corrected implementation
        run: |
          python3 scripts/materialize_increment17.py
          python3 - <<'PY'
          from pathlib import Path

          doc = Path("docs/implementation/increment17-source-origin-naming.md")
          text = doc.read_text(encoding="utf-8")
          marker = "Traversal ordinals are never emitted as a normal name."
          if marker not in text:
              text = text.rstrip() + "\n\n" + marker + "\n"
          marker = "All expression-level source-map entries remain present when nodes are inlined."
          if marker not in text:
              text = text.rstrip() + "\n" + marker + "\n"
          doc.write_text(text, encoding="utf-8")

          source = Path("core/scala/api/src/nodal/SemanticOriginKernel.scala")
          text = source.read_text(encoding="utf-8")
          old = '''  private def isUserFrame(frame: StackWalker.StackFrame): Boolean =
    Option(frame.getFileName).exists: fileName =>
      fileName.endsWith(".scala") &&
      !internalSourceFiles.contains(fileName) &&
      !apiSourceFiles.contains(fileName)
'''
          new = '''  private def isUserFrame(frame: StackWalker.StackFrame): Boolean =
    val owner = frame.getClassName
    Option(frame.getFileName).exists: fileName =>
      fileName.endsWith(".scala") &&
      !internalSourceFiles.contains(fileName) &&
      !apiSourceFiles.contains(fileName) &&
      !owner.startsWith("scala.") &&
      !owner.startsWith("java.") &&
      !owner.startsWith("jdk.") &&
      !owner.startsWith("sun.") &&
      !owner.startsWith("utest.") &&
      !owner.startsWith("mill.")
'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError("user-frame selection anchor is not unique")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")
          PY
          rm -f .increment17-materialize-trigger
          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill scalafix.fix

      - name: Validate corrected increment
        run: |
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py --compile
          python3 tests/api/test_increment16.py
          python3 tests/api/test_increment17.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Publish corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 17 — implement semantic source identity"
          git pull --rebase origin increment/17-source-origin-naming
          git push origin HEAD:increment/17-source-origin-naming
