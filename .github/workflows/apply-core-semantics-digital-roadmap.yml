name: Apply core semantics and digital roadmap

on:
  push:
    branches:
      - increment/13-core-semantics-digital-verilog-roadmap
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-roadmap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.head_ref == 'increment/13-core-semantics-digital-verilog-roadmap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          ref: increment/13-core-semantics-digital-verilog-roadmap
          fetch-depth: 0

      - name: Apply roadmap transformation
        run: python3 scripts/update_core_semantics_digital_roadmap.py

      - name: Normalize generated Markdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/automatic-pipeline-api-v0.3-plan.md")
          text = path.read_text(encoding="utf-8")
          normalized = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          path.write_text(normalized, encoding="utf-8")
          PY

      - name: Validate durable documents
        shell: bash
        run: |
          python3 scripts/check_markdown.py
          python3 scripts/check_formatting_baseline.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("docs/roadmap").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          print("roadmap JSON validation passed")
          PY

      - name: Commit transformed roadmap and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-core-semantics-digital-roadmap.yml \
            scripts/update_core_semantics_digital_roadmap.py
          git add -- \
            docs/architecture/0007-implicit-clock-reset-domains.md \
            docs/architecture/0008-automatic-pipeline-architecture.md \
            docs/roadmap/automatic-pipeline-api-v0.3-plan.md \
            docs/roadmap/clock-reset-api-v0.2-plan.md \
            docs/roadmap/clock-reset-api-v0.2-surface.json \
            docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: freeze core semantics and plan digital Verilog verification'
          git push origin HEAD:increment/13-core-semantics-digital-verilog-roadmap
