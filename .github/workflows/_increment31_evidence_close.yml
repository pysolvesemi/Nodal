name: Increment 31 Evidence Closure Materialization

on:
  push:
    branches:
      - increment/31-evidence-closure

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  close-evidence:
    name: increment-31/evidence-closure-materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v6
        with:
          ref: increment/31-evidence-closure
          fetch-depth: 0

      - name: Record evidence and validate closure when recovery is staged
        run: |
          if [ -f scripts/_increment31_evidence_recover.py ]; then
            python3 scripts/_increment31_evidence_recover.py
          else
            echo 'Increment 31 evidence recovery is already complete.'
          fi
