name: Patch Scalafix selectors

on:
  push:
    branches:
      - increment/9-formatting-linting-contribution-rules

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: increment/9-formatting-linting-contribution-rules

      - name: Use Mill module command selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("scripts/nodal.py"): {
                  '"scalafix/check"': '"scalafix.check"',
                  '"scalafix/fix"': '"scalafix.fix"',
              },
              Path("scripts/check_increment9.py"): {
                  '"scalafix/check"': '"scalafix.check"',
              },
              Path("tests/developer/test_developer_commands.py"): {
                  '"scalafix/check"': '"scalafix.check"',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"missing expected selector {old} in {path}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"no change made to {path}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit selector repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/nodal.py scripts/check_increment9.py tests/developer/test_developer_commands.py
          git commit -m 'fix(style): use Mill Scalafix command selectors'
          git push origin HEAD:increment/9-formatting-linting-contribution-rules
