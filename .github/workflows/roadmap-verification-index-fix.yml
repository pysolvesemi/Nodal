name: Align generated verification roadmap indexes

on:
  push:
    branches:
      - increment/147-verification-projection-roadmap
    paths:
      - .github/workflows/roadmap-verification-index-fix.yml

permissions:
  contents: write

jobs:
  align-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align compact and detailed verification roadmaps
        env:
          INDEX_FIX_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          exec(compile(gzip.decompress(base64.b64decode(os.environ['INDEX_FIX_GZ_B64'])), 'fix_indexes.py', 'exec'))
          PY
      - name: Validate aligned indexes
        run: |
          set -euo pipefail
          test "$(grep -c '^\- \[ \] \*\*Digital Verification Increment ' docs/roadmap/nodal-development-todo.md)" -eq 11
          test "$(grep -c '^\- \[ \] \*\*AMS Verification Increment ' docs/roadmap/nodal-development-todo.md)" -eq 12
          grep -q 'Digital Verification Increment 6 — Generated Verilog testbench projection' docs/roadmap/nodal-development-todo.md
          grep -q 'AMS Verification Increment 7 — Open-source Verilog-AMS conformance profiles' docs/roadmap/nodal-development-todo.md
          test ! -e .github/workflows/roadmap-verification-index-fix.yml
      - name: Commit aligned indexes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap .github/workflows/roadmap-verification-index-fix.yml
          git diff --cached --check
          git commit -m 'Increment 147 — align verification roadmap indexes'
          git push origin HEAD
