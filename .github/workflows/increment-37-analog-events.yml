name: Increment 37 Analog Events

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/increment-37-analog-events.yml'
      - 'build.mill'
      - 'core/**'
      - 'examples/continuousTimeApi/**'
      - 'scripts/check_increment37.py'
      - 'tests/compiler/**'
      - 'docs/design-gates/NodalAnalogEvents-DG-v0.1.md'
      - 'docs/implementation/increment37*.md'
      - 'docs/roadmap/nodal-development-todo.md'
  push:
    branches: [dev, increment/37-analog-events]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: increment-37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  increment-37-analog-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore pinned Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-
      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}
      - name: Validate predecessor and event contracts
        run: |
          python3 scripts/check_increment36.py
          python3 scripts/check_increment37.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment37*.py'
      - name: Compile and execute Scala contracts
        run: ./nodal core scala
      - name: Emit deterministic public-source event witness
        run: |
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment37fixture.Increment37ConstructionCheck
          ./mill -i core.scala.testkit.test.runMain \
            nodal.internal.testkit.Increment37MlirCheck \
            "${RUNNER_TEMP}/increment37-source.mlir"
      - name: Build compiler and execute native and source-to-native matrices
        shell: bash
        run: |
          ./nodal bootstrap --mode prebuilt --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          nodalc=$(find out -type f -name nodalc -perm -u+x | head -n 1)
          translate=$(find out -type f -name nodal-translate -perm -u+x | head -n 1)
          test -n "$nodalc" && test -n "$translate"
          python3 tests/compiler/fixtures/increment37/run_native_matrix.py \
            --nodalc "$nodalc" --translate "$translate" \
            --source "${RUNNER_TEMP}/increment37-source.mlir"
          "$nodalc" \
            '--pass-pipeline=builtin.module(nodal-fold-analog-constants,canonicalize,cse,nodal-verify-analog-numeric)' \
            "${RUNNER_TEMP}/increment37-source.mlir" > "${RUNNER_TEMP}/increment37-normalized.mlir"
          for source in "${RUNNER_TEMP}/increment37-source.mlir" \
              "${RUNNER_TEMP}/increment37-source.mlir.held.mlir" \
              "${RUNNER_TEMP}/increment37-source.mlir.controlled.mlir"; do
            "$translate" --nodal-to-verilog-a "$source" > "${source}.va"
          done
          sha256sum "${RUNNER_TEMP}"/increment37-*.mlir "${RUNNER_TEMP}"/increment37-*.va
      - name: Check style and documentation
        run: |
          ./nodal style check --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          python3 scripts/check_markdown.py
          git diff --check
      - name: Retain source-to-native witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment37-source-witness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/increment37-*.mlir
            ${{ runner.temp }}/increment37-*.va
          retention-days: 14
