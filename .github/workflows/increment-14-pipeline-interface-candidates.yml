name: Increment 14 Pipeline and Interface Candidates

on:
  push:
    branches:
      - increment/14-pipeline-interface-candidates
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  candidate-contracts:
    name: increment-14/pipeline-interface-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out increment branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/14-pipeline-interface-candidates

      - name: Fold review closure into original API
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              assert text.count(old) == 1, f"expected one replacement anchor in {path}: {old!r}"
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          api = Path("core/scala/api/src/nodal/PipelineInterfaceCandidateApi.scala")
          replace_once(
              api,
              """enum RoleAccess:
            case In(member: String)
            case Out(member: String)
            case Observe(member: String)
            case Master(member: String)
            case Slave(member: String)
            case Read(member: String)
            case Drive(member: String)
            case Connect(member: String)
            case Sense(member: String)
            case Contribute(member: String)
            case Nested(member: String, role: String)
          """,
              """enum RoleAccess:
            case In(member: String)
            case Out(member: String)
            case Observe(member: String)
            case Master(member: String)
            case Slave(member: String)
            case Read(member: String)
            case Drive(member: String)
            case Connect(member: String)
            case Sense(member: String)
            case Contribute(member: String)
            case Nested(member: String, role: String)

          object RoleAccess:
            private[nodal] def inverted(access: RoleAccess): RoleAccess = access match
              case RoleAccess.In(member) => RoleAccess.Out(member)
              case RoleAccess.Out(member) => RoleAccess.In(member)
              case RoleAccess.Observe(member) => RoleAccess.Observe(member)
              case RoleAccess.Master(member) => RoleAccess.Slave(member)
              case RoleAccess.Slave(member) => RoleAccess.Master(member)
              case RoleAccess.Read(member) => RoleAccess.Drive(member)
              case RoleAccess.Drive(member) => RoleAccess.Read(member)
              case RoleAccess.Connect(member) => RoleAccess.Connect(member)
              case RoleAccess.Sense(member) => RoleAccess.Contribute(member)
              case RoleAccess.Contribute(member) => RoleAccess.Sense(member)
              case RoleAccess.Nested(member, role) =>
                RoleAccess.Nested(member, invertedRoleName(role))

            private def invertedRoleName(role: String): String = role match
              case "master" => "slave"
              case "slave" => "master"
              case "source" => "sink"
              case "sink" => "source"
              case "initiator" => "target"
              case "target" => "initiator"
              case "controller" => "peripheral"
              case "peripheral" => "controller"
              case "device" => "environment"
              case "environment" => "device"
              case other => s"inverse($other)"
          """,
          )
          replace_once(
              api,
              """  def inverted(using inverse: RoleInverse[R]): InterfacePort[I, inverse.Out] =
            new InterfacePort(
              endpoint.definition,
              inverse.inverse,
              s"${endpoint.name}.inverse",
              endpoint.domain
            )
          """,
              """  def inverted(using inverse: RoleInverse[R]): InterfacePort[I, inverse.Out] =
            val invertedRole = new Role[inverse.Out](
              inverse.inverse.name,
              endpoint.role.access.map(RoleAccess.inverted)
            )
            new InterfacePort(
              endpoint.definition,
              invertedRole,
              s"${endpoint.name}.inverse",
              endpoint.domain
            )
          """,
          )

          test = Path("tests/api/test_increment14_review_closure.py")
          replace_once(
              test,
              'API = ROOT / "core/scala/api/src/nodal/RoleAccessInversionCandidate.scala"',
              'API = ROOT / "core/scala/api/src/nodal/PipelineInterfaceCandidateApi.scala"',
          )
          replace_once(test, '            "type InverseRole",\n', '            "object RoleAccess",\n')
          replace_once(
              test,
              '            "endpoint.role.access.map(RoleAccessInversion.apply)",',
              '            "endpoint.role.access.map(RoleAccess.inverted)",',
          )

          workaround = Path("core/scala/api/src/nodal/RoleAccessInversionCandidate.scala")
          assert workaround.exists(), "expected temporary role-inversion workaround"
          workaround.unlink()

          Path(".github/workflows/increment-14-pipeline-interface-candidates.yml").write_text(
              """name: Increment 14 Pipeline and Interface Candidates

          on:
            push:
              branches:
                - increment/14-pipeline-interface-candidates
            pull_request:
              branches:
                - dev

          permissions:
            contents: read

          jobs:
            candidate-contracts:
              name: increment-14/pipeline-interface-candidates
              runs-on: ubuntu-24.04
              timeout-minutes: 30

              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    fetch-depth: 0

                - name: Validate positive and negative compile contracts
                  run: |
                    ./mill mill.scalalib.scalafmt/checkFormatAll
                    ./mill scalafix.check
                    python3 scripts/check_increment13.py --compile-negative
                    python3 scripts/check_increment14.py --compile-negative
                    python3 tests/api/test_increment14_review_closure.py
                    git diff --check
          """,
              encoding="utf-8",
          )
          PY

      - name: Validate positive and negative compile contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment13.py --compile-negative
          python3 scripts/check_increment14.py --compile-negative
          python3 tests/api/test_increment14_review_closure.py
          git diff --check

      - name: Commit folded review closure
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 14 — fold role inversion review fix into API"
          git push origin HEAD:increment/14-pipeline-interface-candidates
