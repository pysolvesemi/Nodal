name: Increment 38 accepted evidence preparation
on:
  push:
    branches: [automation/increment38-evidence-closure-20260907]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and extract closure sources
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os
          from pathlib import Path
          payload = Path('.automation/increment38-closure.json.xz').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == '610a1627c1064f344a40851526188cf3628298427f3945cfd9eb4b7f9a60b530'
          files = json.loads(lzma.decompress(payload))
          assert set(files) == {'write_closure.py', 'collect_postmerge.py', 'check_inc38_template.py', 'test_inc38_closure_template.py'}
          work = Path(os.environ['RUNNER_TEMP']) / 'inc38-closure-work'
          work.mkdir()
          for name, content in files.items():
              compile(content, name, 'exec')
              (work / name).write_text(content)
          PY
      - name: Require successful exact-merge validation and verified artifacts
        run: python3 "$RUNNER_TEMP/inc38-closure-work/collect_postmerge.py"
      - name: Materialize only the separate closure change
        run: |
          git checkout -b increment/38-evidence-closure-v1 e593a60eb6d6fdb9a505d0762c859934e041b92d
          python3 "$RUNNER_TEMP/inc38-closure-work/write_closure.py"
          git diff --check
      - name: Check acceptance mutations and all compiler contracts
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/closure-evidence"
          python3 scripts/check_increment38.py 2>&1 | tee "$RUNNER_TEMP/closure-evidence/increment38.log"
          python3 scripts/check_increment37.py 2>&1 | tee "$RUNNER_TEMP/closure-evidence/increment37.log"
          python3 -m unittest discover -s tests/compiler 2>&1 | tee "$RUNNER_TEMP/closure-evidence/compiler-python.log"
          python3 scripts/check_markdown.py
          python3 scripts/check_architecture.py
          python3 scripts/check_package_visibility.py
      - name: Commit and publish clean evidence branch without merging
        run: |
          git config user.name 'Nodal implementation'
          git config user.email 'nodal-implementation@users.noreply.github.com'
          git add docs/implementation/increment38-accepted-evidence.json docs/implementation/increment38-evidence-closure.md docs/implementation/increment38-mathematical-simulator-functions.md docs/implementation/increment37-evidence-closure.md docs/roadmap/nodal-development-todo.md scripts/check_increment38.py tests/compiler/fixtures/increment38/manifest.json tests/compiler/test_increment38.py tests/compiler/test_increment38_closure.py
          test "$(git diff --cached --name-only | wc -l)" = 9
          git diff --cached --check
          git commit -m 'Increment 38: close accepted evidence after verified post-merge qualification'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/closure-evidence/source-identity.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/closure-evidence/source.tar.gz"
          cp "$RUNNER_TEMP/inc38-closure-work/inc38-postmerge-metadata.json" "$RUNNER_TEMP/closure-evidence/"
          cp "$RUNNER_TEMP/inc38-closure-work/postmerge/public.va" "$RUNNER_TEMP/inc38-closure-work/postmerge/events.va" "$RUNNER_TEMP/closure-evidence/"
          git push origin HEAD:refs/heads/increment/38-evidence-closure-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment38-evidence-closure-candidate
          path: |
            ${{ runner.temp }}/closure-evidence
            ${{ runner.temp }}/inc38-closure-work/inc38-postmerge-metadata.json
          retention-days: 14
