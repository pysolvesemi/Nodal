name: Increment 5 roadmap completion

on:
  push:
    branches:
      - increment/5-native-toolchain-lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark Increment 5 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/roadmap/nodal-development-todo.md')
          text = path.read_text(encoding='utf-8')

          old_revision = '**Revision:** 0.6  '
          new_revision = '**Revision:** 0.7  '
          unchecked = '- [ ] **Increment 5 — LLVM/MLIR/CIRCT toolchain lock**'
          checked = '- [x] **Increment 5 — LLVM/MLIR/CIRCT toolchain lock**'
          description = '  - Select and pin a compatible LLVM/MLIR/CIRCT revision pair, CMake and Ninja requirements, checksums, source-build fallback, and prebuilt-toolchain discovery. Avoid unpinned `main` dependencies.'
          evidence = '  - Evidence: [`toolchains/lock.json`](../../toolchains/lock.json), [`toolchains/README.md`](../../toolchains/README.md), [`scripts/check_native_toolchain.py`](../../scripts/check_native_toolchain.py), [`scripts/bootstrap_native_toolchain.py`](../../scripts/bootstrap_native_toolchain.py), commit [`7ea7c2b`](https://github.com/pysolvesemi/Nodal/commit/7ea7c2b6ea8993f9de58e528cc916d7ac7655272), and successful validation run [`32355110533`](https://github.com/pysolvesemi/Nodal/actions/runs/32355110533).'

          if text.count(old_revision) != 1:
              raise SystemExit('expected exactly one roadmap revision 0.6 marker')
          if text.count(unchecked) != 1:
              raise SystemExit('expected exactly one unchecked Increment 5 marker')
          if text.count(description) != 1:
              raise SystemExit('expected exactly one Increment 5 description')
          if evidence in text:
              raise SystemExit('Increment 5 evidence is already present')

          text = text.replace(old_revision, new_revision, 1)
          text = text.replace(unchecked, checked, 1)
          text = text.replace(description + '\n', description + '\n' + evidence + '\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit roadmap evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: mark increment 5 complete'
          git push origin "HEAD:${GITHUB_REF_NAME}"
