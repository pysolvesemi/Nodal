name: Apply automatic pipeline roadmap v2

on:
  push:
    branches:
      - increment/13-automatic-pipeline-roadmap

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          ref: increment/13-automatic-pipeline-roadmap
          fetch-depth: 0

      - name: Apply and validate automatic-pipeline roadmap
        run: |
          python3 scripts/apply_pipeline_roadmap_v2.py
          python3 scripts/check_markdown.py
          python3 scripts/check_architecture.py
          python3 -m json.tool docs/roadmap/automatic-pipeline-api-v0.3-surface.json >/dev/null
          python3 -m json.tool docs/roadmap/clock-reset-api-v0.2-surface.json >/dev/null
          git diff --check

      - name: Commit finalized roadmap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-pipeline-roadmap-v2.yml \
            scripts/apply_pipeline_roadmap_v2.py
          git add \
            .github/branch-policy.json \
            docs/architecture/0007-implicit-clock-reset-domains.md \
            docs/architecture/0008-automatic-pipeline-architecture.md \
            docs/architecture/README.md \
            docs/roadmap/automatic-pipeline-api-v0.3-plan.md \
            docs/roadmap/automatic-pipeline-api-v0.3-surface.json \
            docs/roadmap/clock-reset-api-v0.2-plan.md \
            docs/roadmap/clock-reset-api-v0.2-surface.json \
            docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: add automatic pipeline architecture and API freeze plan'
          git push origin HEAD:increment/13-automatic-pipeline-roadmap
