name: Prepare Increment 10 candidate prototypes

on:
  push:
    branches:
      - increment/10-public-api-candidate-prototypes

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: increment/10-public-api-candidate-prototypes

      - name: Integrate Increment 10 contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("scripts/nodal.py"): (
                  (
                      '        _python(root, "check_increment9.py"),\n',
                      '        _python(root, "check_increment9.py"),\n'
                      '        _python(root, "check_increment10.py"),\n',
                  ),
                  (
                      '        "lint",\n',
                      '        "lint",\n'
                      '        "api",\n',
                  ),
              ),
              Path("scripts/check_developer_commands.py"): (
                  (
                      '        \'check_increment9.py"\',\n',
                      '        \'check_increment9.py"\',\n'
                      '        \'check_increment10.py"\',\n',
                  ),
              ),
              Path("tests/developer/test_developer_commands.py"): (
                  (
                      '            "check_increment9.py",\n',
                      '            "check_increment9.py",\n'
                      '            "check_increment10.py",\n',
                  ),
                  (
                      '        for suite in ("architecture", "build", "toolchain", "compiler", "developer", "ci", "lint"):\n',
                      '        for suite in (\n'
                      '            "architecture",\n'
                      '            "build",\n'
                      '            "toolchain",\n'
                      '            "compiler",\n'
                      '            "developer",\n'
                      '            "ci",\n'
                      '            "lint",\n'
                      '            "api",\n'
                      '        ):\n',
                  ),
                  (
                      '        self.assertTrue(any("check_increment9.py" in command for command in rendered))\n'
                      '        self.assertTrue(any("tests/lint" in command for command in rendered))\n',
                      '        self.assertTrue(any("check_increment9.py" in command for command in rendered))\n'
                      '        self.assertTrue(any("check_increment10.py" in command for command in rendered))\n'
                      '        self.assertTrue(any("tests/lint" in command for command in rendered))\n'
                      '        self.assertTrue(any("tests/api" in command for command in rendered))\n',
                  ),
              ),
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(
                          f"missing expected Increment 10 integration anchor in {path}: {old!r}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Format Scala candidates
        run: ./mill mill.scalalib.scalafmt/reformatAll

      - name: Commit integrated and formatted candidates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            build.mill \
            core/scala/api/src/nodal/CandidateApi.scala \
            examples \
            scripts/nodal.py \
            scripts/check_developer_commands.py \
            tests/developer/test_developer_commands.py
          git commit -m 'style: integrate and format Increment 10 candidates'
          git push origin HEAD:increment/10-public-api-candidate-prototypes
