name: Automation Increment 22 Review Fixes v2

on:
  push:
    branches:
      - automation/increment22-review-fixes-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-increment22-review-fixes-v2
  cancel-in-progress: false

jobs:
  patch-and-validate:
    name: increment-22/review-fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out automation source
        uses: actions/checkout@v6
        with:
          ref: automation/increment22-review-fixes-v2
          path: automation

      - name: Check out Increment 22 branch
        uses: actions/checkout@v6
        with:
          ref: increment/22-cross-layer-diagnostic-mapping
          fetch-depth: 0
          path: target

      - name: Apply review and diagnostic-proof fixes
        run: |
          cp \
            automation/scripts/automation_patch_increment22_review_fixes.py \
            target/scripts/automation_patch_increment22_review_fixes.py
          cd target
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/automation_patch_increment22_review_fixes.py
          rm scripts/automation_patch_increment22_review_fixes.py

      - name: Restore locked native and Scala caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/nodal/downloads
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-inc22-review-${{ runner.os }}-${{ hashFiles('target/build.mill', 'target/.mill-version', 'target/mill', 'target/toolchains/lock.json', 'target/toolchains/checksums/*.sha256', 'target/toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-inc22-review-${{ runner.os }}-
            nodal-inc22-${{ runner.os }}-

      - name: Install locked toolchains and format changed sources
        working-directory: target
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/lib/Diagnostics/DiagnosticMapping.cpp
          ./mill mill.scalalib.scalafmt/reformatAll

      - name: Validate structural and mutation contracts
        working-directory: target
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check_increment18.py
          python3 scripts/check_increment19.py
          python3 scripts/check_increment20.py
          python3 scripts/check_increment21.py
          python3 scripts/check_increment22.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Build and test native and Scala layers
        working-directory: target
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          NODAL_NODALC="${PWD}/out/native/release/bin/nodalc" \
            ./nodal core scala
          git diff --check

      - name: Publish validated review fixes
        working-directory: target
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/increment-22-cross-layer-diagnostics.yml \
            core/compiler/lib/Diagnostics/DiagnosticMapping.cpp \
            core/compiler/test/IR/diagnostic-mapping-inventory-invalid.mlir \
            core/compiler/test/IR/diagnostic-mapping-operation-invalid.mlir \
            core/scala/bridge/src/nodal/bridge/NativeDiagnosticMapper.scala \
            core/scala/testkit/test/src/nodal/internal/testkit/CrossLayerDiagnosticTests.scala \
            scripts/check_increment22.py \
            tests/compiler/test_increment22.py
          git commit -m 'Increment 22 — resolve diagnostic mapping review findings'
          git push origin HEAD:increment/22-cross-layer-diagnostic-mapping
