name: Increment 28 Python Cache Cleanup

on:
  push:
    branches:
      - increment/28-electrical-connectivity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-28-pyc-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: increment-28/remove-python-cache-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact repaired branch
        uses: actions/checkout@v6
        with:
          ref: increment/28-electrical-connectivity
          fetch-depth: 0

      - name: Verify exact artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          base=56bd6d50a1ddf780a81038e1dbd42949845f481d
          git merge-base --is-ancestor "${base}" HEAD
          mapfile -t artifacts < <(git ls-files | grep -E '(^|/)__pycache__/.*[.]pyc$' | sort)
          expected=(
            scripts/__pycache__/bootstrap_lint_toolchain.cpython-312.pyc
            scripts/__pycache__/check_increment28.cpython-312.pyc
            scripts/__pycache__/toolchain_lock.cpython-312.pyc
            scripts/native_toolchain/__pycache__/__init__.cpython-312.pyc
            scripts/native_toolchain/__pycache__/install.cpython-312.pyc
            scripts/native_toolchain/__pycache__/state.cpython-312.pyc
            tests/compiler/__pycache__/test_increment28.cpython-312.pyc
          )
          test "${#artifacts[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${artifacts[$index]}" = "${expected[$index]}"
          done
          test -z "$(git status --short)"

      - name: Remove generated artifacts and one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            scripts/__pycache__/bootstrap_lint_toolchain.cpython-312.pyc \
            scripts/__pycache__/check_increment28.cpython-312.pyc \
            scripts/__pycache__/toolchain_lock.cpython-312.pyc \
            scripts/native_toolchain/__pycache__/__init__.cpython-312.pyc \
            scripts/native_toolchain/__pycache__/install.cpython-312.pyc \
            scripts/native_toolchain/__pycache__/state.cpython-312.pyc \
            tests/compiler/__pycache__/test_increment28.cpython-312.pyc
          git rm .github/workflows/increment-28-pyc-cleanup.yml
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/.*[.]pyc$' || true)"
          git diff --cached --check

      - name: Commit and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Increment 28 — remove generated Python cache artifacts'
          echo "CLEAN_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:increment/28-electrical-connectivity
