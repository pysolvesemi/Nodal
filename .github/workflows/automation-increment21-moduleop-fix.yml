name: Automation Increment 21 ModuleOp Fix

on:
  push:
    branches:
      - automation/increment21-moduleop-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-module-op:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out Increment 21 closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/21-roadmap-evidence-closure
          fetch-depth: 0

      - name: Repair MLIR operation typing and owning references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pass_path = Path("core/compiler/lib/Transforms/Passes.cpp")
          text = pass_path.read_text(encoding="utf-8")
          pattern = re.compile(r"(?<!::)\bModuleOp\b")
          matches = pattern.findall(text)
          if not matches:
              raise SystemExit("no unqualified ModuleOp references found")
          updated = pattern.sub("mlir::ModuleOp", text)
          if pattern.search(updated):
              raise SystemExit("unqualified ModuleOp reference remains")

          old_clone = "accepted->clone()"
          new_clone = "accepted.get().getOperation()->clone()"
          if updated.count(old_clone) != 1:
              raise SystemExit(
                  f"const clone anchor count is {updated.count(old_clone)}, expected 1"
              )
          updated = updated.replace(old_clone, new_clone, 1)
          pass_path.write_text(updated, encoding="utf-8")

          test_path = Path("core/compiler/test/Unit/SemanticPipelineTest.cpp")
          test_text = test_path.read_text(encoding="utf-8")
          old_access = "release->getAttrOfType<mlir::StringAttr>"
          new_access = "release->getOperation()->getAttrOfType<mlir::StringAttr>"
          if test_text.count(old_access) != 1:
              raise SystemExit(
                  f"owning-reference access count is {test_text.count(old_access)}, expected 1"
              )
          test_path.write_text(
              test_text.replace(old_access, new_access, 1),
              encoding="utf-8",
          )
          print(f"qualified {len(matches)} builtin ModuleOp references")
          PY

      - name: Install locked toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format and validate native compiler
        run: |
          formatter="${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format"
          "${formatter}" -i \
            core/compiler/include/nodal/Transforms/Passes.h \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/test/Unit/SemanticPipelineTest.cpp \
            core/compiler/tools/nodalc/nodalc.cpp
          python3 scripts/check_increment21.py
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Publish validated fix
        run: |
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add \
            core/compiler/include/nodal/Transforms/Passes.h \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/test/Unit/SemanticPipelineTest.cpp \
            core/compiler/tools/nodalc/nodalc.cpp
          git commit -m \
            "Increment 21 — fix MLIR module typing and native formatting"
          git push origin HEAD:increment/21-roadmap-evidence-closure
