name: Increment 17 Materialize

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: increment-17-materialize
  cancel-in-progress: false

jobs:
  materialize:
    name: increment-17/materialize
    if: github.head_ref == 'increment/17-source-origin-naming' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out authoritative increment branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/17-source-origin-naming

      - name: Materialize implementation and permanent validation
        run: |
          python3 scripts/materialize_increment17.py
          ./mill mill.scalalib.scalafmt/reformatAll
          ./mill scalafix.fix

      - name: Validate materialized increment
        run: |
          python3 scripts/check_increment15.py --compile-negative
          python3 scripts/check_increment16.py
          python3 scripts/check_increment17.py --compile
          python3 tests/api/test_increment16.py
          python3 tests/api/test_increment17.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Commit materialized increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 17 — implement semantic source identity"
          git pull --rebase origin increment/17-source-origin-naming
          git push origin HEAD:increment/17-source-origin-naming
