name: Increment 35 closure materializer

"on":
  push:
    branches:
      - increment/35-evidence-closure-v1
    paths:
      - .github/workflows/increment-35-closure-materializer.yml

permissions:
  contents: write

concurrency:
  group: increment-35-closure-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize closure candidate and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/_inc35_closure_materializer.py")
          text = path.read_text(encoding="utf-8")
          old = 'Path(path_text).write_text(base64.b64decode(payload).decode("utf-8"), encoding="utf-8")'
          new = 'Path(path_text).write_text(base64.b64decode(payload + "=" * (-len(payload) % 4)).decode("utf-8"), encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit(f"expected one base64 decoder, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/_inc35_closure_materializer.py
          rm scripts/_inc35_closure_materializer.py
          rm .github/workflows/increment-35-closure-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(increment35): materialize evidence-closure candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
