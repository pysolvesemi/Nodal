name: Increment 35 predecessor SHA repair

"on":
  push:
    branches:
      - increment/35-evidence-closure-v1
    paths:
      - .github/workflows/increment-35-predecessor-sha-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Correct predecessor identity and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wrong = "a9d3ec507f9953c41e7b9cf1d8bd6a2c5c9afd49"
          correct = "a9d3ec50799953c41e7b9cf1d8bd6a2c5c9afd49"
          paths = [
              Path("scripts/check_increment35.py"),
              Path("tests/compiler/fixtures/increment35/manifest.json"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(wrong)
              if count != 1:
                  raise SystemExit(f"{path}: expected one predecessor SHA typo, found {count}")
              path.write_text(text.replace(wrong, correct, 1), encoding="utf-8")
          PY
          rm .github/workflows/increment-35-predecessor-sha-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment35): correct predecessor merge identity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
