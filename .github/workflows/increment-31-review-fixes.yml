name: Increment 31 Review Fixes

on:
  push:
    branches:
      - increment/31-potential-flow-access

permissions:
  contents: write

concurrency:
  group: increment-31-review-fixes
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply bytecode inventory repair
        run: python3 scripts/finalize_increment31.py

      - name: Validate repaired contracts and mutations
        run: |
          python3 scripts/check_increment31.py
          python3 tests/compiler/test_increment31.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          git diff --check

      - name: Commit validated non-workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment31): ignore runtime Python bytecode caches"
          git push origin HEAD:increment/31-potential-flow-access
