name: Increment 35 Increment 33 successor repair

"on":
  push:
    branches:
      - increment/35-evidence-closure-v1
    paths:
      - .github/workflows/increment-35-inc33-successor-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply successor contract and retire repair scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_increment35_inc33_successor_repair.py
          python3 -m py_compile scripts/check_increment33.py tests/compiler/test_increment33.py
          rm scripts/_increment35_inc33_successor_repair.py
          rm .github/workflows/increment-35-inc33-succcessor-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(increment35): make Increment 33 successor-aware"
          git push origin "HEAD:${GITHUB_REF_NAME}"
