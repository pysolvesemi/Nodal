name: Increment 24 Evidence Closure

on:
  push:
    branches:
      - increment/24-roadmap-evidence-closure

permissions:
  contents: write

concurrency:
  group: increment-24-evidence-closure
  cancel-in-progress: false

jobs:
  close:
    name: increment-24/close-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/24-roadmap-evidence-closure
          fetch-depth: 0

      - name: Record accepted implementation evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          manifest_path = Path("tests/compiler/fixtures/increment24/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "implemented-awaiting-evidence":
              raise RuntimeError("Increment 24 manifest is not awaiting evidence")
          manifest["status"] = "validated-minimal-analog-ir"
          manifest["evidence"] = {
              "pull_request": 66,
              "dedicated_run": 33039547022,
              "core_ci_run": 33039546995,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          roadmap_path = Path("docs/roadmap/nodal-development-todo.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          replacements = (
              ("**Revision:** 1.29", "**Revision:** 1.30"),
              ("**Updated:** 2026-08-26", "**Updated:** 2026-08-27"),
              (
                  "- [ ] **Increment 24 — Minimal analog expression and contribution IR**\n"
                  "  - Add real literals, parameter references, arithmetic, electrical potential access, analog region, and contribution sufficient for a minimal RC equation.\n",
                  "- [x] **Increment 24 — Minimal analog expression and contribution IR**\n"
                  "  - Add real literals, parameter references, arithmetic, electrical potential access, analog region, and contribution sufficient for a minimal RC equation.\n"
                  "  - Evidence: [`NodalMinimalAnalogIr-DG-v1.0.md`](../design-gates/NodalMinimalAnalogIr-DG-v1.0.md), "
                  "[`increment24-minimal-analog-ir.md`](../implementation/increment24-minimal-analog-ir.md), "
                  "implementation PR [#66](https://github.com/pysolvesemi/Nodal/pull/66), "
                  "dedicated validation run [33039547022](https://github.com/pysolvesemi/Nodal/actions/runs/33039547022), "
                  "and Core CI run [33039546995](https://github.com/pysolvesemi/Nodal/actions/runs/33039546995).\n",
              ),
          )
          for old, new in replacements:
              if roadmap.count(old) != 1:
                  raise RuntimeError(f"roadmap anchor is not unique: {old!r}")
              roadmap = roadmap.replace(old, new, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          test_path = Path("tests/compiler/test_increment24.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = "    def test_accepts_validated_successor_state(self) -> None:\n"
          addition = (
              "    def test_rejects_premature_roadmap_closure(self) -> None:\n"
              "        temporary, root = self.temporary_repository()\n"
              "        self.addCleanup(temporary.cleanup)\n"
              "        manifest_path = root / \"tests/compiler/fixtures/increment24/manifest.json\"\n"
              "        manifest = __import__(\"json\").loads(\n"
              "            manifest_path.read_text(encoding=\"utf-8\")\n"
              "        )\n"
              "        manifest[\"status\"] = \"implemented-awaiting-evidence\"\n"
              "        manifest[\"evidence\"] = {}\n"
              "        manifest_path.write_text(\n"
              "            __import__(\"json\").dumps(manifest, indent=2) + \"\\n\",\n"
              "            encoding=\"utf-8\",\n"
              "        )\n"
              "        self.assertIn(\"NODAL-INC24-010\", self.codes(root))\n"
              "\n"
          )
          if tests.count(anchor) != 1:
              raise RuntimeError("Increment 24 acceptance-test anchor is not unique")
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Remove one-shot workflow before repository validation
        run: |
          set -euo pipefail
          git rm -f .github/workflows/automation-increment24-evidence-closure.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate closed Increment 24 state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          for increment in 18 19 20 21 22 23 24; do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

          actual="$(git diff --name-only origin/dev | sort)"
          expected="$(printf '%s\n' \
            docs/roadmap/nodal-development-todo.md \
            tests/compiler/fixtures/increment24/manifest.json \
            tests/compiler/test_increment24.py \
            | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo 'unexpected final closure diff:' >&2
            printf '%s\n' "${actual}" >&2
            exit 1
          fi

      - name: Publish Increment 24 evidence closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 24 — record accepted evidence and close roadmap"
          git pull --rebase origin increment/24-roadmap-evidence-closure
          git push origin HEAD:increment/24-roadmap-evidence-closure
