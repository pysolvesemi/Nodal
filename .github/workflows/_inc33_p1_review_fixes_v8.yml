name: Increment 33 P1 review fixes v8

on:
  push:
    branches:
      - automation/inc33-p1-review-fixes-v8-20260901

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Increment 33 implementation head
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Require the reviewed baseline
        run: test "$(git rev-parse HEAD)" = 848e5420bddf25869b48892d49bf90b824d2ee3b

      - name: Apply the reviewed P1 repair
        run: |
          git fetch --no-tags origin automation/inc33-p1-review-fixes-v7-20260901
          python3 - <<'PY'
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "15d213fc5babf583efa77961da563715db1a8b22:.github/workflows/_inc33_p1_review_fixes_v7.yml",
              ],
              text=True,
          )
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install pinned native and lint toolchains"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          script = textwrap.dedent(source[begin:end])
          exec(compile(script, "increment33-p1-review-fix-v8.py", "exec"), {"__name__": "__main__"})

          renderer_path = Path(
              "core/scala/bridge/src/nodal/bridge/AnalogProceduralMlir.scala"
          )
          renderer = renderer_path.read_text(encoding="utf-8")

          overlap_pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)throw new IllegalArgumentException\(\n'
              r'(?P=indent)  "procedural event order contains overlapping semantic intervals"\n'
              r'(?P=indent)\)'
          )

          def overlap_replacement(match: re.Match[str]) -> str:
              indent = match.group("indent")
              return (
                  f"{indent}require(\n"
                  f"{indent}  false,\n"
                  f'{indent}  "procedural event order contains overlapping semantic intervals"\n'
                  f"{indent})\n"
                  f"{indent}None"
              )

          renderer, overlap_count = overlap_pattern.subn(
              overlap_replacement,
              renderer,
              count=1,
          )
          if overlap_count != 1:
              raise SystemExit("overlapping-order throw site was not found exactly once")

          contradiction_pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)if semanticOrder\.contains\(true\) && '
              r'semanticOrder\.contains\(false\) then\n'
              r'(?P=indent)  throw new IllegalArgumentException\(\n'
              r'(?P=indent)    "procedural declaration and assignment orders contradict each other"\n'
              r'(?P=indent)  \)'
          )

          def contradiction_replacement(match: re.Match[str]) -> str:
              indent = match.group("indent")
              return (
                  f"{indent}require(\n"
                  f"{indent}  !(semanticOrder.contains(true) && semanticOrder.contains(false)),\n"
                  f'{indent}  "procedural declaration and assignment orders contradict each other"\n'
                  f"{indent})"
              )

          renderer, contradiction_count = contradiction_pattern.subn(
              contradiction_replacement,
              renderer,
              count=1,
          )
          if contradiction_count != 1:
              raise SystemExit("contradictory-order throw site was not found exactly once")
          if "throw new IllegalArgumentException" in renderer:
              raise SystemExit("explicit IllegalArgumentException remains in procedural renderer")
          renderer_path.write_text(renderer, encoding="utf-8")
          PY

      - name: Install pinned native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Format Scala sources
        run: ./mill mill.scalalib.scalafmt/reformatAll

      - name: Validate predecessor and Increment 33 contracts
        run: |
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile

      - name: Execute Increment 33 mutation suite
        run: python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'

      - name: Compile and test Scala core
        run: ./nodal core scala

      - name: Configure build lint and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Parse procedural bridge output with nodalc
        run: |
          test -x out/native/release/bin/nodalc
          NODAL_NODALC="$PWD/out/native/release/bin/nodalc" \
            ./mill core.scala.testkit.test.testOnly \
              nodal.internal.testkit.ScalaToMlirBridgeTests

      - name: Check repository style and whitespace
        run: |
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Publish validated review fixes
        run: |
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            .github/workflows/increment-33-analog-procedural-assignment.yml \
            core/scala/api/src/nodal/AnalogProceduralConstruction.scala \
            core/scala/api/src/nodal/ElaborationConstructionKernel.scala \
            core/scala/bridge/src/nodal/bridge/AnalogProceduralMlir.scala \
            core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala \
            core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala \
            scripts/check_increment33.py \
            tests/compiler/test_increment33.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(increment33): preserve nested chronology and compound dimensions'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
