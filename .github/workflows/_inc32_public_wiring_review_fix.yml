name: Increment 32 API Manifest Diagnostic

on:
  push:
    branches:
      - automation/inc32-public-wiring-review-fix

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download failing Increment 14 job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pysolvesemi/Nodal/actions/jobs/99315063505/logs \
            --output /tmp/increment14-job.log
          test -s /tmp/increment14-job.log

      - name: Upload raw diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: increment14-job-log
          path: /tmp/increment14-job.log
          if-no-files-found: error
          retention-days: 1
