name: Increment 21 Canonical Native Formatting Closure

on:
  push:
    branches:
      - increment/21-roadmap-evidence-closure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-21-format-closure
  cancel-in-progress: false

jobs:
  format:
    name: increment-21/canonical-native-format
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/21-roadmap-evidence-closure
          fetch-depth: 0

      - name: Install pinned lint toolchain
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Apply canonical native formatting
        run: |
          formatter="${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format"
          find \
            core/compiler/include \
            core/compiler/lib \
            core/compiler/test/Unit \
            core/compiler/tools \
            -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 | xargs -0 "${formatter}" -i
          python3 scripts/check_formatting_baseline.py
          git diff --check

      - name: Publish permanent formatted sources
        run: |
          rm .github/workflows/increment-21-format-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 21 — apply canonical native formatting'
          git push origin HEAD:increment/21-roadmap-evidence-closure
