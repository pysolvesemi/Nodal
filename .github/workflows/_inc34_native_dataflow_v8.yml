name: Increment 34 Native Dataflow v8

on:
  push:
    branches:
      - automation/inc34-native-dataflow-v8
    paths:
      - '.github/workflows/_inc34_native_dataflow_v8.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-native-dataflow-v8
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-native-dataflow-v8
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Repair stale paths, deterministic anchors, and Scalafix findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('controller')
          automation = controller / '.github/automation'
          old_test = 'core/scala/bridge/test/src/nodal/bridge/ScalaToMlirBridgeTests.scala'
          new_test = 'core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala'

          for path in automation.iterdir():
              if path.suffix not in {'.py', '.sh'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if old_test in text:
                  path.write_text(text.replace(old_test, new_test), encoding='utf-8')

          scala_patch = automation / 'inc34_patch_scala.py'
          text = scala_patch.read_text(encoding='utf-8')
          replacements = {
              '''        throw new IllegalArgumentException(
          s"structured analog operation '$identity' is missing '$role' payload"
        )''': '''        scala.util.Failure[AnalogProceduralRuntime.ControlExpressionRecord](
          new IllegalArgumentException(
            s"structured analog operation '$identity' is missing '$role' payload"
          )
        ).get''',
              '''            throw new IllegalArgumentException(
              s"structured declaration '${declaration.variable}' has no variable record"
            )''': '''            scala.util.Failure[AnalogProceduralRuntime.VariableRecord](
              new IllegalArgumentException(
                s"structured declaration '${declaration.variable}' has no variable record"
              )
            ).get''',
              '''            throw new IllegalArgumentException(
              s"structured read '${read.variable}' has no variable record"
            )''': '''            scala.util.Failure[AnalogProceduralRuntime.VariableRecord](
              new IllegalArgumentException(
                s"structured read '${read.variable}' has no variable record"
              )
            ).get''',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'missing Scala repair anchor: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          scala_patch.write_text(text, encoding='utf-8')

          post = automation / 'inc34_post_repair.py'
          text = post.read_text(encoding='utf-8')
          old = '        text = replace_once(text, old, new, "conditional arm owner check")'
          new = '''        if old not in text:
            raise SystemExit("conditional arm owner check marker was not found")
        text = text.replace(old, new, 1)'''
          if old not in text and new not in text:
              raise SystemExit('conditional-arm deterministic repair anchor was not found')
          post.write_text(text.replace(old, new, 1), encoding='utf-8')

          contract = automation / 'inc34_patch_native_dataflow_contract_repair.py'
          text = contract.read_text(encoding='utf-8')
          old = "integration 'native_branch_sensitive_definite_assignment' is not complete"
          new = "completed integration 'native_branch_sensitive_definite_assignment' is not recorded"
          if old not in text and new not in text:
              raise SystemExit('native-dataflow evidence assertion was not found')
          contract.write_text(text.replace(old, new), encoding='utf-8')

          runner = automation / 'inc34_run_native_dataflow_v6.sh'
          text = runner.read_text(encoding='utf-8')
          text = text.replace(
              'automation/inc34-native-dataflow-results-v6',
              'automation/inc34-native-dataflow-results-v8',
          )
          text = text.replace(
              '# Increment 34 native dataflow v6',
              '# Increment 34 native dataflow v8',
          )
          text = text.replace(
              'structured native dataflow v6',
              'structured native dataflow v8',
          )
          text = text.replace(
              'record native dataflow v6',
              'record native dataflow v8',
          )
          runner.write_text(text, encoding='utf-8')
          PY

      - name: Execute guarded Increment 34 continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_run_native_dataflow_v6.sh \
            "${GITHUB_WORKSPACE}/controller" \
            "${GITHUB_WORKSPACE}/work" \
            "${RUNNER_TEMP}/inc34-v8"
