name: Core CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'increment/**'
      - 'roadmap/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_increment12_revision:
    name: repair Increment 12 roadmap revision check
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run Increment 12 revision repair'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch checker and mutation test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("scripts/check_increment12.py")
          lines = checker.read_text(encoding="utf-8").splitlines(keepends=True)
          fixed_revision = '            "**Revision:** 1.12",\n'
          validation_marker = "main roadmap revision must be a two-part numeric revision at least 1.12"
          if validation_marker not in "".join(lines):
              matches = [index for index, line in enumerate(lines) if line == fixed_revision]
              if len(matches) != 1:
                  raise SystemExit(f"expected one fixed roadmap revision line, found {len(matches)}")
              del lines[matches[0]]
              anchors = [
                  index
                  for index, line in enumerate(lines)
                  if line == '        "main roadmap",\n'
                  and index + 1 < len(lines)
                  and lines[index + 1] == "    )\n"
              ]
              if len(anchors) != 1:
                  raise SystemExit(f"expected one main-roadmap validation anchor, found {len(anchors)}")
              revision_check = '''    revision_line = next(
        (line for line in roadmap.splitlines() if line.startswith("**Revision:** ")),
        None,
    )
    try:
        revision = (
            tuple(
                int(part)
                for part in revision_line.removeprefix("**Revision:** ").split(".")
            )
            if revision_line is not None
            else ()
        )
    except ValueError:
        revision = ()
    if len(revision) != 2 or revision < (1, 12):
        problems.append(
            Problem(
                "NODAL-INC12-054",
                "main roadmap revision must be a two-part numeric revision at least 1.12",
            )
        )

'''.splitlines(keepends=True)
              lines[anchors[0] + 2:anchors[0] + 2] = revision_check
              checker.write_text("".join(lines), encoding="utf-8")

          tests = Path("tests/api/test_increment12.py")
          test_lines = tests.read_text(encoding="utf-8").splitlines(keepends=True)
          test_name = "    def test_roadmap_revision_cannot_predate_increment12(self) -> None:\n"
          if test_name not in test_lines:
              anchors = [
                  index
                  for index, line in enumerate(test_lines)
                  if line == "    def test_roadmap_increment_must_remain_closed(self) -> None:\n"
              ]
              if len(anchors) != 1:
                  raise SystemExit(f"expected one roadmap test anchor, found {len(anchors)}")
              test_case = '''    def test_roadmap_revision_cannot_predate_increment12(self) -> None:
        temporary, root = self.copy_fixture()
        self.addCleanup(temporary.cleanup)
        path = root / "docs/roadmap/nodal-development-todo.md"
        content = path.read_text(encoding="utf-8")
        revision_line = next(
            line for line in content.splitlines() if line.startswith("**Revision:** ")
        )
        path.write_text(
            content.replace(revision_line, "**Revision:** 1.11", 1),
            encoding="utf-8",
        )
        codes = {problem.code for problem in CHECKER.check_repository(root)}
        self.assertIn("NODAL-INC12-054", codes)

'''.splitlines(keepends=True)
              test_lines[anchors[0]:anchors[0]] = test_case
              tests.write_text("".join(test_lines), encoding="utf-8")
          PY
          python3 -m py_compile scripts/check_increment12.py tests/api/test_increment12.py
          python3 scripts/check_increment12.py
          python3 -m unittest discover -s tests/api -p 'test_increment12.py'
          git diff --check

      - name: Publish checker repair
        run: |
          rm .ci-increment12-repair-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_increment12.py tests/api/test_increment12.py .ci-increment12-repair-trigger
          git commit -m 'Make Increment 12 checker accept later roadmap revisions'
          git push origin HEAD:roadmap/immediate-assertion-synthesis-boundary

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve contribution-policy base
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git fetch --no-tags origin \
              "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          elif [[ "${GITHUB_REF_NAME}" == increment/* ]]; then
            git fetch --no-tags origin dev:refs/remotes/origin/dev
            base_ref=origin/dev
          else
            base_ref=HEAD^
          fi
          echo "NODAL_BASE_REF=${base_ref}" >> "${GITHUB_ENV}"

      - name: Install pinned lint tools
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          echo "NODAL_LINT_TOOLCHAIN=${RUNNER_TEMP}/nodal-lint-toolchain" \
            >> "${GITHUB_ENV}"

      - name: Validate contracts, style, and online provenance
        run: |
          ./nodal check \
            --contracts-only \
            --online-toolchain \
            --lint-toolchain "${NODAL_LINT_TOOLCHAIN}" \
            --base-ref "${NODAL_BASE_REF}"

  scala:
    name: scala
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore verified Scala dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/nodal/mill
          key: nodal-scala-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version', 'mill', '.scalafmt.conf', '.scalafix.conf', 'toolchains/lock.json', 'toolchains/lint-lock.json') }}
          restore-keys: |
            nodal-scala-${{ runner.os }}-

      - name: Compile and test Scala core
        run: ./nodal core scala

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore locked native download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nodal/downloads
          key: nodal-native-download-${{ runner.os }}-${{ hashFiles('toolchains/lock.json', 'toolchains/checksums/*.sha256') }}

      - name: Install locked native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Configure, build, lint, and test native core
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

  required:
    name: required
    if: always()
    needs:
      - contracts
      - scala
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish aggregate push status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          state=success
          description='Core CI passed'
          if [ "${CONTRACTS_RESULT}" != success ] || \
             [ "${SCALA_RESULT}" != success ] || \
             [ "${NATIVE_RESULT}" != success ]; then
            state=failure
            description='Core CI failed'
          fi
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='core-ci/required' \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Require every Core CI job
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SCALA_RESULT: ${{ needs.scala.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${CONTRACTS_RESULT}" = success
          test "${SCALA_RESULT}" = success
          test "${NATIVE_RESULT}" = success
