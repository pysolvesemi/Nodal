name: Increment 33 P1 review fixes

on:
  push:
    branches:
      - automation/inc33-p1-review-fixes-20260901

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Increment 33 implementation head
        uses: actions/checkout@v6
        with:
          ref: increment/33-analog-variables-procedural-assignment-v5
          fetch-depth: 0

      - name: Require the reviewed baseline
        run: test "$(git rev-parse HEAD)" = 2356c98e0ad3e586344bedaa6ddc849c92b7bec8

      - name: Apply authored-order and dimension fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          construction_path = Path(
              "core/scala/api/src/nodal/AnalogProceduralConstruction.scala"
          )
          construction = construction_path.read_text(encoding="utf-8")
          construction, count = re.subn(
              r'(?m)^(\s*\.map\(dimensionFromUnit\)\n)\s*\.filterNot\(_ == "dimensionless"\)\n',
              r'\1',
              construction,
              count=1,
          )
          if count != 1:
              raise SystemExit("dimensionless filter was not found exactly once")
          construction_path.write_text(construction, encoding="utf-8")

          renderer_path = Path(
              "core/scala/bridge/src/nodal/bridge/AnalogProceduralMlir.scala"
          )
          renderer = renderer_path.read_text(encoding="utf-8")
          helper_anchor = "  private def renderScopeBody(\n"
          helpers = '''  private def earliestAssignmentOrder(node: ScopeNode): Option[Int] =
            val local = node.assignments.iterator.map(_.authoredOrder)
            val nested = node.children.valuesIterator.flatMap(earliestAssignmentOrder)
            (local ++ nested).minOption

          private def earliestDeclarationOrder(node: ScopeNode): Option[Int] =
            val local = node.declarations.iterator.map(_.declarationOrder)
            val nested = node.children.valuesIterator.flatMap(earliestDeclarationOrder)
            (local ++ nested).minOption

          private def authoredSequence(event: Event): (Int, Int) = event match
            case DeclarationEvent(record) => (0, record.declarationOrder)
            case AssignmentEvent(record) => (1, record.authoredOrder)
            case ScopeEvent(scope) =>
              earliestAssignmentOrder(scope)
                .map(order => (1, order))
                .orElse(earliestDeclarationOrder(scope).map(order => (0, order)))
                .getOrElse((2, Int.MaxValue))

          '''
          if "private def authoredSequence(event: Event)" not in renderer:
              if renderer.count(helper_anchor) != 1:
                  raise SystemExit("renderScopeBody anchor was not found exactly once")
              renderer = renderer.replace(helper_anchor, helpers + helper_anchor, 1)

          sort_start = renderer.find("    val sorted = events.sortBy: event =>\n")
          if sort_start < 0:
              raise SystemExit("event sort start was not found")
          sort_end = renderer.find("\n\n    sorted.flatMap:", sort_start)
          if sort_end < 0:
              raise SystemExit("event sort end was not found")
          old_sort = renderer[sort_start:sort_end]
          if "source.file" not in old_sort or "event.order" not in old_sort:
              raise SystemExit("unexpected event sort implementation")
          new_sort = '''    val sorted = events.sortBy: event =>
            val (phase, sequence) = authoredSequence(event)
            event.source match
              case Some(source) =>
                (
                  phase,
                  sequence,
                  event.category,
                  source.file,
                  source.line,
                  source.column,
                  event.identity
                )
              case None =>
                (
                  phase,
                  sequence,
                  event.category,
                  "",
                  Int.MaxValue,
                  Int.MaxValue,
                  event.identity
                )'''
          renderer = renderer[:sort_start] + new_sort + renderer[sort_end:]
          renderer_path.write_text(renderer, encoding="utf-8")

          construction_tests_path = Path(
              "core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala"
          )
          construction_tests = construction_tests_path.read_text(encoding="utf-8")
          class_anchor = "final class PublicAnalogAssignmentOutsideProcedure extends Module:\n"
          dimensionless_class = '''final class PublicAnalogDimensionlessMismatch extends Module:
            val voltage: Variable[Real] = variable(Real, 0.0.V)

            analogProcedure:
              voltage := 0.0.real

          '''
          if "final class PublicAnalogDimensionlessMismatch" not in construction_tests:
              if construction_tests.count(class_anchor) != 1:
                  raise SystemExit("construction test class anchor was not found exactly once")
              construction_tests = construction_tests.replace(
                  class_anchor,
                  dimensionless_class + class_anchor,
                  1,
              )

          test_anchor = '    test("public assignment outside analogProcedure is rejected"):\n'
          dimensionless_test = '''    test("public dimensionless assignment to a voltage variable is rejected"):
            val failure =
              scala.util.Try(
                ConstructionKernel.inspect(new PublicAnalogDimensionlessMismatch)
              ).failed.get
                .asInstanceOf[AnalogProceduralRuntime.Failure]
            assert(failure.diagnostic.code == "NODAL-ANALOG-033-013")

          '''
          if "public dimensionless assignment to a voltage variable is rejected" not in construction_tests:
              if construction_tests.count(test_anchor) != 1:
                  raise SystemExit("construction test method anchor was not found exactly once")
              construction_tests = construction_tests.replace(
                  test_anchor,
                  dimensionless_test + test_anchor,
                  1,
              )
          construction_tests_path.write_text(construction_tests, encoding="utf-8")

          bridge_tests_path = Path(
              "core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala"
          )
          bridge_tests = bridge_tests_path.read_text(encoding="utf-8")
          snapshot_test_anchor = '    test("snapshot insertion order does not affect the bridge"):\n'
          order_test = '''    test("analog procedural rendering prefers authored order to provenance"):
            val snapshot = ConstructionKernel.inspect(new BridgeProceduralTop)
            val program = snapshot.analogProcedural.head
            val invertedSources = program.assignments.zipWithIndex.map:
              case (record, 0) =>
                record.copy(
                  source = Some(AnalogProceduralRuntime.Source("z-helper.scala", 200, 1))
                )
              case (record, 1) =>
                record.copy(
                  source = Some(AnalogProceduralRuntime.Source("a-helper.scala", 10, 1))
                )
              case (record, _) => record
            val modified = snapshot.copy(
              analogProcedural = snapshot.analogProcedural.updated(
                0,
                program.copy(assignments = invertedSources)
              )
            )

            val document = ScalaToMlirBridge.fromSnapshot(modified)
            val first = document.text.indexOf("authored_order = 0 : i64")
            val second = document.text.indexOf("authored_order = 1 : i64")
            assert(first >= 0)
            assert(second > first)

          '''
          if "analog procedural rendering prefers authored order to provenance" not in bridge_tests:
              if bridge_tests.count(snapshot_test_anchor) != 1:
                  raise SystemExit("bridge test method anchor was not found exactly once")
              bridge_tests = bridge_tests.replace(
                  snapshot_test_anchor,
                  order_test + snapshot_test_anchor,
                  1,
              )
          bridge_tests_path.write_text(bridge_tests, encoding="utf-8")
          PY

      - name: Install pinned native and lint toolchains
        run: |
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Run focused acceptance
        run: |
          python3 scripts/check_increment31.py
          python3 scripts/check_increment133.py
          python3 scripts/check_increment32.py
          python3 scripts/check_increment33.py --compile
          python3 -m unittest discover -s tests/compiler -p 'test_increment33.py'
          ./nodal core scala
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          ./nodal style check \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"
          git diff --check

      - name: Publish validated review fixes
        run: |
          git config user.name pysolvesemi
          git config user.email pysolvesemi@gmail.com
          git add \
            core/scala/api/src/nodal/AnalogProceduralConstruction.scala \
            core/scala/bridge/src/nodal/bridge/AnalogProceduralMlir.scala \
            core/scala/testkit/test/src/nodal/AnalogProceduralConstructionTests.scala \
            core/scala/testkit/test/src/nodal/internal/testkit/ScalaToMlirBridgeTests.scala
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(increment33): preserve order and dimension semantics'
          git push origin HEAD:increment/33-analog-variables-procedural-assignment-v5
