name: Nodal 42 PR134 public hierarchy bridge fixture dispatch 9271a6d

on:
  push:
    branches:
      - 'ci-control/nodal-42-pr134-9271a6d-bridge-v1'
    paths:
      - '.github/workflows/ci-control-42-pr134-9271a6d-v1.yml'
      - 'scripts/ci_control/increment42_pr134_9271a6d_v1.py'
      - 'scripts/ci_control/increment42_pr134_9271a6d_v1_inventory.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: nodal-42-pr134-f2f3215-format-v1
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out only the pinned controller commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact parent failures and dispatch bridge fixture repair checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_control/increment42_pr134_9271a6d_v1.py
      - name: Preserve dispatch intent and observed run ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodal-42-pr134-9271a6d-v1-dispatch-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-evidence/
          if-no-files-found: error
          retention-days: 30

