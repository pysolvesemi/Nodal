name: Automation Increment 23 Evidence Closure

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - dev

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: automation-increment23-evidence-closure
  cancel-in-progress: false

jobs:
  close:
    if: github.event.pull_request.head.ref == 'increment/23-roadmap-evidence-closure'
    name: increment-23/evidence-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply evidence and remove one-shot automation
        run: |
          python3 scripts/automation_close_increment23.py
          rm scripts/automation_close_increment23.py
          rm .github/workflows/automation-increment23-evidence-closure.yml

      - name: Validate closure contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for increment in 18 19 20 21 22 23; do
            python3 "scripts/check_increment${increment}.py"
          done
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          python3 scripts/check_package_visibility.py
          git diff --check

      - name: Publish closure commit
        id: publish
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Increment 23 — record validated evidence and close roadmap'
          git push origin "HEAD:${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Dispatch final-head validation
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"%s\"}' "${BRANCH}")"
          for workflow in increment-23-backend-framework.yml ci.yml; do
            curl --fail-with-body --retry 3 \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d "${payload}"
          done

      - name: Record final head
        run: echo "Final closure head is ${{ steps.publish.outputs.sha }}"
