name: Increment 13 Core Semantic Candidates

on:
  push:
    branches:
      - increment/13-core-semantic-candidates
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  candidate-contracts:
    name: increment-13/core-semantic-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Format Scala candidate sources
        if: github.event_name == 'push'
        run: ./mill mill.scalalib.scalafmt/reformatAll

      - name: Publish formatting-only fix
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              core/scala/api/src/nodal/CoreSemanticsCandidateApi.scala \
              examples/coreSemanticsApi/src/CoreSemanticsCandidates.scala \
              examples/coreSemanticsExternal/src/ReusableCoreSemantics.scala
            git commit -m 'Increment 13 — apply Scala formatting'
            git push origin HEAD:increment/13-core-semantic-candidates
          fi

      - name: Validate positive and negative compile contracts
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          ./mill scalafix.check
          python3 scripts/check_increment13.py --compile-negative
          git diff --check
