name: Increment 30 Temporary Artifact Guard

on:
  push:
    branches:
      - increment/30-analog-numeric-types
    paths:
      - .github/workflows/increment-30-temporary-artifact-guard.yml

permissions:
  contents: write

concurrency:
  group: increment-30-temporary-artifact-guard
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out Increment 30 branch
        uses: actions/checkout@v6
        with:
          ref: increment/30-analog-numeric-types
          fetch-depth: 0

      - name: Reserve all temporary helper paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_increment30.py")
          text = path.read_text(encoding="utf-8")
          marker = '    ".github/workflows/increment-30-final-review-fixes.yml",\n'
          replacement = marker + (
              '    ".github/workflows/increment-30-review-fixes.yml",\n'
              '    ".github/workflows/increment-30-temporary-artifact-guard.yml",\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("Increment 30 temporary-file marker is not unique")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Publish checker guard
        run: |
          set -euo pipefail
          git config user.name "pysolvesemi"
          git config user.email "pysolvesemi@gmail.com"
          git add scripts/check_increment30.py
          git commit -m "Increment 30 — reserve all temporary review helpers"
          git push origin HEAD:increment/30-analog-numeric-types
