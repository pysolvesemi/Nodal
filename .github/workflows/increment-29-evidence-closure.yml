name: Increment 29 Evidence Closure

on:
  push:
    branches:
      - increment/29-evidence-closure

permissions:
  contents: write

concurrency:
  group: increment-29-evidence-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    name: increment-29/evidence-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out closure branch
        uses: actions/checkout@v6
        with:
          ref: increment/29-evidence-closure
          fetch-depth: 0

      - name: Record accepted implementation evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          roadmap_path = Path("docs/roadmap/nodal-development-todo.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")

          revision_old = "**Revision:** 1.36"
          revision_new = "**Revision:** 1.37"
          if roadmap.count(revision_old) != 1:
              raise SystemExit(f"roadmap revision anchor count: {roadmap.count(revision_old)}")
          roadmap = roadmap.replace(revision_old, revision_new, 1)

          increment_old = """- [ ] **Increment 29 — Parameters, constants, ranges, and units**
            - Implement supported parameter kinds, constraints, constant expressions, overrides, unit-aware literals, and lossless native HDL rendering.
            - Classify ordinary parameters, structural parameters, and dynamic values; require topology, component count, equation count, shape, or rank changes to be elaboration-time or static target generation, and diagnose unsupported parameter-envelope structural changes.
          """
          increment_new = """- [x] **Increment 29 — Parameters, constants, ranges, and units**
            - Implement supported parameter kinds, constraints, constant expressions, overrides, unit-aware literals, and lossless native HDL rendering.
            - Classify ordinary parameters, structural parameters, and dynamic values; require topology, component count, equation count, shape, or rank changes to be elaboration-time or static target generation, and diagnose unsupported parameter-envelope structural changes.
            - Evidence: implementation PR [#78](https://github.com/pysolvesemi/Nodal/pull/78), dedicated validation run [33154887196](https://github.com/pysolvesemi/Nodal/actions/runs/33154887196), merge commit [`09ffbf34`](https://github.com/pysolvesemi/Nodal/commit/09ffbf344a4bf2ee8f6b2fb16ba3272669f47f27), and Core CI run [33154887245](https://github.com/pysolvesemi/Nodal/actions/runs/33154887245).
          """
          if roadmap.count(increment_old) != 1:
              raise SystemExit(f"Increment 29 roadmap anchor count: {roadmap.count(increment_old)}")
          roadmap = roadmap.replace(increment_old, increment_new, 1)
          if "- [ ] **Increment 30 — Analog numeric types and expression typing**" not in roadmap:
              raise SystemExit("Increment 30 is not left unchecked")
          if "- [x] **Increment 30 — Analog numeric types and expression typing**" in roadmap:
              raise SystemExit("Increment 30 was unexpectedly checked")
          roadmap_path.write_text(roadmap, encoding="utf-8")

          manifest_path = Path("tests/compiler/fixtures/increment29/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("increment") != 29:
              raise SystemExit("Increment 29 manifest identity mismatch")
          if manifest.get("status") != "implemented-awaiting-evidence":
              raise SystemExit(f"unexpected pre-closure status: {manifest.get('status')!r}")
          manifest["status"] = "validated-parameter-constant-unit"
          manifest["evidence"] = {
              "pull_request": 78,
              "dedicated_run": 33154887196,
              "core_ci_run": 33154887245,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate closed roadmap and evidence state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check_increment28.py
          python3 scripts/check_increment29.py
          python3 -m unittest discover -s tests/compiler -p 'test_increment28.py'
          python3 -m unittest discover -s tests/compiler -p 'test_increment29.py'
          python3 scripts/check_markdown.py
          git diff --check

      - name: Commit evidence closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/nodal-development-todo.md
          git add tests/compiler/fixtures/increment29/manifest.json
          git diff --cached --check
          git commit -m "Increment 29 — record merge evidence and close roadmap"
          git push origin HEAD:increment/29-evidence-closure
