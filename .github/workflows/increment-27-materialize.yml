name: Increment 27 Materialize

on:
  push:
    branches:
      - increment/27-natures-disciplines
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: increment-27-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: increment-27/materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: increment/27-natures-disciplines
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize implementation
        run: |
          python3 scripts/materialize_increment27.py
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/increment-27-natures-disciplines.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          workflow_anchor = '          done\n          python3 -m unittest discover'
          workflow_replacement = '          done\n          python3 scripts/check_increment27.py\n          python3 -m unittest discover'
          if workflow_text.count(workflow_anchor) != 1:
              raise SystemExit('permanent workflow checker anchor not found')
          workflow.write_text(
              workflow_text.replace(workflow_anchor, workflow_replacement, 1),
              encoding='utf-8',
          )

          test = Path('tests/compiler/test_increment27.py')
          test_text = test.read_text(encoding='utf-8')
          mutation_anchor = '.replace("resolveDeclaration", "missingResolver", 1)'
          mutation_replacement = '.replace("resolveDeclaration", "missingResolver")'
          if test_text.count(mutation_anchor) != 1:
              raise SystemExit('resolver mutation anchor not found')
          test.write_text(
              test_text.replace(mutation_anchor, mutation_replacement, 1),
              encoding='utf-8',
          )

          cmake = Path('core/compiler/test/Unit/CMakeLists.txt')
          cmake.write_text(
              cmake.read_text(encoding='utf-8').rstrip() + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate structural contracts before commit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check_increment27.py
          python3 -m unittest tests.compiler.test_increment27 tests.compiler.test_increment26
          git diff --check

      - name: Commit materialized Increment 27
        run: |
          git add -A
          git commit -m "Increment 27 — implement natures and disciplines"
          git push origin HEAD:increment/27-natures-disciplines
