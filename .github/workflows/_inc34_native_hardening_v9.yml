name: Increment 34 Native Hardening v9

on:
  push:
    branches:
      - automation/inc34-native-hardening-v9
    paths:
      - '.github/workflows/_inc34_native_hardening_v9.yml'
      - '.github/automation/inc34_native_hardening_v9.py'
      - '.github/automation/inc34_run_native_hardening_v9.sh'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-34-native-hardening-v9
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out hardening controller
        uses: actions/checkout@v6
        with:
          ref: automation/inc34-native-hardening-v9
          path: controller
          fetch-depth: 1

      - name: Check out current Increment 34 feature head
        uses: actions/checkout@v6
        with:
          ref: increment/34-analog-control-flow-v1
          path: work
          fetch-depth: 0

      - name: Execute guarded fresh-review hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash controller/.github/automation/inc34_run_native_hardening_v9.sh \
            "${GITHUB_WORKSPACE}/controller" \
            "${GITHUB_WORKSPACE}/work" \
            "${RUNNER_TEMP}/inc34-hardening-v9"
