name: Restore verification SystemVerilog IR readiness gate

on:
  push:
    branches:
      - increment/147-verification-projection-roadmap
    paths:
      - .github/workflows/roadmap-systemverilog-ir-gate-fix.yml

permissions:
  contents: write

jobs:
  restore-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the minimal SystemVerilog IR readiness contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bullet = (
              "  - Freeze Verification SystemVerilog IR readiness for packages/classes, "
              "interfaces, typed class/struct containers, concurrency/process control, "
              "constrained-random hooks, functional coverage, DPI/VPI boundaries, source "
              "maps, and capability diagnostics required by UVM/UVM-MS generation.\n"
          )

          def insert_after(path: str, anchor: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {text.count(anchor)}")
              text = text.replace(anchor, anchor + bullet, 1)
              target.write_text(text)

          anchor = (
              "  - Apply ADRs 0023 and 0025 and freeze Verification Semantic IR -> "
              "UVM/UVM-MS projections as siblings of native execution and procedural "
              "Verilog/Verilog-AMS testbench projections.\n"
          )
          insert_after(
              "docs/roadmap/dependent-productivity-and-verification-tracks-v0.1-plan.md",
              anchor,
          )
          insert_after("docs/roadmap/nodal-development-todo.md", anchor)

          gate_path = Path("docs/roadmap/dependent-track-gate-v0.1.json")
          gate = gate_path.read_text()
          old = (
              '    "native_simulation_depends_on_generated_testbench": false,\n'
              '    "artifact_generation_and_execution_are_separate_gates": true,\n'
          )
          new = (
              '    "native_simulation_depends_on_generated_testbench": false,\n'
              '    "verification_systemverilog_ir_readiness_reserved_in_foundation": true,\n'
              '    "artifact_generation_and_execution_are_separate_gates": true,\n'
          )
          if gate.count(old) != 1:
              raise SystemExit("machine-readable verification architecture anchor mismatch")
          gate_path.write_text(gate.replace(old, new, 1))

          Path(".github/workflows/roadmap-systemverilog-ir-gate-fix.yml").unlink()
          PY
      - name: Validate restored readiness gate
        run: |
          set -euo pipefail
          test "$(grep -c 'Freeze Verification SystemVerilog IR readiness' docs/roadmap/nodal-development-todo.md)" -eq 1
          test "$(grep -c 'Freeze Verification SystemVerilog IR readiness' docs/roadmap/dependent-productivity-and-verification-tracks-v0.1-plan.md)" -eq 1
          grep -q '"verification_systemverilog_ir_readiness_reserved_in_foundation": true' docs/roadmap/dependent-track-gate-v0.1.json
          python3 -m json.tool docs/roadmap/dependent-track-gate-v0.1.json >/dev/null
          test ! -e .github/workflows/roadmap-systemverilog-ir-gate-fix.yml
      - name: Commit review fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap .github/workflows/roadmap-systemverilog-ir-gate-fix.yml
          git diff --cached --check
          git commit -m 'Increment 147 — restore verification SystemVerilog IR readiness gate'
          git push origin HEAD
