name: Apply Increment 9 Markdown fixes

on:
  push:
    branches:
      - increment/9-formatting-linting-contribution-rules

permissions:
  contents: write

jobs:
  fix-markdown:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix checked Markdown contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          template = Path('.github/pull_request_template.md')
          text = template.read_text(encoding='utf-8')
          if not text.startswith('# Pull request\n'):
              template.write_text('# Pull request\n\n' + text, encoding='utf-8')

          roadmap = Path('docs/roadmap/nodal-development-todo.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '../../scripts/check_format_baseline.py'
          new = '../../scripts/check_formatting_baseline.py'
          if text.count(old) != 1:
              raise SystemExit('expected one stale Increment 8 formatting-check link')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 scripts/check_markdown.py

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/increment-9-markdown-fix.yml
          git add -- \
            .github/pull_request_template.md \
            docs/roadmap/nodal-development-todo.md
          git diff --cached --check
          git commit -m 'docs: satisfy Markdown contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
