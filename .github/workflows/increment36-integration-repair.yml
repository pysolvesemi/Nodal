name: Increment 36 Integration Repair
on:
  push:
    branches: [automation/increment36-integration-repair]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: increment/36-time-waveform-operators-v1
          fetch-depth: 0
      - name: Apply reviewed integration changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = 50015ebb68f3899e2dfba8c7a935ad8a0c0cee63
          gh api repos/pysolvesemi/Nodal/git/blobs/ab3f847c44a3f9835ea31102e7dcc15243bef1e7 --jq .content | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git diff --binary > /tmp/repair.patch
          echo '2e318a97e81dee1cd81cb8846f24e5270a9c1bd0f474811c39c613171927afc6  /tmp/repair.patch' | sha256sum -c -
          python3 scripts/check_increment36.py
      - name: Format and publish
        id: publish
        run: |
          ./nodal style bootstrap --prefix "$RUNNER_TEMP/lint"
          ./nodal style fix --lint-toolchain "$RUNNER_TEMP/lint"
          git diff --exit-code -- .github/workflows
          git diff --check
          git add core
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Increment 36 — Register optimization passes and reparse waveform output'
          git push origin HEAD:refs/heads/increment/36-time-waveform-operators-v1
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD > /tmp/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: increment36-repaired-source
          path: /tmp/source.tar.gz
          retention-days: 3
  scala:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - name: Compiled Scala and public-source emission
        shell: bash
        run: |
          set -o pipefail
          ./nodal core scala 2>&1 | tee /tmp/scala.log
          ./mill -i examples.continuousTimeApi.runMain nodal.increment36fixture.Increment36ConstructionCheck /tmp/construction.txt 2>&1 | tee /tmp/construction.log
          ./mill -i core.scala.testkit.test.runMain nodal.internal.testkit.Increment36MlirCheck /tmp/source.mlir 2>&1 | tee /tmp/source.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment36-scala-validation
          path: |
            /tmp/*.log
            /tmp/source.mlir
            /tmp/construction.txt
          retention-days: 3
  native:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - name: Native compiler and matrix
        shell: bash
        run: |
          set -o pipefail
          ./nodal bootstrap --mode prebuilt --prefix "$RUNNER_TEMP/native"
          ./nodal style bootstrap --prefix "$RUNNER_TEMP/lint"
          ./nodal core native --toolchain "$RUNNER_TEMP/native" --lint-toolchain "$RUNNER_TEMP/lint" 2>&1 | tee /tmp/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment36-native-validation
          path: /tmp/native.log
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: increment36-native-tools
          path: |
            out/native/release/bin/nodalc
            out/native/release/bin/nodal-translate
            /home/runner/work/_temp/native/lib/libMLIR.so*
            /home/runner/work/_temp/native/lib/libCIRCT.so*
            /home/runner/work/_temp/native/lib/libLLVM.so*
          retention-days: 1
