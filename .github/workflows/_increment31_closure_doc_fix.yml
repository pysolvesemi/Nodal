name: Increment 31 Closure Documentation Fix

on:
  push:
    branches:
      - increment/31-evidence-closure

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize-note:
    name: increment-31/finalize-validated-note
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v6
        with:
          ref: increment/31-evidence-closure
          fetch-depth: 0

      - name: Finalize note when the patch script is staged
        run: |
          if [ -f scripts/_increment31_closure_doc_fix.py ]; then
            python3 scripts/_increment31_closure_doc_fix.py
          else
            echo 'Increment 31 validated implementation note is already finalized.'
          fi
