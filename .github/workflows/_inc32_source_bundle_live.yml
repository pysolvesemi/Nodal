name: Increment 32 Current Source Bundle

on:
  push:
    branches:
      - automation/inc32-source-bundle-live

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current Increment 32 head
        uses: actions/checkout@v6
        with:
          ref: increment/32-equation-contribution-semantics-review
          fetch-depth: 0
      - name: Record source identity
        run: git rev-parse HEAD > /tmp/nodal-inc32-head.txt
      - name: Package source snapshot
        run: |
          tar --exclude=.git --exclude=out --exclude=build -czf /tmp/nodal-inc32-current-source.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nodal-inc32-current-source
          path: |
            /tmp/nodal-inc32-current-source.tgz
            /tmp/nodal-inc32-head.txt
          if-no-files-found: error
          retention-days: 1
