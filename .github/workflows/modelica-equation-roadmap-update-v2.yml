name: Modelica-Inspired Equation Roadmap Update v2

on:
  push:
    branches:
      - agent/modelica-equation-roadmap-update

permissions:
  contents: write

concurrency:
  group: modelica-equation-roadmap-update-v2
  cancel-in-progress: false

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/modelica-equation-roadmap-update

      - name: Execute corrected materializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path(".github/workflows/modelica-equation-roadmap-update.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          old = (
              "  - Classify continuous, derivative, algebraic, discrete, parameter, "
              "environment, and independent variables.\\n  - Implement incidence/dependency "
              "graphs, structural matching, block decomposition, equation/unknown balance, "
              "references, conservation, singularity,"
          )
          new = (
              "  - Classify continuous, derivative, algebraic, discrete, parameter, "
              "environment, independent, and input variables.\\n  - Implement incidence/dependency "
              "graphs, structural matching, block decomposition, equation/unknown balance, "
              "reference/conservation checks, singularity,"
          )
          if workflow.count(old) != 1:
              raise RuntimeError(
                  f"Increment 135 correction anchor count is {workflow.count(old)}"
              )
          workflow = workflow.replace(old, new, 1)

          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          script = dedent(workflow[start:end])
          exec(compile(script, str(workflow_path), "exec"), {})
          PY

          python3 scripts/check_markdown.py
          git diff --check

      - name: Commit roadmap update and remove temporary workflows
        run: |
          rm -f .github/workflows/modelica-equation-roadmap-update.yml
          rm -f .github/workflows/modelica-equation-roadmap-update-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: strengthen equation-oriented AMS roadmap"
          git pull --rebase origin agent/modelica-equation-roadmap-update
          git push origin HEAD:agent/modelica-equation-roadmap-update
