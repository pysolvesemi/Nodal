name: Increment 33 diagnose Scala witness exit

on:
  push:
    branches:
      - automation/inc33-scala-diagnostic-controller-20260831

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact failing Increment 33 head
        uses: actions/checkout@v6
        with:
          ref: c09bfec6fed26b6b964a935aceebe1f051bcb985
          fetch-depth: 0

      - name: Compile witness module
        run: ./mill examples.continuousTimeApi.compile

      - name: Capture Mill runMain exit and task files
        shell: bash
        run: |
          set +e
          ./mill -i examples.continuousTimeApi.runMain \
            nodal.increment33fixture.Increment33RuntimeCheck \
            /tmp/increment33-mill-report.txt \
            > /tmp/increment33-mill.stdout 2> /tmp/increment33-mill.stderr
          status=$?
          set -e
          echo "mill_status=${status}"
          echo '--- mill stdout ---'
          cat /tmp/increment33-mill.stdout || true
          echo '--- mill stderr ---'
          cat /tmp/increment33-mill.stderr || true
          echo '--- report ---'
          cat /tmp/increment33-mill-report.txt || true
          echo '--- runMain task files ---'
          find out/examples/continuousTimeApi -maxdepth 5 -type f -print | sort || true

      - name: Run the same main class directly
        shell: bash
        run: |
          ./mill show examples.continuousTimeApi.runClasspath > /tmp/increment33-classpath.json
          cat /tmp/increment33-classpath.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/increment33-classpath.json').read_text())
          paths = []
          def visit(item):
              if isinstance(item, dict):
                  path = item.get('path')
                  if isinstance(path, str):
                      paths.append(path)
                  for child in item.values():
                      visit(child)
              elif isinstance(item, list):
                  for child in item:
                      visit(child)
          visit(value)
          if not paths:
              raise SystemExit('no classpath entries found')
          Path('/tmp/increment33-classpath.txt').write_text(':'.join(dict.fromkeys(paths)))
          PY
          set +e
          java -cp "$(cat /tmp/increment33-classpath.txt)" \
            nodal.increment33fixture.Increment33RuntimeCheck \
            /tmp/increment33-direct-report.txt
          status=$?
          set -e
          echo "direct_status=${status}"
          cat /tmp/increment33-direct-report.txt || true
          test "$status" = 0
