name: Increment 153 Function-local Naming Roadmap Materializer

on:
  push:
    branches:
      - increment/153-function-local-semantic-naming-roadmap

permissions:
  contents: write

concurrency:
  group: increment-153-function-local-naming-roadmap-materializer
  cancel-in-progress: false

jobs:
  materialize:
    name: increment-153/materialize-roadmap
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: increment/153-function-local-semantic-naming-roadmap

      - name: Materialize and validate roadmap
        run: |
          python3 scripts/materialize_increment153_roadmap.py
          rm -f \
            scripts/materialize_increment153_roadmap.py \
            .github/workflows/increment-153-function-local-naming-roadmap-materialize.yml \
            .increment153-materialize-trigger
          python3 -m json.tool docs/roadmap/dependent-track-gate-v0.1.json >/dev/null
          python3 scripts/check_markdown.py
          python3 scripts/check_architecture.py
          python3 scripts/check_increment22.py
          git diff --check

      - name: Publish roadmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increment 153 — add function-local semantic naming roadmap"
          git pull --rebase origin increment/153-function-local-semantic-naming-roadmap
          git push origin HEAD:increment/153-function-local-semantic-naming-roadmap
