name: Automation Increment 21 Native Validate v2

on:
  push:
    branches:
      - automation/increment21-native-validate-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out Increment 21
        uses: actions/checkout@v6
        with:
          ref: increment/21-native-semantic-pipeline
          fetch-depth: 0

      - name: Apply compile and fixture corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          passes = Path('core/compiler/lib/Transforms/Passes.cpp')
          text = passes.read_text(encoding='utf-8')
          if '#include <cassert>' not in text:
              text = text.replace('#include <functional>\n', '#include <cassert>\n#include <functional>\n', 1)
          if '#include "llvm/Support/ErrorHandling.h"' not in text:
              text = text.replace(
                  '#include "llvm/ADT/Twine.h"\n',
                  '#include "llvm/ADT/Twine.h"\n#include "llvm/Support/ErrorHandling.h"\n',
                  1,
              )
          text = text.replace('accepted->clone()', 'accepted.get()->clone()')
          passes.write_text(text, encoding='utf-8')

          fixture = Path('core/compiler/test/IR/semantic-pipeline-invalid.mlir')
          text = fixture.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(}> \(\{\n)([ \t]*)(\}\) : \(\) -> \(\))',
              lambda match: (
                  match.group(1)
                  + match.group(2)
                  + '^bb0:\n'
                  + match.group(2)
                  + match.group(3)
              ),
              text,
          )
          if count < 7:
              raise SystemExit(f'expected at least seven empty regions, patched {count}')
          fixture.write_text(text, encoding='utf-8')

          gate = Path('docs/design-gates/NodalNativeSemanticPipeline-DG-v1.0.md')
          text = gate.read_text(encoding='utf-8')
          anchor = '## Transaction contract\n'
          addition = (
              '## Transaction contract\n\n'
              'This is a **clone-before-commit** contract across all thirteen '
              'mandatory stages.\n'
          )
          if 'clone-before-commit' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('transaction heading is not unique')
              text = text.replace(anchor, addition, 1)
          gate.write_text(text, encoding='utf-8')
          PY

      - name: Install locked lint and native toolchains
        run: |
          ./nodal style bootstrap \
            --prefix "${RUNNER_TEMP}/nodal-lint-toolchain"
          ./nodal bootstrap \
            --mode prebuilt \
            --prefix "${RUNNER_TEMP}/nodal-native-toolchain"

      - name: Apply canonical formatting and structural checks
        run: |
          "${RUNNER_TEMP}/nodal-lint-toolchain/bin/clang-format" -i \
            core/compiler/include/nodal/Transforms/Passes.h \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/test/Unit/SemanticPipelineTest.cpp \
            core/compiler/tools/nodalc/nodalc.cpp
          python3 scripts/check_increment18.py
          python3 scripts/check_increment19.py
          python3 scripts/check_increment20.py
          python3 scripts/check_increment21.py
          python3 -m unittest discover \
            -s tests/compiler \
            -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py
          python3 scripts/check_markdown.py
          git diff --check

      - name: Build and test pinned native compiler
        run: |
          ./nodal core native \
            --toolchain "${RUNNER_TEMP}/nodal-native-toolchain" \
            --lint-toolchain "${RUNNER_TEMP}/nodal-lint-toolchain"

      - name: Exercise gates and complete failure inventory
        run: |
          compiler=out/native/release/bin/nodalc
          fixture=core/compiler/test/IR/semantic-pipeline-valid.mlir
          for profile in fast default release; do
            "${compiler}" \
              "--pass-pipeline=builtin.module(nodal-gate-${profile})" \
              "${fixture}" \
              >"/tmp/nodal-gate-${profile}.mlir"
            grep -F "nodal.pipeline.profile = \"${profile}\"" \
              "/tmp/nodal-gate-${profile}.mlir"
          done

          if "${compiler}" --split-input-file \
              '--pass-pipeline=builtin.module(nodal-gate-default)' \
              core/compiler/test/IR/semantic-pipeline-invalid.mlir \
              >/tmp/nodal-invalid.log 2>&1; then
            echo 'invalid semantic-stage matrix was accepted' >&2
            exit 1
          fi
          for code in \
            NODAL-VERIFY-CONSTRUCTION-001 \
            NODAL-VERIFY-DRIVER-001 \
            NODAL-VERIFY-LATCH-001 \
            NODAL-VERIFY-CYCLE-001 \
            NODAL-VERIFY-HIERARCHY-004 \
            NODAL-VERIFY-TYPE-003 \
            NODAL-VERIFY-PARAMETER-003 \
            NODAL-VERIFY-FSM-001 \
            NODAL-VERIFY-DOMAIN-003 \
            NODAL-VERIFY-PROTOCOL-003 \
            NODAL-VERIFY-EFFECT-001 \
            NODAL-VERIFY-ANAL-001 \
            NODAL-VERIFY-ANALOG-001 \
            NODAL-VERIFY-CAPABILITY-003; do
            if [ "${code}" = NODAL-VERIFY-ANAL-001 ]; then
              continue
            fi
            grep -F "${code}" /tmp/nodal-invalid.log
          done

      - name: Publish validated corrections
        run: |
          git config user.name 'pysolvesemi'
          git config user.email 'pysolvesemi@gmail.com'
          git add \
            core/compiler/include/nodal/Transforms/Passes.h \
            core/compiler/lib/Transforms/Passes.cpp \
            core/compiler/test/IR/semantic-pipeline-invalid.mlir \
            core/compiler/test/Unit/SemanticPipelineTest.cpp \
            core/compiler/tools/nodalc/nodalc.cpp \
            docs/design-gates/NodalNativeSemanticPipeline-DG-v1.0.md
          if ! git diff --cached --quiet; then
            git commit -m 'Increment 21 — apply validated native and fixture corrections'
            git push origin HEAD:increment/21-native-semantic-pipeline
          fi
