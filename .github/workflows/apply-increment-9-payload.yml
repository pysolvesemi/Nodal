name: Apply Increment 9 implementation payload

on:
  push:
    branches:
      - increment/9-formatting-linting-contribution-rules

permissions:
  contents: write

jobs:
  apply-payload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply staged implementation
        shell: bash
        run: |
          python3 scripts/apply_increment9_payload.py
          rm -rf .github/increment9-payload
          rm -f scripts/apply_increment9_payload.py
          rm -f .github/workflows/apply-increment-9-payload.yml

      - name: Validate extracted contracts
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/*.py \
            tests/developer/*.py \
            tests/lint/*.py
          python3 scripts/check_increment9.py
          python3 scripts/check_developer_commands.py
          python3 -m unittest discover -s tests/developer -p 'test_*.py'
          python3 -m unittest discover -s tests/lint -p 'test_*.py'
          python3 scripts/check_formatting_baseline.py

      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/increment9-payload
          git rm --ignore-unmatch scripts/apply_increment9_payload.py
          git rm --ignore-unmatch .github/workflows/apply-increment-9-payload.yml
          git add -- \
            scripts/bootstrap_lint_toolchain.py \
            scripts/run_clang_tools.py \
            scripts/check_markdown.py \
            scripts/check_package_visibility.py \
            scripts/check_contribution_policy.py \
            scripts/check_increment9.py \
            scripts/nodal.py \
            scripts/check_developer_commands.py \
            scripts/check_ci_baseline.py \
            tests/developer/test_developer_commands.py \
            tests/developer/test_developer_command_contract.py \
            tests/lint/test_increment9.py \
            build.mill \
            docs/development/commands.md \
            docs/development/ci.md \
            .github/workflows/ci.yml \
            .github/workflows/increment-9-formatting-linting.yml \
            .github/CODEOWNERS
          git diff --cached --check
          git commit -m 'feat: add formatting linting and contribution gates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
